    // aurora-local-patch: perf-pick-column
    /// The objects a ray search whose searched part lies in the box
    /// `min`..`max` can test, from one pass over the index: those whose
    /// bounds, widened as `ray_candidates` widens them (5 % + 15 cm),
    /// reach the box, and those tested whatever the ray. Several searches
    /// in the same place (the traces of a pair of feet) then pick their own
    /// with [`Self::ray_candidates_among`] instead of a pass each.
    pub fn column_candidates(&self, min: Vec3, max: Vec3, out: &mut Vec<usize>) {
        out.clear();
        out.extend(
            self.entries
                .iter()
                .enumerate()
                .filter(|(_, e)| {
                    let r = e.radius * 1.05 + 0.15;
                    e.pickable() && (e.always || e.center.clamp(min, max).distance_squared(e.center) <= r * r)
                })
                .map(|(i, _)| i),
        );
    }

    /// What `ray_candidates` gives for `ray`, among `among` (a
    /// [`Self::column_candidates`] list, in index order): the same objects
    /// in the same order, but those whose widened bounds do not reach the
    /// column's box, which cannot meet the part of the ray inside it.
    pub fn ray_candidates_among(&self, ray: (Vec3, Vec3), among: &[usize], out: &mut Vec<usize>) {
        let probe = Probe { ray, depth: None };
        out.clear();
        out.extend(
            among
                .iter()
                .copied()
                .filter(|&i| self.entries.get(i).is_some_and(|e| e.candidate(&probe))),
        );
    }

    /// The objects of a radius of at least `min_radius` whose bounds come within'''

