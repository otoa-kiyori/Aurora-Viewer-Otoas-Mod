[[patch]]
id = "perf-complexity-inputs"
why = "the complexity rules' exceptions and friends kept between frames, made again on a change"
paths = ["crates/aurora-viewer/src/scene/complexity.rs"]
op = "literal"
find = '''
impl Rules<'_> {
    /// Changes when any rule does (recompute at once).
'''
replace = '''// aurora-local-patch: perf-complexity-inputs
/// The exceptions and friends a frame gives [`Rules`], kept from one frame
/// to the next and made again only when what they come from changed: the
/// saved choices (`Settings::render_exceptions`), the blocked residents
/// and the friends list. Each is compared as it is, so a list replaced
/// with another (a new login) is seen like any change.
#[derive(Default)]
pub struct Inputs {
    built: bool,
    saved: Vec<(String, u8)>,
    blocked: Vec<Uuid>,
    friend_ids: Vec<Uuid>,
    scratch: Vec<Uuid>,
    /// The saved choices alone (what the people lists' menus check).
    pub saved_map: HashMap<Uuid, u8>,
    /// With the blocked residents as silhouettes (3, FIRE-11783).
    pub exceptions: HashMap<Uuid, u8>,
    pub friends: HashSet<Uuid>,
}

impl Inputs {
    /// This frame's inputs; `saved_map` makes the map of `saved` (called
    /// only when it changed).
    pub fn update(
        &mut self,
        saved: &[(String, u8)],
        saved_map: impl FnOnce() -> HashMap<Uuid, u8>,
        blocked: impl Iterator<Item = Uuid>,
        friends: impl Iterator<Item = Uuid>,
    ) {
        self.scratch.clear();
        self.scratch.extend(blocked);
        let blocked_same = self.built && self.scratch == self.blocked;
        if !blocked_same {
            std::mem::swap(&mut self.scratch, &mut self.blocked);
        }
        let saved_same = self.built && self.saved.as_slice() == saved;
        if !saved_same {
            self.saved = saved.to_vec();
            self.saved_map = saved_map();
        }
        if !saved_same || !blocked_same {
            self.exceptions.clone_from(&self.saved_map);
            for id in &self.blocked {
                self.exceptions.insert(*id, 3);
            }
        }
        self.scratch.clear();
        self.scratch.extend(friends);
        if !self.built || self.scratch != self.friend_ids {
            std::mem::swap(&mut self.scratch, &mut self.friend_ids);
            self.friends = self.friend_ids.iter().copied().collect();
        }
        self.built = true;
    }
}

impl Rules<'_> {
    /// Changes when any rule does (recompute at once).'''

