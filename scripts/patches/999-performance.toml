# Performance: the same viewer, faster. Nothing it draws, plays, sends or
# saves changes; only where and how often the work is done.
#
# Applied last, after every other manifest (its anchors are the tree with
# all of them applied), so it can also speed up their code. Each step keeps
# the results of the code it replaces; where that could not be shown, the
# change was left out. The parts:
#
# - Foot support traces (grounding.rs, hover.rs): the 16 to 32 traces of a
#   grounded avatar's feet a frame each went over the whole pick index for
#   their candidates. Now one pass a frame takes those that can reach a box
#   around the avatar (PickIndex::column_candidates, the bounds widened as
#   the ray search widens them), and each trace picks its own among them
#   with the same test (ray_candidates_among): the same objects in the same
#   order, the exact hit test unchanged, so the same support; a trace
#   outside the box takes the full pass as before. A metre of room around
#   the box covers what moves between the index's sync and the trace.
#   Feet height (100) lowers the traces inside the same box.
# - Water walking tops (117, picking.rs water_walk_top): the five traces
#   share one such pass; and the probe is skipped in the frames where
#   water_walk::Runtime::update lets the walk go before it reads its answer
#   (bridge not ready, suspended, locked while not walking, no water over
#   the ground).
# - Texture uploads (textures.rs): the uploads a decode job already staged
#   only record a GPU copy; they get room of their own beside the 24 MB a
#   frame of the main thread's writes, up to 48 MB a frame in all (about
#   2 ms of GPU), within the same 3 ms time budget, so their staging chunks
#   (2 of 32 MB on a card without resizable BAR) free sooner for the decode
#   jobs that wait for them. The textures are the same; they arrive sooner.
#   A 4-channel image is moved, not copied, into its levels when no sculpt
#   map keeps it.
# - Projector shadow maps: AURORA_PROFILE gives the maps drawn a frame and
#   their casters (`spot_maps`, `sd_spot`, docs/TESTING.md).
# - Calm water and open-sea swell (109), water shape (120): their maps are
#   built on the background jobs' pool (Jobs::run, as the decodes) instead
#   of the frame's, and their per-second scans of the objects and of the
#   terrain run as the frame's own parallel loops (frame_par), which the
#   main thread takes part in, in the same order.
# - Complexity rules (app.rs, complexity.rs): the saved exceptions, the
#   blocked residents' silhouettes and the friends set are kept between
#   frames and made again only when one of them changed (each compared as
#   it is).
# - Poses (scene/mod.rs update_poses): the posed and held avatars looked up
#   in sets, not lists, when the poses and skeletons of the others go.
# - Per-frame small work (app.rs): the media plugins' folder text, the sky
#   log's key (the source hashed, not formatted), the cache folder (fixed
#   once the run's folder is chosen, before the first frame), and the
#   poser demo's environment variable read outside the demo.
# - Background work on the frame's pool: the terrain paint map's bake and
#   its wait for staging room, and the physics shapes' preparation, go to
#   the jobs' pool.
# - A paint map staged again at a scene's recreation (terrain_paint.rs
#   PaintMap::prepare) waits for staging room on the jobs' pool too.
# - Occlusion streaming (121, object_occlusion.rs): a verdict's tested
#   objects come from their set bits only, lowest first, the same pairs in
#   the same order as the test of each of the 32 bits of every word.
# - Sky rays (114, env.wgsl): the cascades' projections of a ray are made
#   once at its start; a sample's is start + t * direction (one
#   multiply-add instead of a matrix product), equal to the float rounding.
# - Log: the follow-simulator list's lines that only reorder (96) at debug
#   level; the 20-second media list counts the faces neither wanted nor
#   loaded in one line; "projector shadow maps active" at most one line
#   every 2 s, with the range it went through meanwhile.
#
# Tests: hover::tests::a_column_gives_each_search_inside_it_what_the_full_pass_gives,
# grounding::tests::a_support_column_gives_the_supports_of_the_full_pass,
# complexity::tests::the_kept_inputs_follow_every_change_of_what_they_come_from,
# lights::tests::the_projector_maps_line_is_written_on_a_change_at_most_every_two_seconds,
# textures::tests::staged_uploads_have_room_of_their_own,
# object_occlusion::tests::the_tested_objects_are_those_of_every_bit_in_order, and the existing
# tests of the code each step touches (grounding, picking, water walking,
# ocean, textures).
#
# Optional links (glue_for the partner step: OPTIONAL-MISSING without the
# other patch, which applies earlier; DRIFT when it is there and the
# step's anchor is not): the steps that tune another patch's code
# go with it: perf-water-walk-* (117); perf-calm-*, perf-field-*,
# perf-ocean-jobs (109); perf-shape-* (120); perf-occl-tested-bits(-test)
# (121); perf-sky-rays-* (114); perf-log-follow-sim (96, which needs 92).
# Everything else tunes upstream code and applies alone.

