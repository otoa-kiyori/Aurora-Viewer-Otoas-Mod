use super::anim::grounding::{Frame, Surface};
use super::*;
'''
replace = '''use super::anim::grounding::{Frame, Surface};
use super::*;

// aurora-local-patch: perf-ground-column-type
/// Where the ankle traces of a standing, kneeling or lifted pose search,
/// around the avatar's root: half a body below its feet and a trace reach
/// under them (Feet height lowering the traces by up to a metre), up to a
/// trace reach over a leg raised to the root (m). A trace outside it takes
/// the full pass.
const COLUMN_BELOW: Vec3 = Vec3::new(1.5, 1.5, 5.0);
const COLUMN_ABOVE: Vec3 = Vec3::new(1.5, 1.5, 2.5);
/// Room around that box (m): an object the column leaves out is at least
/// this far from every trace it serves (beyond `ray_candidates`' margin),
/// more than anything moves between the pick index's sync and the trace.
const COLUMN_SLACK: f32 = 1.0;

/// The pick index's objects around one avatar's support traces
/// (`Scene::support_column`).
pub(super) struct SupportColumn {
    min: Vec3,
    max: Vec3,
    among: Vec<usize>,
}

impl SupportColumn {
    fn holds(&self, p: Vec3) -> bool {
        p.cmpge(self.min).all() && p.cmple(self.max).all()
    }
}'''

