'''
replace = '''// aurora-local-patch: perf-pick-column-test
    #[test]
    fn a_column_gives_each_search_inside_it_what_the_full_pass_gives() {
        let mut state = 7u64;
        let mut rnd = |m: f32| {
            state = state.wrapping_mul(6364136223846793005).wrapping_add(1442695040888963407);
            ((state >> 40) as f32 / (1u64 << 24) as f32) * m
        };
        let mut index = PickIndex::default();
        for i in 0..3000 {
            let center = Vec3::new(rnd(16.0) - 8.0, rnd(16.0) - 8.0, rnd(24.0) - 12.0);
            let e = match i % 50 {
                0 => PickEntry::NEVER,
                1 => PickEntry {
                    center,
                    ..always(0.0, 0.0)
                },
                _ => PickEntry {
                    center,
                    radius: rnd(3.0),
                    ..sphere(0.0, 0.0, 0.0)
                },
            };
            index.set(i, e);
        }
        let (min, max) = (Vec3::new(-1.5, -1.0, -5.0), Vec3::new(1.0, 1.5, 2.5));
        let mut column = Vec::new();
        index.column_candidates(min, max, &mut column);
        assert!(column.len() < 3000, "the column leaves the far objects out");
        let (mut full, mut among) = (Vec::new(), Vec::new());
        for _ in 0..2000 {
            // a searched segment inside the box: straight down (the feet's
            // traces) or any way
            let from = min + (max - min) * Vec3::new(rnd(1.0), rnd(1.0), rnd(1.0));
            let to = if rnd(1.0) < 0.5 {
                from.with_z(min.z + (from.z - min.z) * rnd(1.0))
            } else {
                min + (max - min) * Vec3::new(rnd(1.0), rnd(1.0), rnd(1.0))
            };
            let Some(dir) = (to - from).try_normalize() else { continue };
            let length = from.distance(to);
            index.ray_candidates((from, dir), &mut full);
            index.ray_candidates_among((from, dir), &column, &mut among);
            // the same order, nothing that the full pass does not give
            let mut rest = full.iter();
            assert!(among.iter().all(|i| rest.any(|j| j == i)), "{among:?} in {full:?}");
            // and what it leaves out cannot meet the segment
            for i in full.iter().filter(|i| !among.contains(i)) {
                let e = index.entries[*i];
                let along = (e.center - from).dot(dir).clamp(0.0, length);
                assert!(!e.always, "an object tested whatever the ray stays");
                assert!(
                    e.center.distance(from + dir * along) > e.radius * 1.05 + 0.15,
                    "{i}: {e:?} reaches the segment {from} {to}"
                );
            }
        }
    }

    #[test]
    fn candidates_come_in_index_order() {'''

