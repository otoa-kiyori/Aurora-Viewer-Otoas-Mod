'''
replace = '''mod tests {
    use super::*;

    // aurora-local-patch: perf-log-projector-test
    #[test]
    fn the_projector_maps_line_is_written_on_a_change_at_most_every_two_seconds() {
        let start = Instant::now();
        let at = |s: f32| start + std::time::Duration::from_secs_f32(s);
        let mut log = ShadowMapLog::default();
        assert_eq!(log.note(0, at(0.0)), None, "no maps, no line");
        assert_eq!(log.note(15, at(0.1)).as_deref(), Some("15"));
        assert_eq!(log.note(15, at(0.2)), None);
        // a flicker within the wait: one line once the time is up
        assert_eq!(log.note(16, at(0.5)), None);
        assert_eq!(log.note(15, at(0.6)), None);
        assert_eq!(log.note(14, at(1.0)), None);
        assert_eq!(log.note(14, at(2.2)).as_deref(), Some("14 (from 14 to 16 since the last line)"));
        assert_eq!(log.note(14, at(9.0)), None, "nothing changed since");
        // back where it was within the wait: still told
        assert_eq!(log.note(12, at(9.5)).as_deref(), Some("12"));
        assert_eq!(log.note(13, at(10.0)), None);
        assert_eq!(log.note(12, at(10.5)), None);
        assert_eq!(log.note(12, at(11.6)).as_deref(), Some("12 (from 12 to 13 since the last line)"));
        // a single step after a wait: the plain count
        assert_eq!(log.note(0, at(20.0)).as_deref(), Some("0"));
        assert_eq!(log.note(0, at(21.0)), None);
    }'''
