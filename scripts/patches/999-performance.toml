        let mut inputs = Inputs::default();
        let mut made = 0;
        let mut check = |inputs: &mut Inputs, saved: &[(String, u8)], blocked: &[Uuid], friends: &[Uuid]| {
            inputs.update(
                saved,
                || {
                    made += 1;
                    map(saved)
                },
                blocked.iter().copied(),
                friends.iter().copied(),
            );
            let (saved_map, exceptions, friends) = fresh(saved, blocked, friends);
            assert_eq!(inputs.saved_map, saved_map);
            assert_eq!(inputs.exceptions, exceptions);
            assert_eq!(inputs.friends, friends);
        };
        let mut saved = vec![(id(1).to_string(), 2), ("not an id".to_string(), 1)];
        check(&mut inputs, &saved, &[], &[]);
        check(&mut inputs, &saved, &[], &[]);
        // a saved choice changes, then one is added for a blocked resident
        saved[0].1 = 1;
        check(&mut inputs, &saved, &[], &[id(5)]);
        check(&mut inputs, &saved, &[id(1)], &[id(5)]);
        saved.push((id(7).to_string(), 2));
        check(&mut inputs, &saved, &[id(1)], &[id(5)]);
        // unblocked: the saved choice shows again; friends come and go
        check(&mut inputs, &saved, &[], &[id(5), id(6)]);
        check(&mut inputs, &saved, &[], &[id(6)]);
        // a later choice for the same resident wins, as in the settings
        saved.push((id(1).to_string(), 2));
        check(&mut inputs, &saved, &[], &[]);
        // everything gone (another login)
        check(&mut inputs, &[], &[], &[]);
        drop(check);
        assert_eq!(made, 5, "the saved map is made again only when the choices change");
    }

