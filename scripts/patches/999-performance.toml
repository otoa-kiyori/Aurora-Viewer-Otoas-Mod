    }
}
'''
replace = '''pub fn allows(&self, done: usize, bytes: u64, elapsed: Duration) -> bool {
        done == 0 || (bytes < self.bytes && elapsed < self.time)
    }

    // aurora-local-patch: perf-upload-staged-budget
    /// `allows`, the uploads already staged by their decode job counted
    /// apart: those written by the main thread (`direct` of the `bytes`)
    /// keep `self.bytes`, and all of them together may reach
    /// [`STAGED_FRAME_BYTES`]. A staged upload only records a copy, and the
    /// staging chunk it holds (2 of 32 MB on a card without resizable BAR)
    /// is free for the decode jobs once it is copied.
    pub fn allows_split(&self, done: usize, direct: u64, bytes: u64, elapsed: Duration) -> bool {
        self.allows(done, direct, elapsed) && (done == 0 || bytes < STAGED_FRAME_BYTES.max(self.bytes))
    }
}

/// Bytes of GPU copies a frame may record with the uploads staged by the
/// decode jobs (about 2 ms of GPU at the 24 MB a millisecond above).
pub const STAGED_FRAME_BYTES: u64 = 48 << 20;'''

