'''
replace = '''#[cfg(test)]
    pub(super) fn ground_surface(&self, world: &World, frame: Frame, ankle: Vec3, now: Instant) -> Option<Surface> {
        self.ground_surface_in(world, frame, ankle, now, None)
    }

    // aurora-local-patch: perf-ground-column
    /// The objects the support traces of the avatar of `frame` can meet:
    /// one pass over the pick index for all its traces of a frame (16 to
    /// 32), instead of one each.
    pub(super) fn support_column(&self, frame: &Frame) -> SupportColumn {
        let root = frame.to_world.transform_point3(self.avatar_lib.pelvis);
        let (min, max) = (root - COLUMN_BELOW, root + COLUMN_ABOVE);
        let mut among = Vec::new();
        if min.is_finite() && max.is_finite() {
            let slack = Vec3::splat(COLUMN_SLACK);
            self.pick.column_candidates(min - slack, max + slack, &mut among);
        }
        SupportColumn { min, max, among }
    }

    /// `ground_surface`, its candidates taken from `column` when the trace
    /// lies in its box (else the full pass, as before): the same objects
    /// in the same order either way, so the same support.
    pub(super) fn ground_surface_in(
        &self,
        world: &World,
        frame: Frame,
        ankle: Vec3,
        now: Instant,
        column: Option<&SupportColumn>,
    ) -> Option<Surface> {
        let reach = crate::settings::MAX_GROUND_FEET_HEIGHT + 0.002;
        let ray = (ankle + Vec3::Z * reach, -Vec3::Z);
        let mut candidates = Vec::new();
        // (the trace's searched part: `support_hit` keeps 0..=2 reach)
        match column.filter(|c| c.holds(ray.0) && c.holds(ray.0 + ray.1 * (reach * 2.0))) {
            Some(c) => self.pick.ray_candidates_among(ray, &c.among, &mut candidates),
            None => self.pick.ray_candidates(ray, &mut candidates),
        }'''

