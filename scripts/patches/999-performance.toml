[[patch]]
id = "perf-log-projector"
why = "the projector shadow maps line at most one every 2 s, with the range it went through"
paths = ["crates/aurora-viewer/src/scene/lights.rs"]
op = "literal"
find = '''
    objects: Vec<usize>,
    shadow_map_count: usize,
}
'''
replace = '''objects: Vec<usize>,
    shadow_map_count: usize,
    shadow_log: ShadowMapLog, // aurora-local-patch: perf-log-projector-field
}

// aurora-local-patch: perf-log-projector
/// Seconds between two "projector shadow maps active" lines at most.
const SHADOW_LOG_EVERY: f32 = 2.0;

/// The "projector shadow maps active" line: written when the count of maps
/// changed, at most one every [`SHADOW_LOG_EVERY`] (the count flickers
/// when a light sits on the ranking's edge, up to ten lines a second). A
/// line written after a wait gives the lowest and highest counts since the
/// last one; the count a run of changes ends on is always written.
#[derive(Default)]
struct ShadowMapLog {
    /// The count of the last line (0 before the first: none is written
    /// while there are no maps, as before).
    shown: usize,
    at: Option<Instant>,
    /// The lowest and highest counts since the last line, when any differs.
    range: Option<(usize, usize)>,
}

impl ShadowMapLog {
    /// What to write for this frame's `active` count, if anything.
    fn note(&mut self, active: usize, now: Instant) -> Option<String> {
        if active == self.shown && self.range.is_none() {
            return None;
        }
        let (low, high) = self.range.unwrap_or((self.shown, self.shown));
        self.range = Some((low.min(active), high.max(active)));
        if self
            .at
            .is_some_and(|at| now.saturating_duration_since(at).as_secs_f32() < SHADOW_LOG_EVERY)
        {
            return None;
        }
        let (low, high) = self.range.take().unwrap_or((active, active));
        // (the range only when the count went beyond the last line's and
        // this one's)
        let line = if low < self.shown.min(active) || high > self.shown.max(active) {
            format!("{active} (from {low} to {high} since the last line)")
        } else {
            format!("{active}")
        };
        self.shown = active;
        self.at = Some(now);
        Some(line)
    }
}'''

