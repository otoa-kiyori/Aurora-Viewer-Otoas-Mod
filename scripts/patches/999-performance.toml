'''
replace = '''// aurora-local-patch: perf-sky-rays-march
// The three cascades' projections of a ray, made once at its start: the
// clip position of the sample at `t` is start + t * direction (the matrix
// is linear in the homogeneous position), one multiply-add per sample
// instead of a matrix product.
struct SkyRayMarch {
    s0: vec4<f32>,
    s1: vec4<f32>,
    s2: vec4<f32>,
    d0: vec4<f32>,
    d1: vec4<f32>,
    d2: vec4<f32>,
}

fn sky_ray_march(eye: vec3<f32>, ray: vec3<f32>) -> SkyRayMarch {
    let e = vec4<f32>(eye, 1.0);
    let r = vec4<f32>(ray, 0.0);
    return SkyRayMarch(
        frame.cascade_vp[0] * e,
        frame.cascade_vp[1] * e,
        frame.cascade_vp[2] * e,
        frame.cascade_vp[0] * r,
        frame.cascade_vp[1] * r,
        frame.cascade_vp[2] * r,
    );
}

fn sky_ray_clip(m: SkyRayMarch, cascade: u32, t: f32) -> vec4<f32> {
    switch cascade {
        case 0u: { return fma(m.d0, vec4<f32>(t), m.s0); }
        case 1u: { return fma(m.d1, vec4<f32>(t), m.s1); }
        default: { return fma(m.d2, vec4<f32>(t), m.s2); }
    }
}

fn sky_ray_cascade(m: SkyRayMarch, t: f32, cascade: u32) -> f32 {
    let matrix = frame.cascade_vp[cascade];
    let lp = sky_ray_clip(m, cascade, t);
    let ndc = lp.xyz / lp.w;'''

