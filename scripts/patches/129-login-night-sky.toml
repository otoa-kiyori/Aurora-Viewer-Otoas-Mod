[[patch]]
id = "login-night-sky-palettes"
why = "the two builds, the cache that keeps the second beside the first, and Palette::backdrop"
paths = ["crates/aurora-viewer/src/theme.rs"]
op = "literal"
find = """impl Theme {
    /// The colors, those of the high contrast palette instead of the skin's"""
replace = """// aurora-local-patch: login-night-sky-palettes
/// The palettes `Theme::palette_for` built with interface colours chosen,
/// each with its twin for the login backdrop, newest last: the user's skin,
/// and the default one of the previews that build their own.
static BACKDROPS: std::sync::Mutex<Vec<(Palette, Palette)>> = std::sync::Mutex::new(Vec::new());

impl Palette {
    /// The palette of the login backdrop: the night sky of `ui/aurora_bg.rs`
    /// and what is written straight on it (title, footer, the loading
    /// banner). It is this palette built without the interface colours of
    /// the preferences, so that a light interface keeps a dark sky and its
    /// aurora while the cards, fields and buttons keep the chosen colours.
    /// Itself when no interface colour is chosen, in high contrast, and for
    /// a palette `Theme::palette_for` did not build.
    pub fn backdrop(&self) -> Palette {
        let Ok(built) = BACKDROPS.lock() else { return *self };
        let found = built.iter().rev().find(|(palette, _)| palette == self);
        found.map_or(*self, |(_, backdrop)| *backdrop)
    }
}

/// Keeps `backdrop` as the twin of `palette`, for `Palette::backdrop`.
pub(crate) fn remember_backdrop(palette: Palette, backdrop: Palette) {
    // a few skins at most: a skin reload or a new choice adds one
    const KEPT: usize = 8;
    let Ok(mut built) = BACKDROPS.lock() else { return };
    if built.last() == Some(&(palette, backdrop)) {
        return;
    }
    built.retain(|(known, _)| *known != palette);
    if built.len() >= KEPT {
        built.remove(0);
    }
    built.push((palette, backdrop));
}

impl Theme {
    /// What `palette_for` builds for these settings, and the login
    /// backdrop's palette when it differs: the same build with only the
    /// interface colours left out, so that high contrast, Disable glass and
    /// the colour blindness adaptation stay as they are. `interface` applies
    /// the colours (`interface_colors::apply`; the tests give it `derive`,
    /// which leaves the process-wide state alone).
    pub(crate) fn palettes(
        &self,
        vision: crate::colorblind::Vision,
        high_contrast: bool,
        glass_off: bool,
        colors: &crate::interface_colors::InterfaceColors,
        interface: fn(Palette, &crate::interface_colors::InterfaceColors) -> Palette,
    ) -> (Palette, Option<Palette>) {
        let build = |chosen: Option<&crate::interface_colors::InterfaceColors>| {
            let mut base = if high_contrast {
                crate::high_contrast::palette()
            } else if let Some(chosen) = chosen {
                interface(self.skin_palette(), chosen)
            } else {
                self.skin_palette()
            };
            // Disable glass (Preferences › Accessibility): keep the skin's
            // colours, drop the frosted pass, the world never shows through.
            if glass_off {
                base.panel_alpha = 255;
            }
            crate::colorblind::palette(base, vision)
        };
        let palette = build(Some(colors));
        let backdrop = (!high_contrast && !colors.is_default()).then(|| build(None));
        (palette, backdrop)
    }
}

impl Theme {
    /// The colors, those of the high contrast palette instead of the skin's"""

