[[patch]]
id = "login-night-sky-test"
why = "goes with login-night-sky-palettes: the rule, the cache, the bare text's contrast, high contrast (at the end of the file: clippy's items_after_test_module)"
paths = ["crates/aurora-viewer/src/ui/aurora_bg.rs"]
op = "regex"
pattern = '\n\Z'
replace = '''


// aurora-local-patch: login-night-sky-test
#[cfg(test)]
mod night_sky_tests {
    use super::mix;
    use crate::colorblind::{Deficiency, Vision};
    use crate::interface_colors::{InterfaceColors, contrast, derive};
    use crate::theme::{Palette, Theme};
    use egui::Color32;

    /// The interface step without its process-wide state (`apply` keeps it).
    fn interface(skin: Palette, colors: &InterfaceColors) -> Palette {
        derive(skin, colors).0
    }

    /// A light background chosen in Preferences › Appearance › Skin.
    fn light() -> InterfaceColors {
        InterfaceColors {
            surface: Some([244, 244, 247, 255]),
            ..Default::default()
        }
    }

    /// The skin's own colours: one palette, the one upstream builds.
    #[test]
    fn the_skin_colours_give_the_backdrop_the_interface_palette() {
        let theme = Theme::default();
        for glass_off in [false, true] {
            let (palette, backdrop) = theme.palettes(Vision::OFF, false, glass_off, &InterfaceColors::default(), interface);
            assert!(backdrop.is_none());
            let mut upstream = theme.skin_palette();
            if glass_off {
                upstream.panel_alpha = 255;
            }
            assert_eq!(palette, upstream);
            assert_eq!(palette.backdrop(), palette);
        }
    }

    /// A light background: the cards take it, the sky keeps the skin's
    /// night (upstream turned it near white), and a colour blindness
    /// adaptation still applies to the sky.
    #[test]
    fn a_light_background_keeps_the_skins_night_sky() {
        let theme = Theme::default();
        let skin = theme.skin_palette();
        let (palette, backdrop) = theme.palettes(Vision::OFF, false, false, &light(), interface);
        let backdrop = backdrop.expect("a chosen colour gives the backdrop its own palette");
        assert_eq!(palette.panel, Color32::from_rgb(244, 244, 247));
        assert_ne!(palette.navy, skin.navy);
        assert_eq!(backdrop, skin);
        crate::theme::remember_backdrop(palette, backdrop);
        assert_eq!(palette.backdrop(), backdrop);
        let tritan = Vision::new(Deficiency::Tritan, 1.0);
        let (_, adapted) = theme.palettes(tritan, false, false, &light(), interface);
        assert_eq!(adapted, Some(crate::colorblind::palette(skin, tritan)));
    }

    /// What is written straight on the sky (title, tagline, footer, the
    /// loading banner) reads on every colour of it with a light interface:
    /// 4.5:1 for text, 3:1 for the dim version line (the palette's own
    /// minimum for dim text).
    #[test]
    fn text_on_the_sky_reads_with_a_light_interface() {
        let (_, backdrop) = Theme::default().palettes(Vision::OFF, false, false, &light(), interface);
        let p = backdrop.expect("a backdrop palette");
        // the sky's stops and the two ridges, as `shapes` paints them
        let deep = mix(p.navy, Color32::BLACK, 0.45);
        let horizon = mix(p.navy, p.indigo, 0.22);
        let far = mix(p.navy, p.indigo, 0.16);
        let near = mix(p.navy, Color32::BLACK, 0.35);
        for ground in [deep, p.navy, horizon, far, near] {
            for (name, text) in [
                ("ink", p.ink),
                ("violet_pale", p.violet_pale),
                ("violet_light", p.violet_light),
                ("muted", p.muted),
            ] {
                let ratio = contrast(text, ground);
                assert!(ratio >= 4.5, "{name} on {ground:?}: {ratio}");
            }
            let dim = contrast(p.muted_dim, ground);
            assert!(dim >= 3.0, "muted_dim on {ground:?}: {dim}");
        }
    }

    /// High contrast ignores the interface colours: one palette, its own.
    #[test]
    fn high_contrast_keeps_one_palette() {
        let theme = Theme::default();
        for colors in [InterfaceColors::default(), light()] {
            let (palette, backdrop) = theme.palettes(Vision::OFF, true, false, &colors, interface);
            assert!(backdrop.is_none());
            assert_eq!(palette, crate::high_contrast::palette());
        }
    }
}
'''

