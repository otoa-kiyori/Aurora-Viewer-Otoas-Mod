[[patch]]
id = "login-night-sky-dialogs"
why = "the login dialogs blur the real screen behind them, now the dark sky: a chosen panel covers it instead of tinting it"
paths = ["crates/aurora-viewer/src/ui/widgets/workspace.rs"]
op = "literal"
find = "frame.fill = Color32::from_rgba_unmultiplied(p.panel.r(), p.panel.g(), p.panel.b(), (f32::from(p.panel_alpha) * tint) as u8);"
replace = """// aurora-local-patch: login-night-sky-dialogs
            // over the backdrop's night (`Palette::backdrop`) a chosen panel
            // covers the sky: tinting it, a light one left its text at 1.2
            // to 3.2:1
            let alpha = if p.backdrop() == p {
                (f32::from(p.panel_alpha) * tint) as u8
            } else {
                u8::MAX
            };
            frame.fill = Color32::from_rgba_unmultiplied(p.panel.r(), p.panel.g(), p.panel.b(), alpha);"""
