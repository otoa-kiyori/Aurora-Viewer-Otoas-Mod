# The login screen keeps its night sky whatever the interface colours.
#
# Why: Preferences › Appearance › Skin lets the user choose the accent, the
# background and the text, and `interface_colors` derives the whole palette
# from them, the sky's `navy` included. With a light background the night of
# the login screen (ui/aurora_bg.rs) turned near white: the additive aurora
# vanished on it and the hills went pale grey, a white mask over the sky.
#
# What: the backdrop (sky, stars, aurora, hills) and what is written straight
# on it use the palette built without the interface colours: the normal
# build (Theme::palette_for) with only that step left out, so high contrast,
# Disable glass and the colour blindness adaptation stay as they are. With
# no interface colour chosen, or in high contrast, both palettes are the same
# and nothing changes. The cards, fields, buttons and dialogs keep the chosen
# colours.
# - Where: the sky of `aurora_bg::paint` (login, accounts, loading and
#   teleport screens without a last view); the title and tagline of both
#   login layouts and the logo's halo; the footer's community line and
#   version; the banner of the loading and teleport screens (veils, texts,
#   chips, progress line), and the veil over the last view behind it.
# - Not the glass cards: their frosted copy of the sky (`frosted_pane`) and
#   their lights stay the chosen palette's, as upstream. A light tint at
#   56 % over the dark sky leaves the cards' text at 1.2 to 2.5:1 (4 to 4.6:1
#   even for a chosen near-black text); over the chosen palette's light sky
#   it reads as upstream designed it. With Disable glass the cards are
#   opaque and show no sky at all.
# - The login dialogs (accounts manager, grids, sign-up, news) blur the
#   real screen behind them, which is now the dark sky: while the backdrop
#   differs, their chosen panel is opaque instead of a 56 % (or 78 %) tint.
# - Cost: the second palette is built with the first (only when an
#   interface colour is chosen) and kept beside it, for the last 8 palettes
#   built; `Palette::backdrop` is a lock and a comparison per call, and
#   returns the palette itself at once when nothing is kept.
#
# A local addition: the Legacy Viewer has neither interface colours nor this
# sky, so there is no counterpart to follow. No setting, no interface text.
#
# Stands alone on upstream. Other manifests touch the same files elsewhere:
# 80-window-shadow (theme.rs, in Theme::apply), 28-credentials (ui/login.rs,
# LoginForm's fields; ui/login/carousel.rs, the connect click) and
# 102-year-first-dates (ui/login/driver_notice.rs, not patched here). None of
# their anchors overlaps these, so no order between them is needed.
#
# Tests: aurora_bg::night_sky_tests (the rule, the cache, contrast of the
# bare text on the sky, high contrast). Apply or skip the whole file; only
# login-night-sky-banner and login-night-sky-last-view (the loading and
# teleport screens) may be disabled alone, they need nothing but
# `Palette::backdrop`.

