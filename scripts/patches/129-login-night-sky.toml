id = "login-night-sky-build"
why = "goes with login-night-sky-palettes: the palette as upstream builds it, its backdrop twin kept beside it"
paths = ["crates/aurora-viewer/src/theme.rs"]
op = "replace_fn_body"
fn = "palette_for"
impl = "Theme"
expect_sig = 'pub fn palette_for\(&self, vision: crate::colorblind::Vision\) -> Palette'
body = '''
let (palette, backdrop) = self.palettes(
    vision,
    crate::high_contrast::current(),
    crate::disable_glass::current(),
    &crate::interface_colors::current(),
    crate::interface_colors::apply,
);
if let Some(backdrop) = backdrop {
    remember_backdrop(palette, backdrop);
}
palette
'''

