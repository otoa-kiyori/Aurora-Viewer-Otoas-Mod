[[patch]]
id = "scene-impostors-table-restamp"
why = "goes with scene-impostors-table-hook: a changed entry goes through the hook; one that only differs by its stamp is left as it was (not uploaded)"
paths = ["crates/aurora-render/src/gpu_cull.rs"]
op = "literal"
fn = "set"
find = """        if self.mirror[i] != v {
            if self.differs.is_some_and(|differs| differs(&self.mirror[i], &v)) {
                self.touched.mark(i);
            }
            self.mirror[i] = v;
            self.dirty.mark(i);
        }"""
replace = """if self.mirror[i] != v {
            // aurora-local-patch: scene-impostors-table-restamp
            // (the change the ray tracer follows is the restamped one)
            let v = self.restamp.map_or(v, |f| f(&self.mirror[i], v));
            if self.mirror[i] != v {
                if self.differs.is_some_and(|differs| differs(&self.mirror[i], &v)) {
                    self.touched.mark(i);
                }
                self.mirror[i] = v;
                self.dirty.mark(i);
            }
        }"""

