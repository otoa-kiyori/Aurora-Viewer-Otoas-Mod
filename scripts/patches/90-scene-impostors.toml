[[patch]]
id = "scene-impostors-pick-defer-in"
why = "goes with scene-impostors-pick-defer-out: the same pick, after the probes' capture, waiting one frame when a probe shadow map takes bin 30 while a panorama may be shown; its narrowed view goes to the panorama's plan"
paths = ["crates/aurora-render/src/renderer.rs"]
op = "literal"
find = "        // impostor pictures: lit like the scene, seen from the camera"
replace = """// a pixel whose drawn faces are asked: the same camera, narrowed to it
        // (here, once the probes' capture is known: a probe shadow map takes
        // bin 30, which holds the faces the scene impostors' panorama stands
        // in for under the pixel; the pick then waits one frame,
        // scene_panorama::ScenePanorama::pick_waits)
        // aurora-local-patch: scene-impostors-pick-defer-in
        let main_vp = Mat4::from_cols_array_2d(&main.view_proj);
        // (asked in window pixels: a photo frame answers none of them)
        let drawn_px = if snapshot.is_none() && !self.panorama.pick_waits(probe_shadow_now.is_some()) {
            self.drawn_pick.begin(
                (self.config.width, self.config.height),
                main_vp.inverse(),
                Curvature::new(f.camera_pos, f.curvature),
            )
        } else {
            None
        };
        if let Some((x, y, mode)) = drawn_px {
            let narrow = crate::drawn_pick::narrow(x, y, self.config.width, self.config.height);
            let mut u = main;
            // (its group binds no soft shadow mask)
            u.soft[0] = 0.0;
            u.soft[3] = u8::from(mode.through_ignored()) as f32;
            u.view_proj = (narrow * main_vp).to_cols_array_2d();
            u.eye_view_proj = (narrow * Mat4::from_cols_array_2d(&main.eye_view_proj)).to_cols_array_2d();
            self.queue.write_buffer(&self.refl_buffers[6], 0, bytemuck::bytes_of(&u));
        }
        let pick_vp = drawn_px.map(|(x, y, _)| crate::drawn_pick::narrow(x, y, self.config.width, self.config.height) * main_vp);
        // impostor pictures: lit like the scene, seen from the camera"""

