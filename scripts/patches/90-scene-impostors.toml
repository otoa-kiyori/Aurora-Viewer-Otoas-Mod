[[patch]]
id = "scene-impostors-keep-near"
why = "goes with scene-impostors-objgpu: the selection, the edited faces, the beacons' highlights and the photo's and the give's marks are kept near; nothing at all while off"
paths = ["crates/aurora-viewer/src/scene/mod.rs"]
op = "literal"
find = "    /// The photo's isolation (`snapshot::isolate`) and the hidden rendering"
replace = """// aurora-local-patch: scene-impostors-keep-near
    /// Scene impostors (scene_impostors.rs): the selection, the edited
    /// faces, the beacons' highlights and the photo's and the give's marks
    /// are drawn as usual, never from the panorama (`ObjGpu::keep_near`,
    /// their outlines and overlays are drawn over their own depth). While
    /// off, nothing is kept and nothing is done.
    fn sync_keep_near(&mut self, renderer: &mut Renderer) {
        let on = crate::scene_impostors::stamp() != 0;
        if !on && self.keep_near.is_empty() {
            return;
        }
        let mut wanted = std::mem::take(&mut self.keep_near_next);
        wanted.clear();
        if on {
            wanted.extend(self.selection_wire.keys().copied());
            wanted.extend(self.selection_faces.keys().copied());
            wanted.extend(self.beacon_highlights.iter().copied());
            wanted.extend(self.photo_marks.iter().copied());
            wanted.extend(self.give_marks.1.iter().copied());
        }
        if wanted != self.keep_near {
            for &idx in wanted.symmetric_difference(&self.keep_near) {
                if let Some(g) = self.gpu.get_mut(idx) {
                    g.keep_near = wanted.contains(&idx);
                    renderer.cull.objects.set(idx, g.cull_object(idx));
                }
            }
            std::mem::swap(&mut self.keep_near, &mut wanted);
        }
        self.keep_near_next = wanted;
    }

    /// The photo's isolation (`snapshot::isolate`) and the hidden rendering"""

