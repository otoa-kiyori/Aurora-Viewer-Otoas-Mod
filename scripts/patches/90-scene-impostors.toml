replace = """let d = length(c - frame.eye.xyz);
    // scene impostors: the shown panorama stands in for it, the face
    // captured draws it (scene_panorama::face_panorama, line for line)
    // aurora-local-patch: scene-impostors-cull-face-mask
    let impostor = (o.flags & (OBJ_AVATAR | OBJ_RIGGED | OBJ_NO_PROBE | OBJ_NO_IMPOSTOR)) == 0u && o.avatar >= n;
    let far_front = impostor && in_panorama(frame.panorama[0], frame.panorama[2].x, frame.panorama_stamps.x, o.stamp, c, r);
