[[patch]]
id = "scene-impostors-plan"
why = "the panorama's part of the frame: what it may do, the face it captures and that face's uniforms"
paths = ["crates/aurora-render/src/renderer.rs"]
op = "literal"
find = "        let gpu = lists.gpu.filter(|_| self.gpu_cull);"
replace = """let gpu = lists.gpu.filter(|_| self.gpu_cull);
        // ---- scene impostors (scene_panorama.rs): the panorama's part of
        // this frame, and the uniforms of the face it captures
        // aurora-local-patch: scene-impostors-plan
        let scene_pano = {
            let state = crate::scene_panorama::FrameState {
                params: f.panorama,
                // GPU lists, the window's own frame, above the water (the
                // captures see the water's fog as an eye above it does)
                usable: gpu.is_some() && snapshot.is_none() && !f.cutout && f.camera_pos.z >= camera_water_level,
                // (a drawn pick: bin 30 holds the panorama's faces under it)
                pick: pick_vp,
                // (bin 30 holds the probe shadow map's casters this frame)
                capture: probe_shadow_now.is_none(),
                eye: f.camera_pos,
                look: crate::scene_panorama::Look::of(
                    f,
                    crate::scene_panorama::face_size(world_size.1, f.fov_y, self.device.limits().max_texture_dimension_2d),
                ),
                now: Instant::now(),
                view_proj: eye_view_proj(fu.proj, fu.view, fu.camera_pos, true),
                scene_size: world_size,
                samples: self.targets.depth_msaa_tex.as_ref().map_or(1, |t| t.sample_count()),
                formats: crate::scene_panorama::Formats {
                    colour: HDR_FORMAT,
                    depth: DEPTH_FORMAT,
                    // the G-buffer's format follows Reflection precision: the target's own
                    gbuf: self.targets.gbuf.as_ref().map(|view| view.texture().format()),
                },
            };
            self.panorama.plan(&self.device, &self.queue, &state)
        };
        if let Some(c) = &scene_pano.capture {
            let mut pf = f.clone();
            pf.shadows = false;
            pf.proj = crate::scene_panorama::face_proj();
            let mut u = self.frame_uniforms(&pf, crate::probes::face_view(c.centre, c.face), None, &cascades, &splits);
            // 2: a cube face's view is mirrored (probes::face_view); lit by
            // the probes as the main view is, with its tangent frame and its
            // specular anti-aliasing; no clip plane
            u.misc = [0.0, 0.0, 0.0, 2.0];
            u.clip_plane = [0.0; 4];
            let shading = main.light_sets.mode[2] & crate::scene_panorama::MAIN_SHADING_BITS;
            u.light_sets.mode[2] |= crate::probes::capture_lighting::LIT | shading;
            let n = c.size as f32;
            u.screen = [n, n, 1.0 / n, 1.0 / n];
            self.queue.write_buffer(&self.refl_buffers[9], 0, bytemuck::bytes_of(&u));
        }"""

