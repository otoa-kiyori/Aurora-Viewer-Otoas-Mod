# Scene impostors: the far field drawn from a panorama (local addition).
#
# Preferences › Graphics › Quality › Distance and detail: "Scene impostors"
# (off by default) and, behind its cog, "Impostor distance" (120 m, 64 to
# 1,024 m). With the switch on and the impostor distance short of the draw
# distance (scene_impostors::active, unit-tested), the objects wholly beyond
# that distance of a capture point and within the draw distance are drawn
# once into a cube panorama around it, colour and depth, lit, hazed and
# fogged as the main pass draws them (fs_reflect with the probes, from the
# capture point), one face a frame into the slot behind the one shown. Each
# frame the shown panorama is drawn into the scene pass with its depth,
# traced from the camera's own place (scene_panorama.wgsl): near terrain,
# water and objects go in front of or behind the far ones as they should.
# Its depth also goes into the single-sample depth right after the prepass
# (a pass of its own, with every anti-aliasing), so the ambient occlusion,
# the contact shadows, the anti-aliasing history, the depth of field, the
# hover and the clicks see the far field as before.
#
# The objects it stands in for leave the main view in the GPU culling
# (face_mask in cull.wgsl, gpu_cull::face_bins and
# scene_panorama::face_panorama kept line for line); their shadows,
# reflections and probes stay as they are. Terrain, water, avatars and what
# they wear, rigged and animated objects, HUDs, blended, glowing and
# texture-animated faces, water exclusion, the selection, the edited faces,
# the beacons' highlights, the photo's and the give's marks and what the
# photo's isolation leaves unseen never go into it
# (object_flags::NO_IMPOSTOR, set by the viewer), nor do particles. The
# GPU object table carries the frame stamp of each entry's last change
# (CullObject::stamp; GpuTable::set keeps the old stamp of an entry written
# again unchanged, scene_panorama::restamp, and an object whose sync only
# swapped its level of detail keeps its own, scene_panorama::detail_stamp):
# a capture only takes, and a panorama only stands in for, what did not
# change since the capture began. What moves, arrives or changes is drawn
# as usual until a capture takes it, and an object a panorama holds that
# moves, goes or changes its flags makes a new capture due at once.
#
# Refresh: the camera 1 % of the impostor distance from the capture point
# (a parallax of 0.01 rad at most for an object right at that distance,
# about 10 px at 1080p with a 60° view, less the farther it is, and the
# depth tracing takes all but what a moved eye would see behind an edge;
# 1.2 m at 120 m, about three captures a second at a walk), 4 s, the
# distances, the region (a crossing moves the render origin), the face size
# by a quarter, the sun by 2°, a sky or fog colour by 5 %, and the change of
# an object it holds. Six faces over six frames into the other slot, shown
# once complete: no hitch, no wait on the GPU. Shown up to a tenth of the
# impostor distance from its capture point, never in another region's
# render origin: past that the far field is drawn as usual until the next
# one is complete. Faces as fine as the view (N / 2 pixels per radian at a
# face's middle, as H / 2 / tan(fov / 2) at the view's), 256 to 2,048 px.
#
# Differences from a plain reading of the spec, for the image: none is
# shown under water, in a photo, a cut-out photo or a headset view. A frame
# with a drawn pick (a click, and the hover every 100 ms while anything
# rigged is in the scene) keeps it shown: bin 30 holds that frame the faces
# it stands in for under the pick's pixel, drawn by the pick pass with
# pipelines of their own (one- and two-sided faces share the bin), and no
# face is captured; a frame with a probe shadow map (bin 30 taken) makes
# the pick wait one frame. Hiding it on those frames drew the far field
# live every few frames: the far LODs, textures and lighting popped back
# and forth with the cursor over the world (2026-11-10). Off, or
# with nothing far enough, nothing is allocated or drawn and the culling
# leaves everything in place. What remains on the off path: one more frame uniform buffer and
# bind group (renderer.rs), the NO_IMPOSTOR bit and a zero stamp in the
# object table entries (read by nothing), a branch in face_mask.
#
# Known limits: a capture draws no sun shadows, and the panorama begins at
# the impostor distance even with the sun's shadows on
# (scene_panorama::start; Otoa's choice, 2026-11-09), so the far objects
# between the impostor distance and the shadow distance (192 m at shadow
# quality 3, 256 m at 4) lose the sun's shadows on them. The shadows they
# cast on the live ground stay: the shadow map still draws them, and the
# contact shadows and the ambient occlusion read the panorama's depth
# (before 2026-11-09 only with MSAA: with SMAA, FXAA, TAA or none their
# contact shadows were gone, which past the shadow distance are all the
# ground shadows they cast). Far lights
# switched on or off, a texture or a colour changed far away show at the
# next refresh (4 s at most); the debug overlays ("Show transparency", the
# pass view) may speckle on far objects; the far field ends at the capture
# point's draw distance, up to a tenth of the impostor distance off the
# camera's; the far objects write no normals nor G-buffer: no screen-space
# reflection on them, and the ambient occlusion sees them by their depth
# alone (at that distance both reach a pixel or two).
#
# Demo: AURORA_DEMO=1 AURORA_DEMO_SCENE_IMPOSTORS=on|off[:walk] (a far field
# of 24 neighbour regions and about 2,400 boxes out to 1 km); the options
# window reveals AURORA_DEMO_OPTIONS=graphics:impostors (and
# graphics:impostors-cogs, the cogs open). At frame 620 on and off show the
# same ground shadows around the far plaza and boxes: with AURORA_SHADOWS=2
# (96 m) those are their contact shadows alone, with 3 the shadow map's too.
#
# The new code is in files/scene-impostors/. Apply or skip the whole file,
# not one patch of it.

