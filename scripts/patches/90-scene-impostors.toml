[[patch]]
id = "scene-impostors-face-bins"
why = "the Rust reference of face_mask: the shown panorama takes the far static objects out of the main view, the face captured gets bin 30"
paths = ["crates/aurora-render/src/gpu_cull.rs"]
op = "literal"
fn = "face_bins"
find = """    if d - r > frame.eye[3] && !is_avatar {
        return (0, false);
    }
    let fl = frame.sizes[3];
    let viewed = o.flags & object_flags::UNSEEN == 0
        && sphere_in(&frame.planes, c, r)
        && !(own_first_person && (o.flags & object_flags::FIRST_PERSON_HIDDEN != 0 || f.bits & FACE_FIRST_PERSON_HIDDEN != 0));"""
replace = """// scene impostors: the shown panorama stands in for it, the face
    // captured draws it (scene_panorama.rs)
    // aurora-local-patch: scene-impostors-face-bins
    let (far_front, pano) = crate::scene_panorama::face_panorama(frame, &o, n, c, r);
    if d - r > frame.eye[3] && !is_avatar {
        let solid = (pass::OPAQUE..=pass::MASK_2S).contains(&(f.bits & pass::BITS));
        return (u32::from(pano && solid) << BIN_PROBE_SHADOW, false);
    }
    let fl = frame.sizes[3];
    let viewed = o.flags & object_flags::UNSEEN == 0
        && sphere_in(&frame.planes, c, r)
        && !far_front
        && !(own_first_person && (o.flags & object_flags::FIRST_PERSON_HIDDEN != 0 || f.bits & FACE_FIRST_PERSON_HIDDEN != 0));"""

