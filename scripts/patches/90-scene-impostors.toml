        && in_panorama(frame.panorama[1], frame.panorama[2].y, frame.panorama_stamps.y, o.stamp, c, r)
        && sphere_in(frame.panorama_planes, c, r)
        && r * frame.dist.z / max(length(c - frame.panorama[1].xyz), 0.1) >= 1.5;
