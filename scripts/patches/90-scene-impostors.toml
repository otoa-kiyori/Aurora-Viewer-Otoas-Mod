    // panorama stands in for under its pixel, as the main view draws it
    let picked = far_front
        && free
        && frame.panorama[2].z > 0.0
        && sphere_in(frame.panorama_planes, c, r)
        && d - r <= frame.eye.w
        && r * frame.dist.z / max(d, 0.1) >= 1.5;
    let pano = pano_face || picked;
    if (d - r > frame.eye.w && !is_avatar) {
        let far_pass = f.bits & PASS_BITS;
        return select(0u, 1u << BIN_PROBE_SHADOW, pano && far_pass >= PASS_OPAQUE && far_pass <= PASS_MASK_2S);
