replace = """// aurora-local-patch: scene-impostors-cull-in-panorama
// Scene impostors (scene_panorama::in_panorama, kept line for line): the
// sphere lies wholly beyond the impostor distance of a panorama's capture
// point (p.w; 0: none) and within its draw distance `reach`, its object
// unchanged since the capture began.
fn in_panorama(p: vec4<f32>, reach: f32, stamp: u32, object_stamp: u32, c: vec3<f32>, r: f32) -> bool {
    let near = length(c - p.xyz) - r;
    return p.w > 0.0 && object_stamp < stamp && near > p.w && near <= reach;
}

var<workgroup> wg_bins: array<atomic<u32>, BINS>;"""

