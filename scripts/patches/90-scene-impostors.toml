#[test]
fn the_impostor_distance_is_behind_the_scene_impostors_cog() {
    let mut frames = Frames::new();
    let (mut s, mut st, mut r) = (Settings::default(), OptionsUi::default(), OptionsResult::default());
    let distance = aurora_i18n::tr!("ui-options-impostor-distance");
    let mut texts = Vec::new();
    for _ in 0..3 {
        texts = page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 0, Vec::new());
    }
    assert!(!s.scene_impostors && s.impostor_distance == 120.0, "off, 120 m");
    assert!(!texts.iter().any(|t| t.source == distance), "behind its cog at first");
    let stepping = texts
        .iter()
