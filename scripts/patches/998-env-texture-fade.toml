[[patch]]
id = "env-texture-fade-scene-textures"
why = "the second textures asked for and kept as the first ones are, after them: a texture passing from one set to the other is never released in between; and which of them are in, for the selector"
paths = ["crates/aurora-viewer/src/scene/mod.rs"]
op = "literal"
find = "/// Keep the sky / water textures resident; returns their slots (0 until loaded)."
replace = '''// aurora-local-patch: env-texture-fade-scene-textures
    /// The second textures of an environment cross-fade (world/eep_fade.rs;
    /// nil: none), kept resident as [`Self::env_textures`] keeps the first
    /// ones, and called after it: a texture moving from one set to the
    /// other stays held. Their slots, 0 until loaded.
    pub fn env_fade_textures(&mut self, renderer: &mut Renderer, ids: [Uuid; 6]) -> [u32; 6] {
        std::mem::swap(&mut self.env_tex, &mut self.env_fade_tex);
        let slots = self.env_textures(renderer, ids);
        std::mem::swap(&mut self.env_tex, &mut self.env_fade_tex);
        slots
    }

    /// The environment textures held that are in (the first ones, then the
    /// second ones; nil for the others), as [`Self::env_textures`] gives
    /// their slots: what an environment change waits for
    /// (`EnvSelector::set_ready_textures`).
    pub fn env_ready_textures(&self) -> [Uuid; 12] {
        let mut out = [Uuid::nil(); 12];
        for (o, (id, _)) in out.iter_mut().zip(self.env_tex.iter().chain(self.env_fade_tex.iter())) {
            if !id.is_nil() && (self.textures.is_loaded(id) || self.textures.is_local(id)) {
                *o = *id;
            }
        }
        out
    }

    /// Keep the sky / water textures resident; returns their slots (0 until loaded).'''

[[patch]]
id = "env-texture-fade-app"
why = "each frame, after the first textures' slots: the second ones', a texture still loading taking no share yet"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = "env.sky.halo_texture = slots[5];"
replace = '''env.sky.halo_texture = slots[5];
        // aurora-local-patch: env-texture-fade-app
        // the environment's cross-fade: the second textures, after the first
        // ones (world/eep_fade.rs)
        let fade_slots = self.scene.env_fade_textures(&mut gfx.renderer, env.next_textures);
        env.set_fade_slots(fade_slots);'''

[[patch]]
id = "env-texture-fade-clouds-revision"
why = "the weather map follows the second cloud texture's texels too while it fades in (a frozen fade's share no longer moves)"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''                Some(env.sky.cloud_texture)
                    .and_then(|slot| gfx.renderer.textures.revision_of(slot))
                    .unwrap_or(0),'''
replace = '''// aurora-local-patch: env-texture-fade-clouds-revision
                Some(env.sky.cloud_texture)
                    .and_then(|slot| gfx.renderer.textures.revision_of(slot))
                    .unwrap_or(0)
                    ^ Some(env.sky.fade.cloud)
                        .filter(|f| f.texture != 0 && f.blend > 0.0)
                        .and_then(|f| gfx.renderer.textures.revision_of(f.texture))
                        .map_or(0, |r| r.rotate_left(32)),'''

[[patch]]
id = "env-texture-fade-app-ready"
why = "the selector learns which environment textures are in (last frame's), for the textures a change waits for"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = "self.world.eep.set_manual_transition(self.settings.env_manual_transition);"
replace = '''self.world.eep.set_manual_transition(self.settings.env_manual_transition);
        // aurora-local-patch: env-texture-fade-app-ready
        // (the environment textures in, last frame's: a change keeps a texture
        // that is not at share 0 until it is, world/eep_fade.rs)
        self.world.eep.set_ready_textures(self.scene.env_ready_textures());'''

[[patch]]
id = "env-texture-fade-app-scroll"
why = "each cloud layer shown scrolls at its own rate from its own position (one accumulated scroll for a still sky, as before)"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''        if !self.photo_clouds_paused() {
            self.world.cloud_scroll += sky_frame.cloud_scroll_rate * world_dt / 100.0;
        }
        self.world.cloud_scroll = glam::Vec2::new(
            self.world.cloud_scroll.x.rem_euclid(1024.0),
            self.world.cloud_scroll.y.rem_euclid(1024.0),
        );
        let mut env = Environment::from_eep(&sky_frame, &water_frame, self.world.cloud_scroll, self.settings.draw_distance)'''
replace = '''// aurora-local-patch: env-texture-fade-app-scroll
        // (one scroll position for each cloud layer shown, advanced at its own
        // rate: while the clouds cross-fade each layer moves as its own sky
        // moves it, and the one that remains goes on from its place; a still
        // sky keeps the one accumulated scroll of before; world/eep_fade.rs
        // CloudScroll)
        let scroll_dt = if self.photo_clouds_paused() { 0.0 } else { world_dt };
        let cloud_scrolls = self.world.cloud_scrolls.advance(&sky_frame.shown_textures().cloud, scroll_dt);
        self.world.cloud_scroll = cloud_scrolls[0];
        let mut env = Environment::from_eep_scrolled(&sky_frame, &water_frame, cloud_scrolls, self.settings.draw_distance)'''

