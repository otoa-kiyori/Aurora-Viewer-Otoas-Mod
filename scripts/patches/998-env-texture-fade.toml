[[patch]]
id = "env-texture-fade-cloud-noise"
why = "the flat clouds' noise of a given texture and one cloud layer drawn as its own sky draws it (its texture, zoom, variance and offsets), shared by the first and the second layer"
paths = ["crates/aurora-render/src/shaders/common.wgsl"]
op = "literal"
find = '''fn cloud_noise(uv: vec2<f32>) -> f32 {
    return sample_tex_level(frame.tex_slots.x, uv, 0.0).x;
}'''
replace = '''fn cloud_noise(uv: vec2<f32>) -> f32 {
    return sample_tex_level(frame.tex_slots.x, uv, 0.0).x;
}

// aurora-local-patch: env-texture-fade-cloud-noise
// The cloud noise of the texture in `slot`.
fn cloud_noise_in(slot: u32, uv: vec2<f32>) -> f32 {
    return sample_tex_level(slot, uv, 0.0).x;
}

// One cloud layer of sky_clouds (cloudsF.glsl) as its own sky draws it: the
// texture in `slot`, the dome's coordinates `dome` zoomed by its `scale`,
// warped by its `variance` (the distortion taps), at its offsets `o1` and
// `o2` (cloud_pos_density1 and 2 xy, its scroll in `o1`); `density0` the
// sky's cut from its cover, the densities (cloud_pos_density1 and 2 z) the
// sky's, blended as numbers. x: the cover before the altitude blend
// (alpha1), y: the light term (alpha2). The terms of before, for one layer;
// while the environment cross-fades each layer is drawn with its own.
fn sky_cloud_layer(slot: u32, dome: vec2<f32>, ln: vec3<f32>, scale: f32, variance: f32, o1: vec2<f32>, o2: vec2<f32>, density0: f32) -> vec2<f32> {
    let tc0 = (dome - vec2<f32>(0.5)) / scale + vec2<f32>(0.5);
    let tc1 = tc0 + vec2<f32>(ln.y * 0.0125, ln.x * 0.0125);
    let tc2 = tc0 * 16.0;
    let tc3 = tc1 * 16.0;
    let pd1 = frame.sky_cloud_pd1.xyz;
    let pd2 = frame.sky_cloud_pd2.xyz;
    var uv1 = tc0;
    var uv2 = tc1;
    var uv3 = tc2;
    var uv4 = tc3;
    let dist1 = vec2<f32>(cloud_noise_in(slot, uv1 / 8.0), cloud_noise_in(slot, (uv3 + uv1) / 16.0)) * variance * (1.0 - scale * 0.25);
    let dist2 = vec2<f32>(cloud_noise_in(slot, (uv1 + uv3) / 4.0), cloud_noise_in(slot, (uv4 + uv2) / 8.0)) * variance * (1.0 - scale * 0.25);
    uv1 += o1 + dist1 * 0.2;
    uv2 += o1;
    uv3 += o2;
    uv4 += o2;
    let dv = min(1.0, (dist1.x * 2.0 + dist1.y * 2.0 + dist2.x + dist2.y) * 4.0);
    let density = density0 * (1.0 - dv * dv);
    var alpha1 = (cloud_noise_in(slot, uv1) - 0.5) + (cloud_noise_in(slot, uv3) - 0.5) * pd2.z;
    alpha1 = min(max(alpha1 + density, 0.0) * 10.0 * pd1.z, 1.0);
    alpha1 = 1.0 - alpha1 * alpha1;
    alpha1 = 1.0 - alpha1 * alpha1;
    var alpha2 = cloud_noise_in(slot, uv2) - 0.5;
    alpha2 = min(max(alpha2 + density, 0.0) * 2.5 * pd1.z, 1.0);
    alpha2 = 1.0 - alpha2;
    alpha2 = 1.0 - alpha2 * alpha2;
    return vec2<f32>(alpha1, alpha2);
}'''

