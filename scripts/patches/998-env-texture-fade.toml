[[patch]]
id = "env-texture-fade-selector"
why = "an environment change (the selector's fade: another environment, a parcel's, an altitude zone's, a local or pushed one, the photo window closing, one begun over another) cross-fades the textures, each at its own share (a texture still loading joins from its arrival, the change going on for the textures alone past its time); the day cycle beneath keeps its plain blend"
paths = ["crates/aurora-viewer/src/world/eep_env.rs"]
op = "literal"
find = '''        let (sky, water) = match self.fade {
            Some(f) => {
                let t = ((input.now - f.start) as f32 / f.duration).clamp(0.0, 1.0);
                if t >= 1.0 {
                    self.fade = None;
                    (sky, water)
                } else {
                    (f.sky.lerp(&sky, t), f.water.lerp(&water, t))
                }
            }
            None => (sky, water),
        };'''
replace = '''// aurora-local-patch: env-texture-fade-selector
        // (the change cross-fades its textures, world/eep_fade.rs, each at its
        // own share: the change's progress, or, for a texture still loading,
        // from its arrival on; past its time the change goes on for its
        // textures alone, the values being the target's; a day cycle's
        // keyframes never fade)
        let ready = self.ready_textures;
        let mut ended = false;
        let (sky, water) = match self.fade.as_mut() {
            Some(f) => {
                let t = ((input.now - f.start) as f32 / f.duration).clamp(0.0, 1.0);
                let is_ready = |id: Uuid| id.is_nil() || ready.is_none_or(|r| r.contains(&id));
                let waiting = super::eep_fade::waiting((&f.sky, &f.water), (&sky, &water), is_ready);
                let shares = f.clock.advance(input.now, t, f.duration, waiting);
                if t >= 1.0 && f.clock.done() {
                    ended = true;
                    (sky, water)
                } else {
                    let sky_shares = [shares[0], shares[1], shares[2], shares[3], shares[4]];
                    (f.sky.fade_to_with(&sky, t, sky_shares), f.water.fade_to_with(&water, t, shares[5]))
                }
            }
            None => (sky, water),
        };
        if ended {
            self.fade = None;
        }'''

