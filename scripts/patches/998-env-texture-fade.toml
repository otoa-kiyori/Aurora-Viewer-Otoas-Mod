/// An element's share of its second texture for the renderer: its fade's
/// blend while it fades, else 0. The slot is the caller's, once the texture
/// is resident ([`Environment::set_fade_slots`]).
fn texture_share<L: Copy + PartialEq>(f: &Fade<L>) -> aurora_render::TextureFade {
    aurora_render::TextureFade {
        texture: 0,
        blend: if f.fading() { f.blend } else { 0.0 },
    }
}

/// The sky's cross-fade for the renderer: the shares, and the second cloud
/// layer as its own sky draws it: its offsets at its own scroll position
/// (`scrolls[1]`, x negated as the first's, SL-13084), its scale and its
/// variance.
fn sky_texture_fade(f: &SkyFade, scrolls: [glam::Vec2; 2]) -> aurora_render::SkyTextureFade {
    let (b, s) = (f.cloud.next, scrolls[1]);
    let (cloud_next, cloud_next_shape) = if f.cloud.two() {
        (
            [b.offset1.x - s.x, b.offset1.y + s.y, b.offset2.x, b.offset2.y],
            [b.scale, b.variance],
        )
    } else {
        ([0.0; 4], [0.0; 2])
    };
    aurora_render::SkyTextureFade {
        cloud: texture_share(&f.cloud),
        cloud_next,
        cloud_next_shape,
        sun: texture_share(&f.sun),
        moon: texture_share(&f.moon),
        rainbow: texture_share(&f.rainbow),
        halo: texture_share(&f.halo),
    }
}

/// The water's cross-fade for the renderer: off while one normal map
/// shows; on, each map's own waves and normal scale, the first keeping its
/// own even before the second is in.
fn water_texture_fade(f: &WaterFade) -> aurora_render::WaterTextureFade {
    if !f.two() {
        return aurora_render::WaterTextureFade::default();
    }
    aurora_render::WaterTextureFade {
        on: true,
        first_wave1: f.first.wave1,
        first_wave2: f.first.wave2,
        first_scale: f.first.scale,
        next: texture_share(f),
        next_wave1: f.next.wave1,
        next_wave2: f.next.wave2,
        next_scale: f.next.scale,
    }
}

/// The textures the elements show (cloud, sun, moon, water normal map,
/// rainbow, halo): the first ones, and the second ones of those with two
/// layers, a layer waiting for its texture included (nil otherwise). The
/// rainbow and the halo are fetched only while they show (`shown`, the
/// frame's sky).
fn fade_textures(sky: &SkyFade, water: &WaterFade, shown: &SkyParams) -> ([uuid::Uuid; 6], [uuid::Uuid; 6]) {
    let (rainbow, halo) = (shown.moisture_level > 0.0, shown.ice_level > 0.0);
    let nil = uuid::Uuid::nil();
    let next = |two: bool, id: uuid::Uuid| if two { id } else { nil };
    (
        [
            sky.cloud.first.id,
            sky.sun.first,
            sky.moon.first,
            water.first.id,
            if rainbow { sky.rainbow.first } else { nil },
            if halo { sky.halo.first } else { nil },
        ],
        [
            next(sky.cloud.two(), sky.cloud.next.id),
            next(sky.sun.two(), sky.sun.next),
            next(sky.moon.two(), sky.moon.next),
            next(water.two(), water.next.id),
            next(rainbow && sky.rainbow.two(), sky.rainbow.next),
            next(halo && sky.halo.two(), sky.halo.next),
        ],
    )
}

impl Environment {
    /// The second textures' slots (`Scene::env_fade_textures`, in the order
    /// of `next_textures`; 0 until loaded). A nil second texture is its
    /// element's stand-in and keeps its share; one still loading takes none
    /// yet: the first texture shows alone, where it was, until it is in (the
    /// selector itself waits for it, world/eep_fade.rs TextureClock; this
    /// covers a texture that is not in where it cannot wait).
    pub fn set_fade_slots(&mut self, slots: [u32; 6]) {
        let next = self.next_textures;
        let set = |f: &mut aurora_render::TextureFade, i: usize| {
            f.texture = slots[i];
            if !next[i].is_nil() && slots[i] == 0 {
                f.blend = 0.0;
            }
        };
        set(&mut self.sky.fade.cloud, 0);
        set(&mut self.sky.fade.sun, 1);
        set(&mut self.sky.fade.moon, 2);
        set(&mut self.water.fade.next, 3);
        set(&mut self.sky.fade.rainbow, 4);
        set(&mut self.sky.fade.halo, 5);
    }
}

