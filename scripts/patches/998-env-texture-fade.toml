replace = '''// aurora-local-patch: env-texture-fade-types
/// A texture element's second texture while the environment cross-fades
/// (the viewer's world/eep_fade.rs): its bindless slot (0: none, the
/// element's stand-in: no clouds, the procedural sun, no moon, no rainbow
/// or halo, the analytic water) and its share of the result (0: no fade,
/// the first texture alone and the shaders' earlier taps only).
#[derive(Debug, Clone, Copy, Default, PartialEq)]
pub struct TextureFade {
    pub texture: u32,
    pub blend: f32,
}

/// The sky's cross-fade (`SkyParams::fade`): all zero while nothing fades.
/// The first cloud layer is the sky's own fields (`cloud_scale`,
/// `cloud_variance`, `cloud_pos_density1` and 2 xy, at its own scroll).
#[derive(Debug, Clone, Copy, Default, PartialEq)]
pub struct SkyTextureFade {
    pub cloud: TextureFade,
    /// The second cloud layer as its own sky draws it: its
    /// `cloud_pos_density1` xy at its own scroll (x negated, SL-13084),
    /// then its `cloud_pos_density2` xy.
    pub cloud_next: [f32; 4],
    /// Its `cloud_scale` and `cloud_variance`.
    pub cloud_next_shape: [f32; 2],
    pub sun: TextureFade,
    pub moon: TextureFade,
    pub rainbow: TextureFade,
    pub halo: TextureFade,
}

impl SkyTextureFade {
    /// The second cloud layer's share for the shaders (common.wgsl
    /// `sky_clouds`, clouds.rs `LayerFade`): 0 without a fade, the one layer
    /// of before; a second slot of 0 is a layer of no clouds (the first
    /// one's thin out).
    pub fn cloud_share(&self) -> f32 {
        let r = self.cloud.blend;
        if r.is_nan() || r <= 0.0 { 0.0 } else { r.min(1.0) }
    }
}

/// The water's cross-fade (`WaterParams::fade`): off while one normal map
/// shows. On, the first map keeps its own waves and normal scale
/// (`first_*`; the frame's `wave1`, `wave2` and `normal_scale` stay the
/// lerped ones, which during a fade only the enhanced water's detail
/// strength reads; the swell takes each layer's own wave1 and this share,
/// patch 109), whether the second one shows yet or not.
#[derive(Debug, Clone, Copy, Default, PartialEq)]
pub struct WaterTextureFade {
    pub on: bool,
    pub first_wave1: glam::Vec2,
    pub first_wave2: glam::Vec2,
    pub first_scale: Vec3,
    pub next: TextureFade,
    pub next_wave1: glam::Vec2,
    pub next_wave2: glam::Vec2,
    pub next_scale: Vec3,
}

impl Default for WaterParams {'''

