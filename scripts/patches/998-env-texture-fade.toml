[[patch]]
id = "env-texture-fade-selector-test"
why = "a change between two environments fades and ends with no fade; between two day cycles whose keyframes differ, only the two sides fade, the share rising with the change, and the days alone never fade; a change of the cloud scroll alone cross-fades over the manual time with each layer at its own rate and no jump; a late texture joins from its arrival and still fades in after the change's time"
paths = ["crates/aurora-viewer/src/world/eep_env.rs"]
op = "literal"
find = '''    #[test]
    fn altitude_track_switch_fades() {'''
replace = '''#[test]
    fn an_environment_change_cross_fades_its_textures_and_ends_still() {
        // aurora-local-patch: env-texture-fade-selector-test
        use super::super::env::Environment;
        let id = Uuid::from_u128;
        let fixed = |cloud: Uuid, normal: Uuid| {
            let mut a = answer(-1, Some(1.0));
            if let Some(d) = a.day.as_mut() {
                d.sky_tracks[0] = vec![(
                    0.0,
                    SkyFrame {
                        cloud_id: cloud,
                        ..Default::default()
                    },
                )];
                d.water = vec![(
                    0.0,
                    WaterFrame {
                        normal_map: normal,
                        ..Default::default()
                    },
                )];
            }
            a
        };
        let mut sel = EnvSelector::default();
        sel.on_answer(REGION, -1, fixed(id(1), id(2)), ctx(None));
        let (sky, water) = sel.frame(&input(0.0));
        assert!(sky.texture_fade.is_none() && water.texture_fade.is_none());
        sel.on_answer(REGION, -1, fixed(id(3), id(4)), ctx(None));
        sel.frame(&input(10.0));
        // half way through the 5 s: both textures, half each
        let (sky, water) = sel.frame(&input(12.5));
        let (s, w) = (sky.shown_textures(), water.shown_textures());
        assert_eq!((s.cloud.first.id, s.cloud.next.id), (id(1), id(3)));
        assert_eq!((w.first.id, w.next.id), (id(2), id(4)));
        assert!((s.cloud.blend - 0.5).abs() < 1e-5 && (w.blend - 0.5).abs() < 1e-5);
        let env = Environment::from_eep(&sky, &water, glam::Vec2::ZERO, 96.0);
        assert_eq!((env.textures[0], env.next_textures[0]), (id(1), id(3)));
        assert!(env.sky.fade.cloud.blend > 0.0 && env.water.fade.on);
        // the end: one texture each, nothing carried, every share 0
        for now in [15.0, 16.0, 100.0] {
            let (sky, water) = sel.frame(&input(now));
            assert!(sky.texture_fade.is_none() && water.texture_fade.is_none(), "{now}");
            let env = Environment::from_eep(&sky, &water, glam::Vec2::ZERO, 96.0);
            assert_eq!((env.textures[0], env.textures[3]), (id(3), id(4)));
            assert!(env.next_textures.iter().all(Uuid::is_nil), "{now}");
            assert_eq!((env.sky.fade, env.water.fade), Default::default(), "{now}");
        }
    }

    #[test]
    fn a_change_between_day_cycles_fades_only_between_the_two_sides() {
        // aurora-local-patch: env-texture-fade-selector-test
        use super::super::eep_fade::{SkyFade, WaterLayer};
        let id = Uuid::from_u128;
        // a day whose two keyframes differ in every texture, the cloud
        // offsets, the waves and the normal scale
        let cycle = |n: u128| {
            let key = |k: u128, x: f32| {
                let sky = SkyFrame {
                    cloud_id: id(n + k),
                    sun_id: id(n + k + 10),
                    moon_id: id(n + k + 20),
                    cloud_pos_density1: Vec3::new(x, 0.3, 1.0),
                    cloud_pos_density2: Vec3::new(x * 2.0, 0.1, 0.5),
                    ..Default::default()
                };
                let water = WaterFrame {
                    normal_map: id(n + k + 30),
                    wave1: glam::Vec2::new(x, 1.0 - x),
                    normal_scale: Vec3::splat(1.0 + x),
                    ..Default::default()
                };
                (sky, water)
            };
            let ((s0, w0), (s1, w1)) = (key(0, n as f32 / 1000.0), key(1, 0.7));
            let mut a = answer(-1, Some(1.0));
            if let Some(d) = a.day.as_mut() {
                d.sky_tracks[0] = vec![(0.0, s0), (0.5, s1)];
                d.water = vec![(0.0, w0), (0.5, w1)];
            }
            a
        };
        // 14400 s a day: unix 3500 is 0.486 of the first segment, 3700 0.514
        let at = |now: f64, unix: f64| FrameInput {
            unix_secs: unix,
            ..input(now)
        };
        let mut sel = EnvSelector::default();
        sel.on_answer(REGION, -1, cycle(100), ctx(None));
        // the day alone, across its half-way switch: no fade at all
        let mut shown = sel.frame(&at(0.0, 3500.0));
        for (now, unix) in [(1.0, 3700.0), (2.0, 2000.0), (3.0, 1000.0)] {
            assert!(shown.0.texture_fade.is_none() && shown.1.texture_fade.is_none(), "{unix}");
            shown = sel.frame(&at(now, unix));
        }
        assert!(shown.0.texture_fade.is_none() && shown.1.texture_fade.is_none());
        assert_eq!(shown.0.cloud_id, id(100));
        let (from, from_water) = (SkyFade::of(&shown.0).cloud.first, WaterLayer::of(&shown.1));
        // another day: the change fades from what was shown to the other
        // day as it moves, two layers, the share rising with the change
        sel.on_answer(REGION, -1, cycle(200), ctx(None));
        sel.frame(&at(10.0, 1000.0));
        let mut last = 0.0;
        for (now, unix) in [(10.5, 1010.0), (11.5, 1020.0), (12.5, 1030.0), (13.5, 1040.0), (14.5, 1050.0)] {
            let (sky, water) = sel.frame(&at(now, unix));
            let target = sel.shown.expect("shown");
            assert!(target.target_sky.texture_fade.is_none() && target.target_water.texture_fade.is_none());
            let (s, w) = (sky.shown_textures(), water.shown_textures());
            let t = ((now - 10.0) / 5.0) as f32;
            assert_eq!(
                (s.cloud.first, s.cloud.next),
                (from, SkyFade::of(&target.target_sky).cloud.first),
                "{now}"
            );
            assert_eq!((w.first, w.next), (from_water, WaterLayer::of(&target.target_water)), "{now}");
            assert_eq!((s.sun.first, s.sun.next), (id(110), id(210)), "{now}");
            assert!(
                (s.cloud.blend - t).abs() < 1e-5 && (w.blend - t).abs() < 1e-5,
                "{now}: {}",
                s.cloud.blend
            );
            assert!(s.cloud.blend > last, "{now}");
            last = s.cloud.blend;
        }
        // over: the other day alone, moving, and never fading
        for (now, unix) in [(15.0, 1060.0), (16.0, 3500.0), (17.0, 3700.0)] {
            let (sky, water) = sel.frame(&at(now, unix));
            assert!(sky.texture_fade.is_none() && water.texture_fade.is_none(), "{now}");
        }
    }

    /// The share is the change's own progress over its own duration (the
    /// local change's manual transition time here, as a personal sky
    /// preset applied over a parcel's day), the same clock and the same
    /// linear ratio as every other value of the change
    /// (LLSettingsBlenderTimeDelta: time spent / blend span); exactly 0
    /// before the start and from the end on; a change of 0 s is instant,
    /// with no fade and no second texture.
    #[test]
    fn the_texture_share_is_the_changes_own_progress() {
        // aurora-local-patch: env-texture-fade-selector-test
        use super::super::eep_fade::SkyFade;
        use super::super::env::Environment;
        let id = Uuid::from_u128;
        // the shared environment: a day whose keyframes differ
        let mut shared = answer(-1, Some(0.7));
        if let Some(d) = shared.day.as_mut() {
            let key = |cloud: u128, x: f32| SkyFrame {
                cloud_id: id(cloud),
                cloud_pos_density1: Vec3::new(x, 0.2, 1.0),
                ..Default::default()
            };
            d.sky_tracks[0] = vec![(0.0, key(1, 0.1)), (0.5, key(2, 0.8))];
        }
        let preset = Arc::new(Settings::Sky(SkyFrame {
            cloud_id: id(9),
            cloud_pos_density1: Vec3::new(0.5, 0.1, 1.0),
            ..Default::default()
        }));
        for duration in [0.0f32, 2.0, 29.0, 60.0] {
            let mut sel = EnvSelector::default();
            sel.on_answer(REGION, -1, shared.clone(), ctx(None));
            let (before, _) = sel.frame(&input(0.0));
            assert!(before.texture_fade.is_none());
            let from = SkyFade::of(&before).cloud.first;
            sel.set_manual_transition(duration);
            sel.request_local(SKY, SettingsKind::Sky);
            sel.on_settings(SKY, Some(preset.clone()));
            // the change starts with the next frame
            let start = 1.0;
            let (sky, water) = sel.frame(&input(start));
            assert!(
                sky.texture_fade.is_none() && water.texture_fade.is_none(),
                "{duration}: at its start"
            );
            if duration == 0.0 {
                assert_eq!(sky.cloud_id, id(9), "instant");
                let env = Environment::from_eep(&sky, &water, glam::Vec2::ZERO, 96.0);
                assert!(env.next_textures.iter().all(Uuid::is_nil));
                continue;
            }
            for part in [0.25f32, 0.5, 0.75] {
                let (sky, water) = sel.frame(&input(start + f64::from(part * duration)));
                let s = sky.shown_textures().cloud;
                assert_eq!((s.first, s.next.id), (from, id(9)), "{duration} at {part}");
                assert!((s.blend - part).abs() < 1e-4, "{duration} at {part}: {}", s.blend);
                // the frame's own offset, lerped by the same ratio
                let x = before.cloud_pos_density1.x;
                assert!(
                    (sky.cloud_pos_density1.x - (x + (0.5 - x) * part)).abs() < 1e-4,
                    "{duration} at {part}"
                );
                // the water does not change: no fade of its own
                assert!(water.texture_fade.is_none(), "{duration} at {part}");
            }
            for end in [start + f64::from(duration), start + f64::from(duration) + 0.5] {
                let (sky, water) = sel.frame(&input(end));
                assert!(sky.texture_fade.is_none() && water.texture_fade.is_none(), "{duration} at {end}");
                assert_eq!(sky.cloud_id, id(9));
            }
        }
    }

    /// A personal sky that differs from the shared one only in its cloud
    /// scroll (the same texture, offsets and scale, as a Midday and a
    /// Midnight preset): over the 29 s manual transition both layers show,
    /// the share is the change's progress, each layer scrolls at its own
    /// rate (CloudScroll, as the frame loop feeds it), the renderer gets
    /// each one's own place, and the clouds go on without a jump at the
    /// end. The water, the same on both sides, does not fade.
    #[test]
    fn a_change_of_the_cloud_scroll_alone_cross_fades_without_a_jump() {
        // aurora-local-patch: env-texture-fade-selector-test
        use super::super::eep_fade::{CloudLayer, CloudScroll};
        use super::super::env::Environment;
        let slow = SkyFrame {
            cloud_scroll_rate: glam::Vec2::new(0.5, 0.0),
            ..Default::default()
        };
        let fast = SkyFrame {
            cloud_scroll_rate: glam::Vec2::new(4.0, 2.0),
            ..slow
        };
        let mut shared = answer(-1, Some(1.0));
        if let Some(d) = shared.day.as_mut() {
            d.sky_tracks[0] = vec![(0.0, slow)];
        }
        let mut sel = EnvSelector::default();
        sel.on_answer(REGION, -1, shared, ctx(None));
        let mut scroll = CloudScroll::default();
        let dt = 0.25f32;
        let mut now = 0.0f64;
        let mut p = [glam::Vec2::ZERO; 2];
        for _ in 0..8 {
            let (sky, _) = sel.frame(&input(now));
            p = scroll.advance(&sky.shown_textures().cloud, dt);
            now += f64::from(dt);
        }
        sel.set_manual_transition(29.0);
        sel.request_local(SKY, SettingsKind::Sky);
        sel.on_settings(SKY, Some(Arc::new(Settings::Sky(fast))));
        let start = now;
        let (mut first, mut second) = (p[0], p[0]);
        let mut last_share = 0.0f32;
        while now < start + 29.0 {
            let (sky, water) = sel.frame(&input(now));
            assert!(water.texture_fade.is_none());
            let c = sky.shown_textures().cloud;
            let t = ((now - start) / 29.0) as f32;
            let q = scroll.advance(&c, dt);
            if t > 0.0 {
                assert!(c.fading(), "{t}");
                assert_eq!((c.first, c.next), (CloudLayer::of(&slow), CloudLayer::of(&fast)));
                assert!((c.blend - t).abs() < 1e-4, "linear: {t} {}", c.blend);
                assert!(c.blend >= last_share);
                last_share = c.blend;
                // each layer at its own rate, from where it was
                assert!((q[0] - first - slow.cloud_scroll_rate * dt / 100.0).length() < 1e-4, "{t}");
                assert!((q[1] - second - fast.cloud_scroll_rate * dt / 100.0).length() < 1e-4, "{t}");
                let env = Environment::from_eep_scrolled(&sky, &water, q, 96.0);
                // the first layer as its own sky draws it, the second at its own scroll
                assert!((env.sky.cloud_pos_density1.x - (slow.cloud_pos_density1.x - q[0].x)).abs() < 1e-5);
                let n = env.sky.fade.cloud_next;
                assert!(
                    (n[0] - (fast.cloud_pos_density1.x - q[1].x)).abs() < 1e-5
                        && (n[1] - (fast.cloud_pos_density1.y + q[1].y)).abs() < 1e-5
                );
                assert_eq!(env.sky.fade.cloud_next_shape, [fast.cloud_scale, fast.cloud_variance]);
            }
            (first, second) = (q[0], q[1]);
            now += f64::from(dt);
        }
        // the end: the fast layer alone, going on from its place
        let (sky, water) = sel.frame(&input(now));
        assert!(sky.texture_fade.is_none());
        let end = scroll.advance(&sky.shown_textures().cloud, dt);
        assert!(
            (end[0] - second - fast.cloud_scroll_rate * dt / 100.0).length() < 1e-4,
            "{end:?} {second:?}"
        );
        let env = Environment::from_eep_scrolled(&sky, &water, end, 96.0);
        assert_eq!(env.sky.fade, Default::default());
        assert!((env.sky.cloud_pos_density1.x - (fast.cloud_pos_density1.x - end[0].x)).abs() < 1e-5);
    }

    /// A texture still loading when the change starts: the old layer shows
    /// alone at its own place while the new one waits in its slot at share
    /// 0 (asked for); once in, its share rises from 0 at twice the change's
    /// pace, and it goes on fading in past the change's time (the values
    /// then the target's) until it is whole, never switched at once.
    #[test]
    fn a_late_texture_joins_the_change_and_still_fades_in_after_it() {
        // aurora-local-patch: env-texture-fade-selector-test
        use super::super::env::Environment;
        let id = Uuid::from_u128;
        let fixed = |cloud: Uuid, normal: Uuid| {
            let mut a = answer(-1, Some(1.0));
            if let Some(d) = a.day.as_mut() {
                d.sky_tracks[0] = vec![(
                    0.0,
                    SkyFrame {
                        cloud_id: cloud,
                        ..Default::default()
                    },
                )];
                d.water = vec![(
                    0.0,
                    WaterFrame {
                        normal_map: normal,
                        ..Default::default()
                    },
                )];
            }
            a
        };
        let mut ready = [Uuid::nil(); 12];
        (ready[0], ready[1], ready[2]) = (id(1), id(2), id(4));
        let mut sel = EnvSelector::default();
        sel.set_ready_textures(ready);
        sel.on_answer(REGION, -1, fixed(id(1), id(2)), ctx(None));
        sel.frame(&input(0.0));
        sel.on_answer(REGION, -1, fixed(id(3), id(4)), ctx(None));
        sel.frame(&input(10.0));
        let mut last = 0.0f32;
        let mut prev_now = 10.0;
        for now in [11.0, 12.0, 13.0, 14.0, 14.5, 15.0, 15.5, 16.0, 16.5] {
            if now >= 14.5 {
                // the cloud texture is in from 14.5 s on
                ready[3] = id(3);
                sel.set_ready_textures(ready);
            }
            let (sky, water) = sel.frame(&input(now));
            let t = (((now - 10.0) / 5.0) as f32).min(1.0);
            // the water's maps are in: it follows the change
            if now < 15.0 {
                assert!((water.shown_textures().blend - t).abs() < 1e-5, "{now}");
            } else {
                assert!(water.texture_fade.is_none(), "{now}");
            }
            if now >= 16.5 {
                assert!(sky.texture_fade.is_none(), "whole at {now}");
                assert_eq!(sky.cloud_id, id(3));
                continue;
            }
            let c = sky.shown_textures().cloud;
            assert_eq!((c.first.id, c.next.id), (id(1), id(3)), "{now}");
            let env = Environment::from_eep(&sky, &water, glam::Vec2::ZERO, 96.0);
            assert_eq!(env.next_textures[0], id(3), "asked for at {now}");
            if now < 14.5 {
                assert_eq!(c.blend, 0.0, "not in: no share at {now}");
                assert_eq!(env.sky.fade.cloud.blend, 0.0);
            } else {
                assert!(c.blend > last && c.blend <= t, "{now}: {}", c.blend);
                assert!(c.blend - last <= 2.0 * (now - prev_now) as f32 / 5.0 + 1e-5, "no pop at {now}");
            }
            if now >= 15.0 {
                // past the change's time: the target's values, the textures still fading
                assert_eq!(sky.cloud_id, id(3));
                assert!(c.blend < 1.0);
            }
            last = c.blend;
            prev_now = now;
        }
    }

