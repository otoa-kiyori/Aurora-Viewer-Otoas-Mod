    // environment cross-fades the second one too (frame.env_fade_*, the
    // viewer's world/eep_fade.rs), with its own texture, scale, variance and
    // offsets at its own scroll, the two images dissolved by the share as
    // cloudsF.glsl mixes cloud_noise_texture and cloud_noise_texture_next by
    // blend_factor (there one noise at one lerped place: both slide and
    // zoom): their covers mixed, the colour weighted by each one's cover; a
    // layer of no texture is no clouds. No fade: the one layer's taps.
    var first = vec2<f32>(0.0);
    if (first_on) {
        first = sky_cloud_layer(frame.tex_slots.x, tc0, ln, cloud_scale, frame.sky_cloud_pd1.w, frame.sky_cloud_pd1.xy, frame.sky_cloud_pd2.xy, density);
    }
    let color1 = clamp(col_sun * (1.0 - first.y) + col_amb, vec3<f32>(0.0), vec3<f32>(1.0)) * 2.0;
    if (cloud_share <= 0.0) {
        return vec4<f32>(color1, clamp(first.x * altitude_blend, 0.0, 1.0));
    }
