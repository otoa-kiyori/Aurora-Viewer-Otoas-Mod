# The environment's texture elements cross-fade during an environment
# change: the cloud noise, the sun, the moon, the rainbow, the 22° halo and
# the water normal map each show two layers at once, first · (1 − blend) +
# next · blend, each layer drawn exactly as its own side draws it, the blend
# being the change's own linear progress over its time (the manual
# transition time for a personal change). The frame used to switch to the
# next texture half way and to slide, zoom, warp and speed up the one it
# showed with the lerped values. No setting, no interface, nothing sent: the
# frames' own fields (what the editors, RLVa's replies and saved settings
# read) keep their values.
#
# Only an environment change fades: the selector's fade (EnvSelector::frame,
# world/eep_env.rs: another environment, a parcel's, an altitude zone's, a
# local, pushed or photo one, a fade begun over another), through
# SkyFrame::fade_to_with and WaterFrame::fade_to_with. The blend between the
# keyframes of a day cycle (DayCycle::sky_at, water_at) stays the plain lerp,
# exactly as upstream: ids switch half way, offsets, scale, variance, scroll
# rate, waves and the normal scale are lerped, no fade is carried, every
# share is 0. A day cycle moves between two keyframes for hours; fading
# there doubled the reads all that time.
#
# A layer (files/env-texture-fade/eep_fade.rs, module doc) is a texture with
# everything that places, sizes, moves or warps its pattern, and a
# difference in any of them starts the fade:
# - clouds: the texture, cloud_pos_density1 and 2 xy, cloud_scale,
#   cloud_variance, cloud_scroll_rate and the layer's own scroll position
#   (eep_fade.rs CloudScroll, which replaces the one shared scroll of the
#   lerped rate: each layer advances at its own rate; a layer coming in
#   starts on the one it fades from; the one that remains goes on from its
#   place; a still sky keeps the one accumulated scroll of before);
# - water: the normal map, wave1, wave2 (direction and speed) and the normal
#   scale. The water has no accumulated position: every shader that reads the
#   normal pattern places a map layer at wave × time (env.wgsl water_pixel,
#   above and below the surface; patch 91's slope pass; patch 120's shape),
#   so a layer with its own waves is at its own place in every one of them.
#   Patch 109's open-sea swell travels along a layer's wave1: each layer
#   has its own swell, in its own direction.
# Left blended as numbers, on both layers alike (amounts and colours, they
# move no pattern): the cloud colour, densities (cloud_pos_density1/2 z) and
# cover (cloud_shadow); the water fog, fresnel and blur multiplier.
#
# Layers: fade_to gives each element its weighted layers (two; three when a
# change begins over another, the rule takes up to four); equal ones merge,
# the two heaviest stay, renormalised, in the order they come, so a texture
# keeps its slot; the scroll positions follow the layers, not the slots, and
# a layer taking a slot over takes the place of the one it replaces. A frame
# keeps its fade with its own fields as blended: changed afterwards (an
# editor, RLVa, an experience's push) it shows its own textures again.
#
# Loading (eep_fade.rs TextureClock): both textures are asked for as soon as
# a frame names them (Scene::env_fade_textures, after the first ones, so
# that a texture moving from one set to the other stays resident), and the
# scene tells the selector which are in (Scene::env_ready_textures). An
# incoming texture still loading keeps its layer in the second slot at share
# 0 (the old layer alone, in its own place); once in, its share rises from 0
# at twice the change's pace until it meets the change's progress, then
# follows it; past the change's time the change goes on for the textures
# alone (the values are the target's) until it reaches 1, the old layer
# staying meanwhile; a texture not in 30 s after the change's time switches
# as before. A nil texture is its element's stand-in and keeps its share: no
# clouds (their cover thins), the procedural sun, no moon, no rainbow or
# halo, the analytic water.
#
# GPU: nine vec4 appended to the frame uniform (renderer.rs FrameU,
# common.wgsl Frame; a test compares the two through naga), zero while
# nothing fades, and every second tap behind a test of a uniform share above
# 0: with no fade the shaders take exactly their earlier taps. The flat
# clouds (sky_clouds, sky_cloud_layer): each layer its own texture, zoom,
# variance and offsets at its own scroll; the two images dissolved (covers
# mixed, colour weighted by cover). The water: the three normal taps of each
# map at its own waves and scale. The sun's and the moon's texels
# (mix_disc), the rainbow's and the halo's taps, and patch 91's slope pass
# (its own small uniform, files of 91). Volumetric clouds: a second weather
# map (fs_cloud_weather_next, drawn when the first is, only while a second
# texture fades), laid by the trace at the second layer's own tile and place
# with its 3D noise anchored to its own pattern, the two densities weighted
# by the shares (clouds.rs LayerFade, clouds.wgsl cloud_density). Patch 120's
# wave shape: a second height map in 256 rows of its own under the first,
# made on the background jobs from the next normal map as the first is, and
# mixed by the share in water_shape_at and in its CPU mirror; when a fade
# ends the next map's height map becomes the first's (files of 120). Patch
# 109's swell: while the two layers' big waves point different ways, the
# old swell and the new one, each in its own direction, mixed by the water
# layer's share in the displacement, the normals, the crest foam and the
# CPU's copy (a fifth vec4 of the swell's uniform tail, files of 109); when
# patch 91's caustics fade to or from the analytic water (a nil map, which
# it draws from another light map), they dim to nothing at the middle of
# the share and come back in the other pattern.
#
# Legacy Viewer: LLSettingsSky::blend and LLSettingsWater::blend
# (indra/llinventory/llsettingssky.cpp, llsettingswater.cpp) keep the next
# texture ids and a blend factor; cloudsF.glsl, sunDiscF.glsl and
# waterF.glsl mix with it (LLDrawPoolWLSky::renderSkyCloudsDeferred and
# renderHeavenlyBodies, indra/newview/lldrawpoolwlsky.cpp;
# LLDrawPoolWater::renderPostDeferred, lldrawpoolwater.cpp), at the lerped
# offsets, scale and waves, with one scroll of the lerped rate: both
# textures slide, zoom and speed up. Its moon keeps the first texture to the
# end (the blend is commented out in renderHeavenlyBodies), its rainbow and
# halo have no next texture (renderSkyHazeDeferred binds the current sky's),
# and clouds that do not scroll do not blend. Here every element fades and
# each layer keeps its own place, size and motion: better than the Legacy
# Viewer.
#
# Cost while something fades (texture reads, counted): flat clouds 7 to 14
# a sky pixel; sun, moon, rainbow, halo 1 to 2 where each is drawn; water 3
# to 6 a pixel; volumetric clouds a second weather map of 2 taps a texel when
# the first is drawn, and a second weather tap and density (3D noise) for
# each density of the march; patch 91's slope pass 3 to 6 a texel; patch
# 120's shape (Ratio above 0) 16..24 to 32..48 loads a vertex and a pixel;
# patch 109's swell, while the two directions differ, a second set of four
# waves for each of its evaluations (a vertex, a pixel, the CPU's queries);
# only while an environment change lasts (its 1 to 5 s, or the manual
# transition time, and a late texture's join), never under a day cycle
# alone. Nothing fading: the same reads as before; on the CPU a few
# comparisons a frame and the scroll of one layer.
#
# Apply or skip the whole file, not one patch of it; patches 91, 109 and 120
# read its fields, apply it with them.
#
# Optional glue (glue_for the partner step: OPTIONAL-MISSING without the
# other patch, DRIFT when it is there and the glue's anchor is not): env-texture-fade-planets-discs, with patch 128 (it applies
# earlier), calls 128's stars.rs hide_disc_slots on the cross-fade's slots,
# so that a hidden Sun or Moon disc draws no next texture either;
# env-texture-fade-sky-kind-test, with patch 123 (it applies earlier),
# asserts in 123's day-cycle test (world/sky_kind.rs) that a plain keyframe
# blend carries no texture fade; env-texture-fade-ocean-waves and its
# test, with patch 109 (it applies earlier), give the open-sea swell each
# water layer's own big wave while the water cross-fades (scene/
# ocean_field.rs swell_waves).

