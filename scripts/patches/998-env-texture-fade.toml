id = "env-texture-fade-clouds-fade-key"
why = "goes with env-texture-fade-clouds-key: the second layer as the trace lays it, and the weather key with it"
paths = ["crates/aurora-render/src/clouds.rs"]
op = "literal"
find = "fn entry(binding: u32, resource: wgpu::BindingResource<'_>) -> wgpu::BindGroupEntry<'_> {"
replace = '''// aurora-local-patch: env-texture-fade-clouds-fade-key
/// The second cloud layer of an environment cross-fade as the trace draws it
/// (types.rs `SkyTextureFade`; the first is the sky's own fields): each
/// layer's weight, the second one's weather map tile and the offset of its
/// pattern (its scroll included), so that it is laid as its own sky lays it.
/// Default: no fade, the one layer of before.
#[derive(Clone, Copy, Debug, Default, PartialEq)]
pub struct LayerFade {
    pub on: bool,
    /// The first layer's weight (1 - the share; 0 when it draws nothing).
    pub first: f32,
    /// The second layer's weight (the share; 0 when it draws nothing: no
    /// texture, the stand-in of no clouds, or no scale).
    pub share: f32,
    pub tile_km: f32,
    pub pattern_km: [f64; 2],
}

impl LayerFade {
    pub fn of(s: &crate::types::SkyParams, first_drawn: bool) -> LayerFade {
        let share = s.fade.cloud_share();
        if share <= 0.0 {
            return LayerFade::default();
        }
        let scale = s.fade.cloud_next_shape[0];
        let tile = tile_km(scale);
        let next_drawn = layer_drawn(scale, s.fade.cloud.texture, s.cloud_pos_density1.z);
        LayerFade {
            on: true,
            first: if first_drawn { 1.0 - share } else { 0.0 },
            share: if next_drawn { share } else { 0.0 },
            tile_km: tile,
            pattern_km: [0, 1].map(|i| f64::from(s.fade.cloud_next[i]) * f64::from(tile)),
        }
    }

    /// Whether the second layer draws anything.
    pub fn drawn(&self) -> bool {
        self.share > 0.0
    }
}

impl Params {
    /// The offset of the second layer's pattern past the first's (km),
    /// wrapped in the period the noises and the tiles repeat with.
    pub fn fade_offset_km(&self) -> [f32; 2] {
        [0, 1].map(|i| {
            let first = self.camera_km[i] + self.pattern_km[i];
            let next = self.camera_km[i] + self.fade.pattern_km[i];
            (next - first).rem_euclid(PERIOD_KM) as f32
        })
    }
}

/// [`weather_key`] with the environment's cloud cross-fade folded in:
/// unchanged while nothing fades; otherwise also whether a second texture's
/// map is drawn and that texture's slot (its revision comes in
/// `CloudsFrame`). The share and the places are the trace's: they draw
/// nothing again.
pub fn fade_weather_key(key: u64, fade: &LayerFade, next_texture: u32) -> u64 {
    if !fade.on {
        return key;
    }
    let mut h = key;
    for v in [1, u32::from(fade.drawn()), if fade.drawn() { next_texture } else { 0 }] {
        h = (h ^ u64::from(v)).wrapping_mul(0x0100_0000_01b3);
    }
    h
}

fn entry(binding: u32, resource: wgpu::BindingResource<'_>) -> wgpu::BindGroupEntry<'_> {'''

