[[patch]]
id = "env-texture-fade-clouds-density"
why = "the density of the two cloud layers of a cross-fade, each from its own weather map at its own place and tile, its 3D noise anchored to its own pattern, weighted by the shares; no fade, the one density of before"
paths = ["crates/aurora-render/src/shaders/clouds.wgsl"]
op = "literal"
find = '''// ---------------------------------------------------------------- lighting
fn hg(c: f32, g: f32) -> f32 {'''
replace = '''// aurora-local-patch: env-texture-fade-clouds-density
// The density at `p`, `off` the first layer's offset (the camera and its
// pattern). While the environment cross-fades (u.fade_first.y) the two
// layers' densities weighted by their shares, each as its own sky lays it:
// from its own weather map, at its own tile (the second's u.fade.z) and
// place (the second's offset u.fade.xy past the first's), its 3D noise
// anchored to its own pattern; a layer that draws nothing weighs 0. The
// layer heights and the cover are the sky's, blended as numbers. No fade:
// the one density of before.
fn cloud_density(p: vec3f, off: vec2f, full: bool) -> f32 {
    let d = density(p, weather_at(p, off), off, full);
    if u.fade_first.y < 0.5 { return d; }
    var mixed = d * u.fade_first.x;
    if u.fade.w > 0.0 {
        let off2 = off + u.fade.xy;
        let w2 = textureSampleLevel(weather_next_t, samp, (p.xz + off2) / u.fade.z, 0.0);
        mixed += density(p, w2, off2, full) * u.fade.w;
    }
    return mixed;
}

// The base noise's slow light and dark of a sheet at `p` (march), each
// layer's at its own pattern while the clouds cross-fade.
fn cloud_sheet_noise(p: vec3f, off: vec2f) -> f32 {
    let nb = textureSampleLevel(base_t, samp, vec3f(p.x + off.x, height_of(p) * BASE_Y, p.z + off.y) / BASE_KM, 0.0).g;
    if u.fade_first.y < 0.5 || u.fade.w <= 0.0 { return nb; }
    let off2 = off + u.fade.xy;
    let nb2 = textureSampleLevel(base_t, samp, vec3f(p.x + off2.x, height_of(p) * BASE_Y, p.z + off2.y) / BASE_KM, 0.0).g;
    return mix(nb, nb2, u.fade.w / max(u.fade.w + u.fade_first.x, 1e-6));
}

// ---------------------------------------------------------------- lighting
fn hg(c: f32, g: f32) -> f32 {'''

