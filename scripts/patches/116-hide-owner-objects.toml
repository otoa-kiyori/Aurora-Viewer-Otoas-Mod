# Hide every rezzed object of a chosen owner, and two small fixes of the
# blocking of objects.
#
# Cause: blocking a resident hides their avatar, attachments, particles,
# sounds and chat, but their rezzed objects stay drawn; derender and the
# asset blacklist hide one object (or one avatar) by its id. Nothing hides
# an object by its owner. The Legacy Viewer has no such rule either: this is
# an Aurora-only feature of the local patch set.
#
# What it does:
#  - the rule (world/hide_owner.rs): a permanent entry of the asset
#    blacklist of a new kind, "Owner's objects", keyed by the owner id
#    XOR-masked with a fixed value (never the owner id itself, so a rule
#    cannot collide with a derendered resident or with that owner's sound
#    categories, which share the list's keys). "Owner" is the object's owner
#    id: a resident, or the group for a group-owned (deeded) object, whose
#    owner id is the group's. Saved in the account's blacklist file with
#    asset_type 1000, a value no asset type uses (the Legacy Viewer reads it
#    as AT_NONE and acts on nothing).
#  - every rezzed root (not an avatar, not worn: attachments follow their
#    wearer's avatar rules) whose owner has a rule is taken out of the world
#    through the derender machinery, with its linked prims; its updates are
#    dropped while the rule lasts and it comes back at once when the rule is
#    removed in the Asset blacklist window (the row shows the owner's name
#    when known, and the owner's id).
#  - knowing the owner: hidden as the update arrives when the update names
#    its owner (an object with a sound or particles) or the region already
#    told it; otherwise the owner comes from properties already held (hover,
#    selection, menus, Area Search) or is asked for.
#  - the request load: only while at least one rule exists (no rule: the
#    per-frame check returns at once, nothing is asked, nothing is kept).
#    The request is RequestObjectPropertiesFamily (flags 0, reliable, to the
#    object's region), the one a hover sends
#    (LLSelectMgr::requestObjectPropertiesFamily, llselectmgr.cpp), which
#    selects nothing. At most 4 in flight, at most 5 sent per second (the
#    Monitor's name lookups' rate), nearest objects first, each root asked
#    once per region visit; an unanswered one frees its place after 10 s and
#    is not asked again in that visit. The answers are kept per region and
#    dropped when the region leaves, or when the last rule goes. Adding a
#    rule walks the objects already present; while a rule exists the
#    present roots are walked twice a second (a new object whose owner is
#    learnt later goes within half a second of the answer).
#  - never hidden: the user's own objects, the linkset the user sits on
#    (and if a seat was hidden before the user's own update came, at an
#    arrival, it comes back), whatever the user has selected (the build and
#    edit tools work on the selection). A rule cannot be made for the user.
#  - on the user's own parcel the rule applies like anywhere else: an object
#    someone else owns there (a floor, a wall) is hidden when the user asked
#    to hide that owner's objects. The parcel's owner sees it hidden too:
#    the user asked for exactly that, and the blacklist window undoes it.
#  - the menu: "Hide all objects of <owner>" (or "of the group <group>") in
#    the object menu's Disturbance submenu, after the derender entries,
#    once the object's properties came (the menu asks for them). No
#    confirmation: the blacklist window undoes it.
#  - fix 1, stricter than the Legacy Viewer: blocking an object also stops
#    its own particles (the emitting prim or its linkset's root on the block
#    list); the Legacy Viewer's particle check reads the owner only.
#  - fix 2: "Block owner" on a group-owned object whose group name is not
#    known yet no longer does nothing silently: the user is told it could
#    not be done and to try again (blocking needs the real name for the
#    list; a placeholder would need a rename the block list does not have).
#  - log (INFO): a rule added or removed, and once a minute the number of
#    owner lookups sent and answered; no ids, no names. No asset id anywhere.
#
# Differences from the Legacy Viewer: the owner rule and its lookups do not
# exist there; blocking an object stops its particles (stricter).
#
# Tests: world/hide_owner.rs (the rule, the own and spared objects, the
# limits, once per visit, the cache dropped with the region or the last
# rule, the log counts); derender.rs hide_owner_tests (a root and its prims
# hidden and restored, own and worn objects kept, a spared root, an owner
# learnt from the region, the seat released, saved and loaded as its own
# kind, no collision with the owner's sound entry); app/hide_owner.rs (the
# menu's owner: resident, group, never ourselves); blocking.rs (an object's
# particles; an unknown group refused with a message).
#
# Apply or skip the whole file, not one patch of it.

