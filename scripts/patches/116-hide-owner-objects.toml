op = "literal"
find = '''#[test]
    fn mute_particle_flag_remains_independent_of_other_mute_flags() {'''
replace = '''// aurora-local-patch: hide-owner-objects-blocking-tests
    #[test]
    fn hide_owner_fix_a_blocked_object_s_particles_stop_and_an_unknown_group_is_refused() {
        let mut w = World::new(Arc::new(AvatarLibrary::load()));
        w.agent_id = Uuid::from_u128(99);
        w.mutes.reset(w.agent_id);
        let (prim, root, other) = (Uuid::from_u128(5), Uuid::from_u128(6), Uuid::from_u128(7));
        assert!(!w.object_particles_blocked(&prim, &root));
        w.block(root, "Fountain", MuteType::Object).expect("blocked");
        assert!(w.object_particles_blocked(&prim, &root), "the linkset's root");
        assert!(w.object_particles_blocked(&root, &Uuid::nil()), "the root itself");
        assert!(!w.object_particles_blocked(&other, &other));
        let group = Uuid::from_u128(8);
        assert!(w.block_object_owner(group, true).is_err(), "no silent no-op");
        assert!(w.mutes.get(&group).is_none());
        w.land.group_names.insert(group, "Demo Group".into());
        w.take_social_commands();
        assert!(w.block_object_owner(group, true).is_ok());
        assert!(w.mutes.get(&group).is_some());
        // already blocked: nothing to say
        assert!(w.block_object_owner(group, true).is_ok());
        assert!(w.block_object_owner(w.agent_id, true).is_ok(), "ourselves: silent, as upstream");
    }

    #[test]
    fn mute_particle_flag_remains_independent_of_other_mute_flags() {'''

