replace = '''pub fn particles_blocked(&self, owner: &Uuid) -> bool {
        !owner.is_nil() && self.mutes.is_muted(owner, "", flag::PARTICLES)
    }

    // aurora-local-patch: hide-owner-objects-object-particles
    /// Particles of a blocked object: the emitting prim or its linkset's
    /// root is on the block list. Stricter than the Legacy Viewer, whose
    /// particle check (LLViewerPartSourceScript) reads the owner only.
    pub fn object_particles_blocked(&self, emitter: &Uuid, root: &Uuid) -> bool {
        [emitter, root]
            .into_iter()
            .any(|id| !id.is_nil() && self.mutes.is_muted(id, "", flag::PARTICLES))
    }'''

