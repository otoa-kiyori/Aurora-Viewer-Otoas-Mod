why = "the list's side of the rule (it reads the private entries and hidden map), with its tests"
paths = ["crates/aurora-viewer/src/world/derender.rs"]
op = "literal"
find = '''/// What the tests of `friends_only.rs` share with these.'''
replace = '''// aurora-local-patch: hide-owner-objects-derender
/// The owner rules (world/hide_owner.rs, local patch set): entries of
/// `Kind::Owner`, keyed by `hide_owner::rule_key(owner)`.
impl Derender {
    /// At least one owner rule (counted again only when the list changed).
    pub fn any_owner_rule(&mut self) -> bool {
        let generation = self.generation;
        self.owner_rule.any(generation, self.entries.values().map(|e| e.kind))
    }

    pub fn has_owner_rule(&self, owner: &Uuid) -> bool {
        self.is_owner_rule_key(&super::hide_owner::rule_key(*owner))
    }

    fn is_owner_rule_key(&self, key: &Uuid) -> bool {
        self.entries.get(key).is_some_and(|e| e.kind == Kind::Owner)
    }

    /// `filter_avatar`'s owner branch: a rezzed root already hidden by a
    /// rule stays out; a new one goes when its owner is known (named by the
    /// update, or told by the region) and has a rule. Our own objects and
    /// the spared roots (sat on, selected) never.
    fn owner_rule_by(&mut self, region: RegionHandle, u: &ObjectUpdate) -> Option<Uuid> {
        if u.parent_id != 0 || u.is_avatar() || !self.any_owner_rule() {
            return None;
        }
        let key = ObjKey {
            region,
            local_id: u.local_id,
        };
        if let Some(h) = self.hidden.get(&key)
            && self.is_owner_rule_key(&h.by)
        {
            return Some(h.by);
        }
        let owner = Some(u.owner_id)
            .filter(|o| !o.is_nil())
            .or_else(|| self.owner_rule.owner_of(region, u.full_id));
        let spared = self.owner_rule.spared(&key);
        match super::hide_owner::decide(owner, self.owner_rule.me, spared, |o| self.has_owner_rule(&o)) {
            super::hide_owner::Decision::Hide(by) => Some(by),
            _ => None,
        }
    }

    /// The root at `key` and its prims, hidden by an owner rule, come back
    /// (the agent sits on it).
    pub fn release_owner_root(&mut self, key: &ObjKey) -> Restore {
        let mut restore = Restore::default();
        let Some(by) = self.hidden.get(key).map(|h| h.by).filter(|by| self.is_owner_rule_key(by)) else {
            return restore;
        };
        let keys: Vec<ObjKey> = self
            .hidden
            .iter()
            .filter(|&(k, h)| {
                h.by == by && k.region == key.region && (k == key || h.update.as_ref().is_some_and(|u| u.parent_id == key.local_id))
            })
            .map(|(k, _)| *k)
            .collect();
        for k in keys {
            if let Some(h) = self.hidden.remove(&k) {
                if let Some(u) = h.update {
                    restore.updates.push((k.region, u));
                }
                restore.requests.entry(k.region).or_default().push(k.local_id);
            }
        }
        for (region, ids) in &restore.requests {
            self.requests.push((*region, ids.clone()));
        }
        restore
    }
}

#[cfg(test)]
mod hide_owner_tests {
    use super::*;
    use crate::world::hide_owner::rule_key;

    const ME: Uuid = Uuid::from_u128(1);
    const OWNER: Uuid = Uuid::from_u128(2);
    const OTHER: Uuid = Uuid::from_u128(3);

    fn update(local_id: u32, full_id: u128, parent_id: u32, owner_id: Uuid) -> ObjectUpdate {
        use glam::{Quat, Vec3};
        ObjectUpdate {
            local_id,
            full_id: Uuid::from_u128(full_id),
            parent_id,
            pcode: aurora_prim::params::LL_PCODE_VOLUME,
            state: 0,
            crc: 0,
            material: 3,
            click_action: 0,
            scale: Vec3::ONE,
            position: Vec3::ZERO,
            rotation: Quat::IDENTITY,
            velocity: Vec3::ZERO,
            acceleration: Vec3::ZERO,
            angular_velocity: Vec3::ZERO,
            update_flags: 0,
            owner_id,
            volume: Default::default(),
            texture_entry: None,
            extra: Default::default(),
            name_values: String::new(),
            text: String::new(),
            text_color: [0; 4],
            media_url: String::new(),
            tree_species: None,
            texture_anim: None,
            foot_plane: None,
            particles: Default::default(),
            sound: Default::default(),
        }
    }

    fn rule(permanent: bool) -> Entry {
        Entry {
            name: "Owner".into(),
            region: String::new(),
            kind: Kind::Owner,
            date: 1_700_000_000,
            permanent,
        }
    }

    fn ruled() -> Derender {
        let mut list = Derender::default();
        list.owner_rule.me = ME;
        list.add(rule_key(OWNER), rule(false));
        list
    }

    #[test]
    fn hide_owner_rule_hides_a_root_and_its_prims_and_brings_them_back() {
        let mut list = ruled();
        let by = rule_key(OWNER);
        let root = list.filter(1, &update(10, 100, 0, OWNER)).expect("hidden");
        assert!(root.newly && root.by == by);
        assert_eq!(list.filter(1, &update(11, 101, 10, Uuid::nil())).map(|d| d.by), Some(by));
        // its later updates name no owner: it stays out
        assert_eq!(list.filter(1, &update(10, 100, 0, Uuid::nil())).map(|d| d.newly), Some(false));
        assert!(list.filter(1, &update(20, 200, 0, OTHER)).is_none(), "another owner");
        assert!(list.filter(1, &update(30, 300, 0, ME)).is_none(), "our own");
        assert!(list.filter(1, &update(40, 400, 5, OWNER)).is_none(), "worn");
        assert!(list.filter(1, &update(50, 500, 0, Uuid::nil())).is_none(), "owner unknown");
        assert!(!list.contains(&OWNER) && !list.contains(&by));
        let restore = list.remove(&[by]);
        assert_eq!(restore.updates.len(), 2);
        assert_eq!(list.hidden_count(), 0);
        assert!(list.filter(1, &update(10, 100, 0, OWNER)).is_none(), "the rule is gone");
    }

    #[test]
    fn hide_owner_rule_spares_and_learns() {
        let mut list = ruled();
        list.owner_rule
            .set_spared([ObjKey { region: 1, local_id: 10 }].into_iter().collect());
        assert!(list.filter(1, &update(10, 100, 0, OWNER)).is_none(), "sat on or selected");
        list.owner_rule.learn(1, Uuid::from_u128(600), OWNER);
        assert!(list.filter(1, &update(60, 600, 0, Uuid::nil())).is_some(), "the region told us");
        assert!(list.filter(2, &update(61, 600, 0, Uuid::nil())).is_none(), "per region");
    }

    #[test]
    fn hide_owner_rule_gives_back_the_seat() {
        let mut list = ruled();
        list.filter(1, &update(10, 100, 0, OWNER));
        list.filter(1, &update(11, 101, 10, Uuid::nil()));
        list.filter(1, &update(20, 200, 0, OWNER));
        let restore = list.release_owner_root(&ObjKey { region: 1, local_id: 10 });
        assert_eq!(restore.updates.len(), 2, "the seat and its prim");
        assert_eq!(list.hidden_count(), 1, "the other object stays out");
        assert!(list.release_owner_root(&ObjKey { region: 1, local_id: 99 }).updates.is_empty());
    }

    #[test]
    fn hide_owner_rule_is_saved_as_its_own_kind_beside_the_owner_sounds() {
        let dir = std::env::temp_dir().join(format!("aurora-owner-rule-{}", Uuid::new_v4()));
        let path = dir.join(FILE);
        let mut list = Derender::load(path.clone());
        list.add_sound(
            OWNER,
            Entry {
                kind: Kind::Sound(1),
                ..rule(true)
            },
        );
        list.add(rule_key(OWNER), rule(true));
        assert!(crate::saves::wait_for(&path, std::time::Duration::from_secs(10)));
        let saved = aurora_llsd::from_xml(&std::fs::read(&path).expect("saved")).expect("llsd");
        assert_eq!(saved.get(&mask(rule_key(OWNER)).to_string()).get("asset_type").as_i32(), AT_OWNER);
        let mut list = Derender::load(path);
        assert!(list.has_owner_rule(&OWNER) && list.any_owner_rule());
        assert_eq!(list.owner_sound_flags(OWNER), 1, "the sound entry is untouched");
        assert!(!list.contains(&OWNER), "the resident is not derendered");
        let _ = std::fs::remove_dir_all(dir);
    }
}

