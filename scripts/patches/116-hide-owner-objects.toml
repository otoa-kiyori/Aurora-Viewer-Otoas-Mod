[[patch]]
id = "hide-owner-objects-group-unknown"
why = "Block owner on a group-owned object whose group name is not known yet tells the user instead of doing nothing"
paths = ["crates/aurora-viewer/src/world/blocking.rs"]
op = "literal"
find = '''pub fn block_object_owner(&mut self, owner: Uuid, group_owned: bool) -> Result<(), String> {
        if let Some((name, kind)) = self.object_owner_block(owner, group_owned) {
            self.block(owner, &name, kind)?;
        }
        Ok(())
    }'''
replace = '''pub fn block_object_owner(&mut self, owner: Uuid, group_owned: bool) -> Result<(), String> {
        if let Some((name, kind)) = self.object_owner_block(owner, group_owned) {
            self.block(owner, &name, kind)?;
        } else if group_owned && !owner.is_nil() && owner != self.agent_id && !self.mutes.get(&owner).is_some_and(|entry| entry.flags == 0)
        {
            // aurora-local-patch: hide-owner-objects-group-unknown
            // the block list needs the group's real name: say it was not
            // done rather than nothing (a resident's name still loading
            // stays silent, as upstream)
            return Err(aurora_i18n::tr!("hide-owner-block-group-unknown").to_owned());
        }
        Ok(())
    }'''

