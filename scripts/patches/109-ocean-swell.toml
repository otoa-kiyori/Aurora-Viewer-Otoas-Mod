replace = """pub fn offset(&self) -> f32 {
        self.z
    }

    // aurora-local-patch: ocean-swell-heave-depth
    /// The open-sea swell's Down and Up (m, scene ocean_ride.rs uses the
    /// same limits): the heave reaches that much lower and higher, and
    /// follows faster.
    pub fn set_ocean_swell(&mut self, down: f32, up: f32) {
        let bounded = |v: f32| if v.is_finite() { v.max(0.0) } else { 0.0 };
        self.depth = bounded(down);
        self.up = bounded(up);
    }"""

