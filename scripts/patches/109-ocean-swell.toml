[[patch]]
id = "ocean-swell-settings-test"
why = "older files load the defaults, the choices round-trip, every value is bounded"
paths = ["crates/aurora-viewer/src/settings.rs"]
op = "literal"
find = "fn water_choices_round_trip_and_quality_does_not_reset_effects() {"
replace = '''fn ocean_swell_choices_load_round_trip_and_stay_in_range() {
        // aurora-local-patch: ocean-swell-settings-test
        let old: super::WaterEffectsSettings = serde_json::from_str(r#"{"caustics":true,"ocean_depth":3.0}"#).unwrap();
        assert_eq!(old.ocean_depth, 3.0, "the old depth is Ocean Swell Down");
        assert_eq!((old.ocean_up, old.calm_reach, old.calm_edge), (0.0, 100.0, 0.0));
        assert!(!old.ocean_ride);
        let chosen = super::WaterEffectsSettings {
            ocean_depth: 3.5,
            ocean_up: 1.25,
            calm_reach: 42.5,
            calm_edge: 0.35,
            ocean_ride: true,
            ..Default::default()
        };
        let loaded: super::WaterEffectsSettings = serde_json::from_str(&serde_json::to_string(&chosen).unwrap()).unwrap();
        assert_eq!(loaded, chosen);
        let r = loaded.render();
        assert_eq!((r.ocean_depth, r.ocean_up, r.calm_reach, r.calm_edge), (3.5, 1.25, 42.5, 0.35));
        for (saved, kept) in [(-1.0, 0.0), (19.0, 10.0), (f32::NAN, 0.0), (7.5, 7.5)] {
            let mut s = super::Settings::default();
            s.water_effects.ocean_depth = saved;
            s.water_effects.ocean_up = saved;
            assert_eq!(s.water_effects.render().ocean_depth, kept);
            assert_eq!(s.water_effects.render().ocean_up, kept);
            let clean = s.sanitized();
            assert_eq!((clean.water_effects.ocean_depth, clean.water_effects.ocean_up), (kept, kept));
        }
        for (saved, reach, edge) in [(-1.0, 0.0, 0.0), (250.0, 100.0, 1.0), (f32::NAN, 100.0, 0.0), (0.5, 0.5, 0.5)] {
            let mut s = super::Settings::default();
            s.water_effects.calm_reach = saved;
            s.water_effects.calm_edge = saved;
            let clean = s.sanitized();
            assert_eq!((clean.water_effects.calm_reach, clean.water_effects.calm_edge), (reach, edge));
        }
        // the swell off by default; the calming at 100 m, still at the edge
        let d = super::WaterEffectsSettings::default();
        assert_eq!((d.render().ocean_depth, d.render().ocean_up), (0.0, 0.0));
        assert_eq!((d.render().calm_reach, d.render().calm_edge), (100.0, 0.0));
        assert!(!d.ocean_ride);
    }
    #[test]
    fn water_choices_round_trip_and_quality_does_not_reset_effects() {'''

