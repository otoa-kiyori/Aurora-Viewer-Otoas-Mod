// Patch edges (scene/water.rs draws: the dense grids within 160 m, 8 x 8
// within 768 m, a quad beyond) follow the 8 m chord from 96 to 150 m and
// the patch's corners from 700 to 760 m: a coarser neighbour meets them.
const OCEAN_CHORD:f32=8.0;
const OCEAN_CHORD_FROM:f32=96.0;
const OCEAN_CHORD_TO:f32=150.0;
const OCEAN_CORNER_FROM:f32=700.0;
const OCEAN_CORNER_TO:f32=760.0;
const OCEAN_FOAM_FROM:f32=0.04;
const OCEAN_FOAM_FULL:f32=0.12;
fn ocean_on()->bool { return water_fx.ocean_area.w>0.5 && water_fx.ocean.x>0.0 && water_fx_on(1u); }
// Calm water: a calm distance above 0 and an edge below 1.
fn ocean_calm_on()->bool { return water_fx.ocean_shape.z>0.0 && water_fx.ocean_shape.w<1.0 && water_fx_on(1u); }
// The long swell at p: the environment's, or while it cross-fades the water
// to a big wave of another direction (ocean_next, patch 998) the old swell
// and the new one, each in its own direction, mixed by the new one's share
// (the water normal maps'). One swell otherwise.
fn ocean_long_at(p:vec2<f32>,time:f32)->OceanLong {
    let first=ocean_long(p,time,water_fx.ocean.yz);
    if(water_fx.ocean_next.z<=0.0){return first;}
    return ocean_long_mix(first,ocean_long(p,time,water_fx.ocean_next.xy),water_fx.ocean_next.z);
}
// The four texels around p of a map of n cells of `cell` metres from
// origin, its first row `row`: x y the corner, z w the bilinear weights,
// and whether p is inside the texel centres (outside, the edge holds).
struct OceanTexels { a: vec2<f32>, b: vec2<f32>, c: vec2<f32>, d: vec2<f32>, f: vec2<f32>, inside: f32 };
fn ocean_texels(p:vec2<f32>,origin:vec2<f32>,cell:f32,n:i32,row:i32)->OceanTexels {
    let size=f32(n);
    let at=(p-origin)/cell-vec2<f32>(0.5);
    let pos=clamp(at,vec2<f32>(0.0),vec2<f32>(size-1.0));
    let i=vec2<i32>(floor(pos));
    let j=min(i+vec2<i32>(1),vec2<i32>(n-1));
    let r=vec2<i32>(0,row);
    var t:OceanTexels;
    t.a=textureLoad(water_ground,i+r,0).xy;
    t.b=textureLoad(water_ground,vec2<i32>(j.x,i.y)+r,0).xy;
    t.c=textureLoad(water_ground,vec2<i32>(i.x,j.y)+r,0).xy;
    t.d=textureLoad(water_ground,j+r,0).xy;
    t.f=pos-floor(pos);
    t.inside=select(0.0,1.0,all(at>=vec2<f32>(0.0)) && all(at<=vec2<f32>(size-1.0)));
    return t;
}
// The distance to the nearest land or static object at p (x) and its
// gradient (yz): the fine map within it, handing over to `coarse` (the
// coarse field's distance, terrain only) over its outer OCEAN_FINE_BLEND
// metres.
fn ocean_shore(p:vec2<f32>,coarse:vec3<f32>)->vec3<f32> {
    if(water_fx.ocean_fine.w<0.5){return coarse;}
    let local=p-water_fx.ocean_fine.xy;
    let size=f32(OCEAN_FINE_SIZE)*water_fx.ocean_fine.z;
    let border=min(min(local.x,local.y),min(size-local.x,size-local.y));
    let w=smoothstep(0.0,OCEAN_FINE_BLEND,border);
    if(w<=0.0){return coarse;}
    let t=ocean_texels(p,water_fx.ocean_fine.xy,water_fx.ocean_fine.z,OCEAN_FINE_SIZE,OCEAN_FINE_ROW);
    var fine=ocean_bilinear(t.a.x,t.b.x,t.c.x,t.d.x,t.f,water_fx.ocean_fine.z);
    fine=vec3<f32>(fine.x,fine.yz*t.inside);
    return mix(coarse,fine,w);
}
// The coarse field's distance at p and its gradient (OCEAN_NO_LAND while
// it is not loaded).
fn ocean_coarse_distance(p:vec2<f32>)->vec3<f32> {
    if(water_fx.ocean_area.w<0.5){return vec3<f32>(OCEAN_NO_LAND,0.0,0.0);}
    let t=ocean_texels(p,water_fx.ocean_area.xy,water_fx.ocean_area.z,OCEAN_FIELD_SIZE,OCEAN_FIELD_ROW);
    let d=ocean_bilinear(t.a.x,t.b.x,t.c.x,t.d.x,t.f,water_fx.ocean_area.z);
    return vec3<f32>(d.x,d.yz*t.inside);
}
// The calm factor at p (x) and its gradient (yz): 1 while the calming is
// off.
fn ocean_calm_from(d:vec3<f32>)->vec3<f32> {
    let c=ocean_calm(d.x,water_fx.ocean_shape.z,water_fx.ocean_shape.w);
    return vec3<f32>(c.x,d.yz*c.y);
}
fn ocean_calm_at(p:vec2<f32>)->vec3<f32> {
    if(!ocean_calm_on()){return vec3<f32>(1.0,0.0,0.0);}
    return ocean_calm_from(ocean_shore(p,ocean_coarse_distance(p)));
}
// The swell's openness (x) and its gradient (yz) at p: the calm factor and
// the bed's guard, from the coarse field in the bathymetry texture's lower
// rows (outside it the edge holds) and the fine map.
fn ocean_open(p:vec2<f32>)->vec3<f32> {
    let t=ocean_texels(p,water_fx.ocean_area.xy,water_fx.ocean_area.z,OCEAN_FIELD_SIZE,OCEAN_FIELD_ROW);
    let g=ocean_guard(t.a.y,t.b.y,t.c.y,t.d.y,t.f,water_fx.ocean_area.z,water_fx.ocean_shape.x);
    var calm=vec3<f32>(1.0,0.0,0.0);
    if(ocean_calm_on()) {
        let coarse=ocean_bilinear(t.a.x,t.b.x,t.c.x,t.d.x,t.f,water_fx.ocean_area.z);
        calm=ocean_calm_from(ocean_shore(p,vec3<f32>(coarse.x,coarse.yz*t.inside)));
    }
    return vec3<f32>(g.x*calm.x,g.yz*t.inside*calm.x+calm.yz*g.x);
}
// The swell's displacement at material position p: its horizontal motion
// and its height (troughs to -down, crests to +up), faded far from `eye` to
// its mean level, which settles at the far water's openness.
fn ocean_faded(p:vec2<f32>,eye:vec2<f32>,time:f32)->vec3<f32> {
    let fade=smoothstep(OCEAN_FAR_FROM,OCEAN_FAR_TO,distance(p,eye));
    let o=ocean_open(p).x;
    let a=0.5*water_fx.ocean.x*o;
    let half=0.5*(water_fx.ocean_shape.y-water_fx.ocean_shape.x);
    let l=ocean_long_at(p,time);
    let mean=half*mix(o,water_fx.ocean.w,fade);
    return vec3<f32>(l.shift*(a*(1.0-fade)),mean+(1.0-fade)*a*l.s);
}
// The swell's height at p for what is drawn against the surface (its own
// horizontal motion, at most 6 m, is not inverted).
fn ocean_height(p:vec2<f32>)->f32 { return ocean_faded(p,frame.camera_pos.xy,frame.camera_pos.w).z; }
// The water's level at p: the region's flat height, with the swell's
// height while it is on.
fn water_level_at(p:vec2<f32>)->f32 {
    if(!ocean_on()){return frame.params.y;}
    return frame.params.y+ocean_height(p);
}
// A particle's base level `level` at p, moved with the swell.
fn ocean_particle_base(level:f32,p:vec2<f32>)->f32 {
    if(!ocean_on()){return level;}
    return level+ocean_height(p);
}
// A water vertex: p its material position, local its place in its
// record's quad, origin and size the record's. A whole tile (larger than a
// 64 m patch, beyond OCEAN_FAR_TO) takes the far mean level; a patch's edge
// vertex follows the chords above, so both sides of an edge agree.
fn ocean_vertex(p:vec2<f32>,local:vec2<f32>,origin:vec2<f32>,size:vec2<f32>)->vec3<f32> {
    let eye=frame.camera_pos.xy;
    let time=frame.camera_pos.w;
    if(max(size.x,size.y)>64.1){return vec3<f32>(0.0,0.0,0.5*(water_fx.ocean_shape.y-water_fx.ocean_shape.x)*water_fx.ocean.w);}
    let exact=ocean_faded(p,eye,time);
    let across_x=local.x<=0.0 || local.x>=1.0;
    let across_y=local.y<=0.0 || local.y>=1.0;
    // inside the patch, or one of its corners (on every lattice)
    if(across_x==across_y){return exact;}
    let d=distance(p,eye);
    let chord=smoothstep(OCEAN_CHORD_FROM,OCEAN_CHORD_TO,d);
    if(chord<=0.0){return exact;}
    // along a vertical edge (x at 0 or 1) the edge runs in y
    var axis=vec2<f32>(1.0,0.0);var span=size.x;
    if(across_x){axis=vec2<f32>(0.0,1.0);span=size.y;}
    let t=dot(p-origin,axis);
    let start=p-axis*t;
    let a8=floor(t/OCEAN_CHORD)*OCEAN_CHORD;
    let c8=mix(ocean_faded(start+axis*a8,eye,time),ocean_faded(start+axis*(a8+OCEAN_CHORD),eye,time),(t-a8)/OCEAN_CHORD);
    let corners=mix(ocean_faded(start,eye,time),ocean_faded(start+axis*span,eye,time),t/span);
    return mix(exact,mix(c8,corners,smoothstep(OCEAN_CORNER_FROM,OCEAN_CORNER_TO,d)),chord);
}
// water_fx_wave with the geometric waves calmed (`calm`, its whole
// displacement, so no crest folds) and the wake read where the swell moved
// the vertex to.
fn water_fx_wave_calmed(p:vec2<f32>,level:f32,shift:vec2<f32>,calm:f32)->vec3<f32> {
    var offset=vec3<f32>(0.0);
    if(water_fx_on(1u)) {
        offset+=water_swell(p,frame.camera_pos.w,water_fx.counts.w).offset*(smoothstep(0.08,2.4,level-water_fx_bed(p).x)*calm);
    }
    offset.z+=clamp(water_wake_sample(p+offset.xy+shift,level).z,-0.16,0.16);
    return offset;
}
// What the surface's pixel needs of the swell: its normal's tilt, its
// compression (foam), how deep in a trough and how high on a crest it is,
// its openness and its height.
struct OceanPixel { on: f32, normal: vec3<f32>, compression: f32, trough: f32, crest: f32, open: f32, dz: f32 };
fn ocean_pixel(p:vec2<f32>)->OceanPixel {
    var o:OceanPixel;
    let height=water_fx.ocean.x;
    let half=0.5*(water_fx.ocean_shape.y-water_fx.ocean_shape.x);
    let d=distance(p,frame.camera_pos.xy);
    let open=ocean_open(p);
    let a=0.5*height*open.x;
    let l=ocean_long_at(p,frame.camera_pos.w);
    // the geometry flattens beyond OCEAN_FAR_TO, the shading keeps the swell
    let keep=1.0-smoothstep(OCEAN_FAR_TO,OCEAN_NORMAL_TO,d);
    let jac=vec3<f32>(1.0,0.0,1.0)-l.fold*a;
    let det=max(jac.x*jac.z-jac.y*jac.y,0.25);
    let g=(l.ds*a+(l.s*0.5*height+half)*open.yz)*keep;
    let fade=smoothstep(OCEAN_FAR_FROM,OCEAN_FAR_TO,d);
    o.on=1.0;
    o.normal=vec3<f32>(-vec2<f32>(jac.z*g.x-jac.y*g.y,jac.x*g.y-jac.y*g.x)/det,0.0);
    o.compression=(1.0-det)*keep;
    o.trough=clamp(a*(1.0-l.s)/OCEAN_SHADE_DEPTH,0.0,1.0)*keep;
    o.crest=smoothstep(0.35,0.95,l.s)*(2.0*a/OCEAN_SHADE_DEPTH)*keep;
    o.open=open.x;
    o.dz=half*mix(open.x,water_fx.ocean.w,fade)+(1.0-fade)*a*l.s;
    return o;
}
fn water_ocean_normal(base:vec3<f32>,o:OceanPixel)->vec3<f32> {
    if(o.on>0.5){return base+o.normal;}
    return base;
}
// Foam where the long swell compresses, torn into streaks along its way
// (while two swells are mixed, each one's streaks along its own way, mixed
// by the same share).
fn ocean_streak(p:vec2<f32>,w:vec2<f32>)->f32 {
    let q=vec2<f32>(dot(p,w)*0.04,dot(p,vec2<f32>(-w.y,w.x))*0.5);
    return smoothstep(0.5,0.85,water_fx_noise(q+vec2<f32>(frame.camera_pos.w*0.02,0.0)));
}
fn ocean_streaks(p:vec2<f32>,o:OceanPixel)->f32 {
    var streak=ocean_streak(p,water_fx.ocean.yz);
    if(water_fx.ocean_next.z>0.0){streak=mix(streak,ocean_streak(p,water_fx.ocean_next.xy),water_fx.ocean_next.z);}
    return smoothstep(OCEAN_FOAM_FROM,OCEAN_FOAM_FULL,o.compression)*streak*0.4*o.open;
}
// Troughs a little darker, crests lit through from behind toward the sun.
fn ocean_shade(color:vec3<f32>,o:OceanPixel,view:vec3<f32>,sun:vec3<f32>)->vec3<f32> {
    var c=color*(1.0-0.12*o.trough);
    let vh=view.xy/max(length(view.xy),0.0001);
    let sh=sun.xy/max(length(sun.xy),0.0001);
    let toward=pow(max(dot(vh,sh),0.0),3.0)*smoothstep(-0.05,0.2,sun.z)*(1.0-smoothstep(0.35,0.9,sun.z));
    let tint=frame.water_fog.rgb/max(max(frame.water_fog.r,frame.water_fog.g),max(frame.water_fog.b,0.001));
    c+=tint*frame.sun_color.rgb*(toward*o.crest*0.12);
    return c;
}"""

