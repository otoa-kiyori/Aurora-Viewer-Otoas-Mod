op = "regex"
pattern = '^With `AURORA_DEMO_WATER_SHADERS=1`, an offline viewer loads'
replace = '''Open-sea swell (local patch set): `AURORA_DEMO_WATER=medium:ocean` (any
quality) looks west from the void water beyond the demo region, more than
a kilometre of open sea ahead and the coast about 300 m behind.
`AURORA_DEMO_OCEAN` takes comma separated words: a number, the swell's
depth in metres (0 to 5, 3 when absent), `ride` for "Objects ride the
swell", and a view: `high` (above the fixtures, looking down), `horizon`
(low, toward the far water) or `coast` (back toward the shore). 260 m out float an orange physical box with a demo avatar sitting
on it and a swimming demo avatar, which ride the swell with `ride`, and two
controls that never ride: a blue box that is not physical and a red
physical box in the air. Look for long swells arriving in sets from the
environment's big-wave direction, crests no higher than the water without
them, troughs down to the depth, the existing small waves on top, no seam
where the swell fades in toward the coast (it is nothing within about
100 m of land, full from 180 m), no cracks between the near, middle and far
water out to the horizon, streaks of foam on steep crests at the larger
depths, slightly darker troughs. With `ride` the orange box and both avatars
rise and fall with the surface, eased in, and the blue and red boxes stay;
without it only the camera's own avatar would follow the water. With the
depth at 0 the picture is the water demo's as before.
`AURORA_PROFILE=1` gives the swell's cost (the far patches add up to about
900 draws of small grids around the camera).
<!-- // aurora-local-patch: ocean-swell-testing-details -->

\g<0>'''
