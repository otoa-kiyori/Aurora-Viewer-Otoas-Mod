[[patch]]
id = "ocean-swell-testing-details"
why = "docs/TESTING.md: what the scenario shows"
paths = ["docs/TESTING.md"]
op = "regex"
pattern = '^With `AURORA_DEMO_WATER_SHADERS=1`, an offline viewer loads'
replace = '''Open-sea swell and calm water (local patch set):
`AURORA_DEMO_WATER=medium:ocean` (any quality) looks west from the void
water beyond the demo region, more than a kilometre of open sea ahead and
the coast about 300 m behind. `AURORA_DEMO_OCEAN` takes comma separated
words: a number, Ocean Swell Down in metres (0 to 10, 3 when absent);
`up=<m>`, Ocean Swell Up (0 to 10, 0 when absent); `calm=<m>`, Calm
distance (0 to 100, 100 when absent); `edge=<share>`, Calm at the edge (0
to 1, 0 when absent); `ride` for "Objects ride the swell"; and a view:
`high` (above the fixtures, looking down), `horizon` (low, toward the far
water) or `coast` (back toward the shore). 260 m out float an orange
physical box with a demo avatar sitting on it, a swimming demo avatar and a
white keyframed boat going back and forth (not physical, reported with a
velocity), which ride the swell with `ride`; two controls never ride: a
blue box that is not physical and a red physical box in the air; a brown
pier crosses the water. Look for long swells arriving in sets from the
environment's big-wave direction, troughs down to Down and crests up to Up
(at Up 0 no higher than the water without them), the existing small waves
on top, the water still where it meets the pier, the blue box and the coast
and rising smoothly to full at the calm distance (with `edge=0.5` half
height there, with `edge=1` no calming), no calming around the boat, no
seam where the fine calm map hands over to the coarse field (about 230 to
260 m from the camera), no cracks between the near, middle and far water
out to the horizon, streaks of foam on steep crests at the larger heights,
slightly darker troughs, and reflections bent by the waves without the
water mesh's grid in them. With `ride` the orange box, the boat and both
avatars rise and fall with the surface, eased in, and the blue and red
boxes and the pier stay; without it only the camera's own avatar would
follow the water. With Down and Up at 0 and `edge=1` the picture is the
water demo's as before. `AURORA_PROFILE=1` gives the swell's cost (the far
patches add up to about 900 draws of small grids around the camera).
<!-- // aurora-local-patch: ocean-swell-testing-details -->

\g<0>'''
