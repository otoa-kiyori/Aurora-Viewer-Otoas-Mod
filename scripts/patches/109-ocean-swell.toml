# Open-sea swell and calm water: Preferences › Graphics › Aurora water, in
# the gear of "Enhanced water effects", right under "Geometric waves" (and
# greyed while they are off): "Ocean Swell Down" and "Ocean Swell Up" (0 to
# 10 m each, 0.01 m steps, default 0), "Calm distance" (0 to 100 m, 0.01 m
# steps, default 100), "Calm at the edge" (0 to 1, 0.01 steps, default 0)
# and "Objects ride the swell" (off by default). Before, the swell's two
# rows sat behind the geometric waves' own cog, inside the enhanced water's
# gear; they now show in that gear directly. All drawing only.
#
# Long rolling swells on open water: four Gerstner waves of 54 to 131 m
# travelling the way the environment's big water wave (EEP wave1) scrolls,
# within about 25 degrees of it, slowly grouped into sets. s in [-1, 1] maps
# linearly onto the sliders: the surface moves by openness * ((up - down) /
# 2 + (up + down) / 2 * s), so the troughs reach Down below the water's
# level and the crests Up above it. Up 0 is the earlier swell exactly (its
# crests at the water's level, where today's waves reach, the slider's old
# "Ocean swell" depth kept in the same stored key, now Down, 0 to 10 m
# instead of 0 to 5). Down and Up 0: the swell is off. Today's swell, wakes
# and micro waves ride on top. The horizontal motion is inverted in eight
# fixed-point steps on the CPU (a few millimetres at 10 m and 10 m).
#
# Environment changes (patch 998): while the water cross-fades to an EEP
# water whose big wave points another way, the old swell and the new one
# are each evaluated in their own direction and mixed by the share the
# water normal maps take, so that each swell comes and goes with its own
# normal map: the old crests fade out where they are, the new ones fade in,
# none turns or slides. The mix is the surface's own (every term is linear
# in the waves): the displacement, the normals, the crest foam (its
# compression; its streaks each along its own swell), the CPU's copy and
# all that rides it (contacts, the ride, the camera's level). The wave1
# the swell follows is the only value it takes from the environment.
# Outside a change, or with the same direction on both sides, one swell is
# evaluated; during one, a second set of four waves a vertex, a pixel and a
# CPU query, the new direction and the share in a fifth vec4 of the tail.
#
# Calm water: where the water meets land (terrain at or above it) or a
# static object (not physical, not keyframed, not an avatar or attachment:
# its drawn box, its scale turned and placed as drawn, within 0.15 m of the
# water's level), every vertical movement of the surface (the swell, the
# geometric waves of upstream) is "Calm at the edge" times its full height,
# rising smoothly (smoothstep) to full at "Calm distance", full beyond; the
# horizontal motion is scaled the same way and the normals follow the calmed
# shape (the calm factor's gradient is in them). Edge 1 or distance 0: no
# calming. It replaces the earlier rule of the swell (nothing within 100 m
# of land, full from 180 m) and, unlike it, also calms the geometric waves
# with the swell off (the owner's defaults: still water at the contact line,
# full at 100 m). Kept: no trough within 1 m of the bed (with Down; Up has
# no trough). Wakes are not calmed.
#
# Two distance maps around the camera, both built on the thread pool, both
# reaching the GPU in the bathymetry texture's rows under its own 64 (now
# 512 x 704) and the shared water uniform's tail after patch 91's 80 bytes
# (now four vec4): no new binding.
# - The coarse field (while the swell is on): 128 x 128 cells of 16 m (2 km
#   across, moved by 256 m steps, sampled again every 2 s on the frame),
#   terrain only (a missing terrain patch is land, water with no region is
#   open sea), with the water's depth for the bed rule
#   (files/ocean-swell/ocean_field.rs).
# - The fine map (while the calming is on): 512 x 512 cells of 1 m (512 m
#   across, moved by 64 m steps, the camera at least 224 m from its edges),
#   terrain and static footprints (files/ocean-swell/ocean_calm.rs). Every
#   second the frame lists the static boxes that reach the water line (in
#   parallel) and the regions' terrain revisions and water levels; when they
#   or the camera's step changed, a copy of those heightmaps and the
#   footprints go to the pool (rasterising, distance transform). A
#   keyframed object counts as moving for 5 s after it stops. Beyond the
#   fine map's outer 32 m the coarse field's distance takes over (terrain
#   only: piers and walls farther than about 224 to 256 m from the camera do
#   not calm the swell).
# The CPU model (files/ocean-swell/ocean_swell.rs) mirrors the WGSL; its
# tests keep the constants and the results equal.
#
# The far sea: with the swell on, the water's 64 m patches are drawn out to
# 1100 m, on an 8 x 8 grid beyond the dense 160 m; the displacement fades to
# the swell's mean level from 600 to 1000 m (the whole tiles beyond take that
# mean), the normals keep the swell out to 4 km. Patch edges follow the 8 m
# chord beyond 150 m and the patch's corners beyond 760 m, so a coarser
# neighbour meets them: no cracks. With upstream's planet curvature on, the
# void sea's slabs beyond the region block are graded grids of their own
# (scene/water.rs slab_lines), normally over 1 km from the camera: the swell
# gives each of their vertices its mean level, as it gives the flat slabs'
# corners (not checked on screen).
#
# What used the flat water and now follows the swell, above the level as
# well as below it: the camera's waterline (camera_level), the body
# contacts, our own heave (its limits grow with Down and Up: -0.6 - Down to
# +0.6 + Up), the objects' contacts, the particles' kill height and crowns,
# the underwater light and fog on what lies under the swell, rain and snow
# at the surface, the refracted water's fog, the underwater sound. The
# planar reflection and the underwater window's capture take the swell's
# mean level at the camera. Not followed: the blended faces' water-side
# split (the lists stay split at the flat height, as the Legacy Viewer
# splits them), the underside view's own level, lying snow and the wet
# ground at the shore (both keep the flat water level), the water patches'
# culling bounds (flat, as before).
#
# Reflections: with enhanced water, the water's pixels read the normal map's
# two scrolling layers, the geometric waves and the swell at their material
# position (the point's place on the flat water, a new varying), not at the
# displaced position. That one is interpolated linearly over each triangle
# of the water's grid, so the normal map's pattern, and with it the
# reflection's and the refraction's distortion, bent along the grid's lines.
# The distortion now comes from the per-pixel normal only (normal map,
# geometric waves and swell together), as waterF.glsl distorts its
# reflection by its per-pixel wave normal. Without enhanced water nothing
# moves the vertices and the two positions are the same.
#
# "Objects ride the swell": physical linksets and moving keyframed ones
# floating at the surface, and avatars swimming there, are drawn higher or
# lower with it, eased in and out; what sits on or is linked to them
# follows. Static objects never move. A keyframed motion has no flag: a
# non-physical root that is not an avatar and that the simulator reports
# with a velocity (above 2 cm/s; the viewer moves it by that velocity
# between updates, LLViewerObject::interpolateLinearMotion) is keyframed,
# held as such for 5 s after it stops (scene/ocean_ride.rs). Our own
# avatar, swimming or walking on water, keeps riding by its own heave
# (movement/water_float.rs), switch or not; the camera follows its drawn
# body as before. Drawing only: the simulator's positions, the physics and
# the network are untouched.
#
# Down and Up 0, Calm at the edge 1: every path is upstream's; the
# uniform's new tail stays zero, the shaders take their original lines
# behind a test of it, the water draws the same records with the same
# meshes. With the defaults (Down and Up 0, calm 100 m at 0), only the
# geometric waves' calming differs from upstream.
#
# The wave shape taken from the water normal map (Scale, Ratio) is patch
# 120-water-normal-shape.toml, which builds on this one.
#
# Demo: AURORA_DEMO=1 AURORA_DEMO_WATER=medium:ocean
# AURORA_DEMO_OCEAN=5,up=2,calm=60,edge=0.2,ride (docs/TESTING.md).
#
# Apply or skip the whole file, not one patch of it.

