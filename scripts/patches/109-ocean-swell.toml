// Open-sea swell (local patch set; ocean_swell.rs mirrors these and its
// tests keep the constants equal): four long Gerstner waves of 54 to 131 m
// within about 25 degrees of `wind` (unit, the way they travel), slowly
// grouped into sets. s in [-1, 1] and its gradient ds; shift the horizontal
// motion and fold the decrease of the horizontal Jacobian (xx, xy, yy), both
// per metre of amplitude.
// aurora-local-patch: ocean-swell-spectrum
const OCEAN_WAVES=array<vec4<f32>,4>(vec4<f32>(131.0,0.0,0.34,0.0),vec4<f32>(117.0,0.21,0.26,2.1),vec4<f32>(71.3,-0.31,0.22,4.4),vec4<f32>(53.9,0.42,0.18,1.3));
const OCEAN_STEEPNESS:f32=0.6;
const OCEAN_SET_LENGTH:f32=860.0;
const OCEAN_SET_SPEED:f32=7.15;
const OCEAN_SET_DEPTH:f32=0.25;
const OCEAN_KEEL:f32=1.0;
struct OceanLong { s: f32, ds: vec2<f32>, shift: vec2<f32>, fold: vec3<f32> };
fn ocean_long(p:vec2<f32>,time:f32,wind:vec2<f32>)->OceanLong {
    let ke=6.2831853/OCEAN_SET_LENGTH;
    let psi=ke*(dot(p,wind)-OCEAN_SET_SPEED*time);
    let env=1.0-OCEAN_SET_DEPTH*(0.5+0.5*sin(psi));
    let denv=wind*(-OCEAN_SET_DEPTH*0.5*cos(psi)*ke);
    var sum=0.0;var dsum=vec2<f32>(0.0);var shift=vec2<f32>(0.0);var fold=vec3<f32>(0.0);
    for(var i=0u;i<4u;i++) {
        let w=OCEAN_WAVES[i];
        let sa=sin(w.y);let ca=cos(w.y);
        let d=vec2<f32>(wind.x*ca-wind.y*sa,wind.x*sa+wind.y*ca);
        let k=6.2831853/w.x;
        let phase=k*dot(p,d)-sqrt(9.81*k)*time+w.w;
        let s=sin(phase);let c=cos(phase);
        sum+=w.z*s;
        dsum+=d*(w.z*k*c);
        shift+=d*(w.z*OCEAN_STEEPNESS*c);
        fold+=vec3<f32>(d.x*d.x,d.x*d.y,d.y*d.y)*(w.z*OCEAN_STEEPNESS*k*s);
    }
    return OceanLong(env*sum,dsum*env+denv*sum,shift*env,fold*env);
}
// Two swells mixed by `share` (0: a), during an environment change between
// two directions: every term is linear in the waves, so the result is the
// mixed surface's own.
fn ocean_long_mix(a:OceanLong,b:OceanLong,share:f32)->OceanLong {
    return OceanLong(mix(a.s,b.s,share),mix(a.ds,b.ds,share),mix(a.shift,b.shift,share),mix(a.fold,b.fold,share));
}
// The value (x) and gradient (yz) of four texels a b / c d (row by row)
// at bilinear weights f, cell the texel size (m).
fn ocean_bilinear(a:f32,b:f32,c:f32,d:f32,f:vec2<f32>,cell:f32)->vec3<f32> {
    let v=mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
    return vec3<f32>(v,mix(b-a,d-c,f.y)/cell,(mix(c,d,f.x)-mix(a,b,f.x))/cell);
}
// How much of the trough the water depth under a point allows (x) and its
// gradient (yz), from four texels of water depth (m); down the slider (m):
// never so much that a trough comes within OCEAN_KEEL of the bed.
fn ocean_guard(a:f32,b:f32,c:f32,d:f32,f:vec2<f32>,cell:f32,down:f32)->vec3<f32> {
    let v=ocean_bilinear(a,b,c,d,f,cell);
    let raw=(v.x-OCEAN_KEEL)/max(down,0.001);
    let dguard=select(0.0,1.0/max(down,0.001),raw>0.0 && raw<1.0);
    return vec3<f32>(clamp(raw,0.0,1.0),v.yz*dguard);
}
// Calm water: the share of the full vertical movement at distance d (m)
// from the nearest land or static object (x) and its derivative (y): edge
// at the contact line, rising smoothly to 1 at reach, 1 beyond it.
fn ocean_calm(d:f32,reach:f32,edge:f32)->vec2<f32> {
    if(reach<=0.0){return vec2<f32>(1.0,0.0);}
    let x=clamp(d/reach,0.0,1.0);
    let ds=select(0.0,6.0*x*(1.0-x)/reach,x>0.0 && x<1.0);
    return vec2<f32>(edge+(1.0-edge)*x*x*(3.0-2.0*x),(1.0-edge)*ds);
}"""

