# Open-sea swell: Preferences › Graphics › Aurora water, "Ocean swell" (0 to
# 5 m, default 0) and "Objects ride the swell" (off by default), with
# enhanced water and its geometric waves on.
#
# Long rolling swells on open water: four Gerstner waves of 54 to 131 m
# travelling the way the environment's big water wave (EEP wave1) scrolls,
# within about 25 degrees of it, slowly grouped into sets. Their crests stay
# at the water's own level, where today's waves reach; the extra height is
# all below it: the surface drops by depth / 2 * openness * (s - 1), s in
# [-1, 1], so the troughs reach the slider's depth. Today's swell, wakes and
# micro waves ride on top unchanged.
#
# Openness: nothing within 100 m of land, full from 180 m, and no trough
# within 1 m of the bed. Land is terrain at or above the water (prims and
# meshes do not count), a missing terrain patch is land, water with no
# region is open sea. The viewer samples a 128 x 128 field of 16 m cells
# around the camera (2 km across, moved by 256 m steps, sampled again every
# 2 s), the distance transform runs on the thread pool
# (files/ocean-swell/ocean_field.rs), and the field reaches the GPU in the
# bathymetry texture's rows under its own 64 (now 128 x 192) and two vec4
# after the shared water uniform's caustics extension (patch 91's 80 bytes
# stay where they are): no new binding. The CPU model
# (files/ocean-swell/ocean_swell.rs) mirrors the WGSL; its tests keep the
# constants and the results equal.
#
# The far sea: with the swell on, the water's 64 m patches are drawn out to
# 1100 m, on an 8 x 8 grid beyond the dense 160 m; the displacement fades to
# the swell's mean level from 600 to 1000 m (the whole tiles beyond take that
# mean), the normals keep the swell out to 4 km. Patch edges follow the 8 m
# chord beyond 150 m and the patch's corners beyond 760 m, so a coarser
# neighbour meets them: no cracks.
#
# What used the flat water and now follows the swell: the camera's
# waterline (camera_level), the body contacts, our own heave (its limits
# grow with the depth), the objects' contacts, the particles' kill height
# and crowns, the underwater light and fog on what lies under the swell,
# rain and snow at the surface, the refracted water's fog, the underwater
# sound. The planar reflection and the underwater window's capture take
# the swell's mean level at the camera. Not followed: the blended faces'
# water-side split (the lists stay split at the flat height, as the Legacy
# Viewer splits them), the underside view's own level.
#
# "Objects ride the swell": physical linksets floating at the surface and
# avatars swimming there are drawn higher or lower with it, eased in and
# out; what sits on or is linked to them follows. Drawing only: the
# simulator's positions, the physics and the network are untouched.
#
# Depth 0 (the default): every path is upstream's; the uniform's new tail
# stays zero, the shaders take their original lines behind a test of it,
# the water draws the same records with the same meshes.
#
# Demo: AURORA_DEMO=1 AURORA_DEMO_WATER=medium:ocean AURORA_DEMO_OCEAN=5,ride
# (docs/TESTING.md).
#
# Apply or skip the whole file, not one patch of it.

