[[patch]]
id = "ocean-swell-heave-fn"
why = "the limits, and their test"
paths = ["crates/aurora-viewer/src/movement/water_float.rs"]
op = "literal"
find = """#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn surface_float_follows_crests_and_troughs_smoothly_at_different_frame_rates() {"""
replace = """// aurora-local-patch: ocean-swell-heave-fn
/// The heave's lowest target (m), its speed (m/s) and its response time
/// (s): upstream's -0.6 m, 1 m/s and 0.1 s, deeper, faster and closer with
/// the open-sea swell's `depth` (its waves rise and fall at up to about
/// 0.4 m/s per metre of depth: a 0.1 s lag would leave a 5 m swell's rider
/// some 20 cm off its surface).
pub fn heave_limits(depth: f32) -> (f32, f32, f32) {
    if depth > 0.0 {
        (-(0.6 + depth), 1.0 + 0.6 * depth, 0.10 / (1.0 + 0.4 * depth))
    } else {
        (-0.6, 1.0, 0.10)
    }
}

#[cfg(test)]
mod tests {
    use super::*;
    #[test]
    fn surface_float_reaches_the_ocean_swells_troughs_and_keeps_upstreams_limits_without_it() {
        assert_eq!(heave_limits(0.0), (-0.6, 1.0, 0.10));
        for depth in [0.0f32, 2.0, 5.0] {
            let mut follower = Follower::default();
            follower.set_ocean_depth(depth);
            let mut lowest = 0.0f32;
            let mut worst = 0.0f32;
            for frame in 0..60 * 30 {
                let time = frame as f32 / 60.0;
                // the swell's period is about 9 s; troughs reach the depth
                let target = -0.5 * depth * (1.0 - (time * 0.7).sin()) + 0.2 * (time * 1.4).sin();
                let old = follower.offset();
                follower.update(1, Vec3::X * time * 0.01, time, target, false);
                assert!((follower.offset() - old).abs() <= heave_limits(depth).1 / 60.0 + 1e-4);
                lowest = lowest.min(follower.offset());
                if time > 2.0 {
                    worst = worst.max((follower.offset() - target.clamp(heave_limits(depth).0, 0.6)).abs());
                }
            }
            assert!(lowest >= heave_limits(depth).0 - 1e-4);
            assert!(worst < 0.12, "depth {depth}: lags by {worst}");
            if depth == 0.0 {
                assert!(lowest >= -0.6 - 1e-4);
            } else {
                assert!(lowest < -depth * 0.8, "rides down into the troughs: {lowest}");
            }
            // a reset keeps the depth
            follower.update(1, Vec3::ZERO, 100.0, 0.0, true);
            assert_eq!(follower.depth, depth);
        }
    }
    #[test]
    fn surface_float_follows_crests_and_troughs_smoothly_at_different_frame_rates() {"""

