replace = '''cx.toggle(tr!("water-effects-waves"), "", &field!(water_effects.waves));
            // aurora-local-patch: ocean-swell-rows
            // the open-sea swell and the calm water move the geometric
            // waves' surface: in the enhanced water's own gear, right under
            // them, greyed while they are off
            {
                use aurora_render::water_effects::ocean;
                fn slider(ui: &mut egui::Ui, value: &mut f32, range: std::ops::RangeInclusive<f32>, suffix: &str) -> bool {
                    ui.add(
                        egui::Slider::new(value, range)
                            .custom_parser(aurora_i18n::parse_number)
                            .fixed_decimals(2)
                            .step_by(0.01)
                            .suffix(suffix)
                            .trailing_fill(true),
                    )
                    .changed()
                }
                cx.greyed(!cx.s.water_effects.waves);
                cx.row(
                    tr!("water-effects-ocean-down"),
                    tr!("water-effects-ocean-down-help"),
                    &field!(water_effects.ocean_depth),
                    |ui, s| slider(ui, &mut s.water_effects.ocean_depth, ocean::DEPTH_RANGE, " m"),
                );
                cx.row(
                    tr!("water-effects-ocean-up"),
                    tr!("water-effects-ocean-up-help"),
                    &field!(water_effects.ocean_up),
                    |ui, s| slider(ui, &mut s.water_effects.ocean_up, ocean::UP_RANGE, " m"),
                );
                cx.row(
                    tr!("water-effects-calm-distance"),
                    tr!("water-effects-calm-distance-help"),
                    &field!(water_effects.calm_reach),
                    |ui, s| slider(ui, &mut s.water_effects.calm_reach, ocean::CALM_REACH_RANGE, " m"),
                );
                cx.row(
                    tr!("water-effects-calm-edge"),
                    tr!("water-effects-calm-edge-help"),
                    &field!(water_effects.calm_edge),
                    |ui, s| slider(ui, &mut s.water_effects.calm_edge, ocean::CALM_EDGE_RANGE, ""),
                );
                cx.toggle(
                    tr!("water-effects-ocean-ride"),
                    tr!("water-effects-ocean-ride-moving-help"),
                    &field!(water_effects.ocean_ride),
                );
                cx.greyed(false);
            }'''

