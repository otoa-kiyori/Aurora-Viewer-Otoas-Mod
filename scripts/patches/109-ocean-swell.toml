[[patch]]
id = "ocean-swell-heave-limits"
why = "the heave reaches the swell's troughs and crests and follows it; at 0 upstream's 0.6 m and 1 m/s"
paths = ["crates/aurora-viewer/src/movement/water_float.rs"]
op = "literal"
