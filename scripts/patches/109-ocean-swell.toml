// Open-sea swell (local patch set; ocean_swell.rs mirrors these and its
// tests keep the constants equal): four long Gerstner waves of 54 to 131 m
// within about 25 degrees of `wind` (unit, the way they travel), slowly
// grouped into sets. s in [-1, 1] and its gradient ds; shift the horizontal
// motion and fold the decrease of the horizontal Jacobian (xx, xy, yy), both
// per metre of amplitude.
// aurora-local-patch: ocean-swell-spectrum
const OCEAN_WAVES=array<vec4<f32>,4>(vec4<f32>(131.0,0.0,0.34,0.0),vec4<f32>(117.0,0.21,0.26,2.1),vec4<f32>(71.3,-0.31,0.22,4.4),vec4<f32>(53.9,0.42,0.18,1.3));
const OCEAN_STEEPNESS:f32=0.6;
const OCEAN_SET_LENGTH:f32=860.0;
const OCEAN_SET_SPEED:f32=7.15;
const OCEAN_SET_DEPTH:f32=0.25;
const OCEAN_OPEN_FROM:f32=100.0;
const OCEAN_OPEN_FULL:f32=180.0;
const OCEAN_KEEL:f32=1.0;
struct OceanLong { s: f32, ds: vec2<f32>, shift: vec2<f32>, fold: vec3<f32> };
fn ocean_long(p:vec2<f32>,time:f32,wind:vec2<f32>)->OceanLong {
    let ke=6.2831853/OCEAN_SET_LENGTH;
    let psi=ke*(dot(p,wind)-OCEAN_SET_SPEED*time);
    let env=1.0-OCEAN_SET_DEPTH*(0.5+0.5*sin(psi));
    let denv=wind*(-OCEAN_SET_DEPTH*0.5*cos(psi)*ke);
    var sum=0.0;var dsum=vec2<f32>(0.0);var shift=vec2<f32>(0.0);var fold=vec3<f32>(0.0);
    for(var i=0u;i<4u;i++) {
        let w=OCEAN_WAVES[i];
        let sa=sin(w.y);let ca=cos(w.y);
        let d=vec2<f32>(wind.x*ca-wind.y*sa,wind.x*sa+wind.y*ca);
        let k=6.2831853/w.x;
        let phase=k*dot(p,d)-sqrt(9.81*k)*time+w.w;
        let s=sin(phase);let c=cos(phase);
        sum+=w.z*s;
        dsum+=d*(w.z*k*c);
        shift+=d*(w.z*OCEAN_STEEPNESS*c);
        fold+=vec3<f32>(d.x*d.x,d.x*d.y,d.y*d.y)*(w.z*OCEAN_STEEPNESS*k*s);
    }
    return OceanLong(env*sum,dsum*env+denv*sum,shift*env,fold*env);
}
// The openness (x) and its gradient (yz) from the four texels around a
// point (distance to land m, water depth m), f its bilinear weights, cell
// the texel size (m), depth the slider (m): 0 within OCEAN_OPEN_FROM of
// land, 1 from OCEAN_OPEN_FULL, and never so much that a trough comes
// within OCEAN_KEEL of the bed.
fn ocean_openness(a:vec2<f32>,b:vec2<f32>,c:vec2<f32>,d:vec2<f32>,f:vec2<f32>,cell:f32,depth:f32)->vec3<f32> {
    let v=mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
    let gx=mix(b-a,d-c,f.y)/cell;
    let gy=(mix(c,d,f.x)-mix(a,b,f.x))/cell;
    let x=clamp((v.x-OCEAN_OPEN_FROM)/(OCEAN_OPEN_FULL-OCEAN_OPEN_FROM),0.0,1.0);
    let far=x*x*(3.0-2.0*x);
    let dfar=6.0*x*(1.0-x)/(OCEAN_OPEN_FULL-OCEAN_OPEN_FROM);
    let raw=(v.y-OCEAN_KEEL)/max(depth,0.001);
    let guard=clamp(raw,0.0,1.0);
    let dguard=select(0.0,1.0/max(depth,0.001),raw>0.0 && raw<1.0);
    return vec3<f32>(far*guard,vec2<f32>(gx.x,gy.x)*(dfar*guard)+vec2<f32>(gx.y,gy.y)*(dguard*far));
}"""

