[[patch]]
id = "sl-grids-only-settings"
why = "A saved other grid (GridChoice::Custom) becomes Second Life when the settings load, Aditi when its address is Aditi's; it is written on the next normal save. The saved grid list and the typed address stay in the file, unused."
paths = ["crates/aurora-viewer/src/settings.rs"]
op = "insert_fn_start"
fn = "sanitized"
impl = "Settings"
expect_sig = 'fn sanitized\(mut self\) -> Settings'
body = '''
// only the two Second Life grids
if self.grid == GridChoice::Custom {
    self.grid = match crate::login_accounts::grid(&self.custom_login_uri) {
        GridChoice::SecondLifeBeta => GridChoice::SecondLifeBeta,
        _ => GridChoice::SecondLife,
    };
    log::warn!("settings: the saved login grid is not a Second Life grid, Second Life is used");
}
'''

[[patch]]
id = "sl-grids-only-cli"
why = "--grid / --loginuri may only choose Agni or Aditi (by name or by their login address, normalised). Any other grid is ignored with a warning, and a --login given with it is dropped, so that a password meant for that grid is not sent to Second Life instead."
paths = ["crates/aurora-viewer/src/**/external_links.rs"]
op = "replace_fn_body"
fn = "apply_grid"
expect_sig = 'fn apply_grid\(settings: &mut Settings\)$'
body = '''
use crate::settings::GridChoice;
// only the two Second Life grids
let refused = |what: &str| {
    log::warn!("command line: {what} is not a Second Life grid, ignored (and --login with it)");
    drop(crate::cli::take_login());
};
match &crate::cli::get().grid {
    Some(crate::cli::Grid::SecondLife) => settings.grid = GridChoice::SecondLife,
    Some(crate::cli::Grid::SecondLifeBeta) => settings.grid = GridChoice::SecondLifeBeta,
    Some(crate::cli::Grid::LoginUri(uri)) => match aurora_net::login::second_life_grid(uri) {
        Some(login) => settings.grid = crate::login_accounts::grid(login),
        None => refused("the login URI"),
    },
    Some(crate::cli::Grid::Named(_)) => refused("the --grid name"),
    None => {}
}
'''

