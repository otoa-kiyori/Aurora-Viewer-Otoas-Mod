[[patch]]
id = "sl-grids-only-test"
why = "Checks the choke point: the two login servers are recognised (case, final dot, default port), anything else is not (http, other port, user info, look-alikes, other hosts); a login to another server is refused before any byte leaves (a local listener receives no connection); redirects from a login server stay on the login servers."
paths = ["crates/aurora-net/src/**/login.rs"]
op = "regex"
pattern = '^    #\[test\]\r?\n    fn username_split\(\) \{'
replace = '''    // aurora-local-patch: sl-grids-only-test
    #[test]
    fn only_the_second_life_login_servers_get_a_login() {
        for (uri, grid) in [
            (SL_MAIN_GRID, SL_MAIN_GRID),
            (SL_BETA_GRID, SL_BETA_GRID),
            ("  HTTPS://LOGIN.AGNI.LINDENLAB.COM./cgi-bin/login.cgi ", SL_MAIN_GRID),
            ("https://login.aditi.lindenlab.com:443/another/path", SL_BETA_GRID),
        ] {
            assert_eq!(second_life_grid(uri), Some(grid), "{uri}");
            assert!(is_second_life_login(uri), "{uri}");
        }
        for uri in [
            "http://login.agni.lindenlab.com/cgi-bin/login.cgi",
            "https://login.agni.lindenlab.com:12043/cgi-bin/login.cgi",
            "https://someone@login.agni.lindenlab.com/cgi-bin/login.cgi",
            "https://login.agni.lindenlab.com.grid.example/cgi-bin/login.cgi",
            "https://agni.lindenlab.com/cgi-bin/login.cgi",
            "https://util.aditi.lindenlab.com/cgi-bin/login.cgi",
            "https://grid.example:8002/",
            "http://127.0.0.1:9000/",
            "login.agni.lindenlab.com",
            "",
        ] {
            assert_eq!(second_life_grid(uri), None, "{uri}");
        }

        let url = |u: &str| reqwest::Url::parse(u).unwrap();
        let (main, beta, other) = (url(SL_MAIN_GRID), url(SL_BETA_GRID), url("https://grid.example/login"));
        assert!(login_redirect_allowed(std::slice::from_ref(&main), &beta));
        assert!(!login_redirect_allowed(std::slice::from_ref(&main), &other));
        assert!(!login_redirect_allowed(&[main.clone(), beta.clone()], &other));
        assert!(login_redirect_allowed(std::slice::from_ref(&other), &main));
        assert!(login_redirect_allowed(&[other.clone(), url("https://elsewhere.example/")], &other));

        let listener = std::net::TcpListener::bind("127.0.0.1:0").unwrap();
        listener.set_nonblocking(true).unwrap();
        let req = LoginRequest {
            login_uri: format!("http://{}/", listener.local_addr().unwrap()),
            username: "synthetic".into(),
            password: "x".into(),
            start: StartLocation::Last,
            agree_to_tos: false,
            read_critical: false,
            mfa_token: "123456".into(),
            mfa_hash: String::new(),
            mac: String::new(),
            id0: String::new(),
            last_exec: LastExec::default(),
            platform: Platform::default(),
            accepted_next_servers: Vec::new(),
        };
        let rt = tokio::runtime::Builder::new_current_thread().enable_all().build().unwrap();
        let client = reqwest::Client::builder().redirect(redirect_policy()).build().unwrap();
        let err = rt.block_on(login(&client, &req)).unwrap_err();
        assert!(matches!(&err, LoginError::Refused { reason, .. } if reason == "grid"), "{err}");
        assert!(
            matches!(listener.accept(), Err(e) if e.kind() == std::io::ErrorKind::WouldBlock),
            "nothing may reach another server"
        );
    }

    #[test]
    fn username_split() {'''

[[patch]]
id = "sl-grids-only-settings-test"
why = "Checks sl-grids-only-settings: a saved other grid loads as Second Life (Aditi when its address is Aditi's), the Second Life grids are kept, and the login address is always one of the two servers."
paths = ["crates/aurora-viewer/src/**/external_links.rs"]
op = "regex"
pattern = '^mod tests \{\r?\n    use super::\*;\r?\n'
replace = '''\g<0>
    // aurora-local-patch: sl-grids-only-settings-test
    #[test]
    fn a_saved_grid_other_than_second_life_loads_as_second_life() {
        use crate::settings::GridChoice;
        use aurora_net::login::{SL_BETA_GRID, SL_MAIN_GRID};
        for (grid, custom, expected) in [
            (GridChoice::Custom, "http://grid.example:8002/", GridChoice::SecondLife),
            (GridChoice::Custom, "", GridChoice::SecondLife),
            (GridChoice::Custom, SL_MAIN_GRID, GridChoice::SecondLife),
            (GridChoice::Custom, SL_BETA_GRID, GridChoice::SecondLifeBeta),
            (GridChoice::SecondLife, "http://grid.example:8002/", GridChoice::SecondLife),
            (GridChoice::SecondLifeBeta, "http://grid.example:8002/", GridChoice::SecondLifeBeta),
        ] {
            let settings = settings_on(grid.clone(), custom, &["http://grid.example:8002"]).sanitized();
            assert_eq!(settings.grid, expected, "{grid:?} {custom}");
            assert!(aurora_net::login::is_second_life_login(&settings.login_uri()), "{grid:?} {custom}");
        }
    }
'''
