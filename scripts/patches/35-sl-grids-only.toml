# The viewer logs in to the two Second Life grids only: Agni (SL_MAIN_GRID)
# and Aditi (SL_BETA_GRID). The owner uses no other grid, so no login, and no
# password hash or 2FA code with it, may ever go to another server.
#
# Layers, strongest first:
# - aurora-net's login() refuses any other login server, for the first request
#   and for every "indeterminate" hop or stopped 307/308 the server asks for;
#   the login client follows no HTTP redirect away from those servers (a
#   307/308 resends the body). Every real login goes through it; demo mode
#   never does (start_login returns before building a request).
#   Since upstream #3262 (5d67ef55) login() itself asks the user before going
#   on to another server; that question can still show for a hop away from
#   Second Life, and agreeing only leads to this patch's refusal: nothing is
#   sent to the other server either way.
# - a saved other grid becomes Second Life when the settings load, and
#   --grid / --loginuri with another grid are ignored (with --login dropped).
# - the interface offers only the two grids: the grid menu of the login form
#   and the account cards lists no saved grid and no grid manager, and the
#   Preferences button of the grid manager is greyed out.
#
# What is deliberately not patched (the login refusal covers it, and hiding
# it would need many anchors in UI code that changes often): the custom login
# URI fields still show for an account card or a form already on another grid
# (the login is refused), and the grid manager itself. Hypergrid travel needs
# a session on a custom grid (grids::resolve answers CrossGrid otherwise), so
# it cannot start once logins are limited to Second Life.
#
# Pairs: the *-test ids go with the behaviour they check. Skip a behaviour
# patch and its test patch together, or the test fails to build or fails.

[[patch]]
id = "sl-grids-only-rule"
why = "Which login addresses are Second Life's: https, no user info, and the host and port of SL_MAIN_GRID or SL_BETA_GRID once login_authority normalised them (case, final dot, default port). The constants stay the only place the hosts are written. Also the login client's redirect rule."
paths = ["crates/aurora-net/src/**/login.rs"]
op = "regex"
pattern = '^pub const SL_BETA_GRID: &str = "[^"\n]*";$'
replace = '''\g<0>

// aurora-local-patch: sl-grids-only-rule
/// The Second Life grid (`SL_MAIN_GRID` or `SL_BETA_GRID`) whose login
/// server `uri` is, None for any other server. Over https only and without
/// user info; the host and port are compared as `login_authority` gives
/// them, the path does not matter. This viewer logs in to these two only.
pub fn second_life_grid(uri: &str) -> Option<&'static str> {
    let url = reqwest::Url::parse(uri.trim()).ok()?;
    if url.scheme() != "https" || !url.username().is_empty() || url.password().is_some() {
        return None;
    }
    let authority = login_authority(uri)?;
    [SL_MAIN_GRID, SL_BETA_GRID]
        .into_iter()
        .find(|grid| login_authority(grid).as_deref() == Some(authority.as_str()))
}

/// One of the two Second Life login servers.
pub fn is_second_life_login(uri: &str) -> bool {
    second_life_grid(uri).is_some()
}

/// A redirect chain that started at a Second Life login server may only go
/// to one of them: a 307 or 308 would send the login body, password hash
/// included, to the new address. `redirect_policy` (upstream's, used by the
/// login request only) refuses the others before its own rule
/// (sl-grids-only-redirects).
fn login_redirect_allowed(previous: &[reqwest::Url], next: &reqwest::Url) -> bool {
    !previous.first().is_some_and(|first| is_second_life_login(first.as_str())) || is_second_life_login(next.as_str())
}'''

[[patch]]
id = "sl-grids-only-login"
why = "The choke point: every real login (button, account card, command line, reconnect, the retry of a refused login) goes through login(), which builds the request here, for the first server and for each 'indeterminate' next_url. Another server gets nothing: no request is built or sent, and the viewer shows the refusal on the login screen like any refused login."
paths = ["crates/aurora-net/src/**/login.rs"]
op = "literal"
fn = "login"
find = '''
let body = xmlrpc::build_call(&method, &build_params(req, &uri));
'''
replace = '''
// aurora-local-patch: sl-grids-only-login
        if !is_second_life_login(&uri) {
            log::warn!("login: the login server is not one of the Second Life grids, nothing sent");
            return Err(LoginError::Refused {
                reason: "grid".into(),
                message: aurora_i18n::tr!("login-second-life-grids-only").into(),
                message_id: String::new(),
            });
        }
        let body = xmlrpc::build_call(&method, &build_params(req, &uri));'''

[[patch]]
id = "sl-grids-only-redirects"
why = "Goes with sl-grids-only-rule: the login request's client (login_http, with upstream's redirect_policy since #3262; the other clients' redirects stay free) follows no HTTP redirect from a Second Life login server to another address, not even to the other Linden Lab hosts upstream's next_server follows on its own. The redirect is stopped and comes back to login(), where sl-grids-only-login refuses any next address that is not one of the two servers."
paths = ["crates/aurora-net/src/**/login.rs"]
op = "literal"
fn = "redirect_policy"
find = 'reqwest::redirect::Policy::custom(|attempt| {'
replace = '''reqwest::redirect::Policy::custom(|attempt| {
        // aurora-local-patch: sl-grids-only-redirects
        if !login_redirect_allowed(attempt.previous(), attempt.url()) {
            log::warn!("login: a redirect away from the Second Life login servers, not followed");
            return attempt.stop();
        }'''

