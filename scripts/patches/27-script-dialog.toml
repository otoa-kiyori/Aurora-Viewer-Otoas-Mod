op = "literal"
find = "fn script_rows(count: usize)"
replace = '''// aurora-local-patch: script-dialog-toasts-helpers
/// The toasts of the stack under the bell: without the script menus and
/// text boxes once they stand elsewhere (`script_toasts`).
fn main_toasts(list: &Notifications, at: crate::settings::PresencePosition, ids: Vec<u64>) -> Vec<u64> {
    if at == crate::settings::PresencePosition::TopRight {
        return ids;
    }
    ids.into_iter()
        .filter(|id| !list.list.iter().any(|n| n.id == *id && super::notification_center::dnd_shows(n)))
        .collect()
}

/// The script menus and text boxes away from the top right: the same toasts
/// and answers as in the stack under the bell, in an area of their own at the
/// chosen place (in the room the bars leave, above the nearby chat lines).
#[allow(clippy::too_many_arguments)]
fn script_toasts(
    ctx: &egui::Context,
    p: &Palette,
    icons: &Icons,
    world: &World,
    list: &mut Notifications,
    nui: &mut NotifUi,
    env: &mut ToastEnv<'_>,
    dnd: bool,
    answers: &mut Vec<(u64, Response)>,
) {
    let at = nui.center.script_at;
    if at == crate::settings::PresencePosition::TopRight {
        return;
    }
    let (ids, _) = shown_toasts(list, nui, dnd);
    let ids: Vec<u64> = ids
        .into_iter()
        .filter(|id| list.list.iter().any(|n| n.id == *id && super::notification_center::dnd_shows(n)))
        .collect();
    if ids.is_empty() {
        return;
    }
    let (pivot, pos) = super::notification_center::script_place(ctx, at, env.classic_bars, WIDTH, env.toast_gap);
    egui::Area::new(egui::Id::unique("notification_script_toasts"))
        .fade_in(false)
        .order(egui::Order::Foreground)
        .pivot(pivot)
        .fixed_pos(pos)
        .constrain(false)
        .show(ctx, |ui| {
            // ToastGap, as between the Legacy toasts (LLScreenChannel::redrawToasts)
            ui.spacing_mut().item_spacing.y = env.toast_gap;
            for id in ids.into_iter().rev() {
                if let Some(n) = list.list.iter_mut().find(|n| n.id == id) {
                    // Close All Windows (upstream #2766) and Close Window
                    // (upstream #3171): shown toasts, as in the stack
                    if close_script_prompt(ctx, n, true) {
                        answers.push((id, Response::Dismiss));
                        nui.toasts.retain(|(t, _)| *t != id);
                        continue;
                    }
                    match card(ui, p, icons, world, env.images, &mut nui.wanted_images, n, true, false) {
                        // as in the stack: the cross of a text box only hides
                        // it (a menu stays until answered)
                        Some(Response::Dismiss) if !matches!(n.data, Data::Dialog { .. }) => {
                            nui.toasts.retain(|(t, _)| *t != id);
                            nui.hidden.insert(id);
                        }
                        Some(r) => answers.push((id, r)),
                        None => {}
                    }
                }
            }
        });
}

fn script_rows(count: usize)'''

