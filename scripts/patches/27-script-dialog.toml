replace = '''// aurora-local-patch: script-dialog-center-helpers
/// Whether the card `id` is a script menu or text box standing apart from
/// the bell's panel (the place is not the top right).
pub fn is_aside(c: &CenterUi, id: u64) -> bool {
    c.script_at != PresencePosition::TopRight && c.aside.contains(&id)
}

/// Note the rolled-out script menus and text boxes, while they stand apart:
/// one that is answered keeps its side until its card is gone.
fn sync_aside(list: &Notifications, c: &mut CenterUi) {
    if c.script_at == PresencePosition::TopRight {
        c.aside.clear();
        return;
    }
    let new: Vec<u64> = list
        .list
        .iter()
        .filter(|n| dnd_shows(n) && !c.aside.contains(&n.id))
        .map(|n| n.id)
        .collect();
    c.aside.extend(new);
    let peek = &c.peek;
    c.aside.retain(|id| peek.iter().any(|k| k.id == *id));
}

/// `visible` over the cards under the bell (`Some(false)`), those standing
/// aside (`Some(true)`), or all of them (`None`).
fn visible_part(c: &CenterUi, aside: Option<bool>) -> (Vec<Peek>, usize) {
    let part: Vec<&Peek> = c.peek.iter().filter(|k| aside.is_none_or(|a| is_aside(c, k.id) == a)).collect();
    let mut keep: Vec<usize> = (0..part.len()).rev().filter(|i| part[*i].pinned).take(MAX_PEEK).collect();
    let room = MAX_PEEK - keep.len();
    keep.extend((0..part.len()).rev().filter(|i| !part[*i].pinned).take(room));
    keep.sort_unstable();
    let shown: Vec<Peek> = keep.iter().map(|i| part[*i].clone()).collect();
    let behind = part.len() - shown.len();
    (shown, behind)
}

/// The left edge and the content width of the panel under the bell: with
/// the islands, exactly under the system and bell islands (`column`), the
/// overlay's margins and border within that width; with the Legacy bars its
/// own width, ending under the bell. The script cards standing aside take
/// the same width (`script_inner`).
fn bell_panel(column: Option<Rect>, bell: Rect, screen: Rect) -> (f32, f32) {
    match column {
        Some(c) => (c.left(), c.width() - PANEL_FRAME),
        None => (
            ((bell.right() + 4.0).min(screen.right() - 6.0) - WIDTH).max(screen.left() + 6.0),
            WIDTH - 12.0,
        ),
    }
}

/// The content width of the script cards standing aside: `wide`, the panel
/// under the bell's own (`bell_panel`), at every place, so the card, its
/// text box and its buttons are laid out as at the top right; narrowed only
/// when the room the bars leave is narrower than that panel.
pub fn script_inner(room: Rect, wide: f32) -> f32 {
    ((wide + PANEL_FRAME).min(room.width()) - PANEL_FRAME).max(0.0)
}

/// The room the bars leave this frame (both styles of notifications).
pub fn script_room(ctx: &egui::Context, classic_bars: bool) -> Rect {
    presence::room(super::layout::work_area(ctx), classic_bars)
}

/// The corner a column of `width` hangs from at `at` in `room`, above the
/// rectangles of `avoid` across it, `gap` (ToastGap) away from them: the
/// pivot of the area and its point. At the bottom the area grows upwards,
/// as the friends' toasts do.
pub fn script_anchor(room: Rect, at: PresencePosition, width: f32, avoid: &[Rect], gap: f32) -> (egui::Align2, egui::Pos2) {
    use egui::Align;
    // the edge a toast of that width and no height would stand against
    let edge = presence::stack(room, at, &[Vec2::new(width, 0.0)], avoid, gap)
        .pop()
        .flatten()
        .unwrap_or_else(|| Rect::from_min_size(room.min, Vec2::new(width, 0.0)));
    let (x, side) = match at {
        PresencePosition::TopLeft | PresencePosition::BottomLeft => (edge.left(), Align::Min),
        PresencePosition::TopRight | PresencePosition::BottomRight => (edge.right(), Align::Max),
        PresencePosition::TopCenter | PresencePosition::BottomCenter => (edge.center().x, Align::Center),
    };
    if at.top() {
        (egui::Align2([side, Align::Min]), egui::pos2(x, edge.top()))
    } else {
        (egui::Align2([side, Align::Max]), egui::pos2(x, edge.bottom()))
    }
}

/// `script_anchor` in the room the bars leave this frame, above the nearby
/// chat lines (both styles of notifications).
pub fn script_place(ctx: &egui::Context, at: PresencePosition, classic_bars: bool, width: f32, gap: f32) -> (egui::Align2, egui::Pos2) {
    let room = script_room(ctx, classic_bars);
    let avoid: Vec<Rect> = chat_lines(ctx).into_iter().collect();
    script_anchor(room, at, width, &avoid, gap)
}

/// The script menus and text boxes rolled out away from the bell's panel:
/// the same cards, in a panel of their own at the chosen place, as wide as
/// the panel under the bell (`wide`, its content width).
#[allow(clippy::too_many_arguments)]
fn script_dialogs(
    ctx: &egui::Context,
    p: &Palette,
    icons: &Icons,
    world: &World,
    list: &mut Notifications,
    nui: &mut NotifUi,
    env: &mut ToastEnv<'_>,
    wide: f32,
    now: f64,
    answers: &mut Vec<(u64, Response)>,
) {
    let at = nui.center.script_at;
    if at == PresencePosition::TopRight || nui.open || env.hidden || visible_part(&nui.center, Some(true)).0.is_empty() {
        return;
    }
    let inner = script_inner(script_room(ctx, env.classic_bars), wide);
    let (pivot, pos) = script_place(ctx, at, env.classic_bars, inner + PANEL_FRAME, env.toast_gap);
    nui.center.inner_width = inner;
    egui::Area::new(egui::Id::unique("notification_script_dialogs"))
        .fade_in(false)
        .order(egui::Order::Foreground)
        .pivot(pivot)
        .fixed_pos(pos)
        .constrain(false)
        .show(ctx, |ui| {
            super::widgets::overlay(ui, p, egui::Margin::same(6), |ui| {
                ui.set_width(inner);
                rolled_out(true, ui, p, icons, world, list, nui, env, now, answers);
            });
        });
}

pub mod presence;

#[cfg(test)]
pub(super) mod tests;

#[cfg(test)]
mod script_dialog_tests {
    use super::*;
    use crate::world::notifications::Kind;
    use uuid::Uuid;

    const ROOM: Rect = Rect::from_min_max(egui::pos2(0.0, 40.0), egui::pos2(1000.0, 700.0));

    fn dialog(list: &mut Notifications) -> u64 {
        list.push(
            Kind::Script,
            "HUD",
            "Choose a button",
            Data::Dialog {
                sender: ([127, 0, 0, 1], 13000).into(),
                object: Uuid::from_u128(3),
                object_name: "HUD".into(),
                own_object: false,
                channel: -42,
                buttons: vec!["Yes".into(), "No".into()],
            },
        )
    }

    /// Each place hangs the column from its own corner of the room, the
    /// bottom ones growing upwards.
    #[test]
    fn script_anchor_hangs_the_column_from_the_chosen_corner() {
        use egui::{Align, Align2};
        let expect = [
            (PresencePosition::TopLeft, Align2([Align::Min, Align::Min]), egui::pos2(0.0, 40.0)),
            (
                PresencePosition::TopCenter,
                Align2([Align::Center, Align::Min]),
                egui::pos2(500.0, 40.0),
            ),
            (
                PresencePosition::TopRight,
                Align2([Align::Max, Align::Min]),
                egui::pos2(1000.0, 40.0),
            ),
            (
                PresencePosition::BottomLeft,
                Align2([Align::Min, Align::Max]),
                egui::pos2(0.0, 700.0),
            ),
            (
                PresencePosition::BottomCenter,
                Align2([Align::Center, Align::Max]),
                egui::pos2(500.0, 700.0),
            ),
            (
                PresencePosition::BottomRight,
                Align2([Align::Max, Align::Max]),
                egui::pos2(1000.0, 700.0),
            ),
        ];
        for (at, pivot, pos) in expect {
            assert_eq!(script_anchor(ROOM, at, 360.0, &[], 7.0), (pivot, pos), "{at:?}");
        }
    }

    /// The nearby chat lines over the chat bar keep the bottom stack above
    /// them only where they cross its column.
    #[test]
    fn script_anchor_stays_above_the_chat_lines() {
        let chat = Rect::from_min_max(egui::pos2(0.0, 600.0), egui::pos2(400.0, 700.0));
        // ToastGap (7 by default) above the chat lines
        let (_, pos) = script_anchor(ROOM, PresencePosition::BottomLeft, 360.0, &[chat], 7.0);
        assert_eq!(pos, egui::pos2(0.0, 600.0 - 7.0));
        let (_, pos) = script_anchor(ROOM, PresencePosition::BottomLeft, 360.0, &[chat], 0.0);
        assert_eq!(pos, egui::pos2(0.0, 600.0));
        let (_, pos) = script_anchor(ROOM, PresencePosition::BottomRight, 360.0, &[chat], 7.0);
        assert_eq!(pos, egui::pos2(1000.0, 700.0));
        let (_, pos) = script_anchor(ROOM, PresencePosition::TopLeft, 360.0, &[chat], 7.0);
        assert_eq!(pos, egui::pos2(0.0, 40.0));
    }

    /// Away from the top right the script cards keep the width of the panel
    /// under the bell (the islands' column, or the Legacy bars' own) at
    /// every place, and stand inside the room; a room narrower than that
    /// panel narrows them to fit.
    #[test]
    fn the_cards_aside_keep_the_width_under_the_bell() {
        let bell = Rect::from_min_max(egui::pos2(960.0, 4.0), egui::pos2(996.0, 36.0));
        let screen = Rect::from_min_max(egui::pos2(0.0, 0.0), egui::pos2(1000.0, 720.0));
        let column = Rect::from_min_max(egui::pos2(560.0, 4.0), bell.max);
        let narrow = Rect::from_min_max(egui::pos2(0.0, 40.0), egui::pos2(300.0, 700.0));
        for (col, wide) in [(Some(column), 436.0 - PANEL_FRAME), (None, WIDTH - 12.0)] {
            let (_, inner) = bell_panel(col, bell, screen);
            assert_eq!(inner, wide);
            assert_eq!(script_inner(ROOM, inner), inner);
            assert_eq!(script_inner(narrow, inner), 300.0 - PANEL_FRAME);
            for room in [ROOM, narrow] {
                let w = script_inner(room, inner) + PANEL_FRAME;
                for at in PresencePosition::ALL {
                    let (pivot, pos) = script_anchor(room, at, w, &[], 7.0);
                    let card = pivot.anchor_size(pos, Vec2::new(w, 100.0));
                    assert!(room.contains_rect(card), "{at:?} {card:?} in {room:?}");
                }
            }
        }
    }

    /// Away from the top right the script menu is a card of its own side;
    /// the rest stays under the bell, and at the top right nothing is aside.
    #[test]
    fn only_the_script_cards_stand_aside() {
        for (at, aside) in [(PresencePosition::BottomLeft, true), (PresencePosition::TopRight, false)] {
            let mut list = Notifications::default();
            let mut c = CenterUi {
                script_at: at,
                ..CenterUi::default()
            };
            let script = dialog(&mut list);
            let info = list.push(Kind::Info, "Lune paid you L$50", "", Data::None);
            update(&list, &mut c, Moment::default(), 30.0);
            sync_aside(&list, &mut c);
            assert_eq!(is_aside(&c, script), aside);
            assert!(!is_aside(&c, info));
            let ids = |part| visible_part(&c, part).0.iter().map(|k| k.id).collect::<Vec<_>>();
            if aside {
                assert_eq!(ids(Some(true)), vec![script]);
                assert_eq!(ids(Some(false)), vec![info]);
            } else {
                assert!(ids(Some(true)).is_empty());
                assert_eq!(ids(Some(false)), vec![script, info]);
            }
            assert_eq!(ids(None), vec![script, info]);
            assert_eq!(ids(None), visible(&c).0.iter().map(|k| k.id).collect::<Vec<_>>());
        }
    }

    /// A card keeps its side until it is gone, whatever the place becomes.
    #[test]
    fn a_card_keeps_its_side_until_gone() {
        let mut list = Notifications::default();
        let mut c = CenterUi {
            script_at: PresencePosition::TopLeft,
            ..CenterUi::default()
        };
        let script = dialog(&mut list);
        update(&list, &mut c, Moment::default(), 30.0);
        sync_aside(&list, &mut c);
        assert!(is_aside(&c, script));
        c.peek.clear();
        sync_aside(&list, &mut c);
        assert!(!is_aside(&c, script));
        c.script_at = PresencePosition::TopRight;
        assert!(!is_aside(&c, script));
    }

    /// The place is saved; a settings file from before it was added gets the
    /// top right, and the reset of Preferences > Chat puts it back.
    #[test]
    fn the_place_is_saved_and_defaults_to_the_top_right() {
        use crate::settings::Settings;
        assert_eq!(Settings::default().script_dialog_position, PresencePosition::TopRight);
        let old: Settings = serde_json::from_str("{}").expect("empty settings");
        assert_eq!(old.script_dialog_position, PresencePosition::TopRight);
        let s = Settings {
            script_dialog_position: PresencePosition::BottomLeft,
            ..Settings::default()
        };
        let back: Settings = serde_json::from_str(&serde_json::to_string(&s).expect("serialize")).expect("read back");
        assert_eq!(back.script_dialog_position, PresencePosition::BottomLeft);
        let mut s = back;
        crate::ui::options::reset_page_settings(crate::ui::options::Page::Chat, &mut s);
        assert_eq!(s.script_dialog_position, PresencePosition::TopRight);
    }
}'''

