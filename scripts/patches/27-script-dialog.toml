# Choose where the script menus (llDialog) and text boxes (llTextBox) appear.
#
# Upstream shows them as notification cards fixed at the top right, under the
# bell (Aurora's center) or in the Legacy toast stack. The Legacy Viewer has a
# ScriptDialogsPosition setting (indra/newview/app_settings/settings.xml).
#
# New saved setting `script_dialog_position`, the friends' toasts enum
# (`PresencePosition`, six places, same labels), TopRight by default: nothing
# changes until it is picked. Preferences > Chat > Toasts has the dropdown
# right under the one of the online / offline toasts.
#
# Only the script menus and text boxes move (`dnd_shows` picks them: the same
# two kinds that already show in do not disturb). They stand in the room the
# bars leave (`presence::room`), above the nearby chat lines, and at the
# bottom the stack grows upwards, exactly as the friends' toasts do. Every
# other notification, the bell's list, expiry, answers and do not disturb are
# untouched, and with TopRight no code path differs from upstream:
#  - Aurora's center: the moved cards leave the bell's panel for a panel of
#    their own (`script_dialogs`, drawn by the same `rolled_out`), and the
#    bell's panel only unrolls for what is left in it;
#  - Legacy toasts: the moved toasts leave the stack under the bell for an
#    area of their own (`script_toasts`).
# The place reaches both through `CenterUi::script_at`, set by the app from
# the setting each frame (so no `ToastEnv` field has to be added).
#
# Wherever they stand, the cards keep the top right's layout. In Aurora's
# center the panel under the bell takes the islands' column (the system and
# bell islands, often wider than `WIDTH`); the panel aside takes that same
# width through the same rule (`bell_panel`, upstream's own lines moved into
# a function), narrowed only when the room the bars leave is narrower
# (`script_inner`). The Legacy toasts have one fixed width in both places.
#
# Texts (label and hint) are added to every catalogue. The idempotence marker
# of the Fluent files is a Fluent comment line.

