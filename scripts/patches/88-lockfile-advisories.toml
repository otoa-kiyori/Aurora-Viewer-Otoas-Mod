# Cargo.lock moves ctutils past a RustSec advisory.
#
# - ctutils 0.4.3 -> 0.4.8: RUSTSEC-2026-0385 (non-constant-time operations).
#
# Upstream's Cargo.lock has since moved rustls-webpki (0.103.17) and
# pulldown-cmark (0.13.6) past the two other advisories this file used to
# fix (RUSTSEC-2026-0382, RUSTSEC-2026-0433); their patches are retired.
#
# The new version is semver-compatible with the Cargo.toml requirements, so
# only the version and checksum lines of its [[package]] block change; the
# dependency list is identical, no package is added or removed. The match
# starts at the `name = ` line, so it is unique in the file.
#
# Cargo.lock takes a `#` marker comment (`//` does not parse there); cargo
# --locked accepts it.
#
# Retire this whole file once upstream's Cargo.lock reaches this version (or
# a later one): its patches then report ALREADY or DRIFT.

[[patch]]
id = "lock-ctutils"
why = "RUSTSEC-2026-0385: ctutils 0.4.8 fixes non-constant-time operations"
paths = ["Cargo.lock"]
op = "literal"
expect = 1
find = """name = "ctutils"
version = "0.4.3"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "03bb0e1cc970d482d121d9a1744999169b69a07470b3d644a7894e53fcaf4574\""""
replace = """name = "ctutils"
version = "0.4.8" # aurora-local-patch: lock-ctutils
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "261af4dc7a06ea8a527a8717d8cbba3417530d6ea14e1edb3de6b67806be474f\""""

[[patch]]
id = "lock-licences-table"
why = "the licence table names the versions the patched Cargo.lock ships, as its test requires"
paths = ["THIRD-PARTY-LICENSES.md"]
op = "regex"
dotall = true
expect = 1
pattern = '''^## Crates\n(.*?^\| ctutils )0\.4\.3( \|)'''
replace = '''## Crates

Local patch set: ctutils 0.4.8 replaces the version upstream locks, for a RustSec advisory. <!-- // aurora-local-patch: lock-licences-table -->
\g<1>0.4.8\g<2>'''
