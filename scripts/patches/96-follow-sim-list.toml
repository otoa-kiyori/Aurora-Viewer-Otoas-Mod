# With Preferences › Aurora › Animations › Synchronize on, each avatar's
# playback follows the simulator's AvatarAnimation list exactly. This is
# Otoa's rule, not a Legacy Viewer port. With the setting off, nothing
# changes.
#
# On each sync of an avatar (scene::anim::Controller::sync), Aurora corrects
# its motions to the simulator's full list
# (files/follow-sim-list/follow_sim.rs):
# 1. What the simulator does not list stops. What it lists plays, also when
#    our own drawn list (the AO's pose, movement prediction) lacks it.
# 2. The listed motions are ordered newest first by the simulator's
#    sequence numbers, not by packet order or download time. The blender
#    breaks priority ties with this order.
#    - A restart (a new sequence for a listed id) moves the motion to the
#      newest place.
#    - An expression named in an animation's header stays right above that
#      animation.
#    - The built-in motions (head, eyes, breathing, body noise) are not in the
#      list. They stay below every keyframe state of their priority, as
#      before. IK and foot placement still run after the blend.
# 3. One copy per animation.
#    - A restart replaces the copy at once, without a fade. The new copy
#      starts at the old copy's weight (Motion::floor), so there is no dip.
#      A loop listed without a break keeps its phase.
#    - A stop fades the single copy out.
#    - With the setting on, this replaces anim-restart-legacy's keep rule
#      (patch 92) and the second instance that fades beside a new one. With
#      the setting off, both stay exactly as patch 92 has them.
# 4. Exceptions Otoa chose (World::simulator_list_of, our own avatar):
#    - The AO keeps hiding what it leaves out of its pose: the stock clips it
#      replaces, and its own clips it stopped while the simulator still lists
#      them (the round trip, its 2 s owned grace).
#    - With Instant movement (predict_own_motion), a predicted stop keeps the
#      listed walk hidden until the simulator drops it. With Server movement,
#      the list is followed strictly.
#    - Our own local starts not listed yet (AO, movement prediction,
#      previews) rank newest. Once listed, they take their sequence's place.
#      Our local upload preview is never treated as listed.
# 5. Nothing is sent to the simulator for this. The sends that already
#    exist stay as they are.
# 6. One INFO line, "follow simulator list: avatar <id>: ...", for each sync
#    that changed something: removed, added, deduplicated, reordered (with
#    the new order).
#
# Animesh (ObjectAnimation) is not followed; it keeps today's playback.
# Tests: files/follow-sim-list/follow_sim.rs, for both settings. Apply or
# skip the whole file, not one patch of it. It applies after
# 92-anim-restart-legacy.toml, whose lines it anchors on.
# Needs patch 92-anim-restart-legacy (it applies earlier): Motion's field
# `floor` goes in after 92's `inserted` field (anim-restart-legacy-inserted-
# field, follow-sim-list-floor-field), and the signalled and the emote
# motions' `floor: 0.0` after 92's `inserted: now` lines in sync
# (anim-restart-legacy-inserted-signal and -emote, follow-sim-list-floor-
# signal and -emote).

