[[patch]]
id = "follow-sim-list-floor-use"
why = "the ease-in of a replacing copy starts at the replaced copy's weight; with floor 0 the weight is unchanged"
paths = ["crates/aurora-viewer/src/scene/anim.rs"]
op = "literal"
fn = "ease_in_weight"
find = """if ease_in > 0.0 {
            aurora_assets::anim::cubic_step(elapsed / f64::from(ease_in))
        } else {
            1.0
        }"""
replace = """let weight = if ease_in > 0.0 {
            aurora_assets::anim::cubic_step(elapsed / f64::from(ease_in))
        } else {
            1.0
        };
        // aurora-local-patch: follow-sim-list-floor-use
        if self.floor > 0.0 {
            self.floor + (1.0 - self.floor) * weight
        } else {
            weight
        }"""

