[[patch]]
id = "follow-sim-list-world"
why = "World::simulator_list_of: what the simulator lists for an avatar (without our local upload preview), and what our own drawn list hides on purpose (AO, Instant movement's predicted stop)"
paths = ["crates/aurora-viewer/src/world/mod.rs"]
op = "literal"
find = "pub fn animations_of(&self, owner: &Uuid) -> &[PlayingAnimation] {"
replace = """/// Synchronize on (scene/anim/follow_sim.rs): what the simulator lists
    /// for an avatar, and for our own what our drawn list hides on purpose
    /// (Otoa's exceptions), so the simulator's list does not bring it back.
    /// The simulator's list of our own avatar is `animations` without the
    /// local upload preview, which the AvatarAnimations handler and
    /// `preview_animation` push last. Hidden on purpose:
    /// - with Instant movement (`predict_own_motion`, the agent predicting)
    ///   and the keys released, a predicted stop: the listed motions the
    ///   prediction's drawn list (`own_drawn`) left out, until the
    ///   simulator drops them. With Server movement nothing is predicted,
    ///   and the simulator's list is followed strictly;
    /// - with the AO's pose, every clip of the AO's input (`own_signals`)
    ///   missing from its pose: the stock clips it replaces, and its own
    ///   clips it stopped while the simulator still lists them (the round
    ///   trip, its 2 s owned grace).
    // aurora-local-patch: follow-sim-list-world
    pub fn simulator_list_of(&self, owner: &Uuid) -> (&[PlayingAnimation], Vec<Uuid>) {
        let listed = self.animations.get(owner).map(Vec::as_slice).unwrap_or_default();
        if *owner != self.agent_id {
            return (listed, Vec::new());
        }
        // (the local previews, several at once, are pushed last in their order)
        let mut listed = listed;
        while let Some((last, rest)) = listed.split_last()
            && self.local_previews.iter().any(|p| p.signal.id == last.id)
        {
            listed = rest;
        }
        let mut masked = Vec::new();
        if self.agent.predicting()
            && self.own_locomotion.wanted().is_none()
            && let Some(drawn) = &self.own_drawn
        {
            masked.extend(listed.iter().map(|a| a.id).filter(|id| !drawn.iter().any(|d| d.id == *id)));
        }
        if let Some(pose) = &self.ao_pose {
            for id in self.own_signals().iter().map(|a| a.id) {
                if !pose.iter().any(|p| p.id == id) && !masked.contains(&id) {
                    masked.push(id);
                }
            }
        }
        (listed, masked)
    }

    pub fn animations_of(&self, owner: &Uuid) -> &[PlayingAnimation] {"""

[[patch]]
id = "follow-sim-list-world-tests"
why = "World::simulator_list_of: a predicted stop is hidden with Instant movement only, and a clip the AO stopped is hidden at once while still listed"
paths = ["crates/aurora-viewer/src/world/mod.rs"]
op = "literal"
find = """#[test]
    fn ao_pose_does_not_replace_network_signals_or_other_avatars() {"""
replace = """// aurora-local-patch: follow-sim-list-world-tests
    #[test]
    fn synchronize_hides_a_predicted_stop_with_instant_movement_only() {
        let (mut world, _, _) = fixture();
        let me = world.agent_id;
        let (walk, stand) = (crate::own_motion::ANIM_WALK, crate::own_motion::ANIM_STAND);
        let now = Instant::now();
        world.apply(NetEvent::AvatarAnimations {
            avatar: me,
            anims: vec![(walk, 4)],
            sources: Vec::new(),
        });
        // the keys released: prediction draws a local stand over the listed walk
        world.own_drawn = Some(vec![PlayingAnimation::from_signal(stand, i32::MIN, now, None)]);
        for (instant, hidden) in [(true, vec![walk]), (false, Vec::new())] {
            world.agent.set_predicting(instant);
            let (listed, masked) = world.simulator_list_of(&me);
            let ids: Vec<_> = listed.iter().map(|a| a.id).collect();
            assert_eq!(ids, [walk], "the simulator's list is unchanged");
            // Instant: the predicted stop hides the walk; Server: strict
            assert_eq!(masked, hidden, "Instant {instant}");
        }
    }

    #[test]
    fn synchronize_hides_a_clip_the_ao_stopped_while_it_is_still_listed() {
        let (mut world, _, _) = fixture();
        let me = world.agent_id;
        let (stopped, kept) = (Uuid::from_u128(9630), Uuid::from_u128(9631));
        let stock = crate::ao::State::Standing.motion();
        let now = Instant::now();
        world.apply(NetEvent::AvatarAnimations {
            avatar: me,
            anims: vec![(stock, 1), (stopped, 2), (kept, 3)],
            sources: Vec::new(),
        });
        // the AO stopped its own clip and replaces the stock stand
        world.ao_pose = Some(vec![PlayingAnimation::from_signal(kept, 0, now, None)]);
        let (listed, masked) = world.simulator_list_of(&me);
        assert_eq!(listed.len(), 3, "still listed until the simulator's next list");
        assert_eq!(masked, [stock, stopped]);
        world.ao_pose = None;
        assert!(world.simulator_list_of(&me).1.is_empty(), "no AO pose: nothing hidden");
    }

    #[test]
    fn ao_pose_does_not_replace_network_signals_or_other_avatars() {"""

