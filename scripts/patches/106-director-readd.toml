replace = '''// aurora-local-patch: director-readd-prepend
    /// A keyframe at the start (local patch set, 106-director-readd): the
    /// others go `gap` seconds later. Its index (0), or `None` when the track
    /// is empty or full, the gap is under `MIN_GAP`, or the last keyframe
    /// would go past `MAX_TIME`.
    pub fn prepend(&mut self, pose: Pose, gap: f32) -> Option<usize> {
        if self.keys.is_empty() || self.is_full() || !gap.is_finite() || gap < MIN_GAP || self.duration() + gap > MAX_TIME {
            return None;
        }
        for key in &mut self.keys {
            key.time += gap;
        }
        self.keys.insert(
            0,
            Keyframe {
                time: 0.0,
                pose,
                rest: false,
                aim: KeyAim::Lock,
                shot: KeyShot::default(),
                extra: KeyExtra::default(),
            },
        );
        self.tidy();
        Some(0)
    }

