[[patch]]
id = "director-readd-tests"
why = "the keyframe put back after a deletion, and when it is not"
paths = ["crates/aurora-viewer/src/director.rs"]
op = "literal"
find = '''for joint in Joint::ALL {
            assert!(joint.bone().starts_with('m'));
        }
    }
}'''
replace = '''for joint in Joint::ALL {
            assert!(joint.bone().starts_with('m'));
        }
    }

    // aurora-local-patch: director-readd-tests
    fn four() -> Director {
        let mut d = three();
        d.add_key(at(30.0));
        d
    }

    /// Four keyframes, the first deleted.
    fn first_deleted() -> Director {
        let mut d = four();
        d.select(0);
        d.remove(0);
        d
    }

    #[test]
    fn a_first_keyframe_deleted_comes_back_first() {
        let mut d = first_deleted();
        assert_eq!(times(&d), [0.0, 3.0, 6.0]);
        assert_eq!((d.selected, d.time), (None, 0.0));
        d.lock.on = true;
        assert_eq!(d.add_key(at(99.0)), Some(0));
        assert_eq!(times(&d), [0.0, 3.0, 6.0, 9.0]);
        assert_eq!(d.track.keys()[0].pose, at(99.0));
        assert_eq!(d.track.keys()[1].pose, at(10.0));
        // locked on the lock's target, selected and under the playhead, as
        // any new keyframe; the others keep their own aim (laid unlocked)
        assert_eq!(d.track.keys()[0].aim, KeyAim::On(d.lock.aim()));
        assert_eq!(d.track.keys()[1].aim, KeyAim::Free);
        assert_eq!((d.selected, d.time), (Some(0), 0.0));
        assert!(d.readd.is_none());
        // the next one goes after the last, as upstream
        assert_eq!(d.add_key(at(50.0)), Some(4));
        assert_eq!(d.track.duration(), 12.0);
        // of two keyframes: the one left goes back to its time
        let mut d = Director::default();
        d.add_key(at(0.0));
        d.add_key(at(10.0));
        d.select(0);
        d.remove(0);
        assert_eq!(d.add_key(at(99.0)), Some(0));
        assert_eq!(times(&d), [0.0, 3.0]);
        assert_eq!(d.track.keys()[1].pose, at(10.0));
        // unlocked: free, as any new keyframe
        assert_eq!(d.track.keys()[0].aim, KeyAim::Free);
        // the first two deleted together: one keyframe back at the start,
        // the others at their times
        let mut d = four();
        d.select(0);
        d.toggle(1);
        d.remove_selection();
        assert_eq!(times(&d), [0.0, 3.0]);
        assert_eq!(d.add_key(at(99.0)), Some(0));
        assert_eq!(times(&d), [0.0, 6.0, 9.0]);
    }

    #[test]
    fn the_first_keyframe_comes_back_only_right_after_its_deletion() {
        // upstream's Add: after the last keyframe, the start unchanged
        let appended = |mut d: Director| {
            assert_eq!(d.add_key(at(99.0)), Some(3));
            assert_eq!(d.track.keys()[0].pose, at(10.0));
            assert_eq!(d.track.keys()[3].pose, at(99.0));
        };
        // a selection, even one given back
        let mut d = first_deleted();
        d.select(1);
        d.selected = None;
        d.time = 0.0;
        appended(d);
        // a scrub that ends at the start
        let mut d = first_deleted();
        d.scrub(2.0);
        d.scrub(0.0);
        d.end_scrub();
        appended(d);
        // the same track loaded
        let mut d = first_deleted();
        let track = d.track.clone();
        d.load(track);
        appended(d);
        // an undo and a redo
        let mut d = four();
        let mut history = History::default();
        history.observe(&d, true);
        d.select(0);
        d.remove(0);
        history.observe(&d, true);
        assert!(history.undo(&mut d) && history.redo(&mut d));
        assert_eq!((d.selected, d.time), (None, 0.0));
        appended(d);
        // a span changed
        let mut d = first_deleted();
        d.track.set_span(1, 5.0);
        assert_eq!(d.add_key(at(99.0)), Some(3));
        assert_eq!(d.track.keys()[0].pose, at(10.0));
        // a playhead moved away
        let mut d = first_deleted();
        d.time = 1.0;
        assert_eq!(d.add_key(at(99.0)), Some(1));
        assert_eq!(times(&d), [0.0, 1.0, 3.0, 6.0]);
        // another keyframe deleted first
        let mut d = first_deleted();
        d.select(2);
        d.remove(2);
        d.select(0);
        d.selected = None;
        appended_two(d);
        // a fresh track, a loaded one: the playhead at 0 appends
        let mut d = Director::default();
        d.add_key(at(0.0));
        d.selected = None;
        assert_eq!(d.add_key(at(10.0)), Some(1));
        let mut d = Director::default();
        d.load(four().track);
        assert_eq!(d.add_key(at(99.0)), Some(4));
        assert_eq!(d.track.keys()[0].pose, at(0.0));
    }

    fn appended_two(mut d: Director) {
        assert_eq!(d.add_key(at(99.0)), Some(2));
        assert_eq!(d.track.keys()[0].pose, at(10.0));
    }

    #[test]
    fn the_first_keyframe_put_back_is_undone_like_any_add() {
        let mut d = four();
        let mut history = History::default();
        history.observe(&d, true);
        d.select(0);
        history.observe(&d, true);
        d.remove(0);
        history.observe(&d, true);
        d.add_key(at(99.0));
        history.observe(&d, true);
        assert_eq!(times(&d), [0.0, 3.0, 6.0, 9.0]);
        assert!(history.undo(&mut d));
        assert_eq!(times(&d), [0.0, 3.0, 6.0]);
        assert_eq!(d.track.keys()[0].pose, at(10.0));
        assert_eq!((d.selected, d.time), (None, 0.0));
        assert!(history.redo(&mut d));
        assert_eq!(d.track.keys()[0].pose, at(99.0));
    }

    #[test]
    fn the_first_keyframe_goes_back_within_the_tracks_limits() {
        // past MAX_TIME: upstream's Add
        let mut d = four();
        d.track.set_span(3, f32::MAX);
        assert!((d.track.duration() - track::MAX_TIME).abs() < 0.01);
        assert_eq!(d.track.prepend(at(99.0), 1.0), None);
        assert_eq!(d.track.len(), 4);
        // a full track, a gap too small, an empty track
        let mut full = Track::default();
        for i in 0..track::MAX_KEYS {
            full.append(at(i as f32));
        }
        assert_eq!(full.prepend(at(99.0), 3.0), None);
        let mut d = four();
        assert_eq!(d.track.prepend(at(99.0), 0.0), None);
        assert_eq!(Track::default().prepend(at(99.0), 3.0), None);
        // the last keyframe deleted from a track of one: nothing to put back
        let mut d = Director::default();
        d.add_key(at(0.0));
        d.remove(0);
        assert!(d.readd.is_none());
        assert_eq!(d.time, 0.0);
    }

    #[test]
    fn a_last_keyframe_deleted_comes_back_where_it_was() {
        let mut d = four();
        d.track.set_span(3, 8.0);
        assert_eq!(times(&d), [0.0, 3.0, 6.0, 14.0]);
        d.select(3);
        d.remove(3);
        assert_eq!(times(&d), [0.0, 3.0, 6.0]);
        // the playhead past the end, where the keyframe was
        assert_eq!((d.selected, d.time), (None, 14.0));
        assert_eq!(d.add_key(at(99.0)), Some(3));
        assert_eq!(times(&d), [0.0, 3.0, 6.0, 14.0]);
        assert_eq!(d.track.span_time(3), Some(8.0));
        assert_eq!((d.selected, d.time), (Some(3), 14.0));
        // played from there: from the start, as upstream past the end
        let mut d = four();
        d.select(3);
        d.remove(3);
        assert!(d.play());
        assert_eq!(d.time, 0.0);
    }

    #[test]
    fn a_middle_keyframe_deleted_comes_back_as_upstream() {
        let mut d = four();
        d.select(1);
        d.remove(1);
        assert_eq!(times(&d), [0.0, 6.0, 9.0]);
        assert_eq!((d.selected, d.time), (None, 3.0));
        assert!(d.readd.is_none());
        assert_eq!(d.add_key(at(99.0)), Some(1));
        assert_eq!(times(&d), [0.0, 3.0, 6.0, 9.0]);
        assert_eq!(d.track.keys()[1].pose, at(99.0));
    }
}'''

