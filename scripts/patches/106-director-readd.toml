[[patch]]
id = "director-readd-add"
why = "the Add right after the first keyframe's deletion puts it back at the start; any other Add is upstream's"
paths = ["crates/aurora-viewer/src/director.rs"]
op = "literal"
fn = "add_key"
find = '''let on_key = self.track.nearest(self.time, track::MIN_GAP).is_some();
        let index = if !self.track.is_empty() && !on_key && self.time > 0.0 && self.time <= track::MAX_TIME {
            self.track.insert(self.time, pose)
        } else {
            self.track.append(pose)
        }?;'''
replace = '''// aurora-local-patch: director-readd-add
        // right after the first keyframe was deleted, nothing changed since:
        // the new one at the start, the others as much later as they were
        let readd = self
            .readd
            .take()
            .filter(|r| self.time == 0.0 && self.selected.is_none() && r.track == self.track);
        let prepended = readd.and_then(|r| self.track.prepend(pose, r.gap));
        let on_key = self.track.nearest(self.time, track::MIN_GAP).is_some();
        let index = match prepended {
            Some(index) => index,
            None if !self.track.is_empty() && !on_key && self.time > 0.0 && self.time <= track::MAX_TIME => {
                self.track.insert(self.time, pose)?
            }
            None => self.track.append(pose)?,
        };'''

[[patch]]
id = "director-readd-remove"
why = "the first keyframe deleted is remembered for the next Add; the last one deleted leaves the playhead at its time"
paths = ["crates/aurora-viewer/src/director.rs"]
op = "literal"
fn = "remove"
find = '''let before = self.track.keys().get(1).map_or(0.0, |k| k.time);
        self.track.remove(index);
        if index == 0 {
            self.time = (self.time - before).max(0.0);
        }
        self.selected = match self.selected {
            Some(s) if s == index => None,
            Some(s) if s > index => Some(s - 1),
            other => other,
        };
        self.group.retain(|other| *other != index);
        for other in &mut self.group {
            if *other > index {
                *other -= 1;
            }
        }
        self.time = self.time.min(self.track.duration());'''
replace = '''let before = self.track.keys().get(1).map_or(0.0, |k| k.time);
        // aurora-local-patch: director-readd-remove
        let last = index + 1 == self.track.len();
        self.track.remove(index);
        if index == 0 {
            self.time = (self.time - before).max(0.0);
        }
        self.selected = match self.selected {
            Some(s) if s == index => None,
            Some(s) if s > index => Some(s - 1),
            other => other,
        };
        self.group.retain(|other| *other != index);
        for other in &mut self.group {
            if *other > index {
                *other -= 1;
            }
        }
        // the first keyframe gone: the next "Add keyframe" may put one back
        // where it was (`add_key`)
        self.readd = (index == 0 && !self.track.is_empty()).then(|| Readd {
            gap: before,
            track: self.track.clone(),
        });
        // the last one gone: the playhead stays at its time, past the end,
        // so that "Add keyframe" puts the next one there (upstream brought it
        // back to the new end)
        if !last || self.track.is_empty() {
            self.time = self.time.min(self.track.duration());
        }'''

