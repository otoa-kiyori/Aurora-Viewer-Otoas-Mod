[[patch]]
id = "director-readd-path"
why = "a change of the track in the Path section forgets the deleted keyframe, even one undone by hand"
paths = ["crates/aurora-viewer/src/ui/director.rs"]
op = "literal"
fn = "window"
find = '''widgets::collapsing(ui, p, "director_path", aurora_i18n::tr!("director-path"), true, |ui| {
                        path_section(ui, p, d);
                    });'''
replace = '''// aurora-local-patch: director-readd-path
                    let untouched = d.readd.is_some().then(|| d.track.clone());
                    widgets::collapsing(ui, p, "director_path", aurora_i18n::tr!("director-path"), true, |ui| {
                        path_section(ui, p, d);
                    });
                    if untouched.is_some_and(|track| track != d.track) {
                        d.readd = None;
                    }'''

