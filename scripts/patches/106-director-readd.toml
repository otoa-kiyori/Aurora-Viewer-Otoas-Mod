# Director: a keyframe added right after deleting the first or the last one
# goes back where the deleted one was.
#
# Upstream's "Add keyframe" (Director::add_key) inserts at the playhead when
# the playhead is past 0 and not on a keyframe, else appends DEFAULT_GAP
# (3 s) after the last keyframe. Director::remove then leaves two dead ends:
#  - the first keyframe deleted: the track starts again from the next one
#    (Track::tidy), every keyframe moves earlier by the span that was removed
#    and the playhead goes to 0, on the new first keyframe. "Add keyframe"
#    appends at the end, and no keyframe can ever be added before the first
#    (the playhead never goes below 0, a keyframe never passes a neighbour);
#  - the last keyframe deleted: the playhead is brought back to the new end,
#    on the keyframe before, so "Add keyframe" appends 3 s after it, whatever
#    span the deleted one had.
# The Legacy Viewer has no camera path tool to compare with.
#
# This build:
#  - last keyframe deleted (the track still has keyframes): the playhead
#    keeps its time, past the end, so the next "Add keyframe" inserts there
#    and the deleted span comes back. Every other deletion keeps upstream's
#    clamp. A playhead past the end is a state upstream already has (a click
#    after the end of the ruler); its readers: the view (Editing: none, a
#    scrub samples the last keyframe), play() (restarts from 0 when at or
#    past the end), tick (only while playing, after play()), the recorder
#    (goes through play()), the world's playhead dot (drawn only up to the
#    end), the clock (prints the time). The ruler is the one that needed a
#    change: it shows the duration plus 6 s, and a deleted span longer than
#    that put the playhead beyond it, drawn pinned to the right edge; it now
#    also reaches the playhead (only past the usual width, so a click there
#    cannot make it grow).
#  - first keyframe deleted: Director::remove remembers the span that was
#    removed together with the track exactly as the deletion left it
#    (`Readd`). The next "Add keyframe" puts the new keyframe at 0 and moves
#    the others later by that span (Track::prepend), so [0,3,6,9] -> delete
#    the first -> [0,3,6] -> Add -> [new 0, 3, 6, 9]. It does so only while
#    the playhead is at 0, nothing is selected and the track is equal to the
#    one remembered: a later change of the track cannot leave it stale. It is
#    also forgotten by any add or removal, a selection, a scrub, a play, an
#    undo or redo, a load, a clear, a time set on the ruler, and a change made
#    in the Path section (its only controls that edit the track with nothing
#    selected), so that a change undone by hand does not count as none. The
#    new keyframe gets the lock, the selection and the playhead as any other
#    "Add keyframe"; a full track, or one the shift would take past MAX_TIME,
#    falls back to upstream's append. Undo treats it as any other change.
#    A selection deleted together goes through the same removal, the last
#    keyframe first: when it takes the first keyframe, the span remembered
#    is the whole one before the first keyframe kept, and the next "Add
#    keyframe" puts one keyframe back at the start with that span.
#
# Tests: director.rs (the first keyframe back at the start, of four and of
# two, locked and unlocked, and after a selection of the first two deleted
# together; forgotten after a select, a scrub, a load, an undo and redo, an edit
# and a second add; the last keyframe back at its time with its span; the
# middle one as upstream; the limits), and upstream's
# removing_a_keyframe_keeps_the_selection_on_the_same_one adjusted.
# Apply or skip the whole file, not one patch of it.

# --- the track (camera/track.rs)

[[patch]]
