# ------------------------------------------------------------- the filter

[[patch]]
id = "media-filter-switches-fields"
why = "the filter keeps the switches in effect and the URLs Don't ask refused (each told once)"
paths = ["crates/aurora-viewer/src/media/filter.rs"]
op = "literal"
find = "just_denied: HashSet<String>,"
replace = '''just_denied: HashSet<String>,
    // aurora-local-patch: media-filter-switches-fields
    /// "Don't report blocked" in effect (filter_quiet, a local addition).
    quiet: bool,
    /// "Don't ask" in effect (filter_no_ask, a local addition).
    no_ask: bool,
    /// URLs "Don't ask" refused, told once each; emptied whenever the
    /// switch changes. Never an answer: nothing here outlives the switch.
    silenced: HashSet<String>,'''

[[patch]]
id = "media-filter-switches-follow"
why = "the switches follow the settings; Don't ask turned on drops the questions waiting, and either way forgets what it refused"
paths = ["crates/aurora-viewer/src/media/filter.rs"]
op = "literal"
find = "pub fn rules(&self) -> &[Rule] {"
replace = '''// aurora-local-patch: media-filter-switches-follow
    /// The filter's two local switches (Preferences › Media), each in effect
    /// only while the filter is on. "Don't ask" turned on drops the
    /// questions waiting: their media is refused at its next check. Turned
    /// on or off, the sites it refused are forgotten, so that with it off
    /// they are asked about again.
    pub fn follow_settings(&mut self, s: &crate::media::MediaSettings) {
        self.quiet = s.filter && s.filter_quiet;
        let no_ask = s.filter && s.filter_no_ask;
        if no_ask == self.no_ask {
            return;
        }
        self.no_ask = no_ask;
        self.silenced.clear();
        if no_ask && !self.questions.is_empty() {
            log::info!("media filter: {} waiting questions dropped, Don't ask is on", self.questions.len());
            self.questions.clear();
        }
    }

    pub fn rules(&self) -> &[Rule] {'''

[[patch]]
id = "media-filter-switches-tell"
why = "one place tells a refusal in the chat, and stays silent with Don't report blocked"
paths = ["crates/aurora-viewer/src/media/filter.rs"]
op = "literal"
find = "fn decide(&mut self, url: &str, source: Source, ask: bool, notify: bool) -> Verdict {"
replace = '''// aurora-local-patch: media-filter-switches-tell
    /// The chat line of a refusal, unless "Don't report blocked" is on
    /// (filter_quiet): the log line is written by the caller either way.
    fn tell_blocked(&mut self, source: Source, what: String) {
        if self.quiet {
            return;
        }
        self.messages.push(match source {
            Source::Music => aurora_i18n::tr!("media-filter-music-blocked", domain = what),
            _ => aurora_i18n::tr!("media-filter-media-blocked", domain = what),
        });
    }

    fn decide(&mut self, url: &str, source: Source, ask: bool, notify: bool) -> Verdict {'''

[[patch]]
id = "media-filter-switches-quiet-scheme"
why = "a refused scheme (javascript:, file:...) is told through tell_blocked"
paths = ["crates/aurora-viewer/src/media/filter.rs"]
op = "literal"
fn = "refuse_scheme"
find = '''
let what = format!("{scheme}:");
self.messages.push(match source {
    Source::Music => aurora_i18n::tr!("media-filter-music-blocked", domain = what),
    _ => aurora_i18n::tr!("media-filter-media-blocked", domain = what),
});
'''
replace = '''self.tell_blocked(source, format!("{scheme}:")); // aurora-local-patch: media-filter-switches-quiet-scheme'''

[[patch]]
id = "media-filter-switches-quiet-rule"
why = "a site the list or this session refused is told through tell_blocked"
paths = ["crates/aurora-viewer/src/media/filter.rs"]
op = "literal"
fn = "decide"
find = '''
self.messages.push(match source {
    Source::Music => aurora_i18n::tr!("media-filter-music-blocked", domain = host),
    _ => aurora_i18n::tr!("media-filter-media-blocked", domain = host),
});
'''
