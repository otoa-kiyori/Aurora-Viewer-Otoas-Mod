# Two more switches for the media filter, in Preferences > Media, beside
# "Trust my worn items" (behind the filter's cog, greyed while the filter is
# off, and in effect only while it is on):
#
# - "Don't report blocked" (media.filter_quiet, off by default): the filter
#   no longer posts its "... was blocked by the media filter" lines in the
#   chat, neither for a site the list or this session refused nor for a
#   refused scheme (javascript:, file:...). The viewer log still records
#   each refusal. The lines that confirm an answer the resident just gave
#   to the question ("... added to the list") are kept: they are not
#   reports of a block;
# - "Don't ask" (media.filter_no_ask, off by default): where the filter
#   would ask (no rule in the list, no answer this session, not a trusted
#   worn item), it refuses instead, for prim media, parcel media and parcel
#   music alike. Nothing is kept: no rule, no session answer. The URLs it
#   refused are only remembered so that each is told once (following
#   "Don't report blocked"); that memory is emptied whenever the switch
#   changes, so with it off again an unknown site is asked about as before
#   (once its media is wanted again: a refused media is no longer wanted,
#   like after any refusal). Turned on, the questions already waiting are
#   dropped: their media is refused at its next check, and the question
#   (a banner since upstream #3063) never shows while it is on. Allow rules, block rules and "Trust
#   my worn items" work as they do today.
#
# Both are local additions: the Legacy Viewer has neither (MediaEnableFilter
# and its alerts only, llviewerparcelmedia.cpp). They only ever refuse more
# or tell less, never let more through.
#
# Apply or skip the whole file, not one patch of it.

# ---------------------------------------------------------------- settings

[[patch]]
id = "media-filter-switches-settings"
why = "the two switches in settings.json; MediaSettings is serde(default), so older files read them as off"
paths = ["crates/aurora-viewer/src/media/mod.rs"]
op = "literal"
find = "pub filter_trust_own_worn: bool,"
replace = '''pub filter_trust_own_worn: bool,
    // aurora-local-patch: media-filter-switches-settings
    /// Local addition (local patch set): the filter's refusals are not told
    /// in the chat, only written to the log. Off by default.
    pub filter_quiet: bool,
    /// Local addition (local patch set): a site with no answer is refused
    /// instead of asked about, and nothing is added to the list or kept for
    /// the session, so it is asked about again once this is off. Allow
    /// rules and trusted worn items still load. Off by default.
    pub filter_no_ask: bool,'''

[[patch]]
id = "media-filter-switches-defaults"
why = "goes with media-filter-switches-settings: both off by default, the filter behaves as upstream's"
