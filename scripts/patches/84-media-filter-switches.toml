[[patch]]
id = "media-filter-switches-no-ask"
why = "Don't ask: where the question would be asked, the site is refused, told once per URL, and nothing is kept"
paths = ["crates/aurora-viewer/src/media/filter.rs"]
op = "literal"
fn = "decide"
find = "None if !ask => Verdict::Allow,"
replace = '''None if !ask => Verdict::Allow,
            // aurora-local-patch: media-filter-switches-no-ask
            // "Don't ask": refused without a question, kept in no list and
            // as no answer of the session; told once per URL
            None if self.no_ask => {
                if self.silenced.insert(url.to_string()) {
                    log::info!("media filter: {host} blocked without asking");
                    self.tell_blocked(source, host);
                }
                Verdict::Deny
            }'''

