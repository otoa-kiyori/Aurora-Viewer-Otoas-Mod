# ------------------------------------------------------------------- tests

[[patch]]
id = "media-filter-switches-test"
why = "Don't report blocked silences every refusal line; Don't ask refuses unknown sites without a rule or a session answer, tells each once, leaves allow rules, block rules and trusted worn items alone, and asks again once off"
paths = ["crates/aurora-viewer/src/media/filter.rs"]
op = "literal"
find = '''
#[test]
fn questions_nothing_asks_for_go_away() {
'''
replace = '''// aurora-local-patch: media-filter-switches-test
    fn switches(quiet: bool, no_ask: bool) -> crate::media::MediaSettings {
        crate::media::MediaSettings {
            filter_quiet: quiet,
            filter_no_ask: no_ask,
            ..crate::media::MediaSettings::default()
        }
    }

    #[test]
    fn dont_report_blocked_tells_no_refusal() {
        let mut f = MediaFilter::default();
        f.follow_settings(&switches(true, false));
        f.apply(Edit::Set("b.example".into(), Action::Deny));
        assert_eq!(f.check("http://b.example/", Source::ParcelMedia), Verdict::Deny);
        assert_eq!(f.check_trusted("http://b.example/", Source::PrimMedia), Verdict::Deny);
        assert_eq!(f.check("http://b.example/live", Source::Music), Verdict::Deny);
        assert_eq!(f.check("javascript:alert(1)", Source::PrimMedia), Verdict::Deny);
        assert!(f.refuse_scheme("file:///x", Source::Music));
        assert!(f.messages.is_empty());
        // unknown sites are still asked about
        assert_eq!(f.check("http://a.example/", Source::PrimMedia), Verdict::Ask);
        assert!(f.question().is_some());
        // the filter off: the switch is greyed and does nothing
        f.follow_settings(&crate::media::MediaSettings {
            filter: false,
            ..switches(true, false)
        });
        assert!(f.refuse_scheme("file:///x", Source::PrimMedia));
        assert_eq!(f.messages.len(), 1);
    }

    #[test]
    fn dont_ask_refuses_unknown_sites_and_keeps_nothing() {
        let mut f = MediaFilter::default();
        // a question waiting when the switch is turned on goes
        assert_eq!(f.check("http://w.example/", Source::ParcelMedia), Verdict::Ask);
        f.follow_settings(&switches(false, true));
        assert!(f.question().is_none());
        assert_eq!(f.check("http://w.example/", Source::ParcelMedia), Verdict::Deny);
        assert_eq!(f.check("http://a.example/1", Source::PrimMedia), Verdict::Deny);
        assert_eq!(f.check("http://a.example/1", Source::PrimMedia), Verdict::Deny);
        assert_eq!(f.check("http://r.example/live", Source::Music), Verdict::Deny);
        assert!(f.question().is_none());
        assert!(f.rules.is_empty() && f.session.is_empty(), "nothing kept");
        assert_eq!(f.messages.len(), 3, "told once per URL");
        // allow rules, block rules and trusted worn items as before
        f.apply(Edit::Set("ok.example".into(), Action::Allow));
        f.apply(Edit::Set("no.example".into(), Action::Deny));
        assert_eq!(f.check("http://ok.example/", Source::ParcelMedia), Verdict::Allow);
        assert_eq!(f.check("http://ok.example/live", Source::Music), Verdict::Allow);
        assert_eq!(f.check_trusted("http://worn.example/", Source::PrimMedia), Verdict::Allow);
        assert_eq!(f.check_trusted("http://no.example/", Source::PrimMedia), Verdict::Deny);
        assert_eq!(f.check("http://no.example/", Source::ParcelMedia), Verdict::Deny);
        assert_eq!(f.messages.len(), 5, "a block rule is told as before");
        // with Don't report blocked too, nothing is told
        f.follow_settings(&switches(true, true));
        assert_eq!(f.check("http://q.example/", Source::PrimMedia), Verdict::Deny);
        assert_eq!(f.check("http://no.example/", Source::ParcelMedia), Verdict::Deny);
        assert_eq!(f.messages.len(), 5);
        // turned off: the same sites are asked about again
        f.follow_settings(&switches(false, false));
        assert_eq!(f.check("http://a.example/1", Source::PrimMedia), Verdict::Ask);
        assert_eq!(f.check("http://w.example/", Source::ParcelMedia), Verdict::Ask);
        assert_eq!(f.check("http://r.example/live", Source::Music), Verdict::Ask);
        assert_eq!(f.question().map(|q| q.domain.as_str()), Some("a.example"));
        // on again: told again once, the waiting questions go
        f.follow_settings(&switches(false, true));
        assert!(f.question().is_none());
        assert_eq!(f.check("http://a.example/1", Source::PrimMedia), Verdict::Deny);
        assert_eq!(f.check("http://a.example/1", Source::PrimMedia), Verdict::Deny);
        assert_eq!(f.messages.len(), 6);
        // the filter off makes the switch do nothing: with the filter on
        // again the site is refused without a question once more
        f.follow_settings(&crate::media::MediaSettings {
            filter: false,
            ..switches(false, true)
        });
        assert_eq!(f.check("http://z.example/", Source::PrimMedia), Verdict::Ask);
        f.follow_settings(&switches(false, true));
        assert!(f.question().is_none());
        assert_eq!(f.check("http://z.example/", Source::PrimMedia), Verdict::Deny);
    }

    #[test]
    fn questions_nothing_asks_for_go_away() {'''

[[patch]]
id = "media-filter-switches-test-apply"
why = "the media update follows the switches: with Don't ask and Don't report blocked, an unknown parcel media is refused with no question, no chat line and no rule"
paths = ["crates/aurora-viewer/src/media/update.rs"]
op = "literal"
find = '''
mod tests {
    use super::*;
    use std::sync::Arc;
'''
replace = '''mod tests {
    use super::*;
    use std::sync::Arc;

    // aurora-local-patch: media-filter-switches-test-apply
    #[test]
    fn dont_ask_refuses_media_with_no_question_nor_rule() {
        let mut w = World::new(Arc::new(crate::scene::avatar::AvatarLibrary::load()));
        let mut m = MediaManager::default();
        let mut parcel = MediaImpl::new(MediaKey::Parcel, "https://media.example.invalid/".into(), "text/html".into());
        parcel.wanted = true;
        m.impls.push(parcel);
        let view = CullView::new(Mat4::IDENTITY, Vec3::ZERO, 720.0, 1.0);
        let settings = MediaSettings {
            filter_quiet: true,
            filter_no_ask: true,
            ..MediaSettings::default()
        };
        let f = MediaFrame {
            view: &view,
            camera: Vec3::ZERO,
            settings: &settings,
            autoplay: true,
            channel_volume: 1.0,
            agent_speed: 0.0,
            window_focused: true,
            gaming_mode: false,
            net: None,
            cache_dir: std::path::Path::new(""),
            language: "en",
        };
        m.apply_filter(&mut w, &f);
        assert!(!m.impls[0].wanted && !m.impls[0].filter_hold);
        assert!(w.media_filter.question().is_none());
        assert!(w.media_filter.messages.is_empty());
        assert!(w.media_filter.rules().is_empty());
    }'''
