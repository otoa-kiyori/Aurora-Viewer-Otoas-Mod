[[patch]]
id = "shader-look-encode"
why = "encode keeps its signature and calls encode_chained, which takes the closure that draws the chain"
paths = ["crates/aurora-render/src/looks.rs"]
op = "literal"
find = """pub(crate) fn encode(
        &self,
        device: &wgpu::Device,
        queue: &wgpu::Queue,
        encoder: &mut wgpu::CommandEncoder,
        look: &PhotoLook,
        target: &wgpu::TextureView,
        depth: Option<LookDepth>,
    ) -> u32 {"""
replace = """// (the renderer calls `encode_chained`; the tests this)
    #[cfg_attr(not(test), allow(dead_code))]
    pub(crate) fn encode(
        &self,
        device: &wgpu::Device,
        queue: &wgpu::Queue,
        encoder: &mut wgpu::CommandEncoder,
        look: &PhotoLook,
        target: &wgpu::TextureView,
        depth: Option<LookDepth>,
    ) -> u32 {
        // aurora-local-patch: shader-look-encode
        self.encode_chained(device, queue, encoder, look, target, depth, None)
    }

    /// [`Self::encode`], with aurora-shader's chain drawn by `chain` at the
    /// place of its layer (`LookOp::UserChain`, `user_chain.rs`).
    #[allow(clippy::too_many_arguments)]
    pub(crate) fn encode_chained(
        &self,
        device: &wgpu::Device,
        queue: &wgpu::Queue,
        encoder: &mut wgpu::CommandEncoder,
        look: &PhotoLook,
        target: &wgpu::TextureView,
        depth: Option<LookDepth>,
        mut chain: Option<&mut UserChain<'_>>,
    ) -> u32 {"""

[[patch]]
id = "shader-look-pad"
why = "the chain first: a plain layer before it, so that it reads the looks' 8-bit image, never the frame's input"
paths = ["crates/aurora-render/src/looks.rs"]
op = "literal"
fn = "encode_chained"
find = "let layers = &look.layers[..look.layers.len().min(MAX_LAYERS)];"
replace = """let layers = &look.layers[..look.layers.len().min(MAX_LAYERS)];
        // aurora-local-patch: shader-look-pad
        // "Otoa's Shader" first: a plain layer before it (user_chain.rs)
        let padded = user_chain::padded(layers);
        let layers = padded.as_deref().unwrap_or(layers);
        // one chain a frame
        let mut chain_drawn = false;"""

[[patch]]
id = "shader-look-draw"
why = "the chain's layer: its pass reads the chain's result, drawn from the image the layers before left"
paths = ["crates/aurora-render/src/looks.rs"]
op = "literal"
fn = "encode_chained"
find = "let src = if at.local == 0 { layer_input } else { &t.inter[(at.local - 1) % 2] };"
replace = """let src = if at.local == 0 { layer_input } else { &t.inter[(at.local - 1) % 2] };
            // aurora-local-patch: shader-look-draw
            // "Otoa's Shader": the chain from the image the layers before
            // left (never the first layer: `user_chain::padded`)
            let chained = match chain.as_deref_mut() {
                Some(draw) if l > 0 && at.local == 0 && !chain_drawn && user_chain::draws(&layers[l]) => {
                    chain_drawn = true;
                    draw(&mut *encoder, layer_input)
                }
                _ => None,
            };
            let src = chained.as_ref().unwrap_or(src);"""

# --- the renderer: where the chain runs (on 50's A4 and A5)

[[patch]]
id = "shader-look-context"
why = "the look in the frame's stack: the chain's place is the layer's, with the AA finish of that place"
paths = ["crates/aurora-render/src/**/*.rs"]
op = "literal"
fn = "render_view"
find = """let user_context = crate::user_post::Context {
            photo: snapshot.is_some(),
            vr_eye: self.external,
            aa: crate::user_post::ChainAa::for_setting(self.settings.aa, self.msaa_samples, snapshot.is_some()),
        };"""
replace = """// aurora-local-patch: shader-look-context
        // "Otoa's Shader" in the photo's looks (52-shader-photo-look): the
        // chain draws at that layer's place, after the anti-aliasing, and
        // not here (as long as the looks have their images this frame)
        let user_layer = looks.is_some() && look.is_some_and(crate::looks::has_user_chain);
        let user_context = crate::user_post::Context {
            photo: snapshot.is_some(),
            vr_eye: self.external,
            aa: if user_layer {
                crate::user_post::ChainAa::for_layer(self.settings.aa, self.msaa_samples, snapshot.is_some())
            } else {
                crate::user_post::ChainAa::for_setting(self.settings.aa, self.msaa_samples, snapshot.is_some())
            },
        };"""

[[patch]]
id = "shader-look-prepare"
why = "prepared for the layer's place: the post pass and SMAA then keep their targets"
paths = ["crates/aurora-render/src/**/*.rs"]
op = "literal"
fn = "render_view"
find = "let user_on = self.user_post.prepare(&self.device, user_format, post_size, user_context);"
replace = """// aurora-local-patch: shader-look-prepare
        let user_ready = self
            .user_post
            .prepare_for(&self.device, user_format, post_size, user_context, user_layer);
        // (at the look's place the post pass, its FXAA and SMAA are as without the chain)
        let user_on = user_ready && !user_layer;"""

[[patch]]
id = "shader-look-frame"
why = "the chain's frame inputs built for both places: the slot, or the look's (below)"
paths = ["crates/aurora-render/src/**/*.rs"]
op = "regex"
fn = "render_view"
dotall = true
pattern = '''^([ \t]*)if user_on \{\n([ \t]*)let frame = crate::user_post::FrameInputs \{\n(.*?)\n([ \t]*)\};\n([ \t]*)// under SMAA the chain writes SMAA's input, which SMAA reads below\n([ \t]*)let chain_out = ([^\n]*);\n([ \t]*)let passes = self\.user_post\.encode\(&self\.device, &self\.queue, &mut encoder, &frame, chain_out\);\n'''
replace = '''\1// aurora-local-patch: shader-look-frame
\1// (also for the chain at its photo look's place, below)
\1let user_frame = {
\2let frame = crate::user_post::FrameInputs {
\3
\4};
\4user_ready.then_some(frame)
\1};
\1if user_on && let Some(frame) = &user_frame {
\5// under SMAA the chain writes SMAA's input, which SMAA reads below
\6let chain_out = \7;
\8let passes = self.user_post.encode(&self.device, &self.queue, &mut encoder, frame, chain_out);
'''

[[patch]]
id = "shader-look-encode-call"
why = "the looks draw the chain at its layer's place, with the frame's inputs"
paths = ["crates/aurora-render/src/**/*.rs"]
op = "literal"
fn = "render_view"
find = "let passes = looks.encode(&self.device, &self.queue, &mut encoder, look, scene_target, Some(depth));"
replace = """// aurora-local-patch: shader-look-encode-call
                // "Otoa's Shader": aurora-shader's chain at its layer's place
                // (52-shader-photo-look), with the inputs built for its slot
                let user_post = &mut self.user_post;
                let (device, queue) = (&self.device, &self.queue);
                let mut chain = |encoder: &mut wgpu::CommandEncoder, input: &wgpu::TextureView| {
                    let frame = user_frame.as_ref().filter(|_| user_layer)?;
                    let (view, passes) = user_post.encode_layer(device, queue, encoder, frame, input)?;
                    calls.set(calls.get() + passes);
                    Some(view)
                };
                let passes = looks.encode_chained(device, queue, &mut encoder, look, scene_target, Some(depth), Some(&mut chain));"""

