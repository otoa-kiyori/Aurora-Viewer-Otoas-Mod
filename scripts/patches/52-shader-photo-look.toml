# "Otoa's Shader" as a photo look: aurora-shader's whole effect chain becomes
# one look of the photo's look stack, the last of the Creative section of
# Aurora's looks, so it can be ticked, given a strength and moved among the
# other looks like any of them.
#
# Needs 50-aurora-shader (the host, user_post.rs: Place, prepare_for,
# encode_layer, ChainAa::for_layer; and the renderer slot it patches, A4 and
# A5, which these patches change: hence 52, which applies after 50 and 51,
# the manifests going by file name) and 51-aurora-shader-prefs (the page its
# settings area opens, aurora_shader::request_open and ICON). Skip all of 52
# together: the look, its operation and the renderer's use of it go with one
# another. Without it the frame is exactly 50's.
#
# Design (the look renderer is upstream's, unchanged but for two hooks):
# - The layer is one operation, LookOp::UserChain (looks.rs); the viewer's
#   resolve gives it only while aurora-shader is installed (the rule of the
#   Preferences page and toolbar button: the folder has a config.toml), so
#   without it the lists are upstream's and a saved layer is an unknown look
#   (named "No filter", not drawn). Master switch off: listed, draws nothing
#   (as a table whose file is missing), its settings area says so.
# - Where: Looks::encode becomes encode_chained(.., chain), `encode` its
#   wrapper. At the chain layer's one pass the caller's closure runs the whole
#   chain (UserPost::encode_layer: every enabled effect of config.toml in its
#   order, with their parameters) from the image the layers before left (the
#   looks' 8-bit gamma-encoded Rgba8Unorm, which is what the chain already
#   reads under SMAA and between its effects) into the chain's own image of
#   its usual format; the pass, an identity, lays that over its input at the
#   layer's strength (0: unchanged, 1: full) and hands it to the later layers.
#   The comparison line and the photo's coverage come, as for every look,
#   from the scene before the first layer. A chain asked first gets a plain
#   layer in front (looks/user_chain.rs `padded`): it never reads the frame's
#   own input, which can be sRGB.
# - Never twice: with the layer in the stack and ticked (and the look's
#   images there), user_post::place() says Layer: the post pass and SMAA
#   keep their targets, the chain does not run at its slot, and it runs at
#   the layer's place on the live view of the photo mode and on the photo,
#   whatever `[host] photos` says (it was asked for as a look). Without the
#   layer, or ticked off, the frame is 50's (photos follow `photos`); outside
#   the photo mode nothing changes. One chain a frame: a second "Otoa's
#   Shader" layer leaves the image as it is (one history, one set of frame
#   uniforms).
# - Depth and normals: the same FrameInputs as at the slot, built in the same
#   place (post_depth at the chain's size, FSR's display depth when it
#   upscales; GTAO's mesh normals; the water surface; the photo's tile and
#   pixel scale; the jitter), so ink lines see the same scene, on tiled and
#   high-resolution photos too. The looks and the chain both work at
#   post_size.
# - AA (ChainAa::for_layer): the image there is already anti-aliased by the
#   frame's own AA and may carry earlier looks (grain, blur), so it is never
#   smoothed again as a whole: SMAA, FXAA and MSAA give the masked FXAA
#   (only the chain's own sharp changes). Under TAA and FSR the effects
#   still read the jittered depth, so on the live view the chain's change is
#   resolved over the frames as at its slot (ChainAa::Temporal, its history
#   keyed to the place too); a photo is one frame: the masked FXAA. AA off,
#   or an MSAA the GPU lacks: none.
# - The Photo window's, the viewfinder's and the Director's Filters tab's
#   looks editor (all use ui/looks_editor.rs, both interface styles): the
#   Director's films can take the look too. The entry and the strength, then a note
#   and "Open Otoa's Shader" (Preferences on the page, as the toolbar button
#   does); the chain's content and parameters stay there. The editor edits a
#   `Stack` (upstream's), so the World filters window (`ui/world_look.rs`,
#   the world's own stack, off by default) lists the look too: there the
#   chain draws at its layer's place on the live 3D view instead of at its
#   slot, still once a frame.
# - Demo: AURORA_DEMO_PHOTO_LOOK takes `aurora:otoa-shader` and a new `off`
#   token (the last layer ticked off), docs/TESTING.md.

