# SpaceMouse on Linux without a udev rule.
#
# The joystick worker reads 3D mice only through hidapi (hidraw). /dev/hidraw*
# is root-only by default, so with the input on the open fails with EACCES and
# the snapshot drops the mouse: the choice looks lost. The same mouse has an
# input node the seat's user can already read, and gilrs already opens it.
#
# 1. When hidraw cannot be opened, read the mouse's own input node instead.
# 2. A mouse nothing can open stays listed, after the working devices, so a
#    selection survives and the existing error line says why.
# 3. The persisted id hashes the HID port, not the hidrawN number that shifts
#    with each replug.
#
# Windows and macOS keep their behaviour: all of it is behind
# cfg(target_os = "linux").

[[patch]]
id = "spacemouse-hid-field"
why = "a 3D mouse can be read through its input node"
paths = ["crates/aurora-viewer/src/**/*.rs"]
op = "literal"
find = "axis_at: [Instant; 2],"
replace = '''axis_at: [Instant; 2],
    // aurora-local-patch: spacemouse-hid-field
    /// Its input node, read when hidraw is denied.
    #[cfg(target_os = "linux")]
    evdev: Option<evdev::Reader>,'''

