# A minimized or hidden window is not a graphics card that stopped answering.
#
# On KDE Plasma Wayland with an NVIDIA card and vsync on (Fifo), minimizing the
# viewer brought up "the graphics card is not responding" after 6 s. The
# compositor sends no frame callbacks to a hidden surface, and the driver's
# vkQueuePresentKHR waits for the next one inside wl_display_dispatch_queue
# (the render thread's stack in gpu-stall.txt: Backend::render_view ->
# Queue::present -> libGLX_nvidia -> libnvidia-glcore -> libwayland-client)
# for as long as the window stays hidden. The stall watch (main_thread.rs
# `render_thread_free` / `stalled_for`, shown by app/gpu_stall.rs) only
# knows the render thread kept its frame past 2 s, and counted it as a GPU
# hang. winit 0.30 cannot tell a Wayland client it is minimized
# (`is_minimized` is None, no `Occluded` event), so the viewer cannot just
# stop drawing as the Legacy Viewer does (llviewerdisplay.cpp `display`).
#
# Here the render thread notes when it is inside `present`, and whether the
# GPU had finished every frame before the presented one when it began (a
# bounded wait, GPU_WAIT, on the render thread just before the present).
# A frame kept inside `present` with the GPU caught up while the window is
# not in front (unfocused, minimized or occluded) is the compositor's: the
# drawing pauses, the main loop goes on as during a stall (world, network,
# sound, 20 frames a second), no notice, no "GPU stall" in the crash
# session. Everything else still counts as before: a wait outside present
# (acquire, fences), a present begun with the GPU behind, and a present
# that keeps the frame once the window is in front again, counted from
# then (files/minimize-stall/present_watch.rs, with tests).
#
# Apply or skip the whole file, not one patch of it. Drop it once upstream
# stops counting a hidden window's present as a GPU stall.

[[patch]]
id = "minimize-stall-module"
why = "the present watch and the pure rules that excuse a hidden window's present, with tests"
op = "add_file"
paths = ["crates/aurora-render/src/present_watch.rs"]
source = "files/minimize-stall/present_watch.rs"

[[patch]]
id = "minimize-stall-mod"
why = "declare the module beside the presentation one"
paths = ["crates/aurora-render/src/lib.rs"]
op = "literal"
find = "pub mod present;"
replace = """pub mod present;
mod present_watch; // aurora-local-patch: minimize-stall-mod"""

[[patch]]
id = "minimize-stall-watch-field"
why = "the watch travels with the frames' GPU news, shared by the render thread and the main thread"
paths = ["crates/aurora-render/src/pacing.rs"]
op = "literal"
find = """finished: Mutex<Option<u64>>,
    news: Condvar,
}"""
replace = """finished: Mutex<Option<u64>>,
    news: Condvar,
    /// The render thread inside `present`, and whether the GPU was caught
    /// up then (present_watch.rs).
    // aurora-local-patch: minimize-stall-watch-field
    pub(crate) present: crate::present_watch::PresentWatch,
}"""

[[patch]]
id = "minimize-stall-watch-new"
