[[patch]]
id = "minimize-stall-earlier-done"
why = "the bounded wait for the frames before the one presented, on the render thread"
paths = ["crates/aurora-render/src/renderer.rs"]
op = "literal"
find = """/// Frame pacing (pacing.rs), once frame `frame` is presented: wait, at"""
replace = """/// Whether the GPU has finished every frame before `frame`, waiting at
    /// most [`crate::main_thread::GPU_WAIT`]: asked right before `frame` is
    /// presented, so that a present that then waits is known not to wait
    /// for our own work (present_watch.rs). Only the frames before: the one
    /// presented is already submitted, the GPU keeps drawing meanwhile.
    /// Done here, on the thread that submits and presents (a wait on the
    /// device holds its locks).
    // aurora-local-patch: minimize-stall-earlier-done
    fn earlier_frames_done(&self, frame: u64) -> bool {
        let Some(index) = self.gpu_frames.before(frame) else {
            return !self.lost.get();
        };
        let wait = wgpu::PollType::Wait {
            submission_index: Some(index),
            timeout: Some(crate::main_thread::GPU_WAIT),
        };
        matches!(self.lost.poll_with(&self.device, wait), Some(Ok(_)))
    }

    /// Frame pacing (pacing.rs), once frame `frame` is presented: wait, at"""

[[patch]]
id = "minimize-stall-fields"
why = "the renderer's side: a hold excused as the compositor's, and whether the window is in front"
paths = ["crates/aurora-render/src/main_thread.rs"]
op = "literal"
find = """stalled: bool,"""
replace = """stalled: bool,
    // aurora-local-patch: minimize-stall-fields
    /// The frame held is the compositor's (a hidden window, present_watch.rs):
    /// drawing paused, no GPU stall.
    paused: bool,
    /// The stall of the frame held is in the log.
    stall_logged: bool,
    /// When the frame held was last the compositor's: a hold that goes on
    /// once the window is in front again counts from then.
    excused_at: Option<Instant>,
    /// Focused, not minimized nor hidden (`set_in_front`, each frame).
    in_front: bool,"""

[[patch]]
id = "minimize-stall-init"
why = "start in front, nothing held"
paths = ["crates/aurora-render/src/main_thread.rs"]
op = "literal"
find = """stalled: false,"""
replace = """stalled: false,
            // aurora-local-patch: minimize-stall-init
