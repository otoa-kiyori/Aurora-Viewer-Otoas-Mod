[[patch]]
id = "minimize-stall-stalled-for"
why = "a frame the compositor keeps is no GPU stall; one kept on once the window is back counts from then"
paths = ["crates/aurora-render/src/main_thread.rs"]
op = "replace_fn_body"
fn = "stalled_for"
impl = "Renderer"
expect_sig = 'pub fn stalled_for\(&self\) -> Option<Duration>'
body = '''
let Host::Thread { owner, .. } = &self.host else {
    return None;
};
// a hidden window's present: the compositor's, not the GPU's (present_watch.rs)
if !self.stalled || self.compositor_holds() {
    return None;
}
let held = owner.held_for()?;
// (past STALL_AFTER only, as before: the main thread may stop waiting sooner)
let counted = crate::present_watch::counted_stall(held, self.excused_at.map(|at| at.elapsed()));
(counted >= STALL_AFTER).then_some(counted)
'''

[[patch]]
id = "minimize-stall-api"
why = "the app says whether the window is in front; the paused drawing is told apart from a stall"
paths = ["crates/aurora-render/src/main_thread.rs"]
op = "literal"
find = """/// Before a frame is built: wait for the render thread to be free, at"""
replace = """/// Whether the window is in front: focused, not minimized nor hidden
    /// (the app, each frame). A frame the compositor keeps is only excused
    /// when it is not (present_watch.rs).
    // aurora-local-patch: minimize-stall-api
    pub fn set_in_front(&mut self, in_front: bool) {
        self.in_front = in_front;
    }

    /// The drawing is paused because the compositor takes no image (a
    /// minimized or hidden window): no GPU stall, but nothing is drawn.
    pub fn presentation_paused(&self) -> bool {
        self.stalled && self.compositor_holds()
    }

    /// The render thread is inside `present`, the GPU caught up, the window
    /// not in front, for long enough (present_watch.rs).
    fn compositor_holds(&self) -> bool {
        crate::present_watch::compositor_holds(self.gpu_frames.present.compositor_wait(), self.in_front)
    }

    /// Before a frame is built: wait for the render thread to be free, at"""

[[patch]]
id = "minimize-stall-free"
why = "stop waiting as soon as the compositor is known to keep the frame, and log a pause as a pause, not a stall"
paths = ["crates/aurora-render/src/main_thread.rs"]
op = "replace_fn_body"
fn = "render_thread_free"
impl = "Renderer"
expect_sig = 'fn render_thread_free\(&mut self\) -> bool'
body = '''
let Host::Thread { owner, .. } = &self.host else {
    return true;
};
// in short steps: a present that waits with the GPU caught up (a hidden
// window) is known within COMPOSITOR_WAIT, the main loop need not wait the
// whole STALL_AFTER; its events (the focus leaving) come first, the next
// frame decides whether the compositor keeps the frame
let wait = if self.stalled { STALL_POLL } else { STALL_AFTER };
let deadline = Instant::now() + wait;
let free = loop {
    match owner.wait_until_free((Instant::now() + STALL_POLL).min(deadline)) {
        Ok(true) => break true,
        Ok(false) => {
            let waits = crate::present_watch::present_waits(self.gpu_frames.present.compositor_wait());
            if waits || Instant::now() >= deadline {
                break false;
            }
        }
        Err(_) => {
            self.fail();
            return false;
        }
    }
};
if free {
    // (a hold that never reached STALL_AFTER nor a pause logs nothing)
    if std::mem::take(&mut self.stalled) {
        if self.stall_logged {
            log::warn!("the graphics card finished its frame again: drawing resumes");
        } else if self.paused {
            log::info!("the window takes images again: drawing resumes");
        }
    }
    self.paused = false;
    self.stall_logged = false;
    self.excused_at = None;
    return true;
}
self.stalled = true;
let held = owner.held_for().unwrap_or(wait);
if self.compositor_holds() {
    self.excused_at = Some(Instant::now());
    if !std::mem::replace(&mut self.paused, true) {
        log::info!(
            "the window is not shown, the compositor takes no image ({held:?} in present, the GPU done): drawing paused, the world goes on"
        );
    }
} else if !self.stall_logged {
    let counted = crate::present_watch::counted_stall(held, self.excused_at.map(|at| at.elapsed()));
    if counted >= STALL_AFTER {
        self.stall_logged = true;
        log::warn!("the graphics card has not finished a frame for {counted:?}: frames wait, the window keeps answering");
    }
}
false
'''

[[patch]]
id = "minimize-stall-in-front"
why = "tell the renderer each frame whether the window is in front"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = """self.scene.textures.set_window_state(focused, minimized);"""
replace = """self.scene.textures.set_window_state(focused, minimized);
        // a hidden window's present is the compositor's, not a GPU stall
        // (aurora-render present_watch.rs); `focused` and `minimized` are
        // upstream's effective state (a VR headset presenting counts as in
        // front)
        // aurora-local-patch: minimize-stall-in-front
        let in_front = focused && !minimized && !self.occluded;
        if let Some(g) = &mut self.gfx {
            g.renderer.set_in_front(in_front);
        }"""

[[patch]]
id = "minimize-stall-exit"
why = "a paused drawing cannot show the exit prompt either: the close button closes, as during a stall"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
fn = "request_exit"
find = """.is_some_and(|g| g.renderer.stalled_for().is_some() || g.renderer.device_lost())"""
replace = """// aurora-local-patch: minimize-stall-exit
            .is_some_and(|g| g.renderer.stalled_for().is_some() || g.renderer.presentation_paused() || g.renderer.device_lost())"""
