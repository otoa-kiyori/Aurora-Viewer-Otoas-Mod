replace = """news: Condvar::new(),
            present: Default::default(), // aurora-local-patch: minimize-stall-watch-new"""

[[patch]]
id = "minimize-stall-present"
why = "note the present and whether the GPU had finished the frames before it (the world frame's present)"
paths = ["crates/aurora-render/src/renderer.rs"]
op = "literal"
fn = "render_view"
find = """if let FrameTarget::Surface(t) = surface_tex {
            self.queue.present(t);
            stats.presented = true;
            stats.input_ms"""
replace = """if let FrameTarget::Surface(t) = surface_tex {
            // aurora-local-patch: minimize-stall-present
            // a present that then waits with the GPU caught up is the
            // compositor's (a hidden window), not a GPU stall: present_watch.rs
            let gpu_done = self.earlier_frames_done(index);
            self.gpu_frames.present.enter(gpu_done);
            self.queue.present(t);
            self.gpu_frames.present.leave();
            stats.presented = true;
            stats.input_ms"""

[[patch]]
id = "minimize-stall-present-alone"
