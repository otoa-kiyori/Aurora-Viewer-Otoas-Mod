# A motion the simulator signals again while it plays keeps playing, like the
# Legacy Viewer's LLMotionController::startMotion
# (indra/llcharacter/llmotioncontroller.cpp).
#
# A mesh head's expression HUD plays Bento face animations through the head's
# script, and the same script (or another one) plays some animations again and
# again: the simulator sends a new sequence id for them every few seconds
# (LLVOAvatar::processAnimationStateChanges then calls startMotion). Aurora
# kept a re-signalled loop, but stopped a re-signalled one-shot and started a
# fresh instance first in the motion list: newest, it took the shared face
# joints back from an expression of the same priority started after it (the
# blender ranks equal priorities newest first). The Legacy Viewer replaces the
# instance only while it blends (LLMotion::isBlending: easing in or out) or has
# a stop time, unless the character is paused; otherwise "if the motion is
# already active and allows deprecation, then let it keep playing": same clock,
# same place. An expression (LLEmote::canDeprecate is false) always restarts; a
# finished one-shot starts again. Upstream issue #2898 ("Cant use Lelutka axis
# face hud") has the same symptom.
#
# Kept as Aurora does: a re-signalled loop with the same continuous start is
# kept even while it eases in (the Legacy Viewer would replace it), and a
# motion already easing out during a pause gets a new instance (the Legacy
# Viewer would keep the fading one and lose the new start).
#
# A non-looping animation of 0 s (a one-frame pose, as many Bento face
# expressions are) ends itself, as in the Legacy Viewer: LLKeyframeMotion::
# onUpdate returns false once its time passes its 0 s duration, and
# LLMotionController::updateMotionsByType stops it and asks the simulator to
# stop it. Upstream now ends such a pose itself in Controller::sync, once its
# start (Motion::activation) has passed. What stays ours: the pose ends at the
# sync after the one that put it in (Motion::inserted,
# Motion::zero_duration_ended), so it is always drawn once, even when its
# signalled start lies before that sync in synchronized mode (upstream would
# stop it at the very sync that inserts it, before it is drawn); and a
# re-signalled pose that has been drawn counts as ended (the rule above), so
# a clicked expression starts again in front. Its pose is held where no other
# motion drives the joints. 0 s loops are unchanged.
#
# The one-shot's timed stop moves into Motion::one_shot_end, used by the
# weight pass and by the new rule. Tests: files/anim-restart-legacy/.
# Demo: AURORA_DEMO_EMOTE=<expression>,self,pose plays the carrier as a 0 s
# one-shot on our own avatar: one "own animation timed stop" log line a round.
# Retire this whole file once upstream ports the rule: its patches then report
# DRIFT or ALREADY. Apply or skip the whole file, not one patch of it.

[[patch]]
id = "anim-restart-legacy-motion"
why = "Motion::one_shot_end (the timed stop) and Motion::keeps_playing_when_resignalled (the startMotion rule)"
paths = ["crates/aurora-viewer/src/scene/anim.rs"]
op = "literal"
find = "fn stop_at(&mut self, now: Instant) {"
replace = """// aurora-local-patch: anim-restart-legacy-motion
    /// When a one-shot stops itself (mSendStopTimestamp,
    /// LLMotionController::activateMotionInstance): at its ease-out, or at
    /// its authored end when the ease-out would fall inside the ease-in:
    /// LLMotionController::updateMotionsByType requests no timed stop during
    /// ease-in, LLKeyframeMotion::onUpdate runs to the end instead (the stock
    /// pre-jump lasts 0.333333 s, not 0.133333 s, #1637). None for a loop.
    fn one_shot_end(&self) -> Option<Instant> {
        let a = &self.anim.anim;
        (!a.looping && a.duration > 0.0).then(|| {
            let duration = f64::from(a.duration);
            let ease_out_start = (duration - f64::from(a.ease_out)).max(0.0);
            let finish = if ease_out_start < f64::from(a.ease_in) {
                duration
            } else {
                ease_out_start
            };
            self.activation + Duration::from_secs_f64(finish)
        })
    }

    /// Port of LLMotionController::startMotion
    /// (indra/llcharacter/llmotioncontroller.cpp, originally LGPL 2.1) for an
    /// active instance whose signal changed (a new sequence id,
    /// LLVOAvatar::processAnimationStateChanges): it is replaced only while it
    /// blends (LLMotion::isBlending: last frame's weight below 1, easing in)
    /// or has a stop time; otherwise it keeps playing, with its clock and its
    /// place among the newer motions. Nothing is replaced while the character
    /// is paused (mPaused). An expression always starts again
    /// (LLEmote::canDeprecate is false). A one-shot past its timed stop counts
    /// as stopped even before this frame's weight pass marks it, and so does
    /// a 0 s one-shot that has been drawn once.
    fn keeps_playing_when_resignalled(&self, now: Instant, paused: bool) -> bool {
        if self.stop.is_some() || default_motions::emote_param(&self.id).is_some() {
            return false;
        }
        paused || (self.weight >= 1.0 && self.one_shot_end().is_none_or(|end| now < end) && !self.zero_duration_ended(now))
    }

    /// A non-looping motion of 0 s ends itself on its first update after
    /// the start: LLKeyframeMotion::onUpdate returns
    /// `mLastLoopedTime <= mDuration`, false as soon as its time passes 0,
    /// and LLMotionController::updateMotionsByType then stops it and asks
    /// the simulator to stop it (requestStopMotion). It is drawn at the sync
    /// that put it in and ends at the next one. A 0 s loop never ends
    /// (onUpdate holds its time at 0).
    fn zero_duration_ended(&self, now: Instant) -> bool {
        let a = &self.anim.anim;
        !a.looping && a.duration <= 0.0 && now > self.inserted
    }

    fn stop_at(&mut self, now: Instant) {"""

[[patch]]
id = "anim-restart-legacy"
why = "a re-signalled one-shot that has eased in and is not stopping keeps playing in place; only the Legacy Viewer's cases start a new instance"
paths = ["crates/aurora-viewer/src/scene/anim.rs"]
op = "literal"
fn = "sync"
find = """self.signals.insert(signal.id, *signal);
                    continue;
                }
                m.stop_at(now);
            }"""
replace = """self.signals.insert(signal.id, *signal);
                    continue;
                }
                // aurora-local-patch: anim-restart-legacy
                // LLMotionController::startMotion: an active instance that
                // has eased in keeps playing (Motion::keeps_playing_when_resignalled).
                if m.keeps_playing_when_resignalled(now, frozen.is_some()) {
                    self.signals.insert(signal.id, *signal);
                    continue;
                }
                m.stop_at(now);
            }"""

[[patch]]
id = "anim-restart-legacy-end-use"
why = "the weight pass takes the one-shot's timed stop from Motion::one_shot_end, the rule the re-signal check uses"
paths = ["crates/aurora-viewer/src/scene/anim.rs"]
op = "literal"
fn = "sync"
find = """let a = &m.anim.anim;
            // LLMotionController::updateMotionsByType does not request a
            // timed stop during ease-in. If mSendStopTimestamp falls there,
            // LLKeyframeMotion::onUpdate runs to the authored end instead.
            // In particular, the stock pre-jump must last 0.333333 s, not
            // duration - ease_out = 0.133333 s (#1637).
            if m.stop.is_none() && !a.looping && a.duration > 0.0 {
                let duration = f64::from(a.duration);
                let ease_out_start = (duration - f64::from(a.ease_out)).max(0.0);
                let finish = if ease_out_start < f64::from(a.ease_in) {
                    duration
                } else {
                    ease_out_start
                };
                let end = m.activation + Duration::from_secs_f64(finish);
                if now >= end {
                    m.stop_at(end);
                    if !m.internal && !preview.is_some_and(|(target, _)| target.is_none_or(|id| id == m.id)) {
                        completed.push(m.id);
                    }
                }
            }"""
replace = """// A one-shot stops itself at its timed stop (Motion::one_shot_end).
            // aurora-local-patch: anim-restart-legacy-end-use
            if m.stop.is_none()
                && let Some(end) = m.one_shot_end()
                && now >= end
            {
                m.stop_at(end);
                if !m.internal && !preview.is_some_and(|(target, _)| target.is_none_or(|id| id == m.id)) {
                    completed.push(m.id);
                }
            }"""

