# Otoa's Shader: aurora-shader's page in Preferences › Extras, and its
# toolbar button.
#
# Needs 50-aurora-shader (the host and its GUI API, user_post_gui.rs). The
# page (files/aurora-shader-prefs/aurora_shader.rs) comes right below
# "Just for fun" and shows only while the folder the host reads has a
# config.toml: the master switch ([host] enabled: off, the host frees
# everything and the frame is the unpatched one), photos, and the chain as
# a strip of tabs in drawing order (a tab per effect, wrapping; drag one to
# reorder, right-click to move it or take it out, "+" to add one of the
# folder's other effects). The selected tab shows that effect only: its
# on/off switch and its way out of the chain, a control per parameter from
# its `//!` [ui] hints, related values grouped, plus a reset to the
# header's defaults. The selection lives for the session only. It writes
# into config.toml in place (comments kept), atomically; the host's
# watcher applies it like a hand edit.
#
# The toolbar command `aurora_shader` is registered like the others (the
# "Toolbar buttons" window, the skin's default toolbar) and hidden while
# the folder is not installed. A click opens Preferences on the page. A
# toolbar saved before this patch set does not get it on its own: add it
# from the "Toolbar buttons" window.
#
# Skip all of 51 together (Page::OtoaShader is matched in every Page
# function; the toolbar refers to the module).

[[patch]]
id = "aurora-shader-prefs-module"
why = "the Otoa's Shader page and the toolbar's open request"
op = "add_file"
paths = ["crates/aurora-viewer/src/ui/options/aurora_shader.rs"]
source = "files/aurora-shader-prefs/aurora_shader.rs"

[[patch]]
id = "aurora-shader-prefs-mod"
why = "declare the module beside the pages (it uses Cx and the rows' controls)"
paths = ["crates/aurora-viewer/src/ui/options.rs"]
op = "literal"
find = "pub mod backup;"
replace = """pub(crate) mod aurora_shader; // aurora-local-patch: aurora-shader-prefs-mod
pub mod backup;"""

[[patch]]
id = "aurora-shader-prefs-page-variant"
why = "the page, after Just for fun"
paths = ["crates/aurora-viewer/src/ui/options.rs"]
op = "literal"
find = """    Network,
    Fun,
}"""
replace = """Network,
    Fun,
    /// Otoa's Shader: aurora-shader's effects (local patch set).
    OtoaShader, // aurora-local-patch: aurora-shader-prefs-page-variant
}"""

[[patch]]
id = "aurora-shader-prefs-page-all"
why = "in the sidebar's order, right below Just for fun (one page more)"
paths = ["crates/aurora-viewer/src/ui/options.rs"]
op = "regex"
pattern = '(?s)pub const ALL: \[Page; (\d+)\] = \[(.*?)\n(\s*)Page::Fun,\n(\s*)\];'
replace = '''pub const ALL: [Page; \1 + 1] = [
\3// aurora-local-patch: aurora-shader-prefs-page-all (one page more than upstream's count, whatever it is)\2
\3Page::Fun,
\3Page::OtoaShader,
\4];'''

[[patch]]
id = "aurora-shader-prefs-page-key"
why = "its name in AURORA_DEMO_OPTIONS (otoa-shader)"
paths = ["crates/aurora-viewer/src/ui/options.rs"]
op = "literal"
find = 'Page::Fun => "fun",'
replace = '''Page::Fun => "fun",
            Page::OtoaShader => "otoa-shader", // aurora-local-patch: aurora-shader-prefs-page-key'''

[[patch]]
