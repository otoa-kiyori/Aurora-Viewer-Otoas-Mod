replace = '''Page::Fun => aurora_i18n::tr!("ui-options-fun"),
            Page::OtoaShader => aurora_i18n::tr!("ui-options-otoa-shader"), // aurora-local-patch: aurora-shader-prefs-page-name'''

[[patch]]
