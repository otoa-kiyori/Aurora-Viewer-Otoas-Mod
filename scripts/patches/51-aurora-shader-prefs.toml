[[patch]]
id = "aurora-shader-prefs-page-icon"
why = "the toolbar button's icon (one function, one icon)"
paths = ["crates/aurora-viewer/src/ui/options.rs"]
op = "literal"
find = 'Page::Fun => "confetti-filled",'
replace = '''Page::Fun => "confetti-filled",
            Page::OtoaShader => aurora_shader::ICON, // aurora-local-patch: aurora-shader-prefs-page-icon'''

[[patch]]
id = "aurora-shader-prefs-page-sidebar"
why = "the page in the sidebar only while aurora-shader is installed"
paths = ["crates/aurora-viewer/src/ui/options.rs"]
op = "literal"
find = "for page in Page::ALL.into_iter().skip(1) {"
replace = """// aurora-local-patch: aurora-shader-prefs-page-sidebar
            for page in Page::ALL
                .into_iter()
                .skip(1)
                .filter(|page| *page != Page::OtoaShader || aurora_shader::installed())
            {"""

[[patch]]
id = "aurora-shader-prefs-page-draw"
why = "its rows (nothing while not installed)"
paths = ["crates/aurora-viewer/src/ui/options/pages.rs"]
op = "literal"
find = "Page::Fun => fun::page(cx),"
replace = """Page::Fun => fun::page(cx),
        Page::OtoaShader => super::aurora_shader::page(cx), // aurora-local-patch: aurora-shader-prefs-page-draw"""

[[patch]]
id = "aurora-shader-prefs-test-catalogue"
why = "the catalogue test counts the commands: one more than upstream, whatever upstream's count is"
paths = ["crates/aurora-viewer/src/ui/toolbar/tests.rs"]
op = "regex"
pattern = '''assert_eq!\((all|COMMANDS)\.len\(\), (\d+)\);'''
replace = '''assert_eq!(\1.len(), \2 + 1); // aurora-local-patch: aurora-shader-prefs-test-catalogue (aurora_shader)'''
expect = 2

[[patch]]
id = "aurora-shader-prefs-test-catalogue-ids"
why = "goes with aurora-shader-prefs-test-catalogue"
paths = ["crates/aurora-viewer/src/ui/toolbar/tests.rs"]
op = "regex"
pattern = '''assert_eq!\(ids\.len\(\), (\d+), "each command once"\);'''
replace = '''assert_eq!(ids.len(), \1 + 1, "each command once"); // aurora-local-patch: aurora-shader-prefs-test-catalogue-ids'''

[[patch]]
id = "aurora-shader-prefs-open"
why = "the toolbar button's request: Preferences on the page, its master switch lit"
paths = ["crates/aurora-viewer/src/ui/options.rs"]
op = "insert_fn_start"
fn = "show"
expect_sig = 'pub fn show\(ctx: &egui::Context, p: &Palette, icons: &Icons, s: &mut Settings, st: &mut OptionsUi, open: &mut bool\) -> OptionsResult'
body = '''
aurora_shader::take_open(st);
'''

[[patch]]
id = "aurora-shader-prefs-command"
why = "the toolbar command: open (not toggle) Preferences, then go to the page"
paths = ["crates/aurora-viewer/src/ui/bars.rs"]
op = "literal"
fn = "run_command"
find = '''"preferences" => toggle("options", &mut panels.settings),'''
replace = '''"preferences" => toggle("options", &mut panels.settings),
        // aurora-local-patch: aurora-shader-prefs-command
        "aurora_shader" => {
            super::widgets::open_floater(ctx, "options", &mut panels.settings);
            super::options::aurora_shader::request_open();
        }'''

[[patch]]
id = "aurora-shader-prefs-hide"
why = "no button while aurora-shader is not installed (shown while the toolbars are being edited); an empty rect keeps the drop indices of the others"
paths = ["crates/aurora-viewer/src/ui/bars.rs"]
op = "literal"
fn = "toolbar_row"
find = '''    for b in buttons {
        if b.command == "speak" {'''
replace = '''for b in buttons {
        // aurora-local-patch: aurora-shader-prefs-hide
        if b.command == super::options::aurora_shader::COMMAND && !row.editing && !super::options::aurora_shader::installed() {
            rects.push(egui::Rect::from_min_size(ui.cursor().min, egui::Vec2::ZERO));
            continue;
        }
        if b.command == "speak" {'''

[[patch]]
id = "aurora-shader-prefs-catalogue"
why = "the command in the Toolbar buttons window (label = its tooltip, through tr)"
paths = ["crates/aurora-viewer/src/ui/toolbar/catalogue.rs"]
op = "literal"
find = '''"preferences", "Command_Preferences_Icon", "common-preferences", true;'''
replace = '''"preferences", "Command_Preferences_Icon", "common-preferences", true;
    // aurora-local-patch: aurora-shader-prefs-catalogue
    "aurora_shader", "contrast-2-filled", "toolbar-command-aurora-shader", true;'''

[[patch]]
id = "aurora-shader-prefs-default"
why = "on the skin's default toolbar, before Preferences (hidden when not installed)"
