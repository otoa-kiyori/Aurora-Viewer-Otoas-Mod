[[guard]]
id = "credentials-keyring-uses"
why = "A new use of the keyring crate would go to Secret Service, which fails on this desktop: credentials.rs, crash/github.rs and (since 0.9.2) cache_key.rs are the known ones. cache_key.rs keeps the sealed disk cache key and, when the store fails, falls back to a cache.key file of the configuration folder, so it is left unpatched. Guards see text, not files: the allow list holds the text of those uses, and cache_key.rs writes the same `keyring::Entry::new(SERVICE, ACCOUNT)` as crash/github.rs."
paths = ["crates/**/*.rs"]
level = "warn"
pattern = '\bkeyring::[^\n]*|\buse keyring\b[^\n]*'
allow = [
    'keyring::Entry> \{',
    'keyring::Entry::new\(service, &account\(grid, username\)\)',
    'keyring::Entry::new\(SERVICE, ACCOUNT\)',
    'keyring::Error::NoEntry\) => None,',
    'keyring::Error::NoEntry\) => \{\}',
    'keyring::Error::NoEntry\)',
]

