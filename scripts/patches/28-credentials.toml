# Remembered login hash and 2FA authorization on Linux, through a host tool
# instead of Secret Service. This desktop has no default Secret Service
# collection, so the keyring crate fails every save. `$HOME/.local/bin/sealed-cred`
# owns the sealing, the file names and the folder; the viewer only runs it.
# Windows and macOS keep the system store and read it where they always did.
#
# Tool contract:
#   sealed-cred store <service> <account>   secret on stdin, exit 0
#   sealed-cred load <service> <account>    secret on stdout, exit 0; exit 3 if none
#   sealed-cred forget <service> <account>  exit 0, even if already gone
#   anything else: non-zero other than 3, a reason on stderr, no secret
#
# credentials-sealed goes with the login form patches below it: a found read
# starts a helper that uses the TPM (about 500 ms) and a save takes about 700 ms,
# so neither may run on the UI thread. Upstream reads on every key change of the
# user name and each time the window gets the focus back, and saves when the
# login succeeds. Saves and removals go through one ordered queue inside the
# module; the form's reads go through credentials::Deferred. Apply or skip the
# whole file, not one patch of it.

[[patch]]
id = "credentials-sealed"
why = "On Linux the remembered values go through sealed-cred. The module keeps the shape of the crate it stands in for, so the rest of credentials.rs stays as upstream wrote it. No plaintext fallback: a missing tool or HOME is a failed save with a warning. Saves and removals run in order on their own thread."
paths = ["crates/aurora-viewer/src/**/credentials.rs"]
op = "literal"
find = '''
const SERVICE: &str = "Aurora Viewer";
const MFA_SERVICE: &str = "Aurora Viewer MFA";
'''
replace = '''
const SERVICE: &str = "Aurora Viewer";
const MFA_SERVICE: &str = "Aurora Viewer MFA";

// aurora-local-patch: credentials-sealed
pub use self::deferred::Deferred;
#[cfg(target_os = "linux")]
use self::sealed as keyring;

/// The login form's reads of remembered values, away from the UI thread.
mod deferred {
    use std::sync::atomic::{AtomicU64, Ordering};
    use std::sync::mpsc;
    use std::time::{Duration, Instant};

    /// While a text field has the keyboard, how long the name must stay
    /// unchanged before it is read: no helper for each key of a name.
    const SETTLE: Duration = Duration::from_millis(300);

    /// Bumped by every save or removal: a read started before one may hold
    /// the old value, which must not come back after a "forget".
    pub(super) static CHANGES: AtomicU64 = AtomicU64::new(0);

    struct Job<T> {
        key: (String, String),
        read: fn(&str, &str) -> Option<T>,
        since: Instant,
        worker: Option<mpsc::Receiver<(u64, Option<T>)>>,
        ready: Option<Option<T>>,
    }

    /// One value being read for one (grid, user). It holds no secret once
    /// delivered: the value goes to the form, as upstream's read did.
    pub struct Deferred<T> {
        job: Option<Job<T>>,
    }

    impl<T> Default for Deferred<T> {
        fn default() -> Self {
            Self { job: None }
        }
    }

    impl<T: Send + 'static> Deferred<T> {
        /// Replaces any read under way; a late result of that one is dropped.
        pub fn start(&mut self, key: &(String, String), read: fn(&str, &str) -> Option<T>) {
            self.job = Some(Job {
                key: key.clone(),
                read,
                since: Instant::now(),
                worker: None,
                ready: None,
            });
        }

        pub fn active(&self) -> bool {
            self.job.is_some()
        }

        pub fn is_for(&self, key: &(String, String)) -> bool {
            self.job.as_ref().is_some_and(|job| job.key == *key)
        }

        /// Drops the read; true when it was one for this key.
        pub fn cancel_for(&mut self, key: &(String, String)) -> bool {
            self.job.take().is_some_and(|job| job.key == *key)
        }

        /// Called each frame, never blocks on Linux. `Some` once, with the
        /// result of the read; other systems read at once, as upstream does.
        pub fn poll(&mut self, typing: bool) -> Option<Option<T>> {
            let job = self.job.as_mut()?;
            if cfg!(not(target_os = "linux")) {
                job.ready.get_or_insert_with(|| (job.read)(&job.key.0, &job.key.1));
            }
            if let Some(value) = job.ready.take() {
                self.job = None;
                return Some(value);
            }
            if job.worker.is_none() {
                if typing && job.since.elapsed() < SETTLE {
                    return None;
                }
                let (tx, rx) = mpsc::channel();
                let (read, key) = (job.read, job.key.clone());
                let changes = CHANGES.load(Ordering::SeqCst);
                let spawned = std::thread::Builder::new().name("credential-read".into()).spawn(move || {
                    let _ = tx.send((changes, read(&key.0, &key.1)));
                });
                if let Err(err) = spawned {
                    log::warn!("remembered credentials not read: {err}");
                    self.job = None;
                    return Some(None);
                }
                job.worker = Some(rx);
            }
            let worker = job.worker.as_ref()?;
            match worker.try_recv() {
                Ok((changes, value)) if changes == CHANGES.load(Ordering::SeqCst) => {
                    self.job = None;
                    Some(value)
                }
                Ok(_) => {
                    job.worker = None;
                    None
                }
                Err(mpsc::TryRecvError::Empty) => None,
                Err(mpsc::TryRecvError::Disconnected) => {
                    self.job = None;
                    Some(None)
                }
            }
        }

        /// A login is starting: reads now, blocking, for the next `poll`.
        /// True when there was a read to finish. It must end before the
        /// request is built: a login sent without the remembered 2FA
        /// authorization is challenged, and the challenge forgets it.
        pub fn finish(&mut self) -> bool {
            let Some(job) = self.job.as_mut() else {
                return false;
            };
            if job.ready.is_none() {
                job.worker = None;
                job.ready = Some((job.read)(&job.key.0, &job.key.1));
            }
            true
        }
    }

    #[cfg(test)]
    mod tests {
        use super::*;
        use std::sync::Mutex;
        use std::sync::atomic::AtomicUsize;

        /// These tests watch one counter and the shared `CHANGES`.
        static SERIAL: Mutex<()> = Mutex::new(());
        static READS: AtomicUsize = AtomicUsize::new(0);

        fn echo(grid: &str, user: &str) -> Option<String> {
            READS.fetch_add(1, Ordering::SeqCst);
            std::thread::sleep(Duration::from_millis(40));
            Some(format!("{grid}/{user}"))
        }

        fn key(user: &str) -> (String, String) {
            ("test-grid".to_owned(), user.to_owned())
        }

        fn delivered(load: &mut Deferred<String>) -> Option<String> {
            let until = Instant::now() + Duration::from_secs(5);
            while Instant::now() < until {
                if let Some(value) = load.poll(false) {
                    return value;
                }
                std::thread::sleep(Duration::from_millis(5));
            }
            panic!("the read never ended");
        }

        #[test]
        fn typing_starts_no_read_until_the_name_settles() {
            let _serial = SERIAL.lock().unwrap_or_else(|e| e.into_inner());
            READS.store(0, Ordering::SeqCst);
            let mut load = Deferred::default();
            for user in ["s", "sy", "syn", "synthetic"] {
                load.start(&key(user), echo);
                assert_eq!(load.poll(true), None);
            }
            assert!(load.active());
            assert_eq!(READS.load(Ordering::SeqCst), 0);
            std::thread::sleep(SETTLE);
            assert_eq!(load.poll(true), None);
            assert_eq!(delivered(&mut load).as_deref(), Some("test-grid/synthetic"));
            assert_eq!(READS.load(Ordering::SeqCst), 1);
            assert!(!load.active());
            assert_eq!(load.poll(false), None);
        }

        #[test]
        fn a_replaced_read_never_delivers() {
            let _serial = SERIAL.lock().unwrap_or_else(|e| e.into_inner());
            let mut load = Deferred::default();
            load.start(&key("synthetic-a"), echo);
            assert_eq!(load.poll(false), None);
            load.start(&key("synthetic-b"), echo);
            assert!(load.is_for(&key("synthetic-b")));
            assert_eq!(delivered(&mut load).as_deref(), Some("test-grid/synthetic-b"));
        }

        #[test]
        fn a_read_older_than_a_change_is_read_again() {
            let _serial = SERIAL.lock().unwrap_or_else(|e| e.into_inner());
            READS.store(0, Ordering::SeqCst);
            let mut load = Deferred::default();
            load.start(&key("synthetic"), echo);
            assert_eq!(load.poll(false), None);
            CHANGES.fetch_add(1, Ordering::SeqCst);
            assert_eq!(delivered(&mut load).as_deref(), Some("test-grid/synthetic"));
            assert_eq!(READS.load(Ordering::SeqCst), 2);
        }

        #[test]
        fn finish_reads_at_once_even_while_typing() {
            let _serial = SERIAL.lock().unwrap_or_else(|e| e.into_inner());
            let mut load = Deferred::default();
            assert!(!load.finish());
            load.start(&key("synthetic"), echo);
            assert!(load.finish());
            assert_eq!(load.poll(true), Some(Some("test-grid/synthetic".to_owned())));
            assert!(!load.active());
        }

        #[test]
        fn cancel_says_if_the_read_was_for_this_key() {
            let _serial = SERIAL.lock().unwrap_or_else(|e| e.into_inner());
            let mut load = Deferred::default();
            load.start(&key("synthetic-a"), echo);
            assert!(!load.cancel_for(&key("synthetic-b")));
            assert!(!load.active());
            load.start(&key("synthetic-a"), echo);
            assert!(load.cancel_for(&key("synthetic-a")));
            assert_eq!(load.poll(false), None);
        }
    }
}

/// Stands in for the keyring crate in this file, on Linux: same names, and
/// each call runs the host tool that owns the sealed credentials.
#[cfg(target_os = "linux")]
mod sealed {
    use super::deferred::CHANGES;
    use std::ffi::OsString;
    use std::io::{Read, Write as _};
    use std::os::unix::process::CommandExt as _;
    use std::path::{Path, PathBuf};
    use std::process::{Child, Command, Stdio};
    use std::sync::atomic::Ordering;
    use std::sync::{OnceLock, mpsc};
    use std::time::{Duration, Instant};

    const TOOL: &str = ".local/bin/sealed-cred";
    /// The tool: no such credential.
    const EXIT_MISSING: i32 = 3;
    /// Just above the 30 s the tool gives each of its helpers. A save killed
    /// here leaves the old credential: the tool only replaces it at the end.
    const WRITE_TIMEOUT: Duration = Duration::from_secs(35);
    /// A read takes about 0.5 s, and a login may have to wait for one on the
    /// UI thread (`Deferred::finish`): shorter than a save. A read that fails
    /// only leaves the form empty.
    const READ_TIMEOUT: Duration = Duration::from_secs(10);
    /// What is left of a pipe after the helper has ended.
    const PIPE_GRACE: Duration = Duration::from_secs(2);
    /// Above what `load_mfa_at` accepts, far above a login hash.
    const MAX_OUTPUT: u64 = 64 * 1024;
    const MAX_REASON: usize = 200;

    /// Display never holds a secret: child stdout is never part of it, and
    /// the tool's contract keeps secrets out of its stderr.
    #[derive(Debug, PartialEq, Eq)]
    pub enum Error {
        NoEntry,
        Failed(String),
    }

    impl std::fmt::Display for Error {
        fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
            match self {
                Self::NoEntry => f.write_str("no such credential"),
                Self::Failed(reason) => write!(f, "sealed-cred: {reason}"),
            }
        }
    }

    /// Our own copy of a value on its way to the tool, cleared when dropped.
    /// Best effort without a wiping dependency, and the viewer's `String`s
    /// keep the value as they always did.
    struct Secret(Vec<u8>);

    impl Drop for Secret {
        fn drop(&mut self) {
            self.0.fill(0);
        }
    }

    #[derive(Clone, Copy, PartialEq, Eq)]
    enum Op {
        Store,
        Load,
        Forget,
    }

    impl Op {
        fn word(self) -> &'static str {
            match self {
                Self::Store => "store",
                Self::Load => "load",
                Self::Forget => "forget",
            }
        }
    }

    /// The first line of what the tool said, bounded, for the log.
    fn reason(stderr: &[u8]) -> String {
        let text = String::from_utf8_lossy(stderr);
        let line = text
            .lines()
            .map(str::trim)
            .find(|line| !line.is_empty())
            .unwrap_or("no reason given");
        line.chars().filter(|c| !c.is_control()).take(MAX_REASON).collect()
    }

    /// Exit code of the tool (`None`: killed by a signal) to our result.
    fn outcome(op: Op, code: Option<i32>, stderr: &[u8]) -> Result<(), Error> {
        match code {
            Some(0) => Ok(()),
            Some(EXIT_MISSING) if op != Op::Store => Err(Error::NoEntry),
            Some(code) => Err(Error::Failed(format!("{} exited with {code}: {}", op.word(), reason(stderr)))),
            None => Err(Error::Failed(format!("{} was killed by a signal", op.word()))),
        }
    }

    /// From `$HOME`, never from PATH: another program of that name must not
    /// receive the secret.
    fn tool_path(home: Option<OsString>) -> Result<PathBuf, Error> {
        match home.map(PathBuf::from) {
            Some(home) if home.is_absolute() => Ok(home.join(TOOL)),
            _ => Err(Error::Failed("HOME is not set to an absolute path".to_owned())),
        }
    }

    fn drain(pipe: impl Read + Send + 'static) -> mpsc::Receiver<Vec<u8>> {
        let (tx, rx) = mpsc::channel();
        std::thread::spawn(move || {
            let mut bytes = Vec::new();
            let _ = pipe.take(MAX_OUTPUT + 1).read_to_end(&mut bytes);
            // Nobody waits any more (timeout): the bytes end here.
            if let Err(mpsc::SendError(mut late)) = tx.send(bytes) {
                late.fill(0);
            }
        });
        rx
    }

    /// The tool and whatever it started: killing the shell alone leaves
    /// systemd-creds running, and it would still deliver. SIGKILL, because a
    /// save delays SIGTERM while its stdin is open. The wait is left to a
    /// thread: a process stuck in the kernel must not hold the caller either.
    fn kill(mut child: Child) {
        // Above 1: `kill(-1)` would be every process of the user.
        if let Some(pid) = libc::pid_t::try_from(child.id()).ok().filter(|pid| *pid > 1) {
            // SAFETY: a plain syscall with no memory involved, on the group
            // this child leads (`process_group(0)`), never the viewer's own.
            // It is not reaped yet, so its id cannot belong to anyone else.
            unsafe {
                libc::kill(-pid, libc::SIGKILL);
            }
        }
        std::thread::spawn(move || {
            let _ = child.kill();
            let _ = child.wait();
        });
    }

    /// One call of the tool: the secret through stdin only, the exact stdout
    /// bytes back. Each pipe has its own thread, so a helper filling one
    /// while we write another cannot deadlock.
    fn run(tool: &Path, op: Op, service: &str, account: &str, secret: Option<Secret>, timeout: Duration) -> Result<Vec<u8>, Error> {
        let mut child = Command::new(tool)
            .args([op.word(), service, account])
            .stdin(if secret.is_some() { Stdio::piped() } else { Stdio::null() })
            .stdout(if op == Op::Load { Stdio::piped() } else { Stdio::null() })
            .stderr(Stdio::piped())
            .process_group(0)
            .spawn()
            .map_err(|err| Error::Failed(format!("cannot start: {err}")))?;
        // stdin has no length prefix: its end means "this is the whole value".
        // A write only fails once nobody reads any more, so that end cannot
        // pass for a complete value; the group is killed anyway, below.
        let written = secret.zip(child.stdin.take()).map(|(secret, mut stdin)| {
            let (tx, rx) = mpsc::channel();
            std::thread::spawn(move || {
                let whole = stdin.write_all(&secret.0).and_then(|()| stdin.flush()).is_ok();
                let _ = tx.send(whole);
            });
            rx
        });
        let mut delivered = written.is_none();
        let stdout = child.stdout.take().map(drain);
        let stderr = child.stderr.take().map(drain);
        let deadline = Instant::now() + timeout;
        let status = loop {
            match written.as_ref().map(mpsc::Receiver::try_recv) {
                Some(Ok(true)) => delivered = true,
                Some(Ok(false)) => {
                    kill(child);
                    return Err(Error::Failed(format!("{} did not take the whole value", op.word())));
                }
                _ => {}
            }
            match child.try_wait() {
                Ok(Some(status)) => break status,
                Ok(None) if Instant::now() >= deadline => {
                    kill(child);
                    return Err(Error::Failed(format!("{} timed out", op.word())));
                }
                Ok(None) => std::thread::sleep(Duration::from_millis(5)),
                Err(err) => {
                    kill(child);
                    return Err(Error::Failed(format!("{} not awaited: {err}", op.word())));
                }
            }
        };
        let output = stdout.map(|rx| rx.recv_timeout(PIPE_GRACE));
        let said = stderr.and_then(|rx| rx.recv_timeout(PIPE_GRACE).ok()).unwrap_or_default();
        let result = outcome(op, status.code(), &said).and_then(|()| {
            let whole = delivered || written.is_some_and(|rx| rx.recv_timeout(PIPE_GRACE).unwrap_or(false));
            if whole {
                Ok(())
            } else {
                Err(Error::Failed(format!("{} did not take the whole value", op.word())))
            }
        });
        if let Err(err) = result {
            if let Some(Ok(mut bytes)) = output {
                bytes.fill(0);
            }
            return Err(err);
        }
        match output {
            None => Ok(Vec::new()),
            Some(Ok(bytes)) if bytes.len() as u64 <= MAX_OUTPUT => Ok(bytes),
            Some(Ok(mut bytes)) => {
                bytes.fill(0);
                Err(Error::Failed(format!("{} gave too much output", op.word())))
            }
            Some(Err(_)) => Err(Error::Failed(format!("{} left its output open", op.word()))),
        }
    }

    /// Saves and removals, away from the frame that asks for them, in the
    /// order asked: a "forget" must not be overtaken by an earlier save. What
    /// fails is logged here. A viewer quitting in the same instant can lose
    /// the last one, and then simply has to ask for it again.
    enum Write {
        Store(Entry, Secret),
        Forget(Entry),
        Flush(mpsc::Sender<()>),
    }

    fn perform(write: Write) {
        match write {
            Write::Flush(done) => {
                let _ = done.send(());
                return;
            }
            Write::Store(entry, secret) => {
                if let Err(err) = entry.call(Op::Store, Some(secret), WRITE_TIMEOUT) {
                    log::warn!("credential not remembered: {err}");
                }
            }
            Write::Forget(entry) => match entry.call(Op::Forget, None, WRITE_TIMEOUT) {
                Ok(_) | Err(Error::NoEntry) => {}
                Err(err) => log::warn!("credential not removed: {err}"),
            },
        }
        CHANGES.fetch_add(1, Ordering::SeqCst);
    }

    fn submit(write: Write) {
        static WRITER: OnceLock<mpsc::Sender<Write>> = OnceLock::new();
        let writer = WRITER.get_or_init(|| {
            let (tx, rx) = mpsc::channel();
            let spawned = std::thread::Builder::new().name("credential-write".into()).spawn(move || {
                for write in rx {
                    perform(write);
                }
            });
            // Without its thread the queue has no receiver: `send` fails below.
            if let Err(err) = spawned {
                log::warn!("credential writes stay on the caller's thread: {err}");
            }
            tx
        });
        if let Err(mpsc::SendError(write)) = writer.send(write) {
            perform(write);
        }
    }

    #[derive(Clone)]
    pub struct Entry {
        service: String,
        account: String,
    }

    impl Entry {
        pub fn new(service: &str, account: &str) -> Result<Self, Error> {
            Ok(Self {
                service: service.to_owned(),
                account: account.to_owned(),
            })
        }

        fn call(&self, op: Op, secret: Option<Secret>, timeout: Duration) -> Result<Vec<u8>, Error> {
            let tool = tool_path(std::env::var_os("HOME"))?;
            run(&tool, op, &self.service, &self.account, secret, timeout)
        }

        /// Blocks: the login form calls it from `Deferred`. It sees every
        /// write asked before it, unless a hung one outlasts the wait.
        pub fn get_password(&self) -> Result<String, Error> {
            let (done, flushed) = mpsc::channel();
            submit(Write::Flush(done));
            let _ = flushed.recv_timeout(READ_TIMEOUT);
            String::from_utf8(self.call(Op::Load, None, READ_TIMEOUT)?).map_err(|err| {
                err.into_bytes().fill(0);
                Error::Failed("the stored value is not text".to_owned())
            })
        }

        /// Queued: a failure is a warning in the log, as it is for the callers.
        pub fn set_password(&self, secret: &str) -> Result<(), Error> {
            submit(Write::Store(self.clone(), Secret(secret.as_bytes().to_vec())));
            Ok(())
        }

        /// Queued, like `set_password`.
        pub fn delete_credential(&self) -> Result<(), Error> {
            submit(Write::Forget(self.clone()));
            Ok(())
        }
    }

    #[cfg(test)]
    mod tests {
        use super::*;
        use std::os::unix::fs::PermissionsExt as _;

        const SYNTHETIC: &str = "synthetic-value-not-a-secret";

        /// A stand-in for the tool, next to the test binary: `/tmp` is noexec
        /// on the host. Removed at the end of the test.
        struct Stub {
            dir: PathBuf,
            tool: PathBuf,
        }

        impl Stub {
            fn new(name: &str, body: &str) -> Self {
                let exe = std::env::current_exe().expect("test binary");
                let parent = exe.parent().expect("test binary folder");
                let dir = parent.join(format!("sealed-cred-stub-{name}-{}", std::process::id()));
                std::fs::create_dir_all(&dir).expect("stub folder");
                let tool = dir.join("sealed-cred");
                let script = format!(
                    "#!/bin/sh\n[ \"$1\" = probe ] && exit 0\ncd '{}' || exit 9\n{body}\n",
                    dir.display()
                );
                std::fs::write(&tool, script).expect("stub");
                std::fs::set_permissions(&tool, std::fs::Permissions::from_mode(0o700)).expect("stub mode");
                // A test forking at that moment can hold the write handle.
                for _ in 0..100 {
                    match Command::new(&tool).arg("probe").status() {
                        Err(err) if err.kind() == std::io::ErrorKind::ExecutableFileBusy => {
                            std::thread::sleep(Duration::from_millis(10));
                        }
                        _ => break,
                    }
                }
                Self { dir, tool }
            }

            fn run(&self, op: Op, secret: Option<&str>, timeout: Duration) -> Result<Vec<u8>, Error> {
                let secret = secret.map(|secret| Secret(secret.as_bytes().to_vec()));
                run(&self.tool, op, "Aurora Viewer", "test-grid|aurora-selftest", secret, timeout)
            }
        }

        impl Drop for Stub {
            fn drop(&mut self) {
                let _ = std::fs::remove_dir_all(&self.dir);
            }
        }

        #[test]
        fn exit_codes_follow_the_contract() {
            assert_eq!(outcome(Op::Load, Some(0), b""), Ok(()));
            assert_eq!(outcome(Op::Store, Some(0), b""), Ok(()));
            assert_eq!(outcome(Op::Forget, Some(0), b""), Ok(()));
            assert_eq!(outcome(Op::Load, Some(3), b"ignored"), Err(Error::NoEntry));
            assert_eq!(outcome(Op::Forget, Some(3), b""), Err(Error::NoEntry));
            for (op, code) in [(Op::Store, Some(3)), (Op::Load, Some(1)), (Op::Forget, Some(2)), (Op::Load, None)] {
                assert!(matches!(outcome(op, code, b"synthetic reason"), Err(Error::Failed(_))));
            }
        }

        #[test]
        fn errors_say_the_reason_and_stay_bounded() {
            let Err(err) = outcome(Op::Load, Some(1), b"\n  no key here  \nsecond line\n") else {
                panic!("a failure");
            };
            assert_eq!(err.to_string(), "sealed-cred: load exited with 1: no key here");
            let Err(err) = outcome(Op::Store, Some(1), &[b'x'; 5000]) else {
                panic!("a failure");
            };
            assert!(err.to_string().len() < MAX_REASON + 64);
            let Err(err) = outcome(Op::Forget, Some(1), &[0xff, 0x07]) else {
                panic!("a failure");
            };
            assert!(!err.to_string().contains('\u{7}'));
            let Err(err) = outcome(Op::Store, Some(1), b"") else {
                panic!("a failure");
            };
            assert!(err.to_string().contains("no reason given"));
            assert_eq!(Error::NoEntry.to_string(), "no such credential");
        }

        #[test]
        fn the_tool_path_comes_from_an_absolute_home() {
            assert_eq!(
                tool_path(Some("/home/synthetic".into())),
                Ok(PathBuf::from("/home/synthetic/.local/bin/sealed-cred"))
            );
            for home in [None, Some(OsString::new()), Some("relative/home".into())] {
                assert!(matches!(tool_path(home), Err(Error::Failed(_))));
            }
        }

        #[test]
        fn a_missing_tool_is_a_failure() {
            let missing = Path::new("/nonexistent/sealed-cred");
            let result = run(missing, Op::Load, "s", "a", None, READ_TIMEOUT);
            assert!(matches!(result, Err(Error::Failed(_))));
        }

        #[test]
        fn the_secret_goes_through_stdin_and_stdout_comes_back_exact() {
            let stub = Stub::new(
                "exact",
                r#"printf '%s\n' "$@" > args; printenv > env
case "$1" in
store) cat > stored ;;
load) cat stored; printf ' \n' ;;
esac"#,
            );
            stub.run(Op::Store, Some(SYNTHETIC), READ_TIMEOUT).expect("store");
            let stored = std::fs::read_to_string(stub.dir.join("stored")).expect("stored");
            assert_eq!(stored, SYNTHETIC);
            let args = std::fs::read_to_string(stub.dir.join("args")).expect("args");
            assert_eq!(args, "store\nAurora Viewer\ntest-grid|aurora-selftest\n");
            let env = std::fs::read_to_string(stub.dir.join("env")).expect("env");
            assert!(!env.contains(SYNTHETIC));
            let bytes = stub.run(Op::Load, None, READ_TIMEOUT).expect("load");
            assert_eq!(bytes, format!("{SYNTHETIC} \n").into_bytes());
        }

        #[test]
        fn stdout_never_reaches_an_error() {
            let stub = Stub::new("leak", &format!("printf '{SYNTHETIC}'; echo 'synthetic reason' >&2; exit 1"));
            let err = stub.run(Op::Load, None, READ_TIMEOUT).expect_err("exit 1");
            assert_eq!(err.to_string(), "sealed-cred: load exited with 1: synthetic reason");
        }

        #[test]
        fn exit_three_on_load_is_no_entry() {
            let stub = Stub::new("missing", "exit 3");
            assert_eq!(stub.run(Op::Load, None, READ_TIMEOUT), Err(Error::NoEntry));
        }

        #[test]
        fn full_pipes_do_not_deadlock() {
            // Both output pipes well past their buffer, then the answer.
            let stub = Stub::new("pipes", "head -c 60000 /dev/zero; head -c 200000 /dev/zero >&2; exit 0");
            let bytes = stub.run(Op::Load, None, READ_TIMEOUT).expect("load");
            assert_eq!(bytes.len(), 60000);
            // A value past the buffer of stdin, while stderr fills up too.
            let stub = Stub::new("reader", "head -c 200000 /dev/zero >&2; cat > stored");
            let secret = "s".repeat(1024 * 1024);
            assert_eq!(stub.run(Op::Store, Some(&secret), READ_TIMEOUT), Ok(Vec::new()));
            assert_eq!(std::fs::read_to_string(stub.dir.join("stored")).expect("stored"), secret);
        }

        #[test]
        fn a_value_not_taken_whole_is_a_failure() {
            let secret = "s".repeat(1024 * 1024);
            // Ends with success without reading it.
            let stub = Stub::new("deaf", "exit 0");
            let err = stub.run(Op::Store, Some(&secret), READ_TIMEOUT).expect_err("not read");
            assert_eq!(err.to_string(), "sealed-cred: store did not take the whole value");
            // Stops reading and stays: killed at once, not at the timeout.
            let stub = Stub::new("closes", "exec 0<&-; sleep 30");
            let started = Instant::now();
            assert!(matches!(stub.run(Op::Store, Some(&secret), READ_TIMEOUT), Err(Error::Failed(_))));
            assert!(started.elapsed() < Duration::from_secs(3));
        }

        #[test]
        fn a_cut_value_is_never_accepted() {
            let hash = "$1$00000000000000000000000000000000";
            assert!(super::super::is_hash(hash));
            assert!(!super::super::is_hash(&hash[..hash.len() - 1]));
            let json = serde_json::to_string(&super::super::MfaAuthorization::renewed("synthetic-mfa".into(), None, 1000)).expect("json");
            assert!(serde_json::from_str::<super::super::MfaAuthorization>(&json).is_ok());
            for end in 0..json.len() {
                assert!(serde_json::from_str::<super::super::MfaAuthorization>(&json[..end]).is_err());
            }
        }

        #[test]
        fn too_much_output_is_refused() {
            let stub = Stub::new("flood", "head -c 200000 /dev/zero; exit 0");
            assert!(matches!(stub.run(Op::Load, None, READ_TIMEOUT), Err(Error::Failed(_))));
        }

        #[test]
        fn a_hung_helper_and_its_children_are_killed() {
            let stub = Stub::new("hung", "sleep 30 & echo $! > child; wait");
            let started = Instant::now();
            let err = stub.run(Op::Load, None, Duration::from_millis(300)).expect_err("timeout");
            assert!(started.elapsed() < Duration::from_secs(3));
            assert_eq!(err.to_string(), "sealed-cred: load timed out");
            let child = std::fs::read_to_string(stub.dir.join("child")).expect("child pid");
            let stat = Path::new("/proc").join(child.trim()).join("stat");
            let until = Instant::now() + Duration::from_secs(3);
            // Gone, or a zombie waiting for its reaper.
            let dead = || std::fs::read_to_string(&stat).map_or(true, |text| text.contains(") Z "));
            while !dead() && Instant::now() < until {
                std::thread::sleep(Duration::from_millis(10));
            }
            assert!(dead(), "the helper's child survived");
        }

        /// Real round trip through the real tool (run by hand, like
        /// `store_round_trip`, once the tool is installed).
        #[test]
        #[ignore]
        fn mfa_round_trip() {
            let (grid, user) = ("test-grid", "aurora-selftest");
            let now = super::super::now();
            let authorization = super::super::MfaAuthorization::renewed("synthetic-mfa".into(), None, now);
            super::super::store_mfa(grid, user, &authorization);
            let loaded = super::super::load_mfa(grid, user).expect("stored authorization");
            assert_eq!(loaded.hash, "synthetic-mfa");
            super::super::forget_mfa(grid, user);
            assert!(super::super::load_mfa(grid, user).is_none());
        }

        /// The queue keeps the order, and a read sees what was asked before it.
        #[test]
        #[ignore]
        fn writes_keep_their_order() {
            let (grid, user) = ("test-grid", "aurora-selftest-order");
            let (first, second) = ("$1$00000000000000000000000000000001", "$1$00000000000000000000000000000002");
            // (store answers "kept" once the write is queued)
            assert!(super::super::store(grid, user, first));
            assert!(super::super::store(grid, user, second));
            assert_eq!(super::super::load(grid, user).as_deref(), Some(second));
            assert!(super::super::store(grid, user, first));
            super::super::forget(grid, user);
            assert_eq!(super::super::load(grid, user), None);
        }
    }
}
