# Per-site cookie keeping for the embedded browser (CEF), configurable in
# Preferences › Network and cache › Web browser › "Keep cookies for these
# sites".
#
# Upstream gives every CEF plugin process (in-world face, HUD, web window)
# its own Chromium profile, `<cache>/cef/cef_cache/<plugin pid>`, left on
# disk until the next start deletes it (cef_cache.rs). Here
# (files/cef-site-profiles/site_profiles.rs):
#
# - Kept tier: a browser whose first address is on a listed site (a domain,
#   with or without its subdomains) gets that site's own profile,
#   `<cache>/cef/cef-sites/<domain>/`, kept across restarts and isolated
#   from every other site. Nothing is pruned inside it (YouTube signs in
#   through google.com). A second browser of the same site while the first
#   runs gets the normal tier (Chromium cannot share a profile); the log
#   says so.
# - Normal tier, every other site: a private profile (upstream's
#   private_profile.rs, under `<cache>/web-private/`), deleted once its
#   plugin process has exited, and at the next start for what an exit or a
#   crash left. Not a memory-only profile: MediaPluginCEF always builds a
#   non-empty root_cache_path itself (`<cache_path>cef_cache/<pid>`, see the
#   module's documentation).
#
# Default list: empty, so every site is in the normal tier. The settings
# field (`keep_cookies_sites`) has a serde default: older settings files
# load; backups carry it like any other preference. The OpenID cookie of
# the web profiles and the Marketplace is still given at each launch
# (web_view.rs), in both tiers. Upstream's start clean-up reads only
# `cef/cef_cache/` and `web-private/`, never `cef/cef-sites/` (a unit test
# runs it over a kept profile). The search window's private browser is left
# as upstream wrote it.
#
# The guard below fails the build when a new CEF launch appears outside
# the two hooked sites (it would bypass the tiers). Apply or skip the whole
# file, not one patch of it.

# --- the profile choice, in aurora-viewer's media module

[[patch]]
id = "cef-site-profiles-module"
why = "the tiers, the list's rules and the kept profiles' folders, with their tests"
op = "add_file"
paths = ["crates/aurora-viewer/src/media/site_profiles.rs"]
source = "files/cef-site-profiles/site_profiles.rs"

[[patch]]
id = "cef-site-profiles-mod"
why = "declare the module beside private_profile, whose profiles the normal tier uses"
paths = ["crates/aurora-viewer/src/media/mod.rs"]
op = "literal"
find = "pub mod private_profile;"
replace = """pub mod private_profile;
pub mod site_profiles; // aurora-local-patch: cef-site-profiles-mod"""

# --- aurora-media: the plugin keeps the viewer's hold on its profile

[[patch]]
id = "cef-site-profiles-plugin-field"
why = "a value dropped with the plugin, after its process was told to stop: the hold on the profile it was given"
paths = ["crates/aurora-media/src/media.rs"]
op = "literal"
find = """    pub loaded_duration: f64,
}"""
replace = """pub loaded_duration: f64,
    // aurora-local-patch: cef-site-profiles-plugin-field
    /// Dropped last, after `process` (whose drop lets the plugin exit):
    /// what the viewer keeps for this plugin, such as its browser profile.
    profile_hold: Option<Box<dyn std::any::Any + Send + Sync>>,
}"""

[[patch]]
id = "cef-site-profiles-plugin-init"
why = "goes with cef-site-profiles-plugin-field"
paths = ["crates/aurora-media/src/media.rs"]
op = "literal"
fn = "launch_with"
find = """            loaded_duration: 0.0,
        };"""
replace = """loaded_duration: 0.0,
            profile_hold: None, // aurora-local-patch: cef-site-profiles-plugin-init
        };"""

[[patch]]
id = "cef-site-profiles-plugin-hold"
why = "the setter of cef-site-profiles-plugin-field"
paths = ["crates/aurora-media/src/media.rs"]
op = "literal"
find = """    /// The system id of the plugin process (SLPlugin) while it runs.
    pub fn pid(&self) -> Option<u32> {"""
replace = """// aurora-local-patch: cef-site-profiles-plugin-hold
    /// Keep `hold` until this plugin is dropped (after its process).
    pub fn keep_until_dropped(&mut self, hold: Box<dyn std::any::Any + Send + Sync>) {
        self.profile_hold = Some(hold);
    }

    /// The system id of the plugin process (SLPlugin) while it runs.
    pub fn pid(&self) -> Option<u32> {"""

# --- the two CEF launch sites

[[patch]]
id = "cef-site-profiles-in-world"
why = "in-world faces, HUDs and parcel media: the profile of the face's address at this launch"
paths = ["crates/aurora-viewer/src/media/update.rs"]
op = "literal"
fn = "drive_plugins"
find = '''match MediaPlugin::launch_in_world(paths, plugin_name, m.width, m.height, &browser, "") {'''
replace = '''match crate::media::site_profiles::launch(plugin_name, &m.url, &browser, |browser| {
                    MediaPlugin::launch_in_world(paths, plugin_name, m.width, m.height, browser, "") // aurora-local-patch: cef-site-profiles-in-world
                }) {'''

[[patch]]
id = "cef-site-profiles-web-view"
why = "web windows (profiles' Feed, Marketplace, web browser, link previews): the profile of the page's first address; the search tab's private browser stays as it is"
paths = ["crates/aurora-viewer/src/ui/web_view.rs"]
op = "literal"
find = '''                (Ok(settings), Some(paths)) => Some(MediaPlugin::launch(
                    paths,
                    "media_plugin_cef",
                    px.0,
                    px.1,
                    settings.as_ref().unwrap_or(browser),
                    "",
                )),'''
replace = '''// aurora-local-patch: cef-site-profiles-web-view
                (Ok(Some(settings)), Some(paths)) => Some(MediaPlugin::launch(paths, "media_plugin_cef", px.0, px.1, settings, "")), // aurora-local-patch: cef-site-profiles-web-view (private)
                (Ok(None), Some(paths)) => Some(crate::media::site_profiles::launch(
                    "media_plugin_cef",
                    &self.url,
                    browser,
                    |browser| MediaPlugin::launch(paths, "media_plugin_cef", px.0, px.1, browser, ""), // aurora-local-patch: cef-site-profiles-web-view
                )),'''

# --- the setting, its publication, the start and the exit

[[patch]]
id = "cef-site-profiles-setting"
why = "the list, in settings.json (absent from older files: empty)"
paths = ["crates/aurora-viewer/src/settings.rs"]
op = "literal"
find = "    pub browser_home_page: String,"
replace = """pub browser_home_page: String,
    // aurora-local-patch: cef-site-profiles-setting
    /// The sites whose browsers keep their cookies across restarts, each in
    /// a profile of its own (Preferences › Network and cache; local patch
    /// set, media/site_profiles.rs). Empty: no browser keeps anything.
    pub keep_cookies_sites: Vec<crate::media::site_profiles::KeptSite>,"""

[[patch]]
id = "cef-site-profiles-setting-default"
why = "goes with cef-site-profiles-setting"
paths = ["crates/aurora-viewer/src/settings.rs"]
op = "literal"
find = "browser_home_page: crate::ui::web_browser::DEFAULT_HOME.into(),"
replace = """browser_home_page: crate::ui::web_browser::DEFAULT_HOME.into(),
            keep_cookies_sites: Vec::new(), // aurora-local-patch: cef-site-profiles-setting-default"""

[[patch]]
id = "cef-site-profiles-configure-start"
why = "the launches read the list from the start"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = "crate::link_trust::configure(&settings.trusted_sites);"
replace = """crate::link_trust::configure(&settings.trusted_sites);
        crate::media::site_profiles::configure(&settings.keep_cookies_sites); // aurora-local-patch: cef-site-profiles-configure-start"""

[[patch]]
id = "cef-site-profiles-configure-change"
why = "and after each change of the preferences (a restore included)"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = "crate::link_trust::configure(&self.settings.trusted_sites);"
replace = """crate::link_trust::configure(&self.settings.trusted_sites);
            crate::media::site_profiles::configure(&self.settings.keep_cookies_sites); // aurora-local-patch: cef-site-profiles-configure-change"""

[[patch]]
id = "cef-site-profiles-sweep"
why = "at start, finish the deletions of cleared sites an exit cut short (only those, never a kept profile)"
paths = ["crates/aurora-viewer/src/main.rs"]
op = "literal"
find = ".spawn(move || media::private_profile::sweep(&private_profiles));"
replace = """.spawn(move || media::private_profile::sweep(&private_profiles));
    // aurora-local-patch: cef-site-profiles-sweep
    let site_profiles = media::site_profiles::sites_root();
    let _ = std::thread::Builder::new()
        .name("aurora-site-profiles".into())
        .spawn(move || media::site_profiles::sweep(&site_profiles));"""

[[patch]]
id = "cef-site-profiles-finish"
why = "at exit, wait a little for the plugins to exit: the normal tier's profiles are then deleted now, not at the next start"
paths = ["crates/aurora-viewer/src/main.rs"]
op = "literal"
find = """    drop(app);
    media::private_profile::finish("""
replace = """drop(app);
    media::site_profiles::finish(std::time::Duration::from_secs(5)); // aurora-local-patch: cef-site-profiles-finish
    media::private_profile::finish("""

