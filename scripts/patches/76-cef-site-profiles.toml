# --- a CEF launch that would bypass the tiers

[[guard]]
id = "cef-site-profiles-new-launch"
why = "A browser plugin is launched outside the two places that choose its profile (update.rs, web_view.rs): it would bypass the kept and normal tiers; route it through media::site_profiles::launch"
paths = ["crates/aurora-viewer/src/**/*.rs"]
level = "fail"
pattern = '^(?!.*aurora-local-patch).*MediaPlugin::launch(?:_in_world)?\s*\(.*$'
