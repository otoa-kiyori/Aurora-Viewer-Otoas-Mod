# A change between a modern sky and a classic one moves the sky's
# presentation with the change's own progress, with no step at its start
# or at its end. No setting, no interface, nothing sent.
#
# A modern sky (a reflection probe ambiance) is tone mapped, exposed
# automatically and drawn at its HDR brightness scale; a classic one (no
# probe ambiance key, or a key at 0) gets none of these. The blended frame
# used to keep the modern presentation as long as either side was modern
# and flip in one frame where the probe ambiance reached 0: at the end of a
# change to a classic sky (the brightness scale from 2 sqrt(gamma) to 1, the
# tone curve from RenderTonemapMix to none, the exposure range from
# [1 / scale, scale] to [1, 1]; the darkened night clouds came out brighter
# at once, then the exposure drifted), at the start of one from it. The
# Legacy Viewer takes the next sky's canAutoAdjust at once (LLSettingsSky::
# blend, indra/llinventory/llsettingssky.cpp): it steps too.
#
# Now (files/sky-mode-blend/sky_kind.rs and sky_mode.rs, module docs):
# - The blended frame (SkyFrame::lerp: the selector's fade, through
#   SkyFrame::fade_to_with, and a day cycle between two keyframes) carries
#   the share of each kind, lerped from each side's (1 or 0; a side that is
#   itself a blend gives its shares): modern, linear (a key at 0), the rest
#   classic. A sky that is not blending has exactly 1 or 0; two skies of
#   the same kind carry nothing. The shares hold while the frame keeps the
#   probe ambiance and the classic flag it was blended to (an editor
#   changing them gives it its own kind). SkyParams::modern takes the modern
#   share to the renderer.
# - Following it, strictly between 0 and 1: the brightness scale goes from
#   1 to the modern one geometrically (modern ^ share: the displayed
#   brightness is the scale times the exposure, whose range follows the
#   scale, and a blend in log units moves both at an even pace; a linear one
#   leaves a bump of about 5 % in the dark values near the classic end, where
#   the tone curve fading out brightens them, the geometric one under half a
#   percent); the tone curve chosen in Preferences at RenderTonemapMix x the
#   share (Khronos PBR Neutral and ACES at mix 0 are both the classic clamp,
#   post.wgsl tonemap: a test compares them); the legacy gamma from the sky's
#   gamma to 1, linearly; the automatic exposure's range [1 / scale, scale],
#   and its dark scene term (Aurora's, exposure.wgsl, which was on above a
#   range of 1 and off at 1) weighted by the share, so the eased exposure has
#   no target to lurch to at either end. The volumetric clouds, the sky, the
#   haze and the fullbright faces read the brightness scale: they follow it.
#   Preferences' tone mapper choice is not greyed out while the curve shows.
# - The frame's light and hemisphere colours, which each lighting model
#   makes its own way (world/env.rs: the modern one from the objects' light
#   attenuated along the light, x 3, and a grey ambient; the classic one at
#   its sRGB scale), are blended at the modern share (sky_kind.rs
#   `mix_light`), and so is the coloured ambient of the probes: what reads
#   them outside the shaders' branch (the sun's disc, the volumetric clouds,
#   the water, the rain, the sky rays) moves with the change. The sky rays'
#   moon factor (patch 114, env.wgsl: the HDR lighting's moon colour lacks
#   the moon's brightness the classic one holds) weighs the share.
# - The lighting model itself, a branch of every surface shader (objects,
#   terrain, water, grass, the air fog, the sun's shadow lift: common.wgsl,
#   object.wgsl, env.wgsl, `sky_ll.x`), the probes' irradiance capture and the
#   panorama's look (patch 90), is not mixed: evaluating both models doubles
#   the heaviest shaders (the Metal compiler already fails on a duplicated
#   part of them). It takes the classic side's model as soon as the modern
#   share is below 1 and the modern one at 1: its step falls at the start of
#   a change from a modern sky and at the end of one to it, where the
#   automatic exposure has its whole range to take the change of level up
#   within about a second, never where the presentation is already the
#   classic one's (exposure fixed at 1), as before at the end of a change to
#   a classic sky. Between the classic and the linear lighting (a change
#   between a classic sky and one with a key at 0) nothing changes.
# - Its level is carried across the switch by two gains (sky_mode.rs
#   `classic_gains`): while a change between the kinds runs, the classic
#   and linear branches (common.wgsl ll_atmos_core, after the haze term)
#   multiply their sun and their ambient light by (hdr / classic) ^ share,
#   where hdr / classic is the gain that makes a white surface lit by the
#   frame's light as bright under the classic lighting as under the HDR one
#   (a face without a PBR material): the ambient gain for a face edge-on to
#   the light, the sun gain the one whose largest difference over the faces
#   from the one facing up to the one facing the light is the least. Both
#   are exactly 1 at a share of 0 and on every sky that is not blending
#   between the kinds (the uniform lanes hold the gain less 1, as f32 bits:
#   0). Measured on the CPU (world/env_change_tests.rs, simulated, nothing
#   drawn): where the branch switches the level of those faces steps by
#   0.03 stop for a classic night and a modern day taken from a viewer's
#   log, 0.12 to 0.16 stop for the synthetic pairs (their sun 40 degrees
#   up); displayed (a PBR face through the tone curve and the eased
#   exposure, simulated), 0.63 to 0.10 stop for the log's skies and 1.14 to
#   0.29 stop for the synthetic pairs.
# - What the gains do not cover (the two lightings differ in shape, two
#   numbers match a level): faces between edge-on and facing up (walls
#   under a high sun), where the classic sun's pow 1.2 through the sRGB
#   curve rises steeply and the HDR n.l does not, up to about 0.5 stop off
#   at the switch (sky_mode.rs test); faces turned away from the light,
#   whose classic ambient falls to 0.75 of itself in sRGB (about 1 stop in
#   linear, against a constant hemisphere; the probes' irradiance also
#   darkens away from the sky, by an amount not measured here); the colour
#   (sRGB sum against linear sum: the chromaticity moves by 0.006 for the
#   log's skies, up to 0.09 for the synthetic ones); PBR faces (the HDR sun
#   over pi rather than 3: 0.07 stop); and, switching with the branch as
#   before, the specular shape, the probes' irradiance capture and their
#   reflections, the panorama's look, the HDR branch's shadow lift, the air
#   fog on surfaces, the screen-space occlusion's indirect term and the
#   local lights' scale. Of these, the shaded sides and the reflections on
#   shiny surfaces can show as a visible step at the switch, smaller than
#   before for the shaded sides; the others stay within a few percent. The
#   automatic exposure is not part of the gains: it eases after the switch
#   as before (its numbers are in the measurements, not in a test).
# - A day cycle whose neighbouring keyframes are of different kinds now
#   moves the presentation with its position the same way (its keyframes
#   blend with lerp); its lighting is the classic side's between them. A day
#   cycle still has no texture fade (patch 998).
#
# Cost: while no sky blends between the kinds, the same values on the GPU,
# to the bit, and the same paths, plus the gains: two lanes of a uniform
# vec4 the frame already has, read and multiplied into the sun and the
# ambient light once per ll_atmos_core call (a multiply by exactly 1). The
# exposure pass reads one more uniform vec4 and the post pass evaluates the
# tone curve while the share is between 0 and 1. On the CPU, a few
# comparisons a frame; while a change between the kinds runs, the gains'
# two searches (a bisection and a ternary search over 17 faces, a few
# thousand float operations). The sky log line says the modern share while
# it is between 0 and 1.
#
# Tests: world/sky_kind.rs (29 s manual changes through the selector from a
# modern sky to a classic and a linear one and back: the share is the
# progress, the brightness scale, the tone map mix, the legacy gamma, the
# exposure range and its dark term, and the displayed colours at both ends
# of the range move by no more than the frame's progress allows, the first
# and the last frames are each sky's own; same-kind changes keep the values
# of before; the blend on lerped, nested and edited frames; a day cycle),
# aurora-render sky_mode.rs (the curves at mix 0, the scale, the post values
# of one kind to the bit and between them, the exposure target); the
# exposure and post shaders through naga (lib.rs shader tests). The
# references of "to the bit" are upstream's formulas written out in the
# tests (sky_kind.rs `upstream_sky`, `upstream_post`; sky_mode.rs
# `upstream`), not this patch's code; sky_mode.rs also checks the gains (1
# on a sky of one kind, the levels they meet just below a share of 1, their
# pace with the share). world/env_change_tests.rs, whole
# frames: every leaf of the Debug forms of the frame's environment (the
# sky's and the water's render parameters, light, fog, hemisphere, probe
# ambiance, texture slots and shares) and of what the renderer derives from
# them (tone mapping, legacy gamma, exposure range and dark term, the sky
# rays' moon factor, the lighting mode, the level of a white surface lit
# edge-on, facing the light and facing up), so that a field added later is
# checked too, for changes dark to bright and bright to dark between each
# pair of kinds (all values different) and for each discrete field alone
# (each texture id, a texture to none, the rainbow and the halo coming and
# going, the kind, the linear kind), over 5 s and 29 s: the first frame is
# the source as it showed, the first frame at full progress the target as
# it shows on the next tick (both against the selector's own frames: a
# continuity check, not an identity with upstream), and no value moves
# between two frames by more than pi / 2 the linear pace allows against its
# whole excursion; what may switch is named with its reason (patch 998's
# layer values, shown at their checked shares, and a share falling from
# within one frame's pace of 1 to 0 as its layer becomes the only one; the
# lighting model's flags, whose lit level is held to 0.2 stop at the switch
# and to the pace elsewhere; the tone curve's id, at a mix of 0); a change
# begun over another starts from the picture shown; between the kinds,
# through the selector over 5 s and 29 s both ways (the synthetic pairs and
# the log's night and day), the lit level steps by no more than 0.2 stop
# where the lighting switches, and neither the surface facing up nor the
# sky, before the exposure, passes the brighter end or falls below the
# darker one by more than 0.15 of the distance between them. They need nothing of the 999 patches.
#
# Switching it off (moving this file out) needs nothing else: the 999
# patches apply and build without it (999-light-handover's
# light-handover-rays-moon is optional).
#
# Optional links, none needed alone: sky-mode-blend-rays (glue_for 114's
# sky-rays-shader, DRIFT if 114 is there and its anchor is not) weighs the moon factor in patch 114's ray march (env.wgsl; 114 applies
# earlier); without 114 the weight in sky_optics.w is written and read by
# nothing. Patch 998 (it applies later) asserts in this patch's day-cycle
# test that a keyframe blend carries no texture fade, in its own optional
# step env-texture-fade-sky-kind-test.

# ------------------------------------------------------------ renderer

