[[patch]]
id = "sky-mode-blend-classic-gain"
why = "the classic lighting's sun and ambient light take their gains while the sky blends between the kinds, after the haze (which keeps its own light), so that a lit surface keeps its level where the lighting model switches; times exactly 1 otherwise"
paths = ["crates/aurora-render/src/shaders/common.wgsl"]
op = "literal"
find = '''    o.additive = min(additive * (vec3<f32>(1.0) - atten), vec3<f32>(10.0));
    o.atten = atten;'''
replace = '''o.additive = min(additive * (vec3<f32>(1.0) - atten), vec3<f32>(10.0));
    // aurora-local-patch: sky-mode-blend-classic-gain
    // (between the kinds of sky, the gains that bring the classic lighting's
    // level to the HDR lighting's as the share rises, sky_mode.rs
    // classic_gains; 1 + 0 on a sky of one kind)
    o.sunlit *= 1.0 + bitcast<f32>(frame.sky_optics_tex.z);
    o.amblit *= 1.0 + bitcast<f32>(frame.sky_optics_tex.w);
    o.atten = atten;'''

