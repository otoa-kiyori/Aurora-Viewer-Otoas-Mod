[[patch]]
id = "sky-mode-blend-exposure-target"
why = "the CPU copy of the exposure target with the dark scene term's weight, for the tests"
paths = ["crates/aurora-render/src/exposure.rs"]
op = "literal"
find = '''#[cfg(test)]
fn target(average: f32, (lo, hi): (f32, f32)) -> f32 {
    let l = average.clamp(0.0, COEFFICIENT) / COEFFICIENT;
    let t = ((average - 0.003) / (0.015 - 0.003)).clamp(0.0, 1.0);
    let dark = if hi > 1.0 { 0.4 + 0.6 * t * t * (3.0 - 2.0 * t) } else { 1.0 };
    (hi + (lo - hi) * l * l) * dark
}'''
replace = '''#[cfg(test)]
pub(crate) fn target(average: f32, range: (f32, f32)) -> f32 {
    target_with(average, range, 1.0)
}

// aurora-local-patch: sky-mode-blend-exposure-target
/// [`target`] with the dark scene term at the weight `dark_weight`
/// (FrameExposure::dark), mixed as the shader mixes it.
#[cfg(test)]
pub(crate) fn target_with(average: f32, (lo, hi): (f32, f32), dark_weight: f32) -> f32 {
    let l = average.clamp(0.0, COEFFICIENT) / COEFFICIENT;
    let t = ((average - 0.003) / (0.015 - 0.003)).clamp(0.0, 1.0);
    let mut dark = if hi > 1.0 { 0.4 + 0.6 * t * t * (3.0 - 2.0 * t) } else { 1.0 };
    if hi > 1.0 && dark_weight < 1.0 {
        dark = (1.0 - dark_weight) + dark * dark_weight;
    }
    (hi + (lo - hi) * l * l) * dark
}'''

