[[patch]]
id = "sky-mode-blend-classic-gain-uniform"
why = "the classic lighting's gains on its sun and ambient light (sky_mode::classic_gains) reach the shaders in the two free lanes of sky_optics_tex, as the f32 bits of the gain less 1: 0, no gain, on a sky of one kind and in any pass that leaves the lanes at 0"
paths = ["crates/aurora-render/src/renderer.rs"]
op = "literal"
find = '''u.sky_stars = s.stars.uniform();'''
replace = '''// aurora-local-patch: sky-mode-blend-classic-gain-uniform
        // (sky_optics_tex z, w: the classic lighting's sun and ambient gains
        // less 1, as f32 bits; 0 on a sky of one kind, sky_mode::classic_gains)
        let gain = crate::sky_mode::classic_gains(s);
        u.sky_optics_tex[2] = (gain[0] - 1.0).to_bits();
        u.sky_optics_tex[3] = (gain[1] - 1.0).to_bits();
        u.sky_stars = s.stars.uniform();'''

