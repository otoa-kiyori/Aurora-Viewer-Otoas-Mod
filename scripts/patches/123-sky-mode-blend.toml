[[patch]]
id = "sky-mode-blend-env-ambient"
why = "the colored ambient's HDR hemisphere goes with the HDR lighting's side, and with its share of the hemisphere between the kinds"
paths = ["crates/aurora-viewer/src/world/env.rs"]
op = "literal"
find = '''        if on && tone_mapped(sky.probe_ambiance) {
            let amblit = srgb_to_linear(sky_tmp_ambient(sky).max(Vec3::ZERO) * 0.7);
            (self.zenith, self.horizon, self.ground) = (amblit, amblit, amblit);
        }'''
replace = '''// aurora-local-patch: sky-mode-blend-env-ambient
        // (the HDR lighting's hemisphere; between the kinds, its share of the
        // blended hemisphere, world/sky_kind.rs)
        let kind = sky.kind();
        if on && kind.lit_modern {
            let amblit = srgb_to_linear(sky_tmp_ambient(sky).max(Vec3::ZERO) * 0.7);
            (self.zenith, self.horizon, self.ground) = (amblit, amblit, amblit);
        } else if on && kind.modern > 0.0 {
            let amblit = srgb_to_linear(sky_tmp_ambient(sky).max(Vec3::ZERO) * 0.7);
            let d = (amblit - hdr_grey(sky)) * kind.modern;
            (self.zenith, self.horizon, self.ground) = (self.zenith + d, self.horizon + d, self.ground + d);
        }'''

[[patch]]
id = "sky-mode-blend-env-light"
why = "each lighting model's light and hemisphere colours as a closure, so that a sky between the kinds can blend them"
paths = ["crates/aurora-viewer/src/world/env.rs"]
op = "literal"
find = '''        let (sun_color, zenith, horizon, ground) = if tone_mapped(sky.probe_ambiance) {'''
replace = '''// aurora-local-patch: sky-mode-blend-env-light
