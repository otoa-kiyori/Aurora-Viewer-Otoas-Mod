[[patch]]
id = "sky-mode-blend-exposure-wgsl-dark"
why = "the dark scene term fades in and out with the range between the kinds of sky, instead of switching where the range leaves 1; at weight 1 it is the same value"
paths = ["crates/aurora-render/src/shaders/exposure.wgsl"]
op = "literal"
find = '''    if (p.b.z > 1.0) {
        goal *= mix(0.4, 1.0, smoothstep(0.003, 0.015, average));
    }'''
replace = '''if (p.b.z > 1.0) {
        // aurora-local-patch: sky-mode-blend-exposure-wgsl-dark
        // (at its weight while the sky blends between the kinds)
        let dark = mix(0.4, 1.0, smoothstep(0.003, 0.015, average));
        goal *= select(mix(1.0, dark, p.c.x), dark, p.c.x >= 1.0);
    }'''

