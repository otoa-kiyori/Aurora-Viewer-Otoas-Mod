[[patch]]
id = "year-first-dates-profile-birth-test"
why = "the birth date tests, year first (French and English alike)"
paths = ["crates/aurora-viewer/src/world/profiles.rs"]
op = "replace_fn_body"
fn = "birth_and_hidden_age"
body = '''
        let mut p = AvatarProfile {
            born: Some(date(2007, 5, 12)),
            ..Default::default()
        };
        let now = date(2024, 9, 15);
        assert!(birth_text_in("fr", &p, false, now).is_some_and(|t| t.starts_with("2007/05/12\n(17 ans 4 mois")));
        p.hide_age = Some(true);
        assert_eq!(birth_text_in("fr", &p, false, now).as_deref(), Some("05/12"));
        // our own profile always shows the full date
        assert!(birth_text_in("fr", &p, true, now).is_some_and(|t| t.starts_with("2007/05/12")));
        assert_eq!(birth_text_in("en", &p, false, now).as_deref(), Some("05/12"));
        assert!(birth_text_in("en", &p, true, now).is_some_and(|t| t.starts_with("2007/05/12\n(17 years 4 months")));
'''

[[patch]]
id = "year-first-dates-profile-line-test"
why = "the header birth line tests, year first"
paths = ["crates/aurora-viewer/src/world/profiles.rs"]
op = "replace_fn_body"
fn = "the_header_birth_line_leaves_the_days_to_the_tooltip"
body = '''
        let mut p = AvatarProfile {
            born: Some(date(2019, 4, 2)),
            ..Default::default()
        };
        let now = date(2026, 10, 14);
        assert_eq!(birth_line_in("fr", &p, false, now).as_deref(), Some("2019/04/02 · 7 ans 6 mois"));
        assert_eq!(
            birth_line_in("en", &p, false, now).as_deref(),
            Some("2019/04/02 · 7 years 6 months")
        );
        p.born = Some(date(2026, 9, 20));
        assert_eq!(birth_line_in("fr", &p, false, now).as_deref(), Some("2026/09/20 · 3 semaines"));
        p.born = Some(date(2026, 10, 14));
        assert_eq!(
            birth_line_in("fr", &p, false, now).as_deref(),
            Some("2026/10/14 · Inscrit aujourd'hui")
        );
        // a hidden age: the day and the month alone, except on our profile
        p.hide_age = Some(true);
        assert_eq!(birth_line_in("fr", &p, false, now).as_deref(), Some("10/14"));
        assert!(birth_line_in("fr", &p, true, now).is_some_and(|t| t.starts_with("2026/10/14 · ")));
        assert_eq!(birth_line_in("fr", &AvatarProfile::default(), false, now), None);
'''

