# Year-first dates: every date the interface shows reads year, month, day.
#
# Numeric dates are YYYY/MM/DD (zero padded, "/"), MM/DD without a year;
# dates with a month name are "YYYY mmm d" (each place keeps its month
# wording and its day padding), "mmm d" without a year. A weekday stays
# first, a time stays after the date. English and French catalogues change;
# Japanese was already year first and keeps its 年月日 wording.
#
# The community catalogues (de, es, it, nb, pl, pt-BR, pt-PT, ru, tr, uk,
# zh-Hans, zh-Hant) follow without new wording of ours:
# - numeric keys (profile-date[-hidden], inspect-date, grid-status-date,
#   search-events-date, the date of ui-display-name-at-slt) take the English
#   form, YYYY/MM/DD or MM/DD, whatever their separators were; a time
#   connector after the date keeps its words;
# - month-name patterns made only of variables and punctuation are
#   reordered year, month, day, keeping their separators (a pattern copied
#   from English, "mmm d, yyyy", takes the English form); a label before a
#   colon keeps its words (es, tr); Turkish keeps its weekday after the date;
# - month-name patterns with words or ordinals inside the date (de and nb
#   "d.", es and pt "de", the date keys only, not the labelled ones) are
#   removed: the English pattern shows, with the catalogue's own month and
#   weekday names (extra-jan…, extra-sun…);
# - left as translated, day or month first: ui-places-created-on and
#   world-im-saved where a word is part of the date phrase (de, it, nb, pl,
#   pt-BR, pt-PT, ru, uk; es world-im-saved only), since the English pattern
#   would bring English words. tests/catalogs.rs names each one.
# - Chinese month-name patterns were already year first (年月日) and stay.
#
# One place for numeric dates: aurora_i18n::numeric_date / numeric_month_day
# (crates/aurora-i18n/src/dates.rs, new; numeric_parts for the catalogue keys
# that take the parts, numeric_date_of_iso for a stored YYYY-MM-DD). The
# catalogue keys that compose a numeric date (profile-date, inspect-date,
# grid-status-date, ui-display-name-at-slt, search-events-date…) read like
# the helper in English and French: tests/catalogs.rs checks it. Month-name
# dates stay in the catalogues: their patterns are reordered, no key renamed.
#
# Changed (interface): inventory item dates (properties, hover card) · group
# members' last online (profile-date) and the members CSV export · group
# notices, land week/stipend days, inventory rows (date-day-month[-year]) ·
# profile birth dates and classified dates (profile-date) · chat day markers,
# bubbles, notification center, chat "date at time" (ui-chat-day) · offline
# IM "(Saved …)" · places visit/created days · land claim/acquired date,
# covenant date, land and region overview/estate dates, ban dates · object
# inspect, derender list, object profile created (inspect-date) · grid status
# dates · display name lock-out · status bar SLT date tooltip · search event
# day labels (both styles, zero padded MM/DD) · landmark acquired date ·
# Top scripts/colliders · driver notice · beta build day · settings backup
# date · texture upload date · poser library · experience log ·
# conversation log rows (Slt time, upstream #2984).
#
# Left alone: dates sent or written for others (abuse report chat time,
# new script descriptions, derender file asset_date, LLSD dates), file names
# (chat logs, snapshots), log and transcript lines (already year first),
# parsing of received dates, server/script/web text shown verbatim like the
# Legacy Viewer (event "Date" field, group sales times, bridge object info,
# grid status feed lines, news headings), the LSL preprocessor __DATE__, the
# calendar tile of events (month above day already), the demo's simulated
# server strings. Upstream doc comments keep their old example forms.
#
# Tests: the helper (padding, year-less, ISO, edges), the catalogue keys,
# every date key of every bundled catalogue (the left ones named), and the
# upstream tests that asserted the old order, updated. Apply or skip
# the whole file, not one patch of it.

[[patch]]
id = "year-first-dates-helper"
why = "the one helper for numeric dates of the interface"
paths = ["crates/aurora-i18n/src/dates.rs"]
op = "add_file"
source = "files/year-first-dates/dates.rs"

[[patch]]
id = "year-first-dates-module"
why = "the shared numeric date helper, exported by aurora-i18n"
paths = ["crates/aurora-i18n/src/lib.rs"]
op = "literal"
find = '''include!(concat!(env!("OUT_DIR"), "/locales.rs"));'''
replace = '''mod dates; // aurora-local-patch: year-first-dates-module
pub use dates::{numeric_date, numeric_date_of_iso, numeric_month_day, numeric_parts};
include!(concat!(env!("OUT_DIR"), "/locales.rs"));'''

