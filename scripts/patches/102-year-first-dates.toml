replace = '''// aurora-local-patch: year-first-dates-catalog-test
    // Year, month, day in every language (local patch set; Japanese was already).
    assert_eq!(tr_in!("en", "date-day-month", day = "28", month = "Oct"), "Oct 28");
    assert_eq!(tr_in!("fr", "date-day-month", day = "28", month = "oct."), "oct. 28");
    for language in ["en", "fr"] {
        assert_eq!(
            tr_in!(language, "date-day-month-year", day = "6", month = "Jun", year = "2022"),
            "2022 Jun 6"
        );
    }'''

