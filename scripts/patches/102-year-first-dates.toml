fn japanese_counts_have_a_single_form() {'''
replace = '''// aurora-local-patch: year-first-dates-numeric-keys
/// The catalogue keys that compose a numeric date read like
/// aurora_i18n::numeric_date in every bundled catalogue, year first;
/// Japanese keeps its 年月日.
#[test]
fn numeric_date_keys_read_like_the_shared_helper() {
    use aurora_i18n::{numeric_date, numeric_month_day, numeric_parts, tr_in};
    let (year, month, day) = numeric_parts(2026, 7, 5);
    let date = numeric_date(2026, 7, 5);
    assert_eq!(date, "2026/07/05");
    for language in SOURCES.iter().map(|&(code, _)| code).filter(|&code| code != "ja") {
        let (y, m, d) = (year.as_str(), month.as_str(), day.as_str());
        assert_eq!(tr_in!(language, "profile-date", year = y, month = m, day = d), date, "{language}");
        assert_eq!(
            tr_in!(language, "profile-date-hidden", month = m, day = d),
            numeric_month_day(7, 5),
            "{language}"
        );
        assert_eq!(
            tr_in!(language, "search-events-date", month = m, day = d),
            numeric_month_day(7, 5),
            "{language}"
        );
        assert_eq!(
            tr_in!(language, "inspect-date", year = y, month = m, day = d, hour = "14", minute = "13"),
            format!("{date} 14:13"),
            "{language}"
        );
        assert_eq!(
            tr_in!(
                language,
                "grid-status-date",
                year = y,
                month = m,
                day = d,
                hour = "10",
                minute = "45"
            ),
            format!("{date} 10:45 SLT"),
            "{language}"
        );
        assert!(
            tr_in!(
                language,
                "ui-display-name-at-slt",
                y = y,
                m = m,
                d = d,
                value0 = "14",
                value1 = "30"
            )
            .starts_with(&date),
            "{language}"
        );
    }
    assert_eq!(
        tr_in!(
            "ja",
            "profile-date",
            year = year.as_str(),
            month = month.as_str(),
            day = day.as_str()
        ),
        "2026年07月05日"
    );
}

/// Every date key of every bundled catalogue reads year, month, day (month
/// before day without a year), through the English pattern where a
/// catalogue has none. The patterns left as their translators wrote them are
/// named with the reason: when one of them changes upstream, this test says so.
#[test]
fn every_catalogue_date_reads_year_first() {
    // Words around the date that this patch set does not rewrite; removing
    // the line would show the English words of the English pattern instead.
    const LEFT: &[(&str, &str, &str)] = &[
        ("de", "ui-places-created-on", "a preposition and an ordinal day around the date"),
        ("de", "world-im-saved", "a preposition and an ordinal day around the date"),
        ("es", "world-im-saved", "connecting words between the parts"),
        ("it", "ui-places-created-on", "words right before the date"),
        ("it", "world-im-saved", "words right before the date"),
        ("nb", "ui-places-created-on", "a word before the date and an ordinal day"),
        ("nb", "world-im-saved", "a word before the date and an ordinal day"),
        ("pl", "ui-places-created-on", "a word right before the date"),
        ("pl", "world-im-saved", "a word right before the date"),
        ("pt-BR", "ui-places-created-on", "connecting words between the parts"),
        ("pt-BR", "world-im-saved", "a word right before the date"),
        ("pt-PT", "ui-places-created-on", "connecting words between the parts"),
        ("pt-PT", "world-im-saved", "connecting words between the parts"),
        ("ru", "ui-places-created-on", "a word right before the date"),
        ("ru", "world-im-saved", "a word right before the date"),
        ("uk", "ui-places-created-on", "a word right before the date"),
        ("uk", "world-im-saved", "a word right before the date"),
    ];
    const KEYS: [&str; 16] = [
        "profile-date",
        "profile-date-hidden",
        "search-events-date",
        "inspect-date",
        "grid-status-date",
        "ui-display-name-at-slt",
        "date-day-month",
        "date-day-month-year",
        "land-claim-date",
        "land-covenant-date",
        "ui-bars-slt-date",
        "ui-places-visit-day",
        "ui-places-created-on",
        "ui-chat-day",
        "world-im-saved",
        "ui-land-overview-date",
    ];
    let mut args = aurora_i18n::Args::new();
    for (name, value) in [
        ("year", "2031"),
        ("y", "2031"),
        ("month", "MON"),
        ("m", "MON"),
        ("day", "27"),
        ("d", "27"),
        ("hour", "14"),
        ("minute", "13"),
        ("value0", "14"),
        ("value1", "13"),
        ("weekday", "WKD"),
        ("time", "11:19:10"),
    ] {
        args.set(name, value);
    }
    let mut left = 0;
    for &(language, _) in SOURCES {
        for key in KEYS {
            let text = aurora_i18n::format_in(language, key, &args);
            let (Some(month), Some(day)) = (text.find("MON"), text.find("27")) else {
                panic!("{language}/{key}: no month or day in {text:?}");
            };
            let yearless = matches!(
                key,
                "profile-date-hidden" | "search-events-date" | "date-day-month" | "ui-bars-slt-date" | "ui-places-visit-day"
            );
            let year_first = match text.find("2031") {
                Some(year) => year < month && month < day,
                None => yearless && month < day,
            };
            match LEFT.iter().find(|&&(l, k, _)| l == language && k == key) {
                Some(&(_, _, reason)) => {
                    left += 1;
                    assert!(
                        !year_first,
                        "{language}/{key} reads year first now ({text:?}); it was left for {reason}: remove it from LEFT"
                    );
                }
                None => assert!(year_first, "{language}/{key}: {text:?}"),
            }
        }
    }
    assert_eq!(left, LEFT.len(), "LEFT names a language or a key that is not bundled");
}

