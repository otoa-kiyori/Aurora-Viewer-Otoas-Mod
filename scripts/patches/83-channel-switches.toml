    // aurora-local-patch: channel-switch-test-settings
    #[test]
    fn the_channel_rows_are_named_and_media_and_voice_channels_are_on_after_loading() {
        use super::*;
        let names = audio_channels();
        assert_eq!(names[UI_CHANNEL], aurora_i18n::tr!("common-interface"));
        assert_eq!(names[AMBIENT_CHANNEL], aurora_i18n::tr!("common-ambient"));
        assert_eq!(names[SOUNDS_CHANNEL], aurora_i18n::tr!("common-sounds"));
        assert_eq!(names[MUSIC_CHANNEL], aurora_i18n::tr!("common-music"));
        assert_eq!(names[MEDIA_CHANNEL], aurora_i18n::tr!("settings-multimedia"));
        assert_eq!(names[VOICE_CHANNEL], aurora_i18n::tr!("common-voice"));
        let mut old = Settings::default();
