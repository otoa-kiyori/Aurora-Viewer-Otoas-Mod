# The volume rows of Preferences > Sound and voice: the box switches a channel
# off, the switch beside it only mutes.
#
# Rule (Otoa's): the speaker switch mutes (still connected, still receiving,
# silent); the box turns the channel off (nothing fetched, received or
# played). Per row (the master has no box):
#
# - Interface (audio.enabled[1]): off, no interface sound is wanted, loaded
#   or played (play_ui_sound). They are local sounds: there is nothing to
#   disconnect. Sound previews (inventory, sound explorer) and the photo
#   shutter play on this channel too: they are the user's own actions and
#   stay silent through the engine's channel switch. The Legacy Viewer has no
#   box on this row (MuteUI only).
# - Ambient (audio.enabled[2]): the wind is the only sound of that channel
#   here; off, it is not synthesised (fades to nothing, then WindGen skips
#   its work). The Legacy Viewer's box on that row is EnableCollisionSounds,
#   which Aurora keeps as its own toggle (Music and sounds group).
# - Sounds (audio.enabled[3]): every world sound (attached, triggered,
#   collision, gesture, typing). Off: SoundTrigger and PreloadSound are
#   neither recorded nor fetched, one-shots are dropped, playing voices stop,
#   what was wanted but not loaded yet is forgotten and fetch() starts no
#   cache read or download for world sounds. Looping sources stay known and
#   pending: when the box is ticked again their sounds are wanted and they
#   start again (the way a loop out of reach already resumes). A download
#   already in flight finishes and goes to the disk cache (not cancelled).
#   The Legacy Viewer's box on that row is EnableGestureSounds, also kept as
#   its own toggle here.
# - Music (audio.enabled[4], the Legacy Viewer's AudioStreamingMusic,
#   enable_music): off, the radio is turned off and a /music stream
#   forgotten, so the stream is stopped at once and never started: no
#   autoplay, no media filter question (filterAudioUrl is only reached with a
#   stream wanted, as optionallyStartMusic is gated on AudioStreamingMusic in
#   llviewerparcelmgr.cpp), and the top-bar radio is greyed with a tooltip
#   (mStreamToggle enabled = AudioStreamingMusic && hasParcelAudio,
#   LLStatusBar::refresh). Ticked again, nothing restarts by itself: the radio
#   button, or autoplay on the next parcel, as in the Legacy Viewer (no
#   listener on AudioStreamingMusic). Stricter: the Legacy Viewer leaves a
#   playing stream alone until the next parcel; here it stops at once. The
#   existing audio.enabled[4] is reused, no second setting: upstream's
#   Radio::target (app/parcel_music.rs) already wants nothing while it is
#   off but keeps the radio on, so ticking it would restart the stream; the
#   gate turns the radio itself off (Radio::switch_off) and the account's
#   remembered radio choice (parcel_music_accounts) with it.
# - Multimedia (settings.media.enabled, AudioStreamingMedia, enable_media):
#   the same switch as Preferences > Media > Enable media, live, with the
#   gates of 82-media-off. The top-bar media button is greyed while media is
#   off (upstream's media_available includes Enable media; since #3544 its
#   hover opens the nearby media panel instead of a tooltip, so the button
#   has no "media is off" tip of its own any more).
# - Voice (audio.voice_enabled, EnableVoiceChat, enable_voice_check): the
#   same switch as Voice > Enable voice: off, voice disconnects, microphone
#   included. The top-bar panel's box already was this one.
#
# audio.enabled[5] and [6] lose their box everywhere: loading the settings
# sets them on (Settings::sanitized), so an earlier session cannot leave
# media or voice silent with nothing to tick. The engine's channel switches
# (app.rs, set_enabled) stay as a backstop for every channel.
#
# Reset: a Sound row's reset still covers volume, mute and audio.enabled[i]:
# the box for Interface, Ambient, Sounds and Music. Enable media stays owned
# by the Media page and Enable voice by its own row of the Voice tab (one
# page per setting, a_setting_has_one_page): resetting the volumes never turns
# media back on.
#
# Apply or skip the whole file, not one patch of it.

# ---------------------------------------------------------------- settings

[[patch]]
