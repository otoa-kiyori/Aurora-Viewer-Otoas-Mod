// aurora-local-patch: channel-switch-sound-test
#[cfg(test)]
mod channel_switch_tests {
    use super::channel_box;
    use crate::settings::{MEDIA_CHANNEL, MUSIC_CHANNEL, Settings, VOICE_CHANNEL};

    #[test]
    fn the_boxes_switch_media_voice_and_the_other_channels() {
        let mut s = Settings::default();
        *channel_box(&mut s, MEDIA_CHANNEL) = false;
        assert!(!s.media.enabled && s.audio.enabled[MEDIA_CHANNEL]);
        *channel_box(&mut s, VOICE_CHANNEL) = false;
