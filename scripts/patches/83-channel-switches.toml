replace = '''mod tests {
    use super::*;

    // aurora-local-patch: channel-switch-test-panel
    #[test]
    fn the_panel_rows_follow_their_real_switches() {
        use crate::settings::{MEDIA_CHANNEL, MUSIC_CHANNEL, VOICE_CHANNEL};
        let mut a = AudioSettings::default();
        assert!(enable_box(&mut a, MEDIA_CHANNEL).is_none());
        let off = MediaState {
            media_enabled: false,
            ..MediaState::default()
        };
        let on = MediaState {
            media_enabled: true,
            ..MediaState::default()
        };
        assert!(!channel_on(&a, off, MEDIA_CHANNEL));
        assert!(channel_on(&a, on, MEDIA_CHANNEL));
        // the media and voice channels' own flags no longer count
        a.enabled[MEDIA_CHANNEL] = false;
        a.enabled[VOICE_CHANNEL] = false;
        assert!(channel_on(&a, on, MEDIA_CHANNEL));
        assert!(channel_on(&a, on, VOICE_CHANNEL));
        a.voice_enabled = false;
        assert!(!channel_on(&a, on, VOICE_CHANNEL));
        // music is its channel (AudioStreamingMusic)
        assert!(channel_on(&a, off, MUSIC_CHANNEL));
        *enable_box(&mut a, MUSIC_CHANNEL).expect("the music has a box") = false;
        assert!(!channel_on(&a, on, MUSIC_CHANNEL));
    }'''

