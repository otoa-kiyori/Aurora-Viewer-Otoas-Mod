find = "    /// Ask for a sound (PreloadSound, or before playing it)."
replace = '''// aurora-local-patch: channel-switch-sounds-set
    /// The Sounds row's box. Off: the playing world sounds stop, one-shots
    /// and triggered sounds are dropped, looping sources stay pending (as a
    /// loop out of reach does) and what was only wanted, not loaded yet, is
    /// forgotten. On again: the pending loops' sounds are wanted, so they
    /// load and start again.
    pub fn set_world_sounds(&mut self, engine: Option<&AudioEngine>, on: bool) {
        if on == self.world_on {
            return;
        }
        self.world_on = on;
        if on {
            let wanted: Vec<Uuid> = self.sources.values().filter(|s| s.pending.is_some()).map(|s| s.sound).collect();
            for id in wanted {
                self.want(id);
            }
            return;
        }
        let now = Instant::now();
        for s in self.sources.values_mut() {
            if let (Some(p), Some(e)) = (s.playing.take(), engine) {
                e.stop_world(p.voice);
            }
            s.pending = (s.flags & FLAG_LOOP != 0).then_some(now);
            s.queued = None;
        }
        for t in self.triggered.drain(..) {
            if let (Some(p), Some(e)) = (t.playing, engine) {
                e.stop_world(p.voice);
            }
        }
        let local = self.local_sounds().unwrap_or_default();
        self.clips.retain(|id, c| c.state >= 3 || c.kept || local.contains(id));
    }

    /// While world sounds are off, the sounds that still load: the
    /// interface sounds waiting for their clip and the previews. None while
    /// they are on.
    fn local_sounds(&self) -> Option<HashSet<Uuid>> {
        (!self.world_on).then(|| {
            self.previews
                .keys()
                .copied()
                .chain(self.ui_pending.iter().map(|(id, _)| *id))
                .collect()
        })
    }

    /// Ask for a sound (PreloadSound, or before playing it).'''

