why = "the rows of audio_channels by name, and the tooltip of each row's box"
paths = ["crates/aurora-viewer/src/settings.rs"]
op = "literal"
find = "pub fn audio_channels() -> [&'static str; 7] {"
replace = '''// aurora-local-patch: channel-switch-consts
/// Rows of `audio_channels` whose box is special-cased.
pub const UI_CHANNEL: usize = 1;
pub const AMBIENT_CHANNEL: usize = 2;
pub const SOUNDS_CHANNEL: usize = 3;
/// Its box is `audio.enabled[4]`, AudioStreamingMusic.
pub const MUSIC_CHANNEL: usize = 4;
/// Its box is `MediaSettings::enabled` (AudioStreamingMedia).
pub const MEDIA_CHANNEL: usize = 5;
/// Its box is `audio.voice_enabled` (EnableVoiceChat).
pub const VOICE_CHANNEL: usize = 6;

/// The tooltip of the box of row `i`: off means off, the mute is beside it.
pub fn channel_box_tip(i: usize) -> &'static str {
    match i {
        UI_CHANNEL => aurora_i18n::tr!("ui-options-channel-switch-ui"),
        AMBIENT_CHANNEL => aurora_i18n::tr!("ui-options-channel-switch-ambient"),
        SOUNDS_CHANNEL => aurora_i18n::tr!("ui-options-channel-switch-sounds"),
        MUSIC_CHANNEL => aurora_i18n::tr!("ui-options-channel-switch-music"),
        MEDIA_CHANNEL => aurora_i18n::tr!("ui-options-channel-switch-media"),
        _ => aurora_i18n::tr!("ui-options-channel-switch-voice"),
    }
}

pub fn audio_channels() -> [&'static str; 7] {'''

