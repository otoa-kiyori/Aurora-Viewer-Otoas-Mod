[[patch]]
id = "channel-switch-music-gate"
why = "the music gate as one pure function the tests check"
paths = ["crates/aurora-viewer/src/app/audio_mute.rs"]
op = "literal"
find = "/// Plugins play outside the audio mixer and need its transient master mute."
replace = """// aurora-local-patch: channel-switch-music-gate
/// AudioStreamingMusic (enable_music): with the Music row's box off the
/// radio is off and a `/music` stream forgotten, so no stream is wanted,
/// filtered (filterAudioUrl) or played, and none starts again by itself once
/// the box is ticked (optionallyStartMusic, llviewerparcelmgr.cpp, checks it
/// before autoplay). Upstream's Radio::target already wants nothing while the
/// channel is off, but keeps the radio on, so ticking the box would restart
/// it. True when this turned the radio off.
pub(super) fn music_gate(audio: &AudioSettings, radio: &mut super::parcel_music::Radio) -> bool {
    !audio.enabled[crate::settings::MUSIC_CHANNEL] && radio.switch_off()
}

/// Plugins play outside the audio mixer and need its transient master mute."""

[[patch]]
id = "channel-switch-test-music"
why = "music off never keeps or starts a stream; the mute leaves it playing"
paths = ["crates/aurora-viewer/src/app/audio_mute.rs"]
op = "literal"
find = """mod tests {
    use super::*;"""
replace = """mod tests {
    use super::*;

    // aurora-local-patch: channel-switch-test-music
    #[test]
    fn music_off_stops_the_radio_and_the_mute_does_not() {
        use super::super::parcel_music::Radio;
        let music = crate::settings::MUSIC_CHANNEL;
        let mut audio = AudioSettings::default();
        let mut radio = Radio::default();
        radio.update(Some("http://radio.example.org/live"), false);
        radio.play("http://radio.example.org/other".into());
        // muted: silent, still playing
        audio.muted[music] = true;
        assert!(!music_gate(&audio, &mut radio));
        assert!(radio.requested());
        assert_eq!(radio.station(), "http://radio.example.org/other");
        // off: nothing wanted and the /music stream forgotten, every frame
        // (autoplay or the radio set it again)
        audio.enabled[music] = false;
        assert!(music_gate(&audio, &mut radio));
        assert!(!radio.requested());
        assert_eq!(radio.station(), "http://radio.example.org/live");
        assert_eq!(radio.wanted(true, true), "");
        radio.toggle();
        assert!(music_gate(&audio, &mut radio));
        assert!(!radio.requested());
        assert!(!music_gate(&audio, &mut radio), "already off: nothing to remember");
        // on again: nothing restarts by itself (the same parcel does not
        // autoplay again), the radio does
        audio.enabled[music] = true;
        radio.update(Some("http://radio.example.org/live"), true);
        assert!(!music_gate(&audio, &mut radio));
        assert!(!radio.requested());
        radio.toggle();
        assert!(!music_gate(&audio, &mut radio));
        assert_eq!(radio.wanted(true, true), "http://radio.example.org/live");
    }"""
