replace = '''// aurora-local-patch: channel-switch-sound-fn
/// The setting the box of volume row `i` (not the master) switches: the
/// channel itself, or for media and voice the real switch the Legacy Viewer
/// binds there (enable_media: AudioStreamingMedia, enable_voice_check:
/// EnableVoiceChat, panel_preferences_sound.xml).
fn channel_box(s: &mut crate::settings::Settings, i: usize) -> &mut bool {
    use crate::settings::{MEDIA_CHANNEL, VOICE_CHANNEL};
    match i {
        MEDIA_CHANNEL => &mut s.media.enabled,
        VOICE_CHANNEL => &mut s.audio.voice_enabled,
        _ => &mut s.audio.enabled[i],
    }
}

fn volumes(cx: &mut Cx) {'''

