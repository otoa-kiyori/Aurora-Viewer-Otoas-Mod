[[patch]]
id = "channel-switch-test-sounds"
why = "world sounds off: nothing asked for or played, loops come back"
paths = ["crates/aurora-viewer/src/scene/sounds.rs"]
op = "literal"
find = '''mod tests {
    use super::*;'''
replace = '''mod tests {
    use super::*;

    // aurora-local-patch: channel-switch-test-sounds
    #[test]
    fn world_sounds_off_are_neither_asked_for_nor_played_and_loops_come_back() {
        let id = Uuid::from_u128;
        let mut sounds = SoundManager::new(std::env::temp_dir().join("aurora-sound-switch-tests"));
        // asked for while on, not loaded yet: forgotten once off
        sounds.set_attached(None, id(200), id(5), 1.0, 0);
        sounds.trigger(id(6), Vec3::ZERO, None, 1.0);
        sounds.set_world_sounds(None, false);
        assert!(!sounds.clips.contains_key(&id(5)) && !sounds.clips.contains_key(&id(6)));
        assert!(sounds.sources[&id(200)].pending.is_none());
        assert!(sounds.triggered.is_empty());
        // off: a loop is known but not fetched, one-shots are dropped
        sounds.set_attached(None, id(100), id(1), 1.0, FLAG_LOOP);
        sounds.set_attached(None, id(101), id(2), 1.0, 0);
        sounds.trigger(id(3), Vec3::ZERO, None, 1.0);
        for s in [1, 2, 3] {
            assert!(!sounds.clips.contains_key(&id(s)), "sound {s} asked for");
        }
        assert!(sounds.sources[&id(100)].pending.is_some());
        assert!(sounds.sources.get(&id(101)).is_none_or(|s| s.pending.is_none()));
        assert!(sounds.triggered.is_empty());
        // the interface sounds still load
        sounds.play_ui(None, id(4));
        assert!(sounds.local_sounds().is_some_and(|l| l.contains(&id(4))));
        // on again: the loop is wanted, the dropped one-shot is not
        sounds.set_world_sounds(None, true);
        assert!(sounds.clips.contains_key(&id(1)));
        assert!(!sounds.clips.contains_key(&id(2)));
        assert!(sounds.local_sounds().is_none());
    }'''

