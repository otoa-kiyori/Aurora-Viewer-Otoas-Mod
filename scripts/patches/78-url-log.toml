# ------------------------------------------------------------- the filter

[[patch]]
id = "url-log-peek"
why = "the filter's answer for an address without asking, telling or keeping anything, for the entry's state"
paths = ["crates/aurora-viewer/src/media/filter.rs"]
op = "literal"
find = "pub fn rules(&self) -> &[Rule] {"
replace = '''// aurora-local-patch: url-log-peek
    /// What the filter would answer for a URL now, without asking, telling
    /// or keeping anything: for the local URL log (url_log.rs), which notes
    /// the answer when an address is first seen. `trusted`: a worn item
    /// that check_trusted would take; "Don't ask" counts as a refusal.
    pub fn peek(&self, url: &str, trusted: bool) -> Verdict {
        let url = url.trim();
        let host = match target(url) {
            Target::Site(host) => host,
            Target::Blank => return Verdict::Allow,
            Target::Refused(_) => return Verdict::Deny,
        };
        match rule_for(&self.rules, url, &host).or_else(|| self.session.get(url).copied()) {
            Some(Action::Allow) => Verdict::Allow,
            Some(Action::Deny) => Verdict::Deny,
            _ if trusted => Verdict::Allow,
            _ if self.no_ask => Verdict::Deny,
            _ => Verdict::Ask,
        }
    }

    pub fn rules(&self) -> &[Rule] {'''

# ---------------------------------------------------- the chat's link finder

[[patch]]
id = "url-log-links"
why = "the web addresses of a chat line, found as the conversation finds its links"
paths = ["crates/aurora-viewer/src/ui/chat.rs"]
op = "literal"
find = "pub(crate) fn mentions(text: &str, agent: &uuid::Uuid) -> bool {"
replace = '''// aurora-local-patch: url-log-links
/// The http and https addresses of a text, as written and in order: the
/// links the conversation shows, the address of a link with its own text
/// included. Other schemes (secondlife://, hop://) and addresses without a
/// scheme (www.…) are left out. For the local URL log (url_log.rs).
pub(crate) fn web_addresses(text: &str) -> Vec<String> {
    fn address(seg: &Seg<'_>) -> Option<String> {
        match seg {
            Seg::Url(u) | Seg::Slurl(u) | Seg::Place(u, _) | Seg::App(u, _) => Some(u.to_string()),
            Seg::Labelled(_, inner) => address(inner),
            _ => None,
        }
    }
    let web = |u: &String| {
        ["http://", "https://"]
            .iter()
            .any(|s| u.get(..s.len()).is_some_and(|p| p.eq_ignore_ascii_case(s)))
    };
    segments(text).iter().filter_map(address).filter(web).collect()
}

/// The text mentions `agent` (LLUrlRegistry::containsAgentMention).
pub(crate) fn mentions(text: &str, agent: &uuid::Uuid) -> bool {'''

