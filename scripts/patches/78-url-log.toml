# An optional local log of the web addresses the world shows, for a
# separate program that checks them later. The viewer writes the file and
# nothing else: it does not show it, read it back or send it anywhere.
#
# What (files/url-log/url_log.rs, with its tests):
#
# - the address of a media on a prim face (in the world, on a worn item, on
#   a HUD), of the parcel media and of the parcel music, when it is turned
#   on: a face's media created, given a new address, or there when the log
#   is turned on (reconcile_prims, a per-media number, no allocation in the
#   frame), the parcel's media address while media is on (update_parcel),
#   the parcel music's while the radio plays it or the filter holds or
#   blocks it (update_audio). The entry's `state` is the media filter's
#   answer at that moment (allowed, held for its question, blocked; music
#   the radio never plays, not http or https, is written as `unsupported`).
#   While a kind of media is off nothing is written for it and its address
#   is not taken as seen, so the entry comes when it is turned on; turning
#   it off, stopping, unloading or removing it writes nothing;
# - every http or https address said in nearby chat or in an IM, by an
#   avatar or an object, found by the chat's own link finder (a link with
#   its own text gives its address): lines that reach the conversation
#   only, so a muted or blocked speaker, a filtered object or spam writes
#   nothing, as for the transcript. Not group chat, not our own lines;
# - with each entry, for media: the region, the position (of the
#   linkset's top or of the avatar wearing it, rounded to 1 m), the parcel
#   (parcel media and music), the object and face; for chat and IM: the
#   speaker (UUID, name, avatar or object, and the owner of an object when
#   the message carries it). Never an asset id, and no request is made for
#   a name;
# - the same address from the same face, parcel or speaker once per
#   session (a bounded set).
#
# Addresses are stored with a `*` just before their scheme
# (`*https://example.com/a?b=1`), so that an editor does not make the log
# clickable; a reading program removes the first `*` to get the address
# back. The host (`host`) is written bare.
#
# Where: `<data dir>/url-log/YYYY-MM-DD.jsonl`, the data dir being the
# folder of the viewer's `logs` (the offline demo writes to `url-log-demo`),
# the day in UTC, one JSON object per line written in one piece. The folder
# is 0700 and the files 0600 on Unix, links are refused, and files more
# than 30 days old (by the date in their exact name) are deleted when the
# writer starts and once a day. One writer thread, a bounded queue (a full
# queue drops the entry and counts it): the frame thread never touches the
# disk, and nothing is created while the switch is off.
#
# The switch: Preferences > Media > Filter > "Log web addresses"
# (media.url_log), off by default. The viewer's own log gets one line when
# logging starts (the folder) and a daily debug count, never an address.
#
# A local addition: the Legacy Viewer has nothing like it. Needs
# 84-media-filter-switches (the filter's peek reads its Don't ask), and
# 85-media-filter-guard lists media.url_log among the fields of
# MediaSettings it allows.
#
# Apply or skip the whole file, not one patch of it.

# ------------------------------------------------------------- the module

