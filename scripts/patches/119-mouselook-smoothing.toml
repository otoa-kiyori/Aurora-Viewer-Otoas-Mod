[[patch]]
id = "mouselook-smoothing-en"
why = "the English texts"
paths = ["crates/aurora-i18n/locales/en.ftl"]
op = "literal"
find = '''
ui-options-camera-combat-range = Marker range
'''
replace = '''
ui-options-camera-combat-range = Marker range
# // aurora-local-patch: mouselook-smoothing-en
ui-options-camera-ml-smoothing = Mouselook smoothing
ui-options-camera-ml-smoothing-tip =
    How the view follows the mouse in mouselook. Your avatar turns with the smoothed view, so others see what you see.
    Off: the view turns exactly with the mouse.
    Frame average: the motion of the last few frames is evened out, with very little lag.
    Exponential: the view glides toward where the mouse points; steady, a little behind every motion.
    One Euro: slow, fine aiming is smoothed while fast turns stay almost direct.
    Damped spring: the view eases in and out like a camera on a spring, without overshooting.
    Leading cursor: the crosshair moves at once and the view follows it back to the centre; clicks go where the crosshair is.
ui-options-camera-ml-smoothing-off = Off
ui-options-camera-ml-smoothing-average = Frame average
ui-options-camera-ml-smoothing-exponential = Exponential
ui-options-camera-ml-smoothing-one-euro = One Euro
ui-options-camera-ml-smoothing-spring = Damped spring
ui-options-camera-ml-smoothing-leading = Leading cursor
ui-options-camera-ml-smoothing-strength = Strength
ui-options-camera-ml-smoothing-strength-tip = How much smoothing: 0 is none, 1 the strongest (about half a second of lag, one second of catch-up for the spring and the leading cursor)'''

