[[patch]]
id = "mouselook-smoothing-settings-bounds"
why = "a strength from an edited file is finite and within 0 to 1"
paths = ["crates/aurora-viewer/src/camera/settings.rs"]
op = "literal"
find = '''
        self.mouselook_iff_range = fix(self.mouselook_iff_range, 0.0, 500.0, d.mouselook_iff_range);
'''
replace = '''
self.mouselook_iff_range = fix(self.mouselook_iff_range, 0.0, 500.0, d.mouselook_iff_range);
        // aurora-local-patch: mouselook-smoothing-settings-bounds
        self.mouselook_smoothing_strength = super::mouselook_smoothing::sanitize_strength(self.mouselook_smoothing_strength);'''

# ------------------------------------------------------------------ the frame

[[patch]]
id = "mouselook-smoothing-step"
why = "one step a frame, after the agent's update (its controller turn) and before the camera and the AgentUpdate read the agent"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''
                self.vr_rig_yaw += (delta + std::f32::consts::PI).rem_euclid(std::f32::consts::TAU) - std::f32::consts::PI;
            }
'''
replace = '''
self.vr_rig_yaw += (delta + std::f32::consts::PI).rem_euclid(std::f32::consts::TAU) - std::f32::consts::PI;
            }
            // aurora-local-patch: mouselook-smoothing-step
            if self.vr_camera.is_none() && self.studio_photo_session.is_none() {
                let aspect = self.camera_aspect();
                self.camera
                    .smooth_mouselook(&mut self.world.agent, &self.settings.camera, dt, aspect);
            } else {
                self.camera.reset_mouselook_smoothing();
            }'''

[[patch]]
id = "mouselook-smoothing-crosshair"
why = "the leading cursor's crosshair is drawn where the aim is"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''
                if self.camera.mouselook() && !vr_active {
                    let c = ctx.content_rect().center();
'''
replace = '''
if self.camera.mouselook() && !vr_active {
                    let c = ctx.content_rect().center();
                    // aurora-local-patch: mouselook-smoothing-crosshair
                    let aim_at = {
                        let r = ctx.content_rect();
                        self.camera
                            .mouselook_aim_ndc(r.width() / r.height().max(1.0))
                            .map_or(c, |n| c + egui::vec2(n.x * r.width() * 0.5, -n.y * r.height() * 0.5))
                    };'''

[[patch]]
id = "mouselook-smoothing-crosshair-draw"
why = "draw it there (the centre in every other mode)"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''
                        ui::crosshair::draw(&painter, c, crosshair, picture.as_ref());
'''
replace = '''
ui::crosshair::draw(&painter, aim_at, crosshair, picture.as_ref()); // aurora-local-patch: mouselook-smoothing-crosshair-draw'''

[[patch]]
id = "mouselook-smoothing-combat"
why = "the combat aids' avatar under the crosshair is the one under the leading cursor's aim"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''
                        self.camera.position,
                        self.camera.forward(),
                        &camera,
'''
replace = '''
self.camera.position,
                        self.camera.mouselook_aim_forward(), // aurora-local-patch: mouselook-smoothing-combat
                        &camera,'''

# ------------------------------------------------------------------ picks at the crosshair

[[patch]]
id = "mouselook-smoothing-gun"
why = "a mouselook click touches or grabs what is under the crosshair, which the leading cursor moves"
paths = ["crates/aurora-viewer/src/app/script_clicks.rs"]
op = "literal"
find = '''
            self.cursor_pos = (w as f32 * 0.5, h as f32 * 0.5);
'''
replace = '''
// aurora-local-patch: mouselook-smoothing-gun
            self.cursor_pos = self.camera.mouselook_aim_pixel(w as f32, h as f32);'''

[[patch]]
id = "mouselook-smoothing-dof"
why = "the depth of field's mouselook focus is at the crosshair"
paths = ["crates/aurora-viewer/src/app/dof.rs"]
op = "literal"
find = '''
            renderer.hover_pick(w as f32 * 0.5, h as f32 * 0.5)
'''
