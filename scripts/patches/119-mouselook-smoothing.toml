# Mouselook smoothing: a choice of how the view follows the mouse in
# mouselook, and one strength.
#
# Preferences › Camera › Mouselook: "Mouselook smoothing" (a drop-down, Off by
# default) and "Strength" (0 to 1.00 in 0.01 steps, 0 by default, greyed
# while Off). Kept with the other mouselook settings (settings `camera`),
# bounded on load (CameraSettings::sanitized); an old settings file loads
# Off / 0. Off, or a strength of 0, is today's viewer bit for bit: the
# filter is bypassed entirely and the mouse writes the agent's yaw and pitch
# as before (a test checks the bits).
#
# Where it sits (camera/mouselook_smoothing.rs): the mouse turns an AIM
# (yaw and pitch after the sensitivity, pitch limits applied); once a frame,
# after the agent's own update and before the camera reads it, the filter
# moves the VIEW toward the aim and writes it to the agent's yaw and pitch.
# The filters take the aim as moving in a straight line during each frame
# and solve their equation exactly over it, so a given motion gives the same
# view at any frame rate; a frame of 0.5 s or more puts the view on the aim;
# yaw goes the short way across ±180°; pitch never leaves the agent's limits;
# a held aim is reached exactly. The techniques:
# - Frame average: the mean of the aim over the last N frames' worth of
#   time at 60 fps, N = 1 + 7 × strength (a window of 0 to 117 ms); no drift.
# - Exponential: view += (aim - view)(1 - e^(-dt/tau)), tau = 0.5 s ×
#   strength² (0.25 → 31 ms, 0.5 → 125 ms, 1 → 0.5 s: the squared slider
#   keeps the light, useful settings on its first half). Its relative is the
#   Legacy Viewer's fixed-strength MouseSmooth (LLViewerWindow::
#   updateMouseDelta, indra/newview/llviewerwindow.cpp, originally LGPL 2.1).
# - One Euro: the published adaptive low-pass (a cutoff that rises with the
#   speed of the motion, the derivative low-passed at 1 Hz as the paper
#   does). Minimum cutoff 25 Hz × (0.5/25)^strength (25 Hz near 0, 3.5 Hz at
#   0.5, 0.5 Hz at 1); speed coefficient 6 Hz per rad/s, so a turn of
#   170°/s raises the cutoff by about 18 Hz and stays nearly direct (1.3°
#   behind at 0.5, against 7.7° for an exponential with the same smoothing
#   of slow motion), while a ±0.05° tremor is damped to almost nothing.
# - Damped spring: a critically damped spring (the closed form of the usual
#   "smooth damp"; no overshoot), catch-up time 1 s × strength².
# - Leading cursor: the aim moves at once and the crosshair shows it, off
#   the centre; the view follows with the same spring (up to 1 s) and so
#   brings the crosshair back to the centre. The aim stays within 85% of
#   the half screen: at the edge it drags the view along. In this mode a
#   mouselook click (touch / grab of what is under the crosshair), the depth
#   of field's and the photo's mouselook focus and the combat aids' "under
#   the crosshair" all use the aim, through one helper
#   (Camera::mouselook_aim_pixel / mouselook_aim_forward); in the four
#   others the crosshair and the clicks stay at the centre, as today.
#
# What the region and others see: the smoothed view IS the agent's yaw and
# pitch, so the body rotation, the head rotation, the camera and the
# look-at of the AgentUpdate all follow what the user sees and nothing snaps
# ahead. What is sent and how often is unchanged (aurora-net's rule of
# send_agent_update is not touched; a slower turn only crosses its
# thresholds at another moment).
#
# Resets: leaving mouselook, entering it, a mode the mouse does not turn
# (VR, flycam, free camera, a Director track), a teleport, sitting down or
# standing up, a change of technique, and any other turn of the agent over
# 1 rad in one frame start the filter again from the current direction. A
# turning seat turns the aim and the view together (not smoothed). Switching
# Off while turning keeps the mouse's last motion.
#
# Other inputs: a game controller or joystick turning the view in mouselook
# (MoveInput::joystick_yaw / joystick_pitch, applied by AgentState::update)
# shares the aim: its turn becomes a turn of the aim and is smoothed the
# same. The turn keys do not turn in mouselook (they strafe), unchanged.
# The third-person camera is not touched.
#
# Verified: pure tests of every technique (strength 0 and Off bypass, the
# view converges and ends exactly on a held aim, no overshoot for the spring
# and the leading cursor, the same motion at 30 and 120 fps, the ±180° wrap,
# a huge or invalid frame time, the pitch limits, the One Euro sweep and
# tremor numbers, the leading cursor's margin, the agent's other turns and
# the resets), the settings' bounds and round trip, and the bit-for-bit
# bypass through the camera. Texts in the English, French and Japanese
# catalogues. Apply or skip the whole file, not one patch of it.

# ------------------------------------------------------------------ module

[[patch]]
id = "mouselook-smoothing-module"
why = "the filters (pure, with their tests) and the camera's glue: one step a frame, the aim's pixel and direction for picks"
paths = ["crates/aurora-viewer/src/camera/mouselook_smoothing.rs"]
op = "add_file"
source = "files/mouselook-smoothing/mouselook_smoothing.rs"

[[patch]]
id = "mouselook-smoothing-mod"
why = "declare the module"
paths = ["crates/aurora-viewer/src/camera/mod.rs"]
op = "literal"
find = '''
mod mouselook_zoom;
'''
replace = '''
pub mod mouselook_smoothing; // aurora-local-patch: mouselook-smoothing-mod
mod mouselook_zoom;'''

# ------------------------------------------------------------------ camera

[[patch]]
id = "mouselook-smoothing-field"
why = "the camera keeps the smoothing's state"
paths = ["crates/aurora-viewer/src/camera/mod.rs"]
op = "literal"
find = '''
    gamepad_ml_zoom: mouselook_zoom::GamepadZoom,
'''
replace = '''
gamepad_ml_zoom: mouselook_zoom::GamepadZoom,
    // aurora-local-patch: mouselook-smoothing-field
    /// The mouselook smoothing's aim and filter (`mouselook_smoothing.rs`).
    ml_smooth: mouselook_smoothing::Smoother,'''

[[patch]]
id = "mouselook-smoothing-field-default"
why = "no smoothing state at start"
paths = ["crates/aurora-viewer/src/camera/mod.rs"]
op = "literal"
find = '''
            gamepad_ml_zoom: Default::default(),
            virtual_position: Vec3::ZERO,
'''
replace = '''
gamepad_ml_zoom: Default::default(),
            ml_smooth: Default::default(), // aurora-local-patch: mouselook-smoothing-field-default
            virtual_position: Vec3::ZERO,'''

[[patch]]
id = "mouselook-smoothing-look"
why = "while a filter runs the mouse turns the aim; otherwise the agent, exactly as before"
paths = ["crates/aurora-viewer/src/camera/mod.rs"]
op = "literal"
find = '''
    pub fn look(&mut self, dx: f32, dy: f32, sensitivity: f32, agent: &mut AgentState) {
        let k = DRAG_RATE * sensitivity;
'''
replace = '''
pub fn look(&mut self, dx: f32, dy: f32, sensitivity: f32, agent: &mut AgentState) {
        let k = DRAG_RATE * sensitivity;
        // aurora-local-patch: mouselook-smoothing-look
        if self.ml_smooth.engaged() {
            self.ml_smooth.turn(-dx * k, -dy * k);
            return;
        }'''

[[patch]]
id = "mouselook-smoothing-seat"
why = "a turning seat turns the smoothed view and its aim together, not through the filter"
paths = ["crates/aurora-viewer/src/camera/mod.rs"]
op = "literal"
find = '''
                if let Some(yaw) = flat(rot * Vec3::new(seat.local_yaw.cos(), seat.local_yaw.sin(), 0.0)) {
                    agent.yaw = yaw;
                }
'''
replace = '''
if let Some(yaw) = flat(rot * Vec3::new(seat.local_yaw.cos(), seat.local_yaw.sin(), 0.0)) {
                    // aurora-local-patch: mouselook-smoothing-seat
                    self.ml_smooth.shift_frame(yaw - agent.yaw);
                    agent.yaw = yaw;
                }'''

[[patch]]
id = "mouselook-smoothing-teleport"
why = "a teleport starts the smoothing again from the arriving direction"
paths = ["crates/aurora-viewer/src/camera/mod.rs"]
op = "insert_fn_start"
fn = "on_teleport_arrival"
body = '''
self.reset_mouselook_smoothing();
'''

