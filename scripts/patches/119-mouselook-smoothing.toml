[[patch]]
id = "mouselook-smoothing-viewfinder"
why = "the photo's pointer focus in mouselook is at the crosshair"
paths = ["crates/aurora-viewer/src/app/viewfinder.rs"]
op = "literal"
find = '''
                    (w as f32 * 0.5, h as f32 * 0.5)
'''
