self.camera.mouselook_aim_pixel(w as f32, h as f32) // aurora-local-patch: mouselook-smoothing-viewfinder'''

# ------------------------------------------------------------------ Preferences

[[patch]]
id = "mouselook-smoothing-options"
why = "the drop-down and the strength slider, under the other mouselook rows"
paths = ["crates/aurora-viewer/src/ui/options/pages/camera.rs"]
op = "literal"
find = '''
                cx.slider(
                    tr!("ui-options-camera-combat-range"),
                    "",
                    &field!(camera.mouselook_iff_range),
                    0.0..=500.0,
                    " m",
                );
            });
        });
'''
replace = '''
cx.slider(
                    tr!("ui-options-camera-combat-range"),
                    "",
                    &field!(camera.mouselook_iff_range),
                    0.0..=500.0,
                    " m",
                );
            });
        });
        // aurora-local-patch: mouselook-smoothing-options
        {
            use crate::camera::mouselook_smoothing::{STRENGTH_RANGE, Technique};
            cx.combo(
                tr!("ui-options-camera-ml-smoothing"),
                tr!("ui-options-camera-ml-smoothing-tip"),
                &field!(camera.mouselook_smoothing),
                &[
                    (Technique::Off, tr!("ui-options-camera-ml-smoothing-off")),
                    (Technique::FrameAverage, tr!("ui-options-camera-ml-smoothing-average")),
                    (Technique::Exponential, tr!("ui-options-camera-ml-smoothing-exponential")),
                    (Technique::OneEuro, tr!("ui-options-camera-ml-smoothing-one-euro")),
                    (Technique::DampedSpring, tr!("ui-options-camera-ml-smoothing-spring")),
                    (Technique::LeadingCursor, tr!("ui-options-camera-ml-smoothing-leading")),
                ],
            );
            cx.greyed(cx.s.camera.mouselook_smoothing == Technique::Off);
            cx.row(
                tr!("ui-options-camera-ml-smoothing-strength"),
                tr!("ui-options-camera-ml-smoothing-strength-tip"),
                &field!(camera.mouselook_smoothing_strength),
                |ui, s| {
                    ui.spacing_mut().slider_width = super::super::SLIDER_W;
                    ui.add(
                        egui::Slider::new(&mut s.camera.mouselook_smoothing_strength, STRENGTH_RANGE)
                            .step_by(0.01)
                            .fixed_decimals(2)
                            .custom_parser(aurora_i18n::parse_number)
                            .trailing_fill(true),
                    )
                    .changed()
                },
            );
            cx.greyed(false);
        }'''

