find = "lift += across * along * faint * seen * drifts * (0.06 - 0.01 * f32(k)) * select(1.0, 1.4, snow);"
replace = "lift += across * along * faint * seen * drifts * (0.06 - 0.01 * f32(k)) * select(1.0, 1.4, snow) * weight; // aurora-local-patch: weather-top-far-weight"

