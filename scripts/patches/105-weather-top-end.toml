[[patch]]
id = "weather-top-streak"
why = "the near streaks and splashes: the opacity boost"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
fn = "rain_streak"
op = "literal"
find = '''var alpha = taper * sqrt(r) * (0.22 + fresnel * 0.55 + lit) * in.life;
    alpha *= 1.0 - rain_sheltered_slanted(in.world);'''
replace = '''var alpha = taper * sqrt(r) * (0.22 + fresnel * 0.55 + lit) * in.life;
    alpha *= 1.0 - rain_sheltered_slanted(in.world);
    // aurora-local-patch: weather-top-streak
    // Amount's top quarter: more opaque
    if (frame.snow_far.z > 0.0) { alpha = min(alpha * (1.0 + frame.snow_far.z), 1.0); }'''

[[patch]]
id = "weather-top-flake"
why = "the near flakes and the flakes that land: the opacity boost"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
fn = "snow_flake"
op = "literal"
find = '''alpha *= 1.0 - rain_sheltered_slanted(in.world);'''
replace = '''alpha *= 1.0 - rain_sheltered_slanted(in.world);
    // aurora-local-patch: weather-top-flake
    // Amount's top quarter: more opaque
    if (frame.snow_far.z > 0.0) { alpha = min(alpha * (1.0 + frame.snow_far.z), 1.0); }'''

[[patch]]
id = "weather-top-far-loop"
why = "the distant rain: up to 2 x the count factor patterns a layer, the extra ones fading in"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
fn = "rain_far_streaks"
op = "literal"
find = "for (var s = 0; s < 2; s++) {"
replace = '''// aurora-local-patch: weather-top-far-loop
        // Amount's top quarter: more offset patterns, the extra ones fading
        // in (snow_far.y, the count factor less 1: none below it)
        let extra = 2.0 * frame.snow_far.y;
        let patterns = 2 + i32(ceil(extra));
        for (var s = 0; s < patterns; s++) {
            let weight = select(1.0, clamp(extra - f32(s - 2), 0.0, 1.0), s >= 2);'''

[[patch]]
id = "weather-top-far-seed"
why = "the extra patterns' own seeds (the first two keep theirs)"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
fn = "rain_far_streaks"
op = "literal"
find = "let seed = bitcast<u32>(i32(col)) * 747796405u + u32(k * 2 + s) * 2891336453u + 17u;"
replace = "let seed = bitcast<u32>(i32(col)) * 747796405u + select(u32(k * 2 + s), u32(64 + k * 8 + s), s >= 2) * 2891336453u + 17u; // aurora-local-patch: weather-top-far-seed"

[[patch]]
id = "weather-top-far-weight"
why = "the extra patterns at their weight"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
fn = "rain_far_streaks"
