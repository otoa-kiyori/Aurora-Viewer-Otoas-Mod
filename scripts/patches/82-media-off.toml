[[patch]]
id = "media-off-open-media"
why = "the Open media click action does nothing while media is off"
paths = ["crates/aurora-viewer/src/media/mod.rs"]
op = "insert_fn_start"
fn = "click_open_media"
impl = "MediaManager"
expect_sig = 'settings: &MediaSettings\) -> Option<String>'
body = '''
// Stricter than handle_click_action_open_media (lltoolpie.cpp), which
// opens the parcel's media URL whatever AudioStreamingMedia says.
