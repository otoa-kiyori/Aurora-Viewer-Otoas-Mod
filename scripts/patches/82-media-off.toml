[[patch]]
id = "media-off-test-allowed"
why = "media_allowed: media off stops everything, prim media off stops prim media only"
paths = ["crates/aurora-viewer/src/media/update.rs"]
op = "literal"
find = '''
mod tests {
    use super::*;
    use std::sync::Arc;
'''
replace = '''mod tests {
    use super::*;
    use std::sync::Arc;

    // aurora-local-patch: media-off-test-allowed
    #[test]
    fn media_off_allows_nothing_and_prim_media_off_only_stops_prims() {
        let mut s = MediaSettings::default();
        assert!(media_allowed(&s, true) && media_allowed(&s, false));
        s.prim_media = false;
        assert!(!media_allowed(&s, true));
        assert!(media_allowed(&s, false));
        s.prim_media = true;
        s.enabled = false;
        assert!(!media_allowed(&s, true));
        assert!(!media_allowed(&s, false));
    }

    #[test]
    fn media_off_filter_asks_nothing_and_holds() {
        let mut w = World::new(Arc::new(crate::scene::avatar::AvatarLibrary::load()));
        let mut m = MediaManager::default();
        let mut parcel = MediaImpl::new(MediaKey::Parcel, "https://media.example.invalid/".into(), "text/html".into());
        parcel.wanted = true;
        m.impls.push(parcel);
        fn frame<'a>(view: &'a CullView, settings: &'a MediaSettings) -> MediaFrame<'a> {
            MediaFrame {
                view,
                camera: Vec3::ZERO,
                ear: Vec3::ZERO,
                settings,
                autoplay: true,
                channel_volume: 1.0,
                agent_speed: 0.0,
                window_focused: true,
                gaming_mode: false,
                net: None,
                cache_dir: std::path::Path::new(""),
                language: "en",
            }
        }
        let view = CullView::new(Mat4::IDENTITY, Vec3::ZERO, 720.0, 1.0);
        let off = MediaSettings {
            enabled: false,
            ..MediaSettings::default()
        };
        m.apply_filter(&mut w, &frame(&view, &off));
        assert!(m.impls[0].filter_hold && m.impls[0].wanted);
        assert!(w.media_filter.question().is_none());
        assert!(w.media_filter.messages.is_empty());
        // media on again: the site is asked about as usual
        m.apply_filter(&mut w, &frame(&view, &MediaSettings::default()));
        assert!(m.impls[0].filter_hold);
        assert!(w.media_filter.question().is_some());
    }'''

[[patch]]
id = "media-off-test-client"
why = "the ObjectMedia queue sends nothing while media is off, keeps its entries once each and still takes answers in flight"
paths = ["crates/aurora-viewer/src/media/entry.rs"]
op = "literal"
find = '''
mod tests {
    use super::*;
'''
replace = '''mod tests {
    use super::*;

    // aurora-local-patch: media-off-test-client
    #[test]
    fn media_off_queue_waits_and_takes_answers_in_flight() {
        let rt = tokio::runtime::Builder::new_current_thread().build().expect("runtime");
        let http = reqwest::Client::new();
        let mut c = MediaDataClient::default();
        let interest = |_: &Uuid| Some((1.0, 1.0));
        let waiting = Uuid::from_u128(7);
        c.request(waiting, "http://127.0.0.1:9/cap", false, WORLD);
        c.request(waiting, "http://127.0.0.1:9/cap", false, WORLD);
        assert!(c.update(rt.handle(), &http, Instant::now(), interest, false).is_empty());
        assert!(c.is_queued(&waiting));
        assert_eq!((c.sorted.len(), c.last_send), (1, None));
        let answered = Uuid::from_u128(8);
        // in flight: its generation and priority as `request` keeps them
        let generation = 99;
        c.queued.insert(answered, (generation, WORLD));
        let pending = Pending {
            object: answered,
            generation,
            cap: String::new(),
            attempts: 0,
            update: false,
            priority: WORLD,
        };
        let data = Ok(ObjectMediaData {
            version: 1,
            faces: Vec::new(),
        });
        c.tx.send((pending, data)).expect("channel");
        let got = c.update(rt.handle(), &http, Instant::now(), interest, false);
        assert_eq!(got.len(), 1);
        assert_eq!(got[0].object, answered);
        assert!(!c.is_queued(&answered));
        assert_eq!((c.sorted.len(), c.last_send), (1, None));
    }'''

