why = "the Open media click gives no URL and toggles nothing while media is off"
paths = ["crates/aurora-viewer/src/media/mod.rs"]
op = "literal"
find = '''
mod click_tests {
    use super::*;
'''
replace = '''mod click_tests {
    use super::*;

    // aurora-local-patch: media-off-test-click
    #[test]
    fn open_media_does_nothing_while_media_is_off() {
        let mut w = World::new(std::sync::Arc::new(crate::scene::avatar::AvatarLibrary::load()));
        for ev in crate::demo::events().into_iter().chain(crate::demo::action_events()) {
            w.apply(ev);
        }
        let p = std::sync::Arc::make_mut(w.parcel.as_mut().expect("demo parcel"));
        p.media_url = "https://example.invalid/media".into();
        p.media.mime = "text/html".into();
        p.media.media_id = crate::demo::ACTION_MEDIA_TEX;
        let settings = MediaSettings {
            enabled: false,
            ..MediaSettings::default()
        };
        let mut m = MediaManager::default();
        let idx = w.objects.index_of_uuid(&crate::demo::action_id(970)).expect("demo object");
        assert!(m.click_open_media(&w, idx, 0, &settings).is_none());
        let idx = w.objects.index_of_uuid(&crate::demo::action_id(978)).expect("demo object");
        assert!(m.click_open_media(&w, idx, 0, &settings).is_none());
        assert!(m.find(&MediaKey::Parcel).is_none());
    }
'''
