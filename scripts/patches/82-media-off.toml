# With media off, nothing about media leaves the viewer or asks a question.
#
# Upstream keeps three paths alive while Preferences > Media > Enable media
# (AudioStreamingMedia) or Prim media (PrimMediaMasterEnabled) is off:
#
# - the ObjectMedia GETs: every object with a media face is still fetched
#   from the region's ObjectMedia capability. The Legacy Viewer queues
#   nothing while AudioStreamingMedia is off
#   (LLObjectMediaDataClient::enqueue, LLObjectMediaNavigateClient::enqueue,
#   indra/newview/llmediadataclient.cpp) and makes no client at all without
#   PrimMediaMasterEnabled (LLVOVolume::initClass, llvovolume.cpp). Here the
#   queue keeps its entries but sends nothing; answers already in flight are
#   still taken, and the fetches resume when media is turned back on;
# - the media filter: a parcel media impl kept from before media was turned
#   off still asked its site question (and told refusals in the chat) every
#   frame. With media off it is not checked at all and stays undecided, so it
#   is asked normally once media is on again. The filter itself is string
#   matching on the URL (no DNS, no request): a question never meant network
#   access;
# - the "Open media" click action: it handed the parcel's media URL straight
#   to the system browser, with media off too and without the link checks.
#   With media off the click does nothing; with media on the URL goes the
#   way of a clicked link (refused schemes, link trust, the external link
#   confirmation). The Legacy Viewer has no gate there
#   (handle_click_action_open_media, lltoolpie.cpp): a deliberate, stricter
#   difference.
#
# Parcel music keeps its own settings and filter path; the build floater's
# Media tab (a user edit) is unchanged.
#
# Apply or skip the whole file, not one patch of it.

[[patch]]
id = "media-off-allowed-fn"
why = "whether media may load, fetch or ask, as one pure function the tests can check"
paths = ["crates/aurora-viewer/src/media/update.rs"]
op = "literal"
find = "const UPLOAD_BUDGET: usize = 16 << 20;"
replace = '''const UPLOAD_BUDGET: usize = 16 << 20;

// aurora-local-patch: media-off-allowed-fn
/// Media is allowed at all (AudioStreamingMedia) and, for media on a prim,
/// prim media too (PrimMediaMasterEnabled). Off, nothing is fetched,
/// filtered or asked about (LLObjectMediaDataClient::enqueue in
/// indra/newview/llmediadataclient.cpp, LLVOVolume::initClass).
fn media_allowed(settings: &MediaSettings, prim: bool) -> bool {
    settings.enabled && (!prim || settings.prim_media)
}'''

