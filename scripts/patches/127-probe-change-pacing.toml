[[patch]]
id = "probe-change-pacing-set"
why = "the change's start and end, the round after it, the free cube of a capture"
paths = ["crates/aurora-viewer/src/scene/probes.rs"]
op = "literal"
find = """pub fn refresh(&mut self) {
        for p in self.probes.values_mut() {
            p.last_update = None;
        }
        self.default_last = None;
        self.updating = None;
    }"""
replace = """pub fn refresh(&mut self) {
        for p in self.probes.values_mut() {
            p.last_update = None;
        }
        self.default_last = None;
        self.updating = None;
    }

    // aurora-local-patch: probe-change-pacing-set
    /// Whether the environment is changing (a cross-fade of the sky), each
    /// frame: while it does, the default probe is captured after every
    /// [`CHANGE_LOCALS_PER_DEFAULT`] local captures, and the local probes
    /// cross-fade into their new captures. When it ends, every probe is
    /// captured once more, the default probe first then the closest
    /// (`refresh`), still cross-fading: the captures made during the change
    /// saw a sky between the two.
    pub fn set_changing(&mut self, changing: bool) {
        if self.changing && !changing {
            self.refresh();
            self.settling = true;
        }
        self.changing = changing;
    }

    /// The free cube slot a local probe's next capture goes into, to
    /// cross-fade from the one it shows: during a change or the round after
    /// it only, for a captured sphere probe (a box probe's weight is not its
    /// fade), when a slot is free of every probe and fade.
    fn fade_target(&self, k: Key) -> Option<u32> {
        if !(self.changing || self.settling) {
            return None;
        }
        self.probes.get(&k).filter(|p| p.kind >= 0.0 && p.complete && p.slot.is_some())?;
        let mut used = vec![false; self.slots as usize];
        let taken = self.probes.values().filter_map(|q| q.slot).chain(self.fades.values().map(|f| f.0));
        for s in std::iter::once(0).chain(taken) {
            if let Some(u) = used.get_mut(s as usize) {
                *u = true;
            }
        }
        used.iter().position(|u| !u).map(|s| s as u32)
    }

    /// How many probes the slots keep besides the default one: all of them
    /// but [`CHANGE_SPARE_SLOTS`] while the environment changes and in the
    /// round after it, when there are enough (more than twice as many).
    fn keep(&self) -> usize {
        let all = self.slots.saturating_sub(1) as usize;
        if (self.changing || self.settling) && all > 2 * CHANGE_SPARE_SLOTS {
            all - CHANGE_SPARE_SLOTS
        } else {
            all
        }
    }"""

[[patch]]
id = "probe-change-pacing-fades"
why = "a fading probe's previous cube stays taken, and the cube a capture goes into"
paths = ["crates/aurora-viewer/src/scene/probes.rs"]
op = "literal"
find = """for k in order.iter().take(keep) {
            if let Some(p) = self.probes.get_mut(k)
                && p.slot.is_none()"""
replace = """// aurora-local-patch: probe-change-pacing-fades
        // (a cross-fade ends after CHANGE_BLEND, or when its probe lost its
        // cube or its capture; its previous cube stays taken until then, as
        // the cube a capture in progress goes into)
        let probes = &self.probes;
        self.fades.retain(|k, (old, at)| {
            now.duration_since(*at) < CHANGE_BLEND && probes.get(k).is_some_and(|p| p.complete && p.slot.is_some_and(|s| s != *old))
        });
        let held = self.fades.values().map(|f| f.0).chain(self.updating.and_then(|u| u.target));
        for s in held {
            if let Some(u) = used.get_mut(s as usize) {
                *u = true;
            }
        }
        for k in order.iter().take(keep) {
            if let Some(p) = self.probes.get_mut(k)
                && p.slot.is_none()"""

[[patch]]
id = "probe-change-pacing-list"
why = "a fading probe listed twice, its previous cube and its new one"
paths = ["crates/aurora-viewer/src/scene/probes.rs"]
op = "literal"
find = """list.push(ProbeGpu {
                center_radius: [p.origin.x, p.origin.y, p.origin.z, p.radius],
                params: [p.ambiance.max(sky_ambiance), 1.0, weight, p.kind],"""
replace = """// aurora-local-patch: probe-change-pacing-list
            // (a probe cross-fading from its previous cube is listed twice,
            // the previous one at (1 - t) of its weight and the new one at
            // t: the shaders sum the weighted probes and divide by their
            // weights, so the pair is the mix of the two at the probe's
            // weight; without room for both, the new one alone)
            let fade = self
                .fades
                .get(k)
                .filter(|_| list.len() + 1 < self.slots as usize)
                .map(|&(old, at)| {
                    (
                        old,
                        (now.duration_since(at).as_secs_f32() / CHANGE_BLEND.as_secs_f32()).clamp(0.0, 1.0),
                    )
                });
            if let Some((old, t)) = fade {
                list.push(ProbeGpu {
                    center_radius: [p.origin.x, p.origin.y, p.origin.z, p.radius],
                    params: [p.ambiance.max(sky_ambiance), 1.0, weight * (1.0 - t), p.kind],
                    slot: [old, 0, 0, 0],
                    box_inv: p.box_inv.to_cols_array_2d(),
                });
            }
            let weight = fade.map_or(weight, |(_, t)| weight * t);
            list.push(ProbeGpu {
                center_radius: [p.origin.x, p.origin.y, p.origin.z, p.radius],
                params: [p.ambiance.max(sky_ambiance), 1.0, weight, p.kind],"""

