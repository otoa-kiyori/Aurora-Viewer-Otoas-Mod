[[patch]]
id = "probe-change-pacing-tests"
why = "the pacing during a change, the turns of the other probes, the cross-fades, the end"
paths = ["crates/aurora-viewer/src/scene/probes.rs"]
op = "literal"
find = """fn cell_probe(origin: Vec3, radius: f32, complete: bool) -> Probe {"""
replace = """// aurora-local-patch: probe-change-pacing-tests
    /// The captures finished over `frames` frames of `dt` seconds: (time,
    /// slot, origin), with `changing` set before each frame.
    fn finished_over(m: &mut ProbeManager, order: &[Key], start: Instant, frames: u32, dt: f32, changing: bool) -> Vec<(f32, u32, Vec3)> {
        let mut done = Vec::new();
        for i in 1..=frames {
            let t = i as f32 * dt;
            m.set_changing(changing);
            if let Some(c) = m.next_capture(order, Vec3::ZERO, start + Duration::from_secs_f32(t), dt)
                && c.finish
            {
                done.push((t, c.slot, c.origin));
            }
        }
        done
    }

    /// A default probe and four local probes, all captured at `start`.
    fn captured_field(start: Instant) -> (ProbeManager, Vec<Key>) {
        let mut m = ProbeManager {
            default_complete: true,
            default_last: Some(start),
            ..Default::default()
        };
        for x in 0..4 {
            let mut p = cell_probe(Vec3::new(x as f32 * 16.0, 0.0, 0.0), 8.0, true);
            p.slot = Some(1 + x as u32);
            p.last_update = Some(start);
            p.distance = x as f32 * 16.0;
            m.probes.insert(cell_key(x), p);
        }
        (m, (0..4).map(cell_key).collect())
    }

    #[test]
    fn during_a_change_the_default_probe_follows_it_and_the_others_keep_turns() {
        let start = Instant::now();
        for fps in [30.0, 50.0, 144.0, 240.0] {
            let (mut m, order) = captured_field(start);
            let dt = 1.0 / fps;
            let frames = (4.0 * fps) as u32;
            let done = finished_over(&mut m, &order, start, frames, dt, true);
            let defaults: Vec<f32> = done.iter().filter(|d| d.1 == 0).map(|d| d.0).collect();
            let locals = done.iter().filter(|d| d.1 != 0).count();
            // the default probe after every two local captures (18 faces,
            // a face a frame up to 60 fps, then at the paced rate's frames:
            // 0.3 to 0.4 s, 0.6 s at 30 fps), not every 2 s
            let per_face = (1.0 / (dt * REFRESH_FACES_PER_SEC)).ceil().max(1.0) * dt;
            let gap = 18.0 * per_face + 3.0 * dt;
            assert!(defaults.len() >= 5, "{fps} fps: {defaults:?}");
            assert!(defaults.windows(2).all(|w| w[1] - w[0] <= gap), "{fps} fps: {defaults:?}");
            // and the local probes keep two thirds of the captures
            assert!(
                locals + 2 >= 2 * defaults.len(),
                "{fps} fps: {locals} locals, {} defaults",
                defaults.len()
            );
            // with the face budget of no change
            let mut faces = 0;
            let (mut n, order) = captured_field(start);
            for i in 1..=frames {
                n.set_changing(true);
                let now = start + Duration::from_secs_f32(i as f32 * dt);
                faces += u32::from(n.next_capture(&order, Vec3::ZERO, now, dt).is_some());
            }
            assert!(faces <= (4.0 * fps.min(60.0)) as u32 + 1, "{fps} fps: {faces} faces");
        }
    }

    #[test]
    fn without_a_change_the_probes_are_paced_as_before() {
        let start = Instant::now();
        let (mut m, order) = captured_field(start);
        let done = finished_over(&mut m, &order, start, 6 * 120, 1.0 / 120.0, false);
        let defaults: Vec<f32> = done.iter().filter(|d| d.1 == 0).map(|d| d.0).collect();
        // every 2 s (RenderDefaultProbeUpdatePeriod), the rest to the others,
        // each in its own cube
        assert!(defaults.windows(2).all(|w| w[1] - w[0] >= 2.0), "{defaults:?}");
        assert!((2..=3).contains(&defaults.len()), "{defaults:?}");
        assert!(done.iter().all(|d| d.1 == 0 || d.1 == 1 + (d.2.x / 16.0) as u32), "{done:?}");
        assert!(m.fades.is_empty());
    }

    #[test]
    fn a_change_that_ends_captures_every_probe_again_default_first() {
        let start = Instant::now();
        let (mut m, order) = captured_field(start);
        let dt = 1.0 / 60.0;
        finished_over(&mut m, &order, start, 120, dt, true);
        // it ends: every probe is due, a face a frame, the default probe
        // first, then the closest
        let later = start + Duration::from_secs(2);
        let done = finished_over(&mut m, &order, later, 5 * 6, dt, false);
        let firsts: Vec<(bool, f32)> = done.iter().map(|d| (d.1 == 0, d.2.x)).collect();
        assert_eq!(firsts, vec![(true, 0.0), (false, 0.0), (false, 16.0), (false, 32.0), (false, 48.0)]);
        // then the paced refresh as before: no default capture for 2 s, and
        // no more cross-fades
        let after = later + Duration::from_secs_f32(5.0 * 6.0 * dt);
        let fades = m.fades.len();
        let next = finished_over(&mut m, &order, after, 90, dt, false);
        assert!(next.iter().all(|d| d.1 != 0), "{next:?}");
        assert_eq!(m.fades.len(), fades, "no new cross-fade once the round is done");
        assert!(!m.settling);
    }

    /// Probe entries of a frame's list at `origin`: (slot, weight).
    fn entries_at(frame: &aurora_render::ProbeFrame, origin: Vec3) -> Vec<(u32, f32)> {
        frame.probes[1..]
            .iter()
            .filter(|g| Vec3::new(g.center_radius[0], g.center_radius[1], g.center_radius[2]) == origin)
            .map(|g| (g.slot[0], g.params[2]))
            .collect()
    }

    #[test]
    fn during_a_change_a_probe_cross_fades_into_its_new_capture() {
        let world = World::new(Arc::new(crate::scene::avatar::AvatarLibrary::load()));
        let scene = Scene::new(std::path::PathBuf::new(), world.avatar_lib.clone());
        let start = Instant::now();
        for slots in [8, 3] {
            let mut m = ProbeManager {
                slots,
                default_complete: true,
                default_last: Some(start),
                // (no scan of the empty scene during the test)
                last_scan: Some(start + Duration::from_secs(1000)),
                last_frame: Some(start),
                ..Default::default()
            };
            let mut auto = cell_probe(Vec3::ZERO, 8.0, true);
            auto.last_update = Some(start);
            m.probes.insert(cell_key(0), auto);
            let boxed = Vec3::new(100.0, 0.0, 0.0);
            let mut b = cell_probe(boxed, 1.0, true);
            b.kind = -1.0;
            b.slot = Some(2);
            b.last_update = Some(start);
            m.probes.insert(Key::Object(Uuid::from_u128(1)), b);
            let dt = 1.0 / 60.0;
            let mut twins = 0;
            let mut last = Vec::new();
            for i in 1..=240u32 {
                // the change for 2 s, then 2 s without
                m.set_changing(i <= 120);
                let now = start + Duration::from_secs_f32(i as f32 * dt);
                let frame = m.update(&scene, &world, Vec3::ZERO, 0.0, now);
                let at = entries_at(&frame, Vec3::ZERO);
                // the pair weighs what the probe weighs alone: 1
                let sum: f32 = at.iter().map(|e| e.1).sum();
                assert!((sum - 1.0).abs() < 1e-5 && at.len() <= 2, "{slots} slots, frame {i}: {at:?}");
                if at.len() == 2 {
                    twins += 1;
                    assert_ne!(at[0].0, at[1].0);
                }
                // a box probe never cross-fades
                assert_eq!(entries_at(&frame, boxed).len(), 1, "{slots} slots, frame {i}");
                // no cube is listed for two probes
                let mut used: Vec<u32> = frame.probes[1..].iter().map(|g| g.slot[0]).collect();
                used.sort_unstable();
                assert!(used.windows(2).all(|w| w[0] != w[1]), "{slots} slots, frame {i}: {used:?}");
                last = at;
            }
            if slots == 8 {
                assert!(twins >= 30, "{twins} frames with a cross-fade");
            } else {
                // no free cube: the captures replace the cube in place
                assert_eq!(twins, 0);
            }
            // well after the change, one cube again and no cube held
            assert_eq!(last.len(), 1, "{last:?}");
            assert!(m.fades.is_empty() && !m.settling);
        }
    }

    #[test]
    fn where_every_slot_is_taken_a_change_spares_two_without_a_step() {
        let world = World::new(Arc::new(crate::scene::avatar::AvatarLibrary::load()));
        let scene = Scene::new(std::path::PathBuf::new(), world.avatar_lib.clone());
        let start = Instant::now();
        let mut m = ProbeManager {
            slots: 8,
            default_complete: true,
            default_last: Some(start),
            last_scan: Some(start + Duration::from_secs(1000)),
            last_frame: Some(start),
            ..Default::default()
        };
        // seven probes for the seven slots past the default's: none free
        let origins: Vec<Vec3> = (0..7).map(|x| Vec3::new(x as f32 * 12.0, 0.0, 0.0)).collect();
        for (x, o) in origins.iter().enumerate() {
            let mut p = cell_probe(*o, 8.0, true);
            p.slot = Some(1 + x as u32);
            p.last_update = Some(start);
            m.probes.insert(cell_key(x as i32), p);
        }
        let dt = 1.0 / 60.0;
        let weight = |frame: &aurora_render::ProbeFrame, o: Vec3| entries_at(frame, o).iter().map(|e| e.1).sum::<f32>();
        let mut before: Option<Vec<f32>> = None;
        let mut twins = 0;
        let mut spared = 0;
        for i in 1..=600u32 {
            // the change for 4 s, then 6 s without
            m.set_changing(i <= 240);
            let now = start + Duration::from_secs_f32(i as f32 * dt);
            let frame = m.update(&scene, &world, Vec3::ZERO, 0.0, now);
            let w: Vec<f32> = origins.iter().map(|o| weight(&frame, *o)).collect();
            // no probe's weight jumps: the spared ones fade out and back in
            if let Some(b) = &before {
                for (k, (x, y)) in b.iter().zip(&w).enumerate() {
                    assert!((x - y).abs() <= 0.08, "frame {i}, probe {k}: {x} -> {y}");
                }
            }
            twins += usize::from(origins.iter().any(|o| entries_at(&frame, *o).len() == 2));
            spared += usize::from(w.iter().filter(|x| **x == 0.0).count() >= 2);
            before = Some(w);
        }
        // during the change the farthest probes gave their cubes up, and the
        // others cross-faded into theirs
        assert!(spared >= 60, "{spared} frames with two probes spared");
        assert!(twins >= 30, "{twins} frames with a cross-fade");
        // well after it, every probe is back at its full weight
        let last = before.unwrap_or_default();
        assert!(last.iter().all(|x| (x - 1.0).abs() < 1e-3), "{last:?}");
        assert!(m.fades.is_empty() && !m.settling && m.keep() == 7);
    }

