[[patch]]
id = "probe-change-pacing-pick"
why = "the default probe after every two local captures during a change, the free cube of a local capture"
paths = ["crates/aurora-viewer/src/scene/probes.rs"]
op = "literal"
find = """let first_pass = candidate.is_some_and(|k| self.probes.get(&k).is_some_and(|p| !p.complete));
            self.updating = if default_due && !(self.default_complete && first_pass) {
                Some(Updating { key: None, face: 0 })
            } else {
                candidate.map(|k| Updating { key: Some(k), face: 0 })
            };"""
replace = """let first_pass = candidate.is_some_and(|k| self.probes.get(&k).is_some_and(|p| !p.complete));
            // aurora-local-patch: probe-change-pacing-pick
            // (during a change the default probe goes after every
            // CHANGE_LOCALS_PER_DEFAULT local captures, or at once when no
            // other probe is there)
            let default_due = !self.default_complete
                || self.default_last.is_none_or(|t| {
                    if self.changing {
                        self.locals_since_default >= CHANGE_LOCALS_PER_DEFAULT || candidate.is_none()
                    } else {
                        now.duration_since(t) >= DEFAULT_PERIOD
                    }
                });
            self.updating = if default_due && !(self.default_complete && first_pass) {
                Some(Updating {
                    key: None,
                    face: 0,
                    target: None,
                })
            } else {
                candidate.map(|k| Updating {
                    key: Some(k),
                    face: 0,
                    target: self.fade_target(k),
                })
            };"""

