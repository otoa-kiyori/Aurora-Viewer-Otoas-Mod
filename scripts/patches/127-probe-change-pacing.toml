# Reflection probes during an environment change: the sky probe follows
# the change instead of stepping every 2 s, and the local probes cross-fade
# into each new capture instead of switching to it in one frame.
#
# What: while the environment cross-fades (a sky picked in World >
# Environment, a parcel or region change, a teleport):
# - the default probe (the sky-only cube that lights and reflects what no
#   local probe covers) is captured again after every two local probe
#   captures, instead of every 2 s (RenderDefaultProbeUpdatePeriod): about
#   every 0.3 s at the paced 60 faces a second. Its cube, radiance and
#   irradiance were replaced in one go every 2 s: the light it gives moved
#   in steps of 2 s of the change;
# - the farthest two probes the slots keep give their cubes up while the
#   change runs (and the round after it): they fade out as a probe past the
#   slots does (its cubed fade over 1 s; the edge of the field and the
#   other probes' weights stay where all the slots put them), so that two
#   cube slots are free in a built-up region too, where every slot is taken;
#   they come back, captured again and fading in, once the change is over;
# - a local probe's new capture goes into a free cube slot, and the probe
#   is listed twice for 0.5 s, its previous cube at weight (1 - t) and the
#   new one at t: the shaders sum the weighted probes and divide by the
#   weights (sample_probes_pair, sample_probes_ex), so the pair shows the
#   mix of the two at the probe's own weight, with no shader change. A box
#   probe (its weight is not its fade), a probe not captured yet, or no
#   free slot (both spare slots taken by cross-fades, or so few slots that
#   none is spared: 4 or fewer): the capture replaces the cube in place, as
#   before. The
#   default probe is not cross-faded (the shaders treat the first entry of
#   the list apart).
#
# How (scene/probes.rs): the face budget is unchanged (60 faces a second,
# one face a frame at most): only the order of the captures and the cube
# they are filtered into change. When the change ends every probe is
# captured once more, the default probe first then the closest, a face a
# frame as after a settings change (`refresh`), still cross-fading: what
# was captured during the change saw a sky between the two. Without a
# change, and once that round is done, nothing differs from before: the
# same period, budget, order, slots and list, and every probe the slots
# can keep.
#
# At every probe level: level 0 has the default probe only, levels 1 and 2
# add the manual probes, which take their turns (and cross-fade, spheres
# only) as the local ones do at 3.
#
# Test variables (app.rs apply_test_overrides, docs/TESTING.md):
# AURORA_PROBES=<level>[,<count>[,<range>]], AURORA_MIRRORS=0..4 and
# AURORA_WATER_REFLECTIONS=0..4 set those settings for a launch, as the
# other overrides do; AURORA_PROBE_CHANGE_PACING=0 gives the probes as
# before during a change, for a comparison with the same build.

[[patch]]
id = "probe-change-pacing-period"
why = "how the probes are paced while the environment changes"
paths = ["crates/aurora-viewer/src/scene/probes.rs"]
op = "literal"
find = """const DEFAULT_PERIOD: Duration = Duration::from_secs(2);"""
replace = """const DEFAULT_PERIOD: Duration = Duration::from_secs(2);
// aurora-local-patch: probe-change-pacing-period
/// Local probe captures between two of the default probe's while the
/// environment changes ([`ProbeManager::set_changing`]), instead of
/// [`DEFAULT_PERIOD`]: its cube replaces the previous one in one go, and
/// every 2 s a change showed in the light in steps of 2 s of the change. A
/// count, not a period: at a low frame rate a period would take the other
/// probes' turns.
const CHANGE_LOCALS_PER_DEFAULT: u32 = 2;
/// How long a probe captured during a change cross-fades from its previous
/// cube into the new one (`ProbeManager::fades`).
const CHANGE_BLEND: Duration = Duration::from_millis(500);
/// Cube slots the probes give up while the environment changes (and in the
/// round after it), so that the cross-fades have a free cube even where
/// every slot is taken: the farthest probes kept fade out as a probe past
/// the slots does. Two: at the paced rate a local capture ends about every
/// 0.15 s, so about three cross-fades of 0.5 s run at once, one of them
/// ending as the next begins.
const CHANGE_SPARE_SLOTS: usize = 2;

/// AURORA_PROBE_CHANGE_PACING=0: the probes as before during an environment
/// change (a comparison with the same build).
pub fn change_pacing_enabled() -> bool {
    static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
    *ON.get_or_init(|| std::env::var("AURORA_PROBE_CHANGE_PACING").ok().is_none_or(|v| v.trim() != "0"))
}"""

