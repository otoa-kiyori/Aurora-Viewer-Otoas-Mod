replace = '''let mirror = f.mirror.filter(|_| self.targets.mirror.is_some());
        // aurora-local-patch: mirror-pass-plan
        // the mirror pass (mirror_pass.rs): left out when the volume where
        // mirror_tap gives its image is off the screen, or thinner than two
        // pixels in the user's view, the frame then one without a mirror
        // (the probes show); else drawn in that volume's screen rect
