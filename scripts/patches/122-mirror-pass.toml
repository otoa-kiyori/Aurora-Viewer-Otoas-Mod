id = "mirror-pass-profile-add"
why = "goes with mirror-pass-profile-fields"
paths = ["crates/aurora-viewer/src/frame_profile.rs"]
op = "literal"
find = "        p.occluded += render.occluded.unwrap_or(0) as u64;"
replace = '''p.occluded += render.occluded.unwrap_or(0) as u64;
        // aurora-local-patch: mirror-pass-profile-add
        let mirror = &render.mirror_pass;
        if mirror.found {
            match mirror.skip {
                None => {
                    p.mirror_frames[0] += 1;
                    p.mirror_draws += mirror.draws as u64;
                    p.mirror_area += mirror.area;
                }
                Some(aurora_render::mirror_pass::MirrorSkip::OffScreen) => p.mirror_frames[1] += 1,
                Some(aurora_render::mirror_pass::MirrorSkip::Tiny) => p.mirror_frames[2] += 1,
            }
        }
        p.mirror_verdicts[0] += mirror.verdicts;
        p.mirror_verdicts[1] += mirror.hidden;'''

