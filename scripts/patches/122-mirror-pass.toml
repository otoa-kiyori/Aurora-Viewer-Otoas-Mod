# The mirror pass made cheaper, with no change to a mirror on the screen
# (Aurora's own; the Legacy Viewer skips its hero probe's faces while an
# occlusion query of the probe's bounding cube finds it hidden, a frame or
# more late: LLHeroProbeManager::update, indra/newview/llheroprobemanager.cpp,
# `!mProbes[0]->mOccluded`; LLReflectionMap::doOcclusion,
# indra/newview/llreflectionmap.cpp).
#
# The planar mirror's pass draws the scene again from the mirror's camera,
# into an image up to the world's size (Preferences' mirror quality), for
# one reader: mirror_tap (common.wgsl) gives that image to the surfaces
# inside the probe's box, in front of its plane or at most 0.5 / 9.5 m
# behind it, glossier than 0.75. Its cost follows the pixels it shades.
# Now (crates/aurora-render/src/mirror_pass.rs):
# - Behind the mirror. The reflection passes' fragment shaders that shade
#   before their clip (fs_reflect, fs_terrain, fs_terrain_pbr; fs_reflect_blend
#   clipped first already, fs_sky has no clip) drop, before any shading,
#   the fragments so far behind the clip plane that their whole quad is too
#   (reflection_behind: the distance below minus four times its fine
#   derivatives and a millimetre); the others go through the late clip as
#   before, so the pixels kept and their shading are the same, and no quad
#   that keeps a lane loses one for its texture derivatives (naga writes
#   discard as OpKill / discard_fragment). Hardware clip distances would need
#   an optional device feature and two variants of the scene module. The
#   water reflection, the water's exterior, the probes and the panorama
#   share those shaders: the early test only drops what their late clip
#   drops (a clip plane of zero drops nothing), so they take it too. The
#   main view's terrain (fs_terrain without the G-buffer) takes a uniform
#   branch out of it. The mirror's draws wholly behind its clip plane (by
#   more than the clip's centimetre, plus a millimetre) are culled: the GPU
#   bin (CullFrame::mirror's sixth plane, which accepted everything), the
#   CPU lists and the blended list. Shadows are not concerned.
# - Left out. The volume where mirror_tap gives the image (the box cut by
#   that plane) projected on the screen: off the screen (two pixels of
#   margin), the frame is one without a mirror, at once; less than 2 world
#   pixels on its shorter side in the user's view, the same once 0.5 s
#   have passed since it last was not (drawn again at once when it grows
#   back). Then mirror_tap's surfaces take the probes, as with no mirror. The
#   same volume is tested on the GPU against the Hi-Z pyramid of the main
#   view's phase 1 depth (what was drawn last frame, drawn again from this
#   frame's camera, so surely there), in the same frame, before anything
#   reads the pass's draws: hidden, its CPU-built draws, its GPU bin's
#   count and its sky get no instance (shaders/mirror_test.wgsl). The pass
#   then clears its image and draws nothing that any pixel on the screen
#   reads. The verdict is read back a frame or two late, never waited for.
#   The mirror chosen stays the nearest one in view (find_mirror): a mirror
#   left out does not hand the pass to the next one, which keeps the probes
#   it has today.
# - The screen area only. The pass's scissor keeps the volume's screen
#   rect, a texel of rounding, the 0.05 fade band mirror_tap gives rays
#   leaving the image, and a texel for the filter; its culling takes that
#   sub-frustum (GPU bin, CPU lists, blended list); mirror_tap fades the
#   rays that leave the rect as those that leave the image. A surface flat
#   on the mirror reads its own point of the screen, inside the rect:
#   unchanged. A glossy surface inside the volume and not parallel to the
#   mirror (normal map, curved object) can reflect a ray out of the rect:
#   it fades to the probes there, where it showed the mirror image before.
#   A side of the scissor at the image's edge, a camera inside the volume
#   (or any point of it behind the camera plane): as before. The image is
#   still cleared whole every frame. Viewport, resolution, update rate,
#   reach and lighting are unchanged.
# - Occlusion streaming (121): what stands in front of the mirror keeps its
#   textures only while the mirror is drawn and not found hidden, and a
#   second after.
#
# Optional link to patch 121 (it applies earlier): mirror-pass-exempt-usage
# (glue_for 121's occl-stream-usage-object, DRIFT if 121 is there and the
# line is not) narrows 121's exemption of what stands in front of the
# mirror (its occl-stream-usage-object line). Without 121 there is no
# exemption to narrow: OPTIONAL-MISSING, the rest of the pass unchanged.
#
# Cost: a few plane and rect computations a frame on the render thread; one
# workgroup of 64 lanes, a 16 byte copy and its readback when the occlusion
# test runs; the bind group is made again only when the indirect buffer,
# the counts or the pyramid change. With the mirrors off or no mirror, the
# frame does what it did.
#
# Profile (AURORA_PROFILE=1): `perf summary` gets `mirror_drawn`,
# `mirror_offscreen`, `mirror_tiny`, `mirror_hidden`, `mirror_draws` and
# `mirror_area` (docs/TESTING.md).
#
# Tests: mirror_pass.rs (plane side for mirrors facing every axis and
# tilted, the cull plane against the fragment clip, the early discard's
# quads, the screen rect and its sub-frustum in front, oblique, partly off
# the screen, behind and inside the volume, the scissor's margin, the skip
# and its hold, the exemption's hold, the verdicts, the test shader and the
# reflection shaders through naga for SPIR-V and MSL), frame_profile.rs
# (the profile segment).

