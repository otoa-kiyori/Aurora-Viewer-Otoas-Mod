[[patch]]
id = "mirror-pass-profile-test"
why = "goes with mirror-pass-profile-line: what the segment says of drawn, left out and hidden frames"
paths = ["crates/aurora-viewer/src/frame_profile.rs"]
op = "literal"
find = '''    /// What the blended faces draw and what a lit fragment may walk, and
    /// which of the compared paths drew the frames.'''
replace = '''// aurora-local-patch: mirror-pass-profile-test
    /// The mirror pass's segment: shares of the frames, of the verdicts,
    /// and per frame that drew it.
    #[test]
    fn summary_tells_what_became_of_the_mirror() {
        use aurora_render::mirror_pass::{MirrorSkip, MirrorStats};
        let mut p = FrameProfile::new(true);
        let t = Instant::now();
        let drawn = MirrorStats {
            found: true,
            tested: true,
            verdicts: 1,
            draws: 30,
            area: 0.25,
            ..Default::default()
        };
        let mut lines = Vec::new();
        for i in 0..=50u64 {
            let mirror = match i % 5 {
                0 | 1 => drawn,
                2 => MirrorStats { hidden: 1, ..drawn },
                3 => MirrorStats {
                    found: true,
                    skip: Some(MirrorSkip::OffScreen),
                    ..Default::default()
                },
                _ => MirrorStats::default(),
            };
            let render = RenderStats {
                mirror_pass: mirror,
                ..Default::default()
            };
            p.lap_at(Lap::Sync, t + ms(i * 20));
            if let Some(l) = p.end_frame_at(&render, &SceneCounts::default(), &Parts::default(), t + ms(i * 20)) {
                lines.push(l);
            }
        }
        assert_eq!(lines.len(), 1, "{lines:?}");
        let l = &lines[0];
        // 51 frames: 31 drew it (10 of them hidden), 10 off the screen
        assert!(
            l.contains(
                " | mirror_drawn=0.61 mirror_offscreen=0.20 mirror_tiny=0.00 mirror_hidden=0.32 mirror_draws=30 mirror_area=0.25 | draws="
            ),
            "{l}"
        );
    }

    /// What the blended faces draw and what a lit fragment may walk, and
    /// which of the compared paths drew the frames.'''

