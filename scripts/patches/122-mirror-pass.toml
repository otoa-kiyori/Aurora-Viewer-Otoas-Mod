            // aurora-local-patch: mirror-pass-scissor
            // the mirror's pass draws its volume's screen rect only, and its
            // sky goes with its other draws when the occlusion test empties
            // them (mirror_pass.rs); the image is still cleared whole
            let mirror_now = bin == BIN_REFL_MIRROR;
            if let Some([x, y, w, h]) = mirror_plan.and_then(|p| p.scissor).filter(|_| mirror_now) {
                pass.set_scissor_rect(x, y, w, h);
            }
            bind_mesh(&mut pass, bg);
            pass.set_pipeline(&self.pipelines.refl_sky);
            match self.mirror_pass.sky_draw().filter(|_| mirror_now) {
                Some(sky) => pass.draw_indirect(sky, 0),
                None => pass.draw(0..3, 0..1),
            }'''

