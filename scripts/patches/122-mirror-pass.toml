[[patch]]
id = "mirror-pass-wgsl-tap"
why = "rays leaving the screen rect the mirror pass draws fade to the probes as those leaving the image"
paths = ["crates/aurora-render/src/shaders/common.wgsl"]
op = "literal"
fn = "mirror_tap"
find = '''    let out = max(max(-uv.x, uv.x - 1.0), max(-uv.y, uv.y - 1.0));
    w *= clamp(1.0 - out * 20.0, 0.0, 1.0);'''
replace = '''let out_image = max(max(-uv.x, uv.x - 1.0), max(-uv.y, uv.y - 1.0));
    // aurora-local-patch: mirror-pass-wgsl-tap
    // the pass draws the screen rect of the volume above only (mirror_pass.rs):
    // the rays leaving that rect fade back the same way. A surface flat on
    // the mirror reads its own point, inside the rect; with every side open
    // (1e4) nothing changes
    let rect = frame.mirror_rect;
    let out = max(out_image, max(max(rect.x - uv.x, uv.x - rect.z), max(rect.y - uv.y, uv.y - rect.w)));
    w *= clamp(1.0 - out * 20.0, 0.0, 1.0);'''

[[patch]]
id = "mirror-pass-wgsl-behind"
why = "the reflection passes drop what lies well behind their clip plane before shading it, whole quads only"
paths = ["crates/aurora-render/src/shaders/common.wgsl"]
op = "literal"
find = '''fn reflection_clip(world_pos: vec3<f32>) -> bool {
    return in_reflection_pass() && dot(frame.clip_plane.xyz, world_pos) + frame.clip_plane.w < 0.0;
}'''
replace = '''fn reflection_clip(world_pos: vec3<f32>) -> bool {
    return in_reflection_pass() && dot(frame.clip_plane.xyz, world_pos) + frame.clip_plane.w < 0.0;
}

// aurora-local-patch: mirror-pass-wgsl-behind
/// Reflection passes, before any shading: the fragment lies so far behind
/// the clip plane that its whole quad does, every lane of which
/// `reflection_clip` drops after its shading anyway. Its row and column
/// neighbours are within its fine derivatives; four times them and a
/// millimetre also cover the fourth lane, unless the depth changes fourfold
/// between two pixels of the quad (within a third of a pixel of the
/// surface's vanishing line); coarse derivatives (one lane's for the quad,
/// as Metal's dfdx may give) cover it the same (mirror_pass.rs tests both).
/// So a quad that keeps a lane keeps all of them
/// for that lane's texture derivatives: naga writes `discard` as OpKill
/// (SPIR-V) and discard_fragment (MSL), after which a lane need not take
/// part in them. The fragments kept and their shading stay the same; the
/// work behind the mirror or under the water goes. Out of the reflection
/// passes (the main view's terrain): a uniform branch, nothing else.
fn reflection_behind(world_pos: vec3<f32>) -> bool {
    if (!in_reflection_pass()) {
        return false;
    }
    let d = dot(frame.clip_plane.xyz, world_pos) + frame.clip_plane.w;
    return d < -4.0 * fwidthFine(d) - 1e-3;
}'''

[[patch]]
id = "mirror-pass-wgsl-reflect"
why = "goes with mirror-pass-wgsl-behind: the reflection passes' objects"
paths = ["crates/aurora-render/src/shaders/object.wgsl"]
op = "literal"
find = '''fn fs_reflect(in: VsOut, @builtin(front_facing) front: bool) -> @location(0) vec4<f32> {
    let rec = records[in.record];'''
replace = '''fn fs_reflect(in: VsOut, @builtin(front_facing) front: bool) -> @location(0) vec4<f32> {
    // aurora-local-patch: mirror-pass-wgsl-reflect
    // well behind the clip plane: gone before the shading (reflection_behind)
    if (reflection_behind(in.world_pos)) {
        discard;
    }
    let rec = records[in.record];'''

