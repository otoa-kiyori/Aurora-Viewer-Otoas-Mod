// aurora-local-patch: mirror-pass-cull-to-view
/// Draws of `list` whose bounding sphere touches every one of `planes` (the
/// mirror pass's: its scissor's sub-frustum and its clip plane,
/// mirror_pass::cull_planes).
fn cull_to_planes(planes: &[[f32; 4]; 6], list: &[ShadowCaster]) -> Vec<DrawCmd> {
    list.iter()
        .filter(|c| crate::gpu_cull::sphere_in(planes, c.center, c.radius))
        .map(|c| c.cmd)
        .collect()
}'''

[[patch]]
id = "mirror-pass-blend-order"
why = "the mirror's blended list culled by its planes"
paths = ["crates/aurora-render/src/renderer.rs"]
op = "literal"
find = '''/// The mirror's blended faces (`DrawLists::reflection_blend`) that its view
/// of `view_proj` touches: the first `rigged` of `list` in their order, then
/// the others back to front from the mirror's camera at `eye` (its own
/// distances, not the main view's: what is near the main camera may be far in
/// the mirror). Equal distances keep their order.
fn mirror_blend_order(view_proj: Mat4, eye: Vec3, list: &[DrawCmd], rigged: usize) -> [Vec<DrawCmd>; 2] {
    let rigged = rigged.min(list.len());
    let first = cull_cmds_to_view(view_proj, &list[..rigged]);
    let mut rest = cull_cmds_to_view(view_proj, &list[rigged..]);'''
replace = '''/// The mirror's blended faces (`DrawLists::reflection_blend`) that its
/// culling `planes` let through (mirror_pass::cull_planes): the first
/// `rigged` of `list` in their order, then the others back to front from the
/// mirror's camera at `eye` (its own distances, not the main view's: what is
/// near the main camera may be far in the mirror). Equal distances keep their
/// order.
// aurora-local-patch: mirror-pass-blend-order
fn mirror_blend_order(planes: &[[f32; 4]; 6], eye: Vec3, list: &[DrawCmd], rigged: usize) -> [Vec<DrawCmd>; 2] {
    let rigged = rigged.min(list.len());
    let first = cull_cmds_to_planes(planes, &list[..rigged]);
    let mut rest = cull_cmds_to_planes(planes, &list[rigged..]);'''

