# Optional volumetric light rays from the sun or the moon, off by default.
#
# Source: the code of this manifest is the code of the commit
# https://github.com/rickrizzlers/Aurora-Sun-Moon-Preview/commit/c5d71a4a61c9ef7e6f280dc2059ca87703e755b1
# ("Add optional volumetric rays from the sun and moon"), from a fork of this
# same viewer, ported here as local patches. Its new file is
# files/sky-rays/volume_depth.rs, unchanged below its header.
#
# What it does: after the scene is drawn, a full-screen pass marches the view
# ray from the camera to the surface (at most 128 m, and no farther than the
# last shadow cascade), sampling the sun or moon shadow cascades along the
# way, and adds the light scattered by the lit parts of the air to the HDR
# colour (additive blend, alpha untouched). The light follows the
# shadow-casting body: sun_color, with the EEP moon brightness for the moon
# when the classic sky is not in use. It needs shadows: the pass is drawn
# only with shadows on, outside a cut-out photo. Under MSAA a small pass
# first writes the nearest sample of the final multisampled depth into the
# single-sample depth (volume_depth.rs), so the rays stop at the rigged
# blended faces drawn after the prepass too.
#
# Settings (Graphics > Light, under the shadows, greyed out with shadows off):
#  - sky_rays_enabled "Volumetric Sun & Moon rays": false
#  - sky_ray_source "Ray source": 0 (0 Automatic: whichever of sun or moon
#    is up; 1 Sun: only while the sun is up; 2 Moon: only while the sun is
#    down and the moon up)
#  - sky_ray_strength "Ray strength": 0.8 (0 to 4)
#  - sky_ray_fade "Near fade": 3.0 m (0 to 40)
#  - sky_ray_samples "Ray samples": 32 (16 to 256)
# Settings::directional_rays brings each value into its range every frame and
# gives the renderer zeros when the effect is off or its body is down.
#
# Demo: AURORA_DEMO_SKY_RAYS=sun|moon puts the demo day's sun (or moon) up
# at 26 degrees (azimuth 300) and the other body down, moon brightness 0.75.
#
# Adaptations to this tree (the behaviour, defaults, setting names and text
# are the commit's):
#  - FrameU / Frame (renderer.rs, common.wgsl): the commit inserts sky_rays
#    between the `photo` field and its doc comment; here it goes right after
#    `aurora` with a doc comment of its own. Same place in the layout (after
#    aurora, before photo) in both the Rust and the WGSL struct.
#  - Pipelines (renderer.rs): likewise, sky_rays goes right after `sky`, not
#    between `clouds_weather` and its doc comment.
#  - FrameParams (types.rs): the field's doc comment also names where it is
#    set.
#  - Every insertion is anchored on this tree's lines (the commit's base is
#    the fork's tree); the text keys are added after the same last key of
#    each catalogue as in the commit.
# Nothing else is changed: the shader, the depth resolve, its test and the
# settings test are the commit's code.
#
# Off, it costs no work per frame: directional_rays gives zeros and the pass
# (render_view, `f.shadows && !f.cutout && f.sky_rays[0] > 0.0`) and the
# resolve are skipped; what stays is one more pipeline built with the scene
# ones and, under MSAA, the resolve's small pipeline made with the targets.
# On, under MSAA, the resolve overwrites the single-sample prepass depth for
# the rest of the frame (the cursor's depth pick and the passes after it read
# it), as the commit does.
#
# Tests: the commit's own, settings.rs directional_ray_tests
# (follows_the_body_that_casts_shadows: off by default, Automatic follows
# the body that is up, Moon only with the sun down, Sun only with the sun
# up) and volume_depth.rs
# (volume_depth_includes_late_blended_faces_and_nearest_msaa_sample_on_gpu:
# on a GPU, the resolved depth includes the late blended faces and takes the
# nearest MSAA sample; skipped without an adapter); the shader validation,
# i18n parity and theme guard tests cover the rest.
# Apply or skip the whole file, not one patch of it.

# ------------------------------------------------------------------- text

