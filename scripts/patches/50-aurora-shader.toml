# aurora-shader: a generic host for user post effects (WGSL) on the finished
# world image, loaded from <config>/aurora-shader/ (installed by the separate
# aurora-shader repository; this patch set knows no effect). The module comes
# in whole with `add_file` (files/aurora-shader/), plus seven small anchors
# in the code (A1 to A7) and two lines of docs/TESTING.md.
# Binding contracts v1 (frozen) and v2 (v1 plus the blended faces' depth),
# chosen and checked per effect in files/aurora-shader/user_post_library.rs:
# a v1 effect is compiled, bound and fed as before v2.
#
# The chain sits between tone mapping and the photo look, before the spatial
# anti-aliasing of the AA setting, so its own edges are smoothed like the
# scene's:
#   SMAA:       tone map -> user chain -> SMAA -> [photo look] -> scene_target
#   FXAA:       tone map (its FXAA off) -> user chain -> host FXAA -> ...
#   MSAA:       (resolved scene) tone map -> user chain -> host FXAA masked
#               to the chain's own edges -> ...
#   TAA, FSR:   (resolved scene) tone map -> user chain -> host temporal
#               resolve of what the chain changed (the effects read the
#               jittered depth: their lines would move every frame), with
#               the motion vectors -> ... (AURORA_SHADER_TEMPORAL=0: the
#               masked FXAA as under MSAA; =always: the resolve under
#               every AA, for comparisons)
#   None:       tone map -> user chain -> ...
# so the selection outline, RLVa's spheres, name tags, HUDs and the interface
# stay on top, and photos (Capture::Snapshot) include it. Without effects
# the frame is the unpatched one (same targets, same passes).

[[patch]]
id = "aurora-shader-host"
why = "the host module: configure(), the GPU chain, the timer"
op = "add_file"
paths = ["crates/aurora-render/src/user_post.rs"]
source = "files/aurora-shader/user_post.rs"

[[patch]]
id = "aurora-shader-host-config"
why = "the strict TOML subset of config.toml and of the effect headers"
op = "add_file"
paths = ["crates/aurora-render/src/user_post_config.rs"]
source = "files/aurora-shader/user_post_config.rs"

[[patch]]
id = "aurora-shader-host-library"
why = "the folder watcher, naga validation and reflection, the contract checks"
op = "add_file"
