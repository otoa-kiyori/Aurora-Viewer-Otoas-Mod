[[patch]]
id = "ao-over-scripted-smart-sit"
why = "Smart sit keeps a scripted sit of our agent, as the seat's own; a worn object's is replaced"
paths = ["crates/aurora-viewer/src/ao/runtime.rs"]
op = "literal"
fn = "update_with_easing"
find = "State::Sitting => set.sits && !(set.smart && frame.seat_animations),"
replace = """// aurora-local-patch: ao-over-scripted-smart-sit
                    // A scripted sit of our agent may be the seat's (its
                    // setter is not known): Smart sit keeps it like the
                    // seat's animations. A worn object's is not the seat's
                    // (AOEngine::foreignAnimations).
                    State::Sitting => {
                        set.sits
                            && !(set.smart
                                && (frame.seat_animations
                                    || scripted
                                        .iter()
                                        .any(|o| o.state == State::Sitting && o.source == super::scripted::Source::Agent)))
                    }"""

