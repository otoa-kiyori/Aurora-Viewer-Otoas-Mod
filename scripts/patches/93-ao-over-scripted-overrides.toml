[[patch]]
id = "ao-over-scripted-methods"
why = "Runtime::scripted_overrides and note_command feed the tracker"
paths = ["crates/aurora-viewer/src/ao/runtime.rs"]
op = "literal"
find = "pub fn suppressed_locomotion(&self) -> Option<PlayingAnimation> {"
replace = """/// This frame's scripted state overrides (`scripted::Tracker::update`):
    /// the signals this runtime stopped or starts again keep their state.
    // aurora-local-patch: ao-over-scripted-methods
    pub fn scripted_overrides(
        &mut self,
        raw: &[PlayingAnimation],
        context: &super::scripted::Context,
        source_of: impl FnMut(&Uuid) -> Option<super::scripted::Source>,
        now: Instant,
    ) -> Vec<super::scripted::Override> {
        let held: Vec<Uuid> = self
            .suppressed
            .keys()
            .copied()
            .chain(self.restoring.map(|(_, signal, _)| signal.id))
            .collect();
        self.scripted.update(raw, context, source_of, &held, now)
    }
    /// Every command sent (`App::send_from`): our own animation starts are
    /// never scripted overrides.
    pub fn note_command(&mut self, command: &aurora_net::NetCommand, now: Instant) {
        self.scripted.note_command(command, now);
    }
    pub fn suppressed_locomotion(&self) -> Option<PlayingAnimation> {"""

