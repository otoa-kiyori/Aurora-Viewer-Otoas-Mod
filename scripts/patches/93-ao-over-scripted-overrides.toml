# With the AO on, its animations win over scripted animation state overrides
# (llSetAnimationOverride: a worn AO script, a vehicle, a HUD, furniture).
#
# The simulator plays an override's own animation in place of the stock state
# animation, and the viewer is never told which state it stands for. The AO
# picked its state only from the stock animations, so it played nothing for
# that state and the scripted animation played alone, for us and for everyone.
#
# Now an override is told apart (ao/scripted.rs): a signal that is not a stock
# animation nor the sit's cover, that this viewer did not ask for (every
# AgentAnimation start sent is logged), whose source (AnimationSourceList) is
# our agent, one of our attachments or our seat, while no stock signal of its
# state plays. The simulator may give the override our agent or the object
# that set it as its source, so both are taken. An attachment's animation is
# taken only when it starts at a change of state (1.5 s), so a worn object's
# own animation started at another time (a hold, a dance) stays. Its state is
# told from the seat, the flight, the keys, the speed, the ground contact and
# the body turn; a ground sit and the air without flight (jumps, falls,
# landings) are not told, and their overrides stay.
#
# The runtime then treats the override as that state's stock clip: the AO's
# animation replaces it and masks it here, and for the steady states it is
# stopped on the simulator and started again when the AO lets go (AO off or
# paused, no animation for the state), the same pair as for the stock clips
# (AOEngine::enable, indra/newview/aoengine.cpp). Sits use the sit options
# unchanged: Override sits off keeps the scripted sit; Smart sit keeps it when
# the seat plays animations (as before) or when its source is our agent (the
# setter is not known, it may be the seat); a worn object's sit is replaced
# like the stock sit (cover and AO sit started, never stopped). With Smart sit
# off, a seat's own animation playing without the stock sit is now replaced by
# the AO's sit too (it used to play alone).
#
# The Legacy Viewer's AO loses to overrides: AOEngine::override and
# AOSet::getStateByRemapID (indra/newview/aoset.cpp) only know the stock state
# animations. This patch deliberately differs: the AO wins.
#
# Tests: in files/ao-over-scripted-overrides/scripted.rs (state inference,
# detection by source and timing, our own starts, known overrides held and
# restarted, the stand take-over and release, a stock signal winning, a state
# without an AO animation, the sit options). Retire this whole file if
# upstream handles scripted overrides. Apply or skip the whole file, not one
# patch of it. Fits on top of 94 (ao-sit-cover-order) and 95
# (ao-repair-any-loop).

[[patch]]
