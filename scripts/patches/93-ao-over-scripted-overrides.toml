[[patch]]
id = "ao-over-scripted-source"
why = "World::own_animation_source: our agent, an attachment, our seat or another object"
paths = ["crates/aurora-viewer/src/world/mod.rs"]
op = "literal"
find = "/// AOEngine::foreignAnimations: only the seat/linkset can cancel smart"
replace = """/// Who started `id` on our avatar (AnimationSourceList): our agent, one of
    /// our attachments, our seat (its linkset) or another object; the closest
    /// when several did. None without a known source.
    // aurora-local-patch: ao-over-scripted-source
    pub fn own_animation_source(&self, id: &Uuid) -> Option<crate::ao::scripted::Source> {
        use crate::ao::scripted::Source;
        let seat = self
            .objects
            .index_of_uuid(&self.agent_id)
            .and_then(|i| self.objects.get(i))
            .and_then(|avatar| avatar.parent_key());
        self.animation_sources
            .iter()
            .filter(|(_, motions)| motions.contains(id))
            .map(|(source, _)| {
                if *source == self.agent_id {
                    return Source::Agent;
                }
                let Some(mut object) = self.objects.index_of_uuid(source).and_then(|i| self.objects.get(i)) else {
                    return Source::Other;
                };
                let mut visited = HashSet::new();
                while visited.insert(object.key) {
                    if object.is_avatar() {
                        return if object.full_id == self.agent_id {
                            Source::Attachment
                        } else {
                            Source::Other
                        };
                    }
                    if Some(object.key) == seat {
                        return Source::Seat;
                    }
                    let Some(next) = self.objects.parent_of(object).and_then(|i| self.objects.get(i)) else {
                        return Source::Other;
                    };
                    object = next;
                }
                Source::Other
            })
            .min()
    }

    /// AOEngine::foreignAnimations: only the seat/linkset can cancel smart"""
