# ----------------------------------------------------------------- the docs

[[patch]]
id = "radio-strict-cert-testing-doc"
why = "what to look for: a refused station"
paths = ["docs/TESTING.md"]
op = "literal"
required = false
find = '''  A station whose certificate fails that check (expired, self-signed, for
  another name) still plays: the radio button carries a red warning sign,
  its tooltip says in red what is wrong (an expiry with its date, in local
  time), and the nearby chat says it once per station and session. The log
  gives `certificate refused by the system (…), playing anyway`. Any
  `https://` station whose certificate has expired shows it.'''
replace = '''A station whose certificate fails that check (expired, self-signed, for
  another name) is refused (local patch set): it stays silent, the radio
  button carries a red warning sign, its tooltip says in red what is wrong
  and that the station was refused (an expiry with its date, in local
  time), and the nearby chat says it once per station and session. The log
  gives `certificate refused by the system (…), station not played`. Any
  `https://` station whose certificate has expired shows it.
  <!-- // aurora-local-patch: radio-strict-cert-testing-doc -->'''

[[patch]]
id = "radio-strict-cert-architecture"
why = "the aurora-audio row: tls.rs refuses"
paths = ["ARCHITECTURE.md"]
op = "literal"
required = false
find = '''`tls.rs` turns a failed certificate (expired, self-signed, another name…) into a `CertificateIssue` carried by `StreamStatus::Playing`, so the station plays and the viewer warns in red, the handshake signatures still checked.'''
replace = '''`tls.rs` refuses a failed certificate (expired, self-signed, another name…) and keeps its `CertificateIssue`, carried by `StreamError::Certificate`, so the viewer says in red why the station stays silent (local patch set) <!-- // aurora-local-patch: radio-strict-cert-architecture -->.'''

# --------------------------------------------------------------------- guards

[[guard]]
id = "radio-cert-assertion"
why = "a certificate verifier of the audio code says yes on its own: a lenient radio verifier came back (118-radio-strict-certificates)"
paths = ["crates/aurora-audio/**/*.rs"]
level = "fail"
pattern = 'ServerCertVerified::assertion\s*\('

[[guard]]
id = "radio-cert-new-verifier"
why = "a file of the audio code other than the patched tls.rs builds its own TLS client or verifier: it may accept a failing certificate (reported as file:1)"
paths = ["crates/aurora-audio/**/*.rs"]
level = "fail"
# Whole-file match: the lookahead skips the file that carries the strict
# verifier's marker (tls.rs once radio-strict-cert-verifier applied).
pattern = '''\A(?![\s\S]*?aurora-local-patch: radio-strict-cert-verifier\b)[\s\S]*?(?:\.dangerous\s*\(\s*\)|client::danger\b|\bServerCertVerifier\b|ClientConfig::builder|danger_accept_invalid|NoCertificateVerification)'''
