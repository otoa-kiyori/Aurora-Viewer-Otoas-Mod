fn = "open_with_origin"
find = '''        let head = read_head(&mut reader)?;
        // the handshake is over once a reply came back
        certificate = issue.and_then(|slot| *slot.lock()).or(certificate);'''
replace = '''let head = read_head(&mut reader).map_err(|e| refused(issue.as_ref(), e))?;
        // aurora-local-patch: radio-strict-cert-http-reply
        // the verifier refuses a failed certificate, so no reply comes under
        // one; should one ever come, it is refused all the same
