[[patch]]
id = "radio-strict-cert-ui-test"
why = "upstream's test played a station under a failed certificate: it is refused, its status and red line say why"
paths = ["crates/aurora-viewer/src/ui/audio.rs"]
op = "regex"
dotall = true
pattern = '''    #\[test\]\n    fn a_station_under_a_failed_certificate_plays_with_its_warning\(\) \{\n.*?\n    \}\n'''
replace = '''    #[test]
    fn a_station_refused_for_its_certificate_says_why_in_red() {
        // aurora-local-patch: radio-strict-cert-ui-test
        use crate::media::filter::Verdict;
        use aurora_audio::{CertificateIssue, StreamError, StreamStatus};
        let audio = AudioSettings::default();
        // 2026-11-18 12:00 UTC: the same year in every time zone
        let expired = CertificateIssue::Expired {
            not_after: Some(1_795_003_200),
        };
        let refused = StreamStatus::Error(StreamError::Certificate(expired));
        let status = MusicStatus::read(true, true, &audio, false, Verdict::Allow, Some(&refused));
        assert_eq!(status, MusicStatus::Error(StreamError::Certificate(expired)));
        assert_eq!(status.certificate(), Some(expired), "the red sign and line");
        assert_eq!(status.text(), MusicStatus::Error(StreamError::Tls).text(), "it does not play");
        // nothing that plays carries a certificate warning
        assert_eq!(MusicStatus::Playing(Some(expired)).certificate(), None);
        assert_eq!(MusicStatus::Playing(None).certificate(), None);
        assert_eq!(MusicStatus::Error(StreamError::Tls).certificate(), None);
        assert_eq!(MusicStatus::Connecting.certificate(), None);
        // the date of the expiry, once readable
        assert!(certificate_warning(expired).contains("2026"), "{}", certificate_warning(expired));
        let issues = [
            expired,
            CertificateIssue::Expired { not_after: None },
            CertificateIssue::NotYetValid,
            CertificateIssue::Untrusted,
            CertificateIssue::WrongName,
            CertificateIssue::Revoked,
            CertificateIssue::Other,
        ];
        let texts: std::collections::HashSet<_> = issues.iter().map(|issue| certificate_warning(*issue)).collect();
        assert_eq!(texts.len(), issues.len(), "each issue has its own words: {texts:?}");
        // every one ends saying the station was refused
        let refusal = aurora_i18n::tr!("music-certificate-warning", reason = "");
        assert!(!refusal.trim().is_empty());
        for text in &texts {
            assert!(text.ends_with(&refusal), "{text}");
        }
    }
'''

