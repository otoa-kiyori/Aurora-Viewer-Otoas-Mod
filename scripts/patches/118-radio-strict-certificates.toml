replace = '''// aurora-local-patch: radio-strict-cert-refused-fn
/// `error`, or the refusal of the certificate when the verifier refused it
/// during this connection's handshake (`tls.rs`).
fn refused(issue: Option<&IssueSlot>, error: HttpError) -> HttpError {
    match issue.and_then(|slot| *slot.lock()) {
        Some(issue) => HttpError::Certificate(issue),
        None => error,
    }
}

