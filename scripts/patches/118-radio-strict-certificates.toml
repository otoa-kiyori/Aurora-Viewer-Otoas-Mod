# Parcel music: a station whose certificate fails verification is refused
# again, never played.
#
# Upstream made the radio play an `https` station whose certificate is
# expired, not valid yet, self-signed, from an untrusted issuer, for another
# name or revoked, with a red warning. This patch set refuses such a
# connection, as Aurora did before: a certificate that cannot be verified
# says nothing about who sends the stream, and the parcel picks the URL, not
# the resident. There is no setting to turn the refusal off.
#
# The cut is at the root: `tls.rs` builds the one certificate verifier of
# every radio connection (`client_config`, called by `http::connect`, which
# serves the first connection, each redirect, each reconnect and each `.m3u`
# / `.pls` hop; the ICY metadata comes in the same stream). Its verifier
# (`Lenient` upstream, `Strict` here) now returns the platform verifier's
# verdict unchanged: a certificate failure stays an error and the handshake
# stops. It only keeps the reason, classified as upstream does
# (`CertificateIssue`), for the viewer. `http::open_with_origin` turns a
# handshake that failed so into `HttpError::Certificate`, and refuses a reply
# if the slot is ever filled anyway; `StreamError::Certificate` carries the
# reason to the interface. `StreamStatus::Playing { certificate }` stays in
# the types but is always `None`.
#
# What the user still sees for a refused station: upstream's red sign on the
# radio button, its tooltip "Can't play: Secure connection failed" and, in
# red, the reason, for example "This radio's security certificate has
# expired. The radio was refused because its certificate could not be
# verified." (an expiry with its date, in local time); the same in both bar
# styles; and that sentence once per station and session in the nearby chat
# as a Warning notice (the plain error notice stays quiet for it, so it is
# said once). Upstream's "The radio plays, but its connection is not secure"
# is reworded in English, French and Japanese; the community catalogues
# lose their translation of it and show the English. Other TLS failures and plain `http`
# stations keep upstream's behaviour; the media filter (84, 85) still
# decides before any connection.
#
# Guards (both "fail", like 76's and 85's tripwires): no `ServerCertVerified`
# assertion anywhere in the audio crate (a verifier that says yes on its own
# is exactly a lenient one), and no new file of the audio crate that builds
# a client configuration or a certificate verifier of its own (`.dangerous()`,
# `rustls::client::danger`, `ServerCertVerifier`, `ClientConfig::builder`,
# `danger_accept_invalid_*`, `NoCertificateVerification`) besides `tls.rs`.
#
# Tests: tls.rs `strict_tests` (pure: the verifier fed by a real WebPKI
# verifier over a local test root, no socket): expired, self-signed,
# untrusted issuer and wrong name are refused with their kind kept, a valid
# certificate passes with nothing kept; stream.rs (the refusal's error
# class); ui/audio.rs (the refused station's status, red sign and texts);
# parcel_music.rs (the plain error notice stays quiet). http.rs's loopback
# test now expects the refusal of a self-signed local station; it needs a
# local TCP server. Apply or skip the whole file, not one patch of it.

# ------------------------------------------------------------- the verifier

[[patch]]
id = "radio-strict-cert-doc"
why = "the module's description: a failed certificate is refused"
paths = ["crates/aurora-audio/src/tls.rs"]
op = "regex"
dotall = true
pattern = '''\A//! TLS of internet radio: a station whose certificate fails the platform\n//! check still plays, and the viewer is told why\..*?failure stays an error\.\n'''
replace = '''//! TLS of internet radio: a station whose certificate fails the platform
//! check is refused, and the viewer is told why.
//!
//! // aurora-local-patch: radio-strict-cert-doc
//! Local patch set (118-radio-strict-certificates): the certificate of an
//! `https` station is checked by the platform verifier (#1628) and a failure
//! (expired, not valid yet, self-signed or untrusted, another name, revoked)
//! ends the handshake, as every other TLS failure does. The verifier only
//! keeps the reason (`CertificateIssue`), so the viewer can say why the
//! station stays silent. The Legacy Viewer hands the URL to
//! FMOD::System::createStream (LLStreamingAudio_FMODSTUDIO::startInternetStream,
//! indra/llaudio/llstreamingaudio_fmodstudio.cpp); this is stricter on
//! purpose.
'''

[[patch]]
id = "radio-strict-cert-struct"
why = "the radio's verifier wraps any verifier (the platform's, or a test's) and is no longer lenient"
paths = ["crates/aurora-audio/src/tls.rs"]
op = "literal"
find = '''/// The platform verifier, a certificate failure turned into a reported issue.
#[derive(Debug)]
struct Lenient {
    inner: Arc<rustls_platform_verifier::Verifier>,
    issue: IssueSlot,
}

impl ServerCertVerifier for Lenient {'''
replace = '''/// The platform verifier, its verdict unchanged; the reason of a refused
/// certificate is kept for the viewer. // aurora-local-patch: radio-strict-cert-struct
#[derive(Debug)]
struct Strict {
    inner: Arc<dyn ServerCertVerifier>,
    issue: IssueSlot,
}

impl ServerCertVerifier for Strict {'''

[[patch]]
id = "radio-strict-cert-verifier"
why = "the root cut: a certificate failure stays an error, nothing says yes in its place"
paths = ["crates/aurora-audio/src/tls.rs"]
op = "replace_fn_body"
fn = "verify_server_cert"
impl = "ServerCertVerifier for Strict"
expect_sig = 'fn verify_server_cert\( &self, end_entity: &CertificateDer<._>, intermediates: &\[CertificateDer<._>\], server_name: &ServerName<._>, ocsp_response: &\[u8\], now: UnixTime, \) -> Result<ServerCertVerified, rustls::Error>'
body = '''
// Local patch set (118): the verdict is returned as it is; a refused
// certificate only leaves its reason in the slot.
let verdict = self
    .inner
    .verify_server_cert(end_entity, intermediates, server_name, ocsp_response, now);
if let Err(rustls::Error::InvalidCertificate(error)) = &verdict {
    let issue = classify(error, end_entity, now);
    log::warn!("music stream: {server_name:?} certificate refused by the system ({error}), station not played: {issue:?}");
    *self.issue.lock() = Some(issue);
}
verdict
'''

