/// Local patch set (118): the radio's verifier refuses every certificate
/// failure and keeps its kind; a valid certificate passes. A real WebPKI
/// verifier over a test root stands for the platform's: no socket, no
/// system store.
#[cfg(test)]
mod strict_tests {
    // aurora-local-patch: radio-strict-cert-tests
    use super::*;
    use rcgen::{BasicConstraints, CertificateParams, ExtendedKeyUsagePurpose, IsCa, Issuer, KeyPair};

    /// 2026-11-19 00:00:00 UTC.
    const NOW: UnixTime = UnixTime::since_unix_epoch(std::time::Duration::from_secs(1_795_046_400));

    fn authority() -> (CertificateParams, KeyPair, CertificateDer<'static>) {
        let mut params = CertificateParams::new(Vec::<String>::new()).unwrap();
        params.is_ca = IsCa::Ca(BasicConstraints::Unconstrained);
        params.not_before = rcgen::date_time_ymd(2020, 1, 1);
        params.not_after = rcgen::date_time_ymd(2040, 1, 1);
        let key = KeyPair::generate().unwrap();
        let der = params.self_signed(&key).unwrap().der().clone();
        (params, key, der)
    }

    fn station_params(not_after: (i32, u8, u8)) -> CertificateParams {
        let mut params = CertificateParams::new(vec!["radio.example".to_string()]).unwrap();
        params.extended_key_usages = vec![ExtendedKeyUsagePurpose::ServerAuth];
        params.not_before = rcgen::date_time_ymd(2020, 1, 1);
        params.not_after = rcgen::date_time_ymd(not_after.0, not_after.1, not_after.2);
        params
    }

    fn station(authority: &(CertificateParams, KeyPair, CertificateDer<'static>), not_after: (i32, u8, u8)) -> CertificateDer<'static> {
        let key = KeyPair::generate().unwrap();
        let issuer = Issuer::from_params(&authority.0, &authority.1);
        station_params(not_after).signed_by(&key, &issuer).unwrap().der().clone()
    }

    /// The strict verifier's verdict on `leaf` for `name`, trusting `root`,
    /// and the reason it kept.
    fn verdict(root: &CertificateDer<'static>, leaf: &CertificateDer<'_>, name: &str) -> (bool, Option<CertificateIssue>) {
        let mut roots = rustls::RootCertStore::empty();
        roots.add(root.clone()).unwrap();
        let inner = rustls::client::WebPkiServerVerifier::builder_with_provider(Arc::new(roots), provider())
            .build()
            .unwrap();
        let issue = IssueSlot::default();
        let strict = Strict {
            inner,
            issue: issue.clone(),
        };
        let name = ServerName::try_from(name.to_string()).unwrap();
        let result = strict.verify_server_cert(leaf, &[], &name, &[], NOW);
        if let Err(error) = &result {
            assert!(matches!(error, rustls::Error::InvalidCertificate(_)), "{error:?}");
        }
        let kept = *issue.lock();
        (result.is_ok(), kept)
    }

    #[test]
    fn a_valid_certificate_still_plays() {
        let ca = authority();
        let leaf = station(&ca, (2030, 1, 1));
        assert_eq!(verdict(&ca.2, &leaf, "radio.example"), (true, None));
    }

    #[test]
    fn an_expired_certificate_is_refused() {
        let ca = authority();
        // ends 2026-11-18 00:00:00 UTC, the day before NOW
        let leaf = station(&ca, (2026, 11, 18));
        assert_eq!(
            verdict(&ca.2, &leaf, "radio.example"),
            (
                false,
                Some(CertificateIssue::Expired {
                    not_after: Some(1_794_960_000)
                })
            )
        );
    }

    #[test]
    fn a_self_signed_certificate_is_refused() {
        let ca = authority();
        let key = KeyPair::generate().unwrap();
        let leaf = station_params((2030, 1, 1)).self_signed(&key).unwrap().der().clone();
        assert_eq!(verdict(&ca.2, &leaf, "radio.example"), (false, Some(CertificateIssue::Untrusted)));
    }

    #[test]
    fn a_certificate_from_an_untrusted_issuer_is_refused() {
        let trusted = authority();
        let other = authority();
        let leaf = station(&other, (2030, 1, 1));
        assert_eq!(
            verdict(&trusted.2, &leaf, "radio.example"),
            (false, Some(CertificateIssue::Untrusted))
        );
    }

    #[test]
    fn a_certificate_for_another_name_is_refused() {
        let ca = authority();
        let leaf = station(&ca, (2030, 1, 1));
        assert_eq!(verdict(&ca.2, &leaf, "other.example"), (false, Some(CertificateIssue::WrongName)));
    }
}'''

