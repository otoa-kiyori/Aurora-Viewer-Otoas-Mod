[[patch]]
id = "radio-strict-cert-http-test"
why = "upstream's loopback test played a self-signed station: it is refused, with its kind (needs a local TCP server)"
paths = ["crates/aurora-audio/src/http.rs"]
op = "regex"
dotall = true
pattern = '''    #\[test\]\n    fn https_plays_a_self_signed_station_and_says_so\(\) \{\n.*?\n    \}\n'''
replace = '''    #[test]
    fn https_refuses_a_self_signed_station_and_says_why() {
        // aurora-local-patch: radio-strict-cert-http-test
        let rcgen::CertifiedKey { cert, signing_key } = rcgen::generate_simple_self_signed(vec!["127.0.0.1".to_string()]).unwrap();
        let provider = Arc::new(rustls::crypto::aws_lc_rs::default_provider());
        let config = rustls::ServerConfig::builder_with_provider(provider)
            .with_safe_default_protocol_versions()
            .unwrap()
            .with_no_client_auth()
            .with_single_cert(
                vec![cert.der().clone()],
                rustls::pki_types::PrivatePkcs8KeyDer::from(signing_key.serialize_der()).into(),
            )
            .unwrap();
        let listener = std::net::TcpListener::bind("127.0.0.1:0").unwrap();
        let url = format!("https://{}/stream", listener.local_addr().unwrap());
        let server = std::thread::spawn(move || {
            let (mut sock, _) = listener.accept().unwrap();
            sock.set_read_timeout(Some(Duration::from_secs(5))).unwrap();
            sock.set_write_timeout(Some(Duration::from_secs(5))).unwrap();
            let mut tls = rustls::ServerConnection::new(Arc::new(config)).unwrap();
            let _ = tls.complete_io(&mut sock);
        });
        let stop = Arc::new(AtomicBool::new(false));
        let error = open(&url, &stop).err().expect("a self-signed station must be refused");
        server.join().unwrap();
        assert!(matches!(error, HttpError::Certificate(CertificateIssue::Untrusted)), "{error:?}");
    }
'''

