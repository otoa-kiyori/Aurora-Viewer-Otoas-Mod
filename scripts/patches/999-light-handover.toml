[[patch]]
id = "light-handover-selector"
why = "the change's blended frame gets its handover at the change's progress (patch 998's fade)"
paths = ["crates/aurora-viewer/src/world/eep_env.rs"]
op = "literal"
find = '''(f.sky.fade_to_with(&sky, t, sky_shares), f.water.fade_to_with(&water, t, shares[5]))'''
replace = '''// aurora-local-patch: light-handover-selector
                    // (the light hands over from the source's to the target's
                    // at the same progress, world/light_handover.rs)
                    let blended = f.sky.fade_to_with(&sky, t, sky_shares);
                    (
                        super::light_handover::with_handover(blended, &f.sky, &sky, t),
                        f.water.fade_to_with(&water, t, shares[5]),
                    )'''

