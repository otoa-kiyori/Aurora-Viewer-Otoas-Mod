paths = ["crates/aurora-viewer/src/world/mod.rs"]
op = "literal"
find = '''pub mod legacy_lists;
pub mod lookat;'''
replace = '''pub mod legacy_lists;
pub mod light_handover; // aurora-local-patch: light-handover-mod
pub mod lookat;'''

