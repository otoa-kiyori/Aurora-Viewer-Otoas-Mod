[[patch]]
id = "light-handover-env-light"
why = "the light's direction: the handover's while a change hands it over, else the Legacy choice"
paths = ["crates/aurora-viewer/src/world/env.rs"]
op = "literal"
find = '''        let light = if sun_up {
            sun
        } else if moon_up {
            moon
        } else {
            Vec3::NEG_Z
        };'''
replace = '''// aurora-local-patch: light-handover-env-light
        // (while an environment change hands the light over, its shares and
        // direction, world/light_handover.rs: every value the Legacy choice
        // switches below is the shares' mix; None, the Legacy choice)
        let hand = sky.light_handover();
        let light = if let Some(h) = hand {
            h.dir
        } else if sun_up {
            sun
        } else if moon_up {
            moon
        } else {
            Vec3::NEG_Z
        };'''

[[patch]]
