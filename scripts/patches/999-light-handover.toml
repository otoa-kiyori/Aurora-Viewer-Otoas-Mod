why = "what the test variable compares"
paths = ["docs/TESTING.md"]
op = "literal"
find = '''  <!-- // aurora-local-patch: demo-sky-change-details -->'''
replace = '''  <!-- // aurora-local-patch: demo-sky-change-details -->
- **`AURORA_LIGHT_HANDOVER=0`**: during an environment change the sky's
  light (the sun, the moon or none) hands over from the source sky's to the
  target's at the change's progress, its direction turning from one to the
  other (`world/light_handover.rs`); with `0` it switches in one frame where
  the blended sun or moon crosses the horizon, as before. Still skies are
  the same either way. Compare a night to a day with
  `AURORA_DEMO_SKY_CHANGE` and a capture every frame around the crossing:
  with `0` the sky, the haze and the lit ground step there; without it they
  move smoothly. A night under no moon: its `moon=-45` key.
  <!-- // aurora-local-patch: light-handover-details -->'''
