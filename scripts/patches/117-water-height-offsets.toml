[[patch]]
id = "water-height-tests"
why = "both offsets at their extremes: rests without flicker, the dive, the walk's rules, wading, the bounds"
paths = ["crates/aurora-viewer/src/movement/tests.rs"]
op = "literal"
find = '''#[test]
fn removing_the_global_switch_preserves_effective_legacy_activation() {'''
replace = '''// aurora-local-patch: water-height-tests
#[test]
fn flotation_height_rests_at_its_extremes_without_flicker_and_dives_clear_of_the_surface() {
    let now = Instant::now();
    for offset in [-1.0_f32, 1.0] {
        let prefs = Preferences {
            float_height: offset,
            ..prefs()
        };
        let mut runtime = Runtime::default();
        let mut f = frame();
        // in the water first, then at the resting height (1.7 m: 0.45 m deep)
        runtime.update(&prefs, &f, &MoveInput::default(), now);
        let rest = 20.0 - 0.45 + offset;
        f.position.z = rest;
        for i in 0..20 {
            // a little bobbing around the rest height never leaves the swim
            f.position.z = rest + if i % 2 == 0 { 0.15 } else { -0.15 };
            let step = runtime.update(&prefs, &f, &MoveInput::default(), now + Duration::from_millis(i * 100));
            assert_eq!(runtime.state, State::Surface, "offset={offset}, i={i}");
            assert_eq!(step.motion.mode, 3);
            assert_eq!(step.motion.parameters[2], offset);
            assert!(step.motion.valid());
        }
        let dive = runtime.update(
            &prefs,
            &f,
            &MoveInput {
                down: true,
                ..Default::default()
            },
            now + Duration::from_secs(3),
        );
        assert_eq!(dive.motion.mode, 7);
        assert!(dive.motion.valid());
        let goal = dive.motion.parameters[2];
        assert!(goal <= -0.45 + offset - 0.6 + 1e-4, "offset={offset}: dive goal {goal}");
        // reached: the body stays under water instead of bouncing back
        f.position.z = 20.0 + goal;
        let released = MoveInput::default();
        runtime.update(&prefs, &f, &released, now + Duration::from_secs(4));
        for i in 0..5 {
            runtime.update(&prefs, &f, &released, now + Duration::from_millis(4100 + i * 100));
            assert_eq!(runtime.state, State::Submerged, "offset={offset}: after the dive");
        }
    }
    // within upstream's range, upstream's dive goal
    for offset in [-0.5_f32, 0.0, 0.5] {
        let prefs = Preferences {
            float_height: offset,
            ..prefs()
        };
        let mut runtime = Runtime::default();
        let mut f = frame();
        runtime.update(&prefs, &f, &MoveInput::default(), now);
        f.position.z = 20.0 - 0.45 + offset;
        runtime.update(&prefs, &f, &MoveInput::default(), now);
        let dive = runtime.update(
            &prefs,
            &f,
            &MoveInput {
                down: true,
                ..Default::default()
            },
            now,
        );
        assert_eq!(dive.motion.parameters[2], -(1.7_f32 * 0.5 + 1.1).max(1.8), "offset={offset}");
    }
}

#[test]
fn water_walking_height_moves_the_target_and_every_rule_with_it() {
    let now = Instant::now();
    for offset in [-1.0_f32, 0.0, 1.0] {
        let prefs = Preferences {
            water_walk: true,
            water_walk_height: offset,
            ..Default::default()
        };
        let target = 20.0 + 0.85 + offset;
        let mut r = Runtime::default();
        let mut f = frame();
        f.on_ground = false;
        f.position.z = target;
        let step = r.update(&prefs, &f, &MoveInput::default(), now);
        assert_eq!(step.motion.mode, 13, "offset={offset}");
        assert!(step.motion.valid());
        // the script holds water + field / 2
        assert!((20.0 + step.motion.parameters[1] * 0.5 - target).abs() < 1e-5, "offset={offset}");
        assert_eq!(r.state, State::WaterWalking);
        assert!(!r.state.swimming(), "never a swim, even wading");
        // the catch band: kept up to target + 0.45, released above it
        f.position.z = target + 0.4;
        assert_eq!(r.update(&prefs, &f, &MoveInput::default(), now).motion.mode, 13);
        f.position.z = target + 0.5;
        assert_ne!(r.update(&prefs, &f, &MoveInput::default(), now).motion.mode, 13);
        // caught again just above the target
        f.position.z = target + 0.2;
        assert_eq!(r.update(&prefs, &f, &MoveInput::default(), now).motion.mode, 13);
        // the jump starts near the target, with the same support field
        f.position.z = target;
        let up = MoveInput {
            up: true,
            ..Default::default()
        };
        let jump = r.update(&prefs, &f, &up, now + Duration::from_millis(100)).motion;
        assert!(jump.action > 0 && jump.valid(), "offset={offset}");
        assert_eq!(jump.parameters[1], step.motion.parameters[1]);
        assert_eq!(jump.parameters[2], aurora_net::bridge::WATER_WALK_JUMP_HEIGHT);
        // rise, then land back on the offset target
        f.position.z = target + 0.8;
        f.velocity.z = 1.0;
        assert_eq!(
            r.update(&prefs, &f, &MoveInput::default(), now + Duration::from_millis(500)).motion,
            jump
        );
        f.position.z = target + 0.1;
        f.velocity.z = -1.0;
        let landed = r
            .update(&prefs, &f, &MoveInput::default(), now + Duration::from_millis(1200))
            .motion;
        assert_eq!(landed.action, 0, "offset={offset}: landed");
        assert_eq!(landed.mode, 13);
        // the speeds stay as they are
        let walk = MoveInput {
            forward: true,
            ..Default::default()
        };
        f.velocity.z = 0.0;
        f.position.z = target;
        assert_eq!(r.update(&prefs, &f, &walk, now + Duration::from_secs(2)).motion.parameters[0], 3.2);
        let crouch = MoveInput { down: true, ..walk };
        assert_eq!(
            r.update(&prefs, &f, &crouch, now + Duration::from_secs(2)).motion.parameters[0],
            1.2
        );
    }
}

#[test]
fn a_lowered_water_walk_in_shallow_water_keeps_the_support_on_the_bed() {
    let now = Instant::now();
    let prefs = Preferences {
        water_walk: true,
        water_walk_height: -1.0,
        ..Default::default()
    };
    let mut r = Runtime::default();
    let mut f = frame();
    // 0.5 m of water: the body stands on the bed, 0.35 m above the lowered support
    f.ground = Some(19.5);
    f.position.z = 19.5 + 0.85;
    f.on_ground = true;
    for i in 0..5 {
        let step = r.update(&prefs, &f, &MoveInput::default(), now + Duration::from_millis(i * 100));
        assert_eq!(step.motion.mode, 13, "the support keeps it, not the simulator's walking");
        assert_eq!(r.state, State::WaterWalking);
    }
    // a jump still starts from where it stands
    let jump = r.update(
        &prefs,
        &f,
        &MoveInput {
            up: true,
            ..Default::default()
        },
        now + Duration::from_secs(1),
    );
    assert!(jump.motion.action > 0);
    // the shore still releases it
    f.ground = Some(19.98);
    assert_ne!(
        r.update(&prefs, &f, &MoveInput::default(), now + Duration::from_secs(5))
            .motion
            .mode,
        13
    );
}

#[test]
fn water_heights_are_bounded_on_load_and_survive_a_save() {
    let old: Preferences = serde_json::from_value(serde_json::json!({"swimming": true, "float_height": 0.3})).expect("old prefs");
    assert_eq!(old.water_walk_height, 0.0, "older settings have no water walking height");
    for (value, expected) in [
        (0.0, 0.0),
        (0.35, 0.35),
        (-0.8, -0.8),
        (1.0, 1.0),
        (-1.0, -1.0),
        (1.5, 1.0),
        (-4.0, -1.0),
        (f32::NAN, 0.0),
        (f32::INFINITY, 0.0),
        (f32::NEG_INFINITY, 0.0),
    ] {
        let mut prefs = Preferences {
            float_height: value,
            water_walk_height: value,
            ..prefs()
        };
        if value.is_finite() {
            let saved = serde_json::to_string(&prefs).expect("save");
            let mut restored: Preferences = serde_json::from_str(&saved).expect("restore");
            restored.sanitize();
            assert_eq!(restored.float_height, expected, "{value} after a save");
            assert_eq!(restored.water_walk_height, expected, "{value} after a save");
        }
        prefs.sanitize();
        assert_eq!(prefs.float_height, expected, "{value}");
        assert_eq!(prefs.water_walk_height, expected, "{value}");
    }
    assert_eq!(water_walk::water_walk_height(f32::NAN), 0.0);
    assert_eq!(water_walk::water_walk_height(3.0), WATER_HEIGHT_LIMIT);
}

