# Water heights: a wider Flotation height for swimming, a Surface swimming
# height, and a Water walking height.
#
# Movement window (Swimming section): "Flotation height" (the swim's
# `float_height`, upstream's) now goes from -1.00 to +1.00 m instead of
# ±0.50, and a new "Water walking height" slider sits right under it, in the
# same style, from -1.00 to +1.00 m in 1 cm steps, 0 by default, usable while
# "Walk / run on water" is on. Both are REAL positions: the worn helper
# script holds the body there with its move-to-target motor, so the region
# and everyone else see the avatar at that height. Both are kept with the
# other movement preferences of the avatar (settings `movements`), bounded
# on load (Preferences::sanitize), and an old settings file without the new
# field loads it as 0. The AO window's copy of the flotation slider takes
# the same range.
#
# Flotation height. The script already takes the offset as it comes (modes
# 3 and 6, no clamp of its own); only the viewer's command check widens
# (Motion::valid: ±1 m for the surface and underwater motors, and the
# surface-return goal, which is the offset minus the flotation depth, up to
# +1 m). Checked at ±1 m (1.7 m avatar, flotation depth 0.45 m):
# - +1: the body rests 0.55 m above the water line. It stays "in the water"
#   while below the water line + 0.45 + the rest height (1.0 m), so the
#   0.45 m gap of upstream holds and resting there does not flicker between
#   swimming and not swimming. Getting in still needs the body below the
#   water line, as upstream; climbing out, the exit flight, the "deep
#   enough" rule (the water depth, not the offset) and the surface-reached
#   test (±0.18 m of the goal) are unchanged.
# - -1: the body rests 1.45 m under the water line, still in the surface
#   state (the dive threshold sits 0.42 m below the rest height, the
#   return 0.18 m). Upstream's dive goal (-1.8 m for this avatar) is then
#   too close: reached, the body would sit right on the Submerged-to-Surface
#   threshold and bounce back. The dive goal is now at least 0.6 m below the
#   rest height (unchanged within upstream's ±0.5). In water shallower than
#   the rest depth the body simply stands on the bed, still swimming.
# - The free camera keeps a swim it pauses while the body is within reach
#   of the water; that lower bound now follows a negative offset, so the
#   deepest rest heights keep it too.
# - Moving the slider keeps the older (shallower) dive threshold until the
#   body reaches the new height, as upstream (settled_float_height).
#
# Water walking height. The bridge command already carries, for water
# walking (mode 13), a field the script uses only for this target: the
# avatar height, of which it holds the body's centre half above the water
# level. The viewer now sends there the height plus twice the offset
# (Motion::water_walk_support), so the body is held at the water level +
# half the avatar's height + the offset, during the walk and the jump. The
# worn script is NOT changed (same text, same version, nothing reinstalled);
# the viewer's check of that field widens by the offset's range. The
# viewer's own rules (water_walk.rs) count from the same target: the catch
# band (released above target + 0.45 m), the jump start (within 0.3 m), its
# rise and landing; the walk, run and crouch speeds are unchanged. The
# release at the shore is the script's and the viewer's water-over-ground
# test, which does not depend on the offset (a raised avatar drops by the
# offset when it walks out onto the shore). A negative offset is wading,
# never swimming: the two modes stay exclusive (set_water_mode) and water
# walking still decides first. Where the water is shallower than a lowered
# body, the body stands on the bed: the viewer's rules then count from where
# it stands, so the support keeps it instead of handing it to the
# simulator's own walking while over water (a jump there rises less, by the
# missing depth). The water surface swell (water_float.rs) still applies
# only within half the avatar's height + 0.5 m of the water line: above
# about +0.5 m of Water walking height, or below about -0.9 m of Flotation
# height, it rests (visual only).
#
# Surface swimming height. A third slider, "Surface swimming height", right
# under "Flotation height" (Movement window and the AO window's copy), -1.00
# to +1.00 m in 1 cm steps, 0 by default, kept and bounded like the others.
# The AO plays one animation floating at rest and another swimming along, and
# one height does not suit both. Upstream holds the same height either way:
# the surface motor (mode 3) aims at the water line - the flotation depth +
# the flotation height, moving or not. The new value is an OFFSET added to
# the flotation height while swimming along the surface (forward, back or
# sideways, the AO's swim stroke condition, in the surface state, with no
# dive or surface return under way); an absolute height would move every
# avatar to 0 m while swimming at its default. The sum stays within ±1 m (the
# command's bound, no wider range for the script). At rest, under water
# (mode 6), diving and returning to the surface (modes 7 and 8), the
# flotation height applies as before. It travels in the field the surface
# motor already reads: the worn script is NOT changed. The script's motor
# glides to each new height (move-to-target, 0.2 s, critically damped), but
# the viewer resends at most twice a second, so a step of up to 2 m would
# lurch: the offset comes in and goes out at 1 m/s (SURFACE_SWIM_EASE), and
# snaps out when the body leaves the surface. The thresholds count from the
# height in force: the "settled" test, the dive threshold (the lower of the
# settled and the new height until the body gets there, as upstream for the
# slider), the exit rule above the water line (the higher of the two), the
# dive goal (at least 0.6 m below the height in force) and the free camera's
# lower bound (the lower of the two heights). Checked with the body half a
# second behind the sent height (1.7 m avatar, 0.45 m deep): flotation -1
# with +1 swims at the water line - 0.45 m, rests at -1.45 m; the dive
# threshold stays at -1.87 m while rising and follows 0.42 m under the eased
# height while sinking; flotation +1 with -1 rests at +0.55 m and swims at
# -0.45 m, its exit limit stays at +1.0 m until the body settles; neither
# leaves the surface state. With 0 the sent value is the flotation height
# exactly, every frame.
#
# Aurora's own design: the Legacy Viewer has no equivalent.
#
# Tests: movement/tests.rs (the swim's rest at ±1 m without flicker, the dive
# goal at -1 m and unchanged within ±0.5 m, the water walk's target, catch
# band and jump at -1, 0, +1 m, the shallow-water wading, the exclusion of
# the modes, both settings' bounds and round trip, old settings; the surface
# swimming height at rest, swimming along and stopping at the extreme
# combinations with a lagging body, the default unchanged, the eased switch,
# the dive and the underwater motor, its bounds and round trip), aurora-net
# bridge.rs (the command's bounds at the new ranges, the support field).
# Texts are in the English, French and Japanese catalogues. Apply or skip the whole file, not one patch
# of it.

