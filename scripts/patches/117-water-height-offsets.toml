    /// Water walking height, m (local patch set, 117-water-height-offsets).
    pub height_offset: f32, // aurora-local-patch: water-walk-height-field
}

/// Water walking height, bounded: never further than the slider, 0 for a
/// value that is not a number.
pub fn water_walk_height(offset: f32) -> f32 {
    if offset.is_finite() {
        offset.clamp(-super::WATER_HEIGHT_LIMIT, super::WATER_HEIGHT_LIMIT)
    } else {
        0.0
    }
}'''

[[patch]]
id = "water-walk-height-target"
why = "every rule of the water walk counts from the offset target (catch band, jump start, rise, landing)"
paths = ["crates/aurora-viewer/src/movement/water_walk.rs"]
op = "literal"
fn = "update"
find = "let target = frame.water? + frame.height * 0.5;"
replace = '''// aurora-local-patch: water-walk-height-target
        // Water walking height: the support holds the body's centre this
        // much higher (or lower, wading) than half its height above the
        // water. The body cannot stand below the bed: where the water is
        // shallower than a lowered support, the rules count from where it
        // stands, so the support keeps it instead of the simulator's own
        // walking while over water.
        let offset = water_walk_height(self.height_offset);
        let support = frame.water? + frame.height * 0.5 + offset;
        let target = frame.ground.map_or(support, |ground| support.max(ground + frame.height * 0.5));
        let support_height = Motion::water_walk_support(frame.height, offset);'''

