// aurora-local-patch: surface-swim-height-rule
/// How fast the Surface swimming height comes in and goes out, m/s. The
/// viewer resends the bridge command at most twice a second and the script's
/// motor glides to each new height (move-to-target, 0.2 s, no overshoot), so
/// the body rises or sinks at about this speed instead of a jump of up to 2 m.
pub const SURFACE_SWIM_EASE: f32 = 1.0;

/// Surface swimming height, bounded: never further than the slider, 0 for a
/// value that is not a number.
pub fn surface_swim_lift(offset: f32) -> f32 {
    if offset.is_finite() {
        offset.clamp(-WATER_HEIGHT_LIMIT, WATER_HEIGHT_LIMIT)
    } else {
        0.0
    }
}

/// The height the surface motor holds: the flotation height plus the part of
/// the Surface swimming height in force, within the slider's range (the
/// command's bound). No lift leaves the flotation height exactly as it is.
pub fn surface_swim_float(float_height: f32, lift: f32) -> f32 {
    if lift == 0.0 {
        float_height
    } else {
        (float_height + lift).clamp(-WATER_HEIGHT_LIMIT, WATER_HEIGHT_LIMIT)
    }
}

/// Swimming along, as the AO picks its swim stroke over floating.
fn swimming_along(input: &MoveInput) -> bool {
    input.forward || input.back || input.strafe_left || input.strafe_right
}'''

