/// Rests, swims along for 3 s and stops for 3 s, the body following the sent
/// height half a second late (the resend interval); returns the heights sent.
fn surface_swim_run(float_height: f32, surface_swim_height: f32) -> (Vec<f32>, Vec<f32>, Vec<f32>) {
    let prefs = Preferences {
        float_height,
        surface_swim_height,
        ..prefs()
    };
    let now = Instant::now();
    let mut runtime = Runtime::default();
    let mut f = frame();
    runtime.update(&prefs, &f, &MoveInput::default(), now);
    let mut sent = vec![float_height; 5];
    let mut phases = Vec::new();
