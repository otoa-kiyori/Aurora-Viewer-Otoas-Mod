[[patch]]
id = "new-object-textures-rule"
why = "the shared rule: which stored default may be painted on a new prim"
paths = ["crates/aurora-viewer/src/build/texture_copy.rs"]
op = "literal"
find = "const AT_MATERIAL: i32 = 57;"
replace = """// aurora-local-patch: new-object-textures-rule
/// Why a default map of new objects is not applied.
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
pub enum NewObjectMapRefusal {
    /// The item is not (or no longer) in the inventory.
    Missing,
    /// Not a texture or a snapshot.
    NotTexture,
    NoCopy,
    NoTransfer,
}

/// The asset a default map of new objects (Preferences › Build, local patch
/// set) may paint on a prim the Create tool made. `stored` is a built-in
/// texture (get_is_predefined_texture, or the picker's Transparent), applied
/// as is, or an inventory item, its link followed, whose asset is applied.
/// FSPanelPrefs::onCommitTexture (indra/newview/fspanelprefs.cpp) refuses an
/// item without copy (LLPermissions::allowOperationBy(PERM_COPY)). Stricter
/// here: the item also needs transfer, unless it is in the Library
/// (`requires_contents`), since a default is painted on prim after prim
/// without going into their contents, where
/// LLToolDragAndDrop::handleDropTextureProtections
/// (indra/newview/lltooldraganddrop.cpp) would put a no-transfer one. Asked
/// when the default is chosen and again for every new prim: a stored id
/// never skips it.
pub fn new_object_map(inv: &Inventory, agent: Uuid, stored: Uuid) -> Result<Uuid, NewObjectMapRefusal> {
    if predefined(stored) || stored == aurora_prim::te::TRANSPARENT_TEXTURE {
        return Ok(stored);
    }
    let item = rules::original(inv, stored)
        .and_then(|id| inv.items.get(&id))
        .ok_or(NewObjectMapRefusal::Missing)?;
    // IT_TEXTURE, IT_SNAPSHOT
    if !matches!(item.inv_type, 0 | 15) || item.asset_id.is_nil() {
        return Err(NewObjectMapRefusal::NotTexture);
    }
    if !contents_drop::copyable(item, agent) {
        return Err(NewObjectMapRefusal::NoCopy);
    }
    if requires_contents(inv, item, agent) {
        return Err(NewObjectMapRefusal::NoTransfer);
    }
    Ok(item.asset_id)
}

const AT_MATERIAL: i32 = 57;"""

