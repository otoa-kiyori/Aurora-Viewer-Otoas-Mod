why = "docs/TESTING.md: what the scenario shows"
paths = ["docs/TESTING.md"]
op = "regex"
required = false
pattern = '^`AURORA_DEMO_BUILD=create-delete,object:118` creates a primitive at'
replace = '''Default maps of new objects (local patch set):
`AURORA_DEMO_NEW_OBJECT_TEXTURES=1` adds three full-permission textures to
the demo inventory ("New object texture", "New object normal map", "New
object specular map") and makes them the texture, normal map and specular
map of Preferences › Build › Look of new objects; `AURORA_DEMO_OPTIONS=build`
shows the three rows with their swatches and names, never an asset id.
`refused` takes the transfer permission from the normal map's item and
leaves the specular map's item out of the inventory: both rows say why, and
a new prim gets the texture alone (two "new object … nothing applied" log
lines). With `AURORA_DEMO_BUILD=create-ready,object:118` and
