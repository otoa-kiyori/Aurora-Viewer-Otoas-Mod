face and the Texture tab its normal and specular maps ("new object maps: …
faces" in the log; the offline simulator does not answer the
RenderMaterials request, so the maps stay those the Texture tab shows). A
demo run without the variable puts back the defaults a previous run left.
<!-- // aurora-local-patch: new-object-textures-testing-details -->

\g<0>'''
