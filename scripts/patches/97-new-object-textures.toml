# Default texture, normal map and specular map of new objects: Preferences ›
# Build › Look of new objects gets three pickers, and every prim made with
# the Create tool starts with those maps on every face.
#
# Reference, not a copy: the Legacy Viewer has a default texture only
# (FSDefaultObjectTexture, set on every face by
# FSCommon::applyDefaultBuildPreferences, indra/newview/fscommon.cpp, its
# picker in FSPanelPrefs::onCommitTexture, indra/newview/fspanelprefs.cpp).
# The default NORMAL and SPECULAR maps are a deliberate addition beyond the
# Legacy Viewer: it has no such defaults.
#
# Aurora's design (files/new-object-textures/new_prim_maps.rs, module doc):
# - settings build.new_prim_texture (default 89556747-…, the region's own
#   plywood, so nothing changes until a texture is picked),
#   build.new_prim_normal and build.new_prim_specular (default none). Each
#   holds a built-in texture or an INVENTORY ITEM id, never another asset
#   id: settings.json goes into the settings backups, an exported file;
# - the texture at Default leaves the faces as the region made them; another
#   one is painted on every face in the existing ObjectImage of the new
#   objects' look (build/new_defaults.rs), the mapping kept;
# - the maps go through the Build window's own Blinn-Phong path
#   (BuildTool::legacy_put, the RenderMaterials PUT, and ui.legacy_pending so
#   the Texture tab shows them at once) with the Build window's default
#   material: repeats 1, offsets 0, rotation 0, white specular colour,
#   glossiness 51, environment 0 (LegacyMaterial::default, approved by
#   Otoa). Its alpha mode follows the diffuse texture: the PUT waits up to
#   5 s for it to load (blend with alpha, none otherwise), then sends none.
#
# Creators' permissions (AGENTS.md section 2): one shared rule,
# texture_copy::new_object_map, built from contents_drop::copyable and
# texture_copy::requires_contents. A built-in texture applies as is; an item
# must be a texture or snapshot the agent may COPY and TRANSFER (a Library
# item: copy). STRICTER than the Legacy Viewer, which asks copy only: a
# default is painted on prim after prim without going into their contents,
# where LLToolDragAndDrop::handleDropTextureProtections would put a
# no-transfer texture. Approved by Otoa. The rule runs when a texture is
# picked (the picker greys the others out and refuses their drop) and again
# for every new prim: an item gone or whose rights changed applies nothing,
# and the log says why. Debug Settings typing goes through the same check.
# The page shows names and swatches, never an asset id; the picker's UUID
# field keeps its own rule (actions::asset_uuid_shown).
#
# Demo: AURORA_DEMO_NEW_OBJECT_TEXTURES=1|refused (docs/TESTING.md).
# Retire this file if upstream ports the defaults. Apply or skip the whole
# file, not one patch of it.

