[[patch]]
id = "chat-scroll-ftl-en"
why = "the row's label and help (English)"
paths = ["crates/aurora-i18n/locales/en.ftl"]
op = "regex"
pattern = '^(ui-options-conversations-own-windows-hint = [^\n]*\n)'
replace = '''\1# // aurora-local-patch: chat-scroll-ftl-en
ui-options-chat-scroll-speed = Scroll speed
ui-options-chat-scroll-speed-hint = When a message arrives in a conversation you are following at its end, the lines slide up to it over this time instead of jumping, so you can keep reading. 0 s jumps at once. With "Reduce animations" on, the lines always jump. Default: 0.3 s.
'''

