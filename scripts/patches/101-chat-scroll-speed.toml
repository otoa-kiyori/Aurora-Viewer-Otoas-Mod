[[patch]]
id = "chat-scroll-step"
why = "goes with chat-scroll-view: the frame's slide, from what came in since the last show"
paths = ["crates/aurora-viewer/src/ui/chat/view.rs"]
op = "literal"
find = '''pub fn scroll_to(&mut self, row: usize) {
        self.scroll_to = Some(row);
    }'''
replace = '''pub fn scroll_to(&mut self, row: usize) {
        self.scroll_to = Some(row);
    }

    // aurora-local-patch: chat-scroll-step
    /// The Scroll speed of the next `show`, in seconds (bounded).
    pub fn set_slide_seconds(&mut self, seconds: f32) {
        self.slide_seconds = crate::settings::chat_scroll_seconds(seconds);
    }

    /// This frame's slide (`slide.rs`), the rows placed: how much lower than
    /// the end they are drawn, and what is left of a slide the reader just
    /// stopped by leaving the end.
    fn slide_step(&mut self, ui: &egui::Ui, anchored: bool, first: u64, view_height: f32) -> super::slide::Step {
        if ui.is_sizing_pass() {
            // (a window's sizing pass scrolls an area of its own, unseen)
            return super::slide::Step::default();
        }
        let pass = ui.ctx().cumulative_pass_nr();
        let before = self.slide_shown.replace((pass, anchored, self.token, self.next));
        let shown_before = before.is_some_and(|(p, ..)| p + 1 == pass);
        let was_at_end = before.is_some_and(|(_, end, ..)| end);
        // the rows after the last line of the last show: the lines that came
        // in since (none when the conversation's lines were replaced)
        let appended = match before {
            Some((_, _, token, next)) if token == self.token && next < self.next => {
                let from = self.rows.partition_point(|r| first + (r.line as u64) < next);
                self.rows.get(from).map_or(0.0, |r| self.total - r.y)
            }
            _ => 0.0,
        };
        // reduced motion (`theme::apply_motion`): at once
        let seconds = if ui.style().animation_time > 0.0 { self.slide_seconds } else { 0.0 };
        let step = self.slide.step(super::slide::Frame {
            now: ui.input(|i| i.time),
            seconds,
            shown_before,
            at_end: anchored,
            was_at_end,
            arrived: super::slide::rise(self.total, appended, view_height, self.layout.workspace()),
            limit: view_height,
        });
        if step.offset > 0.0 {
            ui.ctx().request_repaint();
        }
        step
    }'''

