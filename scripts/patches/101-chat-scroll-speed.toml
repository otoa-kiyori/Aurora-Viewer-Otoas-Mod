[[patch]]
id = "chat-scroll-view-tests"
why = "a followed conversation slides in both layouts, 0 s and reduced motion jump, one read higher up stays"
paths = ["crates/aurora-viewer/src/ui/chat/view.rs"]
op = "literal"
find = '''/// Away from the end, the view says how far it is and counts the lines
    /// that came in since;'''
replace = '''// aurora-local-patch: chat-scroll-view-tests
    /// A conversation followed at its end (or scrolled to its top with
    /// `back`) gets a line at frame 10, in frames of 1/60 s, at this Scroll
    /// speed: where the top of `watched` (a line in sight) is drawn on each
    /// frame, and the bottom of the newest line once settled.
    fn slide_frames(seconds: f32, layout: Layout, back: bool, reduced: bool, watched: usize) -> (Vec<f32>, f32) {
        let mut lines: VecDeque<ChatLine> = (0..40).map(|i| line("Jane", &format!("line {i}"), i * 600)).collect();
        let mut clock = LineClock::default();
        let mut view = View::default();
        view.set_slide_seconds(seconds);
        let mut frames = crate::ui::widgets::elide_tests::Frames::new();
        if reduced {
            frames.ctx.all_styles_mut(|s| s.animation_time = 0.0);
        }
        let (mut tops, mut newest) = (Vec::new(), 0.0);
        for n in 0..60 {
            if n == 3 && back {
                view.scroll_to(0);
            }
            if n == 10 {
                lines.push_back(line("Bob", "new", 40 * 600));
                clock.pushed_back();
            }
            let (mut top, mut bottom) = (None, None);
            frames.run(Vec::new(), |ui| {
                ui.set_max_width(400.0);
                crate::ui::widgets::scroll_offset::show(ui, egui::ScrollArea::vertical(), "slide")
                    .stick_to_bottom(true)
                    .animated(false)
                    .auto_shrink([false, false])
                    .max_height(300.0)
                    .min_scrolled_height(300.0)
                    .show_viewport(ui, |ui, viewport| {
                        let source = Source {
                            lines: &lines,
                            clock,
                            filter: "",
                            find: "",
                            layout,
                            first_unread: None,
                            blocked: Default::default(),
                        };
                        view.sync(&source, 400.0);
                        view.show(ui, viewport, clock.first, &mut |ui, row, painted| {
                            let (rect, _) = ui.allocate_exact_size(egui::vec2(ui.max_rect().width(), 20.0), egui::Sense::hover());
                            if painted && row.line == watched {
                                top = Some(rect.top());
                            }
                            if painted && row.line == 40 {
                                bottom = Some(rect.bottom());
                            }
                        });
                    });
            });
            // (not drawn: NaN)
            tops.push(top.unwrap_or(f32::NAN));
            if let Some(b) = bottom {
                newest = b;
            }
        }
        (tops, newest)
    }

    /// Scroll speed 0: the lines jump to the new one on its frame, as
    /// before the setting; otherwise they slide there within it, never back.
    #[test]
    fn the_lines_slide_up_to_a_new_message_within_the_scroll_speed() {
        for layout in [Layout::Classic, Layout::Aurora] {
            let (jump, end) = slide_frames(0.0, layout, false, false, 35);
            // the new row's height (its line and the gap under it)
            let h = jump[9] - jump[10];
            assert!(h > 15.0, "{layout:?}: at once {jump:?}");
            assert!(jump[10..].iter().all(|&t| (t - jump[10]).abs() < 0.01), "{jump:?}");
            let (slid, slid_end) = slide_frames(0.5, layout, false, false, 35);
            assert_eq!(slid[..10], jump[..10], "{layout:?}: the same until a line comes in");
            assert!(
                (slid[10] - slid[9]).abs() < 0.5,
                "{layout:?}: the arrival moves nothing at once {slid:?}"
            );
            for pair in slid[9..].windows(2) {
                assert!(pair[1] <= pair[0] + 0.01, "{layout:?}: never back {slid:?}");
            }
            let midway = slid[10 + 8];
            assert!(midway < slid[9] - 2.0 && midway > jump[10] + 1.0, "{layout:?}: on its way {slid:?}");
            // there at the Scroll speed (30 frames), where the jump put them
            assert!(
                slid[10 + 31..].iter().all(|&t| (t - jump[10]).abs() < 0.01),
                "{layout:?}: {slid:?} {jump:?}"
            );
            assert!((slid_end - end).abs() < 0.01, "{layout:?}: the newest line at the bottom");
            // reduced motion: the jump
            let (reduced, _) = slide_frames(0.5, layout, false, true, 35);
            assert_eq!(reduced, jump, "{layout:?}");
        }
    }

    /// Scrolled back to older lines, a new message moves nothing.
    #[test]
    fn a_new_message_does_not_move_a_conversation_read_higher_up() {
        let (tops, _) = slide_frames(0.5, Layout::Aurora, true, false, 0);
        assert!(tops[6].is_finite(), "{tops:?}");
        assert!(tops[6..].iter().all(|&t| (t - tops[6]).abs() < 0.01), "{tops:?}");
    }

    /// Away from the end, the view says how far it is and counts the lines
    /// that came in since;'''

