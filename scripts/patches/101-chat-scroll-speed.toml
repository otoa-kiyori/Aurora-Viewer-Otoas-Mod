[[patch]]
id = "chat-scroll-demo"
why = "AURORA_DEMO_CHAT_SCROLL: the Scroll speed for the run and the friend's messages at known frames"
paths = ["crates/aurora-viewer/src/demo.rs"]
op = "literal"
find = '''/// AURORA_DEMO_CONV=aurora[:flag…]: the Conversations window in Aurora's
/// workspace'''
replace = '''// aurora-local-patch: chat-scroll-demo
/// AURORA_DEMO_CHAT_SCROLL=<seconds>[:burst]: Preferences › Chat › Scroll
/// speed for the run (nothing saved), the friend's conversation (the one
/// `AURORA_DEMO_CONV=aurora` or `bubbles` shows) a few screens long and
/// followed at its end, where the friend writes at frame 800 and then every
/// 120 frames, six times; with `burst` each message comes with a second one
/// 6 frames later, which retargets the slide on its way.
pub fn chat_scroll_scenario() -> Option<(f32, bool)> {
    let value = std::env::var("AURORA_DEMO_CHAT_SCROLL").ok()?;
    let mut parts = value.trim().split(':');
    let seconds = parts
        .next()
        .and_then(|v| v.trim().parse::<f32>().ok())
        .unwrap_or(crate::settings::DEFAULT_CHAT_SCROLL_SECONDS);
    let burst = parts.any(|p| p.trim() == "burst");
    Some((crate::settings::chat_scroll_seconds(seconds), burst))
}

/// The Scroll speed scenario's messages, at their frames.
pub fn chat_scroll_message(world: &mut crate::world::World, frame: u64) {
    let Some((_, burst)) = chat_scroll_scenario() else {
        return;
    };
    // once a frame, whatever the interface's passes
    static LAST: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(u64::MAX);
    if LAST.swap(frame, std::sync::atomic::Ordering::Relaxed) == frame {
        return;
    }
    let message = |n: i64| crate::world::ChatLine {
        time: std::time::SystemTime::now(),
        from: "Nova Example".into(),
        text: aurora_i18n::tr!("demo-flash-message", n = n),
        kind: crate::world::ChatKind::Im,
        source: DEMO_FRIEND,
        origin: crate::world::Origin::Live,
        blocked: false,
        beyond_range: false,
        speaker: Default::default(),
    };
    let Some(after) = frame.checked_sub(800) else {
        return;
    };
    let (k, phase) = (after / 120, after % 120);
    if k >= 6 {
        return;
    }
    if phase == 0 {
        world.conversation_line(DEMO_FRIEND, message(2 * k as i64 + 1));
    } else if burst && phase == 6 {
        world.conversation_line(DEMO_FRIEND, message(2 * k as i64 + 2));
    }
}

/// AURORA_DEMO_CONV=aurora[:flag…]: the Conversations window in Aurora's
