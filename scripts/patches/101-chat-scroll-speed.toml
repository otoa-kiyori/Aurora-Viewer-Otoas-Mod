# Scroll speed: the chat and IM lines slide up to a new message.
#
# Preferences › Chat › Conversations: a "Scroll speed" slider from 0 to 1 s
# in 0.05 s steps, 0.3 s by default. Upstream (like the Legacy Viewer) moves
# the lines of a conversation followed at its end up by a new message's
# height in one frame; lines jumping make it hard to keep reading. Now they
# slide there, eased out (emath::easing::cubic_out, as the notification
# center's cards), over that time. At 0 s they jump as before: the slide is
# then 0 everywhere and the drawing is upstream's.
#
# Where: ui/chat/view.rs View::show, which places the rows against the end
# itself while it follows the end. A slide draws them `offset` lower than
# that place, an offset that eases to 0 (ui/chat/slide.rs, pure). The rise
# is what the new rows move the rows in sight by (all of their height once
# the conversation fills the view; in a short one nothing for the classic
# lines, which start at the top, all of it for the workspace, which stands
# against the bottom). A message during a slide adds its height to what is
# left and restarts the time from there: no jump, no step back, and the end
# is reached within the Scroll speed of the latest message. At most one
# viewport's height is left to slide (a burst of history does not scroll
# past for a second). The scroll area itself still sticks to the end as
# upstream does: the offset is only in the drawing.
#
# It covers the nearby chat, IMs and group chats, in the Conversations
# window (Aurora workspace, Bubbles, Legacy lines) and in the conversations
# opened in their own window, which all draw through conversation_lines and
# its View. Not touched: the chat history window (its View never gets a
# Scroll speed, and its pages do not grow live), the nearby chat lines above
# the chat bar (ui/chat/console.rs, cards that fade, not a scroll area).
#
# Unchanged: a view scrolled back or paused by a menu (not at the end: no
# slide; leaving the end during a slide, by the wheel or the scrollbar,
# folds what was left into the view's own offset correction so the lines do
# not jump either), the wheel and the scrollbar, and every jump asked for
# (find and scroll_to, the button back to the latest messages and the
# resume after a menu, another conversation, a window opened: a view not shown at the pass
# before, a resize: no line came in). Reduced motion (egui animation_time 0,
# theme::apply_motion) jumps. While a slide runs the frame is repainted.
#
# Stored as `chat_scroll_seconds`, bounded on load (settings::
# chat_scroll_seconds: 0..=1, not a number gives 0.3). Demo:
# AURORA_DEMO_CHAT_SCROLL=<seconds>[:burst] (docs/TESTING.md).
#
# Aurora's own design: the Legacy Viewer has no equivalent.
#
# Tests: ui/chat/slide.rs (0 s, the duration, monotonic, retarget, the
# viewport bound, away from the end, leaving the end, reduced motion, the
# rise), view.rs (a followed conversation in both layouts, 0 s identical to
# the jump, reduced motion, one read higher up does not move), the setting's
# bounds and round trip, the Options page list. Texts are in the English,
# French and Japanese catalogues. Apply or skip the whole file, not one patch of it.

