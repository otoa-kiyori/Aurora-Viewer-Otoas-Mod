paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''crate::demo::conv_scroll_new(&mut self.world, self.chat_ui.demo_scrolled);'''
replace = '''crate::demo::conv_scroll_new(&mut self.world, self.chat_ui.demo_scrolled);
                    // AURORA_DEMO_CHAT_SCROLL: the friend writes while we follow
                    crate::demo::chat_scroll_message(&mut self.world, self.frame_count); // aurora-local-patch: chat-scroll-demo-messages'''

[[patch]]
id = "chat-scroll-demo-lines"
why = "goes with chat-scroll-demo: the long talk of the scroll scenario, without going to its top"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''crate::demo::conv_scroll_lines(&mut self.world);
                self.chat_ui.demo_scroll = Some(crate::demo::DEMO_FRIEND);
            }'''
replace = '''crate::demo::conv_scroll_lines(&mut self.world);
                self.chat_ui.demo_scroll = Some(crate::demo::DEMO_FRIEND);
            } else if crate::demo::chat_scroll_scenario().is_some() {
                // AURORA_DEMO_CHAT_SCROLL: the same long talk, followed at its end
                crate::demo::conv_scroll_lines(&mut self.world); // aurora-local-patch: chat-scroll-demo-lines
            }'''

[[patch]]
id = "chat-scroll-demo-doc"
why = "goes with chat-scroll-demo: its line in the table of docs/TESTING.md"
paths = ["docs/TESTING.md"]
op = "literal"
find = '''| `AURORA_DEMO_CONV_SCROLL=up\|new` | The friend's conversation, long, shown from its top: no button with `up`; `new` with three messages come in and the button back to the latest messages (with `AURORA_DEMO_CONV`) |'''
replace = '''| `AURORA_DEMO_CONV_SCROLL=up\|new` | The friend's conversation, long, shown from its top: no button with `up`; `new` with three messages come in and the button back to the latest messages (with `AURORA_DEMO_CONV`) |
| `AURORA_DEMO_CHAT_SCROLL=<seconds>[:burst]` | The friend's conversation, long, followed at its end while the friend writes: the lines slide up at this Scroll speed (with `AURORA_DEMO_CONV`; local patch set) <!-- // aurora-local-patch: chat-scroll-demo-doc --> |'''

[[patch]]
id = "chat-scroll-demo-details"
why = "goes with chat-scroll-demo: its details paragraph in docs/TESTING.md"
paths = ["docs/TESTING.md"]
op = "literal"
find = '''  Conversations > Show the button to the latest messages disabled (always absent).'''
replace = '''  Conversations > Show the button to the latest messages disabled (always absent).

<!-- // aurora-local-patch: chat-scroll-demo-details -->
- **`AURORA_DEMO_CHAT_SCROLL=<seconds>[:burst]`** (local patch set):
  Preferences › Chat › Conversations › Scroll speed is
  `<seconds>` for the run (0 to 1, nothing saved; 0.3 if not a number).
  With `AURORA_DEMO_CONV=aurora`, `aurora:compact`, `bubbles` or
  `bubbles:legacy`, the friend's conversation gets the forty earlier
  messages of `AURORA_DEMO_CONV_SCROLL` and stays at its end; the friend
  writes at frame 800, then every 120 frames, six times. With `burst` each
  message comes with a second one 6 frames later, while the first still
  slides. At 0 the lines jump on the message's frame; otherwise they slide
  up to it, eased out, and stand against the field after `<seconds>` (from
  the latest message). Capture consecutive frames with
  `AURORA_FPS_LIMIT=60` and `AURORA_CAPTURE_FRAMES=799,800,803,806,810,820`:
  the lines at intermediate heights, whole, with the new message coming in
  from under the bottom edge. Scroll up by hand: nothing moves when the
  friend writes. "Reduce animations" makes them jump.'''

