[[patch]]
id = "caustics-water-texture-cog-test"
why = "the caustics' cog, behind the water effects' cog, shows its two rows"
paths = ["crates/aurora-viewer/src/ui/options/tests.rs"]
op = "literal"
find = "fn the_frame_rate_limits_show_under_their_switches() {"
replace = '''fn the_caustics_cog_behind_the_water_cog_shows_its_rows() {
    // aurora-local-patch: caustics-water-texture-cog-test
    let mut frames = Frames::new();
    let (mut s, mut st, mut r) = (Settings::default(), OptionsUi::default(), OptionsResult::default());
    s.water_effects.enabled = true;
    let (texture, scale) = (
        aurora_i18n::tr!("water-effects-caustics-texture"),
        aurora_i18n::tr!("water-effects-caustics-scale"),
    );
    let mut texts = Vec::new();
    for _ in 0..3 {
        texts = page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 3, Vec::new());
    }
    // the cog right of a row's label: its number of rows
    let cog = |texts: &[crate::ui::widgets::elide_tests::Text], label: &str| {
        let row = texts.iter().find(|t| t.source == label).expect("the row").rect;
        texts
            .iter()
            .find(|t| t.source.parse::<u32>().is_ok() && (t.rect.center().y - row.center().y).abs() < 6.0 && t.rect.left() > row.right())
            .map(|t| (t.source.clone(), t.rect))
    };
    let caustics = aurora_i18n::tr!("water-effects-caustics");
    assert!(
        !texts.iter().any(|t| t.source == caustics),
        "behind the water effects' cog at first"
    );
    let (_, outer) = cog(&texts, aurora_i18n::tr!("water-effects-enabled")).expect("the water effects' cog");
    for events in click(outer.center() - egui::vec2(6.0, 0.0)) {
        page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 3, events);
    }
    for _ in 0..2 {
        texts = page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 3, Vec::new());
    }
    assert!(!texts.iter().any(|t| t.source == texture), "behind the caustics' own cog");
    let (count, inner) = cog(&texts, caustics).expect("the caustics' cog");
    assert_eq!(count, "2");
    for events in click(inner.center() - egui::vec2(6.0, 0.0)) {
        page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 3, events);
    }
    for _ in 0..2 {
        texts = page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 3, Vec::new());
    }
    let row = |label: &str| texts.iter().find(|t| t.source == label).map(|t| t.rect);
    let (caustics, splashes) = (
        row(caustics).expect("caustics"),
        row(aurora_i18n::tr!("water-effects-splashes")).expect("splashes"),
    );
    for label in [texture, scale] {
        let r = row(label).expect("shown once its cog is open");
        assert!(
            r.top() > caustics.bottom() && r.bottom() < splashes.top(),
            "{label} between caustics and splashes"
        );
        assert!(r.left() > caustics.left(), "{label} indented under its switch");
    }
}

