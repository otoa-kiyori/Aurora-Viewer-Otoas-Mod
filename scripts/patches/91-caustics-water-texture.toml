# Underwater caustics can follow the environment's own water: Preferences ›
# Graphics › Reflections and water › Underwater caustics, behind its cog,
# "Use water texture" (off by default) and "Scale" (0.25..4, default 1).
#
# Upstream's caustics forward-project a fixed analytic surface (6 to 16
# micro-waves by quality, periodic over 16 m) into one light map that every
# receiver samples twice (fract(position / 16), and turned 37 degrees and
# 1.618 times larger), through a slow noise warp, red and blue a little
# apart: the same pattern everywhere, its 16 m period hidden by the second
# reading. With "Use water texture" on, the light map is built from the
# normal map the water surface draws (the EEP water's texture, both wave
# directions and scroll speeds, its normal scale: env.wgsl water_pixel, a
# port of the Legacy Viewer's waterF.glsl), in two GPU passes with no CPU
# work and no readback (files/caustics-water-texture/, module doc):
#   1. the surface's slope over one 25 m tile (the big wave's own period; the
#      little waves rounded to whole repeats so the tile is seamless) into a
#      periodic slope map; a fragment pass, the bindless pages being
#      fragment-only;
#   2. upstream's forward projection (flux-conserving area term, bounded
#      fold), the refraction from that map, the lens Jacobian from its finite
#      differences. 400 texels over 25 m: upstream's 16 per metre.
# The receivers look it up through the surface's own slow x warp, so the
# pattern sits under the ripples that make it and neighbouring tiles shift
# against each other (warp periods 78.5 m and 314 m): no visible grid.
# Scale divides the lookup position in both modes. In either mode (texture
# on, or Scale other than 1) the map is read once, at the refracted position
# before upstream's noise warp, its depth layers mixed as before: upstream's
# second reading, warp and dispersion stay with the analytic map at Scale 1.
# Caustics are an Aurora effect; the Legacy Viewer has none.
#
# Off with Scale 1, nothing changes: water_caustics.wgsl and its pipeline are
# untouched, the shared water uniform keeps its first 64 bytes (the
# extension follows, initialised to the analytic values at creation) and the
# receivers take their original lines. While the environment's normal map is
# not loaded (slot 0) the analytic pattern stands in.
#
# Options: the cog of a row that is itself behind a cog is new; cx.rs gets a
# stack of open blocks (each paints its own background) and a revealed row
# behind two cogs opens both.
#
# Demo: AURORA_DEMO=1 AURORA_DEMO_WATER=caustics (underwater lagoon, waves
# held still) with AURORA_DEMO_CAUSTICS=texture[,scale=<x>] (docs/TESTING.md).
# Upstream now has a `:caustics` demo view of its own (down at the lagoon's
# bed): with this patch set the mode takes this view and holds the waves.
#
# Cross-fade (patch 998): while an environment change fades from one water
# normal map to another (never between a day cycle's keyframes), the slope
# pass reads the second map's three layers too, at its own waves, and mixes
# the two by its share, each map with its own normal scale, as the surface
# does (a small uniform of its own beside the slope pass's): 3 taps a texel,
# 6 while it lasts. A second map still loading has no share: the first map
# alone. A change to or from the analytic water (a nil map) cannot be mixed
# so: the analytic pattern has a light map of its own tile and size and the
# receivers read one map. The caustics dim instead: the first side's
# pattern alone, its light down to nothing at half the share, then the
# second side's back up to full at the end, each at its own waves and scale
# (the extension's last word, an f32's bits, read by the receivers).
#
# Apply or skip the whole file, not one patch of it; it needs patch 998,
# whose fade fields it reads.

