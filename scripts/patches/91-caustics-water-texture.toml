[[patch]]
id = "caustics-water-texture-lookup"
why = "a scaled or texture map goes through water_caustic_focus, read once with the depth layers as before; off with scale 1 keeps upstream's lines (its two readings, warp and dispersion)"
paths = ["crates/aurora-render/src/shaders/common.wgsl"]
op = "literal"
fn = "water_caustic_light" # water_caustics before upstream #3864, which split the shadow out
find = """    let uv=project/16.0;
    let second=water_caustic_tap((WATER_CAUSTIC_TURN*project)/WATER_CAUSTIC_TILE2+vec2<f32>(time*0.0041,-time*0.0029),depth);
    var focus:vec3<f32>;
    if(water_fx.counts.w==0u){focus=vec3<f32>(water_caustic_tap(uv,depth));}
    else{
        // about 9 mm per metre of depth between red and blue, along the
        // sun's direction (less under a high sun)
        let spread=ray.xy/max(length(ray.xy),0.35)*(min(depth,7.0)*0.009/16.0);
        focus=vec3<f32>(water_caustic_tap(uv+spread,depth),
            (water_caustic_tap(uv+WATER_CAUSTIC_FILTER,depth)+water_caustic_tap(uv-WATER_CAUSTIC_FILTER,depth))*0.5,
            water_caustic_tap(uv-spread,depth));
    }
    let energy=max(water_caustic_combine(focus,second)-vec3<f32>(0.9),vec3<f32>(0.0))*0.42;"""
replace = """// aurora-local-patch: caustics-water-texture-lookup
    var energy:vec3<f32>;
    if(water_fx.caustic.w>0.5 || water_fx.caustic.x!=1.0){
        // one reading of the map (water_caustic_focus), its layers mixed by
        // the depth
        let layers=water_caustic_focus(project_plain);
        var intensity=mix(layers.r,layers.g,smoothstep(0.75,2.5,depth));
        if(depth>2.5){intensity=mix(layers.g,layers.b,smoothstep(2.5,7.0,depth));}
        energy=vec3<f32>(max(intensity-0.9,0.0)*0.42);
    } else {
    let uv=project/16.0;
    let second=water_caustic_tap((WATER_CAUSTIC_TURN*project)/WATER_CAUSTIC_TILE2+vec2<f32>(time*0.0041,-time*0.0029),depth);
    var focus:vec3<f32>;
    if(water_fx.counts.w==0u){focus=vec3<f32>(water_caustic_tap(uv,depth));}
    else{
        // about 9 mm per metre of depth between red and blue, along the
        // sun's direction (less under a high sun)
        let spread=ray.xy/max(length(ray.xy),0.35)*(min(depth,7.0)*0.009/16.0);
        focus=vec3<f32>(water_caustic_tap(uv+spread,depth),
            (water_caustic_tap(uv+WATER_CAUSTIC_FILTER,depth)+water_caustic_tap(uv-WATER_CAUSTIC_FILTER,depth))*0.5,
            water_caustic_tap(uv-spread,depth));
    }
    energy=max(water_caustic_combine(focus,second)-vec3<f32>(0.9),vec3<f32>(0.0))*0.42;
    }
    // while the water crosses to or from the analytic water (patch 998), the
    // share of the light taken away (water_caustic_texture.rs Crossing; 0
    // otherwise)
    energy*=1.0-water_fx.caustic_rest[3].w;"""

