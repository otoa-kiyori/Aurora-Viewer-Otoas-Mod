[[patch]]
id = "caustics-water-texture-focus-fn"
why = "the lookup of a scaled or texture light map"
paths = ["crates/aurora-render/src/shaders/common.wgsl"]
op = "literal"
find = "fn water_caustics(pos:vec3<f32>,normal:vec3<f32>)->vec3<f32> {"
replace = """// The light map at a receiver's refracted position, scaled, and for the
// water texture's map through the surface's own x warp (env.wgsl
// water_pixel): the pattern under the ripples that make it, its tiles
// shifted against each other. Local patch set, water_caustic_texture.rs.
// aurora-local-patch: caustics-water-texture-focus-fn
fn water_caustic_focus(project:vec2<f32>)->vec3<f32> {
    let q=project/water_fx.caustic.x;
    var v=q;
    if(water_fx.caustic.w>0.5){v.x+=(cos(q.x*0.08)+sin(q.y*0.02))*6.0;}
    let uv=fract(v/water_fx.caustic.y);
    let f=vec2<f32>(water_fx.caustic.z);
    var focus=textureSampleLevel(water_light,lin_clamp,uv,0.0).rgb;
    if(water_fx.counts.w>0u){
        focus=(textureSampleLevel(water_light,lin_clamp,fract(uv+f),0.0).rgb+textureSampleLevel(water_light,lin_clamp,fract(uv-f),0.0).rgb
            +textureSampleLevel(water_light,lin_clamp,fract(uv+vec2<f32>(f.x,-f.y)),0.0).rgb+textureSampleLevel(water_light,lin_clamp,fract(uv+vec2<f32>(-f.x,f.y)),0.0).rgb)*0.25;
    }
    return focus;
}
fn water_caustics(pos:vec3<f32>,normal:vec3<f32>)->vec3<f32> {"""

