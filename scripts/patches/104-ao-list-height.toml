// aurora-local-patch: ao-list-height-test
#[cfg(test)]
mod list_height_tests {
    use super::{LIST_FIRST, LIST_FLOOR, list_room};

    #[test]
    fn the_list_takes_the_room_the_controls_leave_down_to_its_floor() {
        assert_eq!(list_room(600.0, 200.0), 387.0);
        assert_eq!(list_room(800.0, 200.0), 587.0, "a taller window, a longer list");
        assert_eq!(list_room(600.0, 150.0), 437.0, "fewer wrapped lines, a longer list");
        assert_eq!(list_room(600.5, 200.0), 387.0, "whole points");
        assert_eq!(list_room(300.0, 250.0), LIST_FLOOR, "a small window scrolls the column");
        assert_eq!(list_room(f32::INFINITY, 200.0), LIST_FIRST);
        assert_eq!(list_room(600.0, f32::NAN), LIST_FIRST);
    }
}'''
