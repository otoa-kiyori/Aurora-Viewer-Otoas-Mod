# Voice is heard across region borders: on the estate (region-wide) voice
# channel the viewer keeps one WebRTC connection to the agent's region (the
# primary connection) and one to each neighbouring region within reach, as
# the Legacy Viewer does.
#
# Cause: upstream opens a single connection, to the agent's region, joins it
# as primary and leaves it at every region change. Residents standing in the
# next region are on another voice server: they are never heard, however
# close they stand, while the Legacy Viewer hears them.
#
# Port of indra/newview/llvoicewebrtc.cpp (originally LGPL 2.1):
#
# - LLWebRTCVoiceClient::updateNeighboringRegions: the neighbours are the
#   regions under eight points 2 * MAX_AUDIO_DIST (100 m) around the speaker
#   (the avatar's head), among the regions the viewer is connected to
#   (World::regions, kept by EnableSimulator / EstablishAgentCommunication
#   and emptied by RegionRemoved). files/voice-neighbours/neighbours.rs.
# - estateSessionState::processConnectionStates and isRegionWebRTCEnabled:
#   a neighbour gets a connection when its SimulatorFeatures say "webrtc"
#   and its seed gave a ProvisionVoiceAccountRequest capability; the
#   connection is closed when the region is out of reach or no longer
#   WebRTC. The provision, the ICE trickle and the logout go to the
#   neighbour region's own ProvisionVoiceAccountRequest and
#   VoiceSignalingRequest (LLVoiceWebRTCSpatialConnection::
#   requestVoiceConnection, processIceUpdatesCoro, breakVoiceConnectionCoro:
#   getRegionFromID(mRegionID)), with the estate body (channel_type
#   "local", no parcel_local_id): the same request and the same retries as
#   the primary connection (aurora-voice's session.rs, unchanged).
# - parcelSessionState: a parcel with its own voice channel, and a call,
#   keep a single connection; their neighbours close.
# - LLVoiceWebRTCConnection::sendJoin and the VOICE_STATE_SESSION_UP check:
#   a neighbour connection joins with {"j":{}}, the primary one with
#   {"j":{"p":true}}; when the agent's region changes, the connection to the
#   new region becomes primary and joins again with p, the old one joins
#   again without it and stays a neighbour if still in reach (closed
#   otherwise). Nothing is torn down at a crossing: the Legacy Viewer's
#   estate session ("Estate") outlives region changes. While the new
#   region's parcel is still awaited after a crossing, the estate channel is
#   kept on the new region's connection (the Legacy Viewer treats an unknown
#   parcel as estate voice); once the parcel is known its rules apply as
#   upstream (own channel, or no voice).
# - LLVoiceWebRTCSpatialConnection::setMuteMic (`setMute(mMuted ||
#   !mPrimary)`): a connection to another region than the agent's never
#   carries the microphone, the muted track's silence is sent instead, as
#   libwebrtc does for a muted track; it does not even read the capture.
#   Enforced in aurora-voice's sender (neighbours::outgoing), whatever the
#   viewer asks.
# - sendPositionUpdate (sessionState::sendData): every connection receives
#   the same positions, with the same 100 ms / 10 cm / 4 degree throttling.
# - sessionState::setUserMute and setUserVolume: the block list and the
#   per-resident volumes go to every connection.
# - OnDataReceivedImpl and addParticipantByID: the primary connection and a
#   call list a resident only on that resident's join (on a spatial channel
#   only a join with the primary flag), as the Legacy Viewer; a neighbour
#   connection also lists a resident it is not listing yet on a join
#   without the flag or on a level / speaking update (never the agent,
#   never on a leave). The lists are merged into one, each resident once
#   (voice dots, speaking indicators, moderation). A neighbour connection
#   takes a moderator mute only together with that resident's primary join
#   in the same message (OnDataReceivedImpl ignores the muted flags of a
#   non-primary server). Residents listed by the relaxed rule stay when the
#   connection becomes primary at a crossing: they are the residents that
#   server reports, the server does not repeat their joins, and they leave
#   on their own leave or when the connection closes, like every entry.
#
# Audio: every connection has its own Opus decoder, packet loss concealment
# and its own Voice sink (the mixer sums the sinks, each with its own
# jitter buffer): the received voice of every connection is played on the
# Voice channel, with today's quality path.
#
# Voice off (audio.voice_enabled, upstream's Enable voice), logout, land that forbids
# voice: every connection closes. A closed neighbour connection logs out in
# the background and is kept with upstream's sessions being left
# (`Voice::closing`); a quit closes them all without their logout and waits
# for their threads, as upstream's close_for_exit does for its own. The region and parcel rules are upstream's,
# for the agent's region. No setting and no new text: the Legacy Viewer has
# no switch for it either (its FSDisableNeighbourRegionConnections is off by
# default; refusing the neighbour regions, an upstream switch, already
# leaves no neighbour region to connect to).
#
# Log: one INFO line when a neighbour connection opens or closes and when a
# connection changes role; the `voice stats` line of each connection says
# `primary`, `neighbour` or `call`. About 10 s after its join, then at most
# once a minute while they changed, each connection logs three counts of
# the entries it received for residents it was not listing at that moment
# (joins with the primary flag, joins without it, level / speaking only):
# counts only, no id. No capability URL is logged.
#
# Differences, on purpose: the primary connection's first join already says
# primary (upstream's; the Legacy Viewer sends a non-primary join first and
# the primary one 100 ms later). No connection is started while the agent's
# parcel is unknown except to keep the estate channel through a crossing
# (upstream waits for the parcel). A neighbour connection lists the
# residents it hears even without their primary join: a connection opened
# after a resident of the neighbouring region joined there was heard but
# never got a voice dot nor a lit name tag, because that server did not
# repeat the resident's primary join to it. The Legacy Viewer keeps the
# primary-join rule on every connection (it adds a participant only on a
# primary join in spatial voice, to avoid duplicates); here the merge
# already lists each resident once. The Legacy Viewer's own behaviour in
# this case was not checked on the grid.
#
# Tests: crates/aurora-voice/src/neighbours.rs (neighbours in reach at the
# edges, corners and on larger regions, the join and its hand-over, a
# neighbour never sends the microphone, the merged participants, the
# tagged stats line, the neighbour's relaxed listing and its mute rule, the
# primary and the calls unchanged, the unlisted counts and their log
# timing); crates/aurora-viewer/src/voice.rs (the primary
# hand-over at a crossing, parcel channels and calls have no neighbours,
# the estate channel kept while the parcel is awaited, voice off closes
# every connection).
# Apply or skip the whole file, not one patch of it.

# --------------------------------------------------------------- aurora-voice

