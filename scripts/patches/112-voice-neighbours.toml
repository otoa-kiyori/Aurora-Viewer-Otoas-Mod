        assert_eq!(estate_region(Some(&ChannelKey::Call("test-call".into()))), None);
        assert_eq!(estate_region(None), None);
        for key in [ChannelKey::Local { region: 7, parcel: Some(42) }, ChannelKey::Call("test-call".into())] {
