[[patch]]
id = "voice-neighbours-tests"
why = "the primary hand-over, no neighbours off the estate channel, the crossing, voice off"
paths = ["crates/aurora-viewer/src/voice.rs"]
op = "literal"
find = '''#[test]
    fn the_current_call_survives_teleport_region_data_gaps() {'''
replace = '''// aurora-local-patch: voice-neighbours-tests
    /// A session that never contacts anything: a backend this build does
    /// not speak stops before any request.
    fn idle_session() -> VoiceSession {
        let params = VoiceConnectParams {
            provision_cap_url: "never contacted".into(),
            signaling_cap_url: None,
            agent_id: Uuid::from_u128(1),
            voice_server_type: "vivox".into(),
            channel: ChannelKind::Local { parcel_local_id: None },
            grid: "test".into(),
            stun_servers: None,
        };
        VoiceSession::connect(reqwest::Client::new(), params, aurora_audio::VoiceSink::null())
    }

    fn estate(region: u64) -> ChannelKey {
        ChannelKey::Local { region, parcel: None }
    }

    #[test]
    fn a_region_change_on_the_estate_channel_hands_the_primary_over() {
        let blocked = Uuid::from_u128(5);
        let mut voice = Voice {
            session: Some((estate(7), idle_session())),
            ..Default::default()
        };
        voice.muted.insert(blocked);
        let east = idle_session();
        east.set_primary(false);
        voice.neighbours.insert(8, Neighbour::new(east));
        // into region 8: its connection becomes primary, region 7's a neighbour
        assert!(voice.hand_over(&estate(8)));
        let (key, s) = voice.session.as_ref().expect("a primary connection");
        assert_eq!(*key, estate(8));
        assert!(s.is_primary());
        assert!(voice.muted.is_empty(), "the new primary keeps what it was sent");
        let west = voice.neighbours.get(&7).expect("the region left stays a neighbour");
        assert!(!west.session.is_primary());
        assert!(west.muted.contains(&blocked));
        assert_eq!(voice.neighbours.len(), 1);
        // into a region with no connection yet: both stay neighbours, a new
        // primary connection is to be made
        assert!(!voice.hand_over(&estate(9)));
        assert!(voice.session.is_none());
        assert_eq!(voice.neighbours.keys().copied().collect::<Vec<_>>(), vec![7, 8]);
        assert!(!voice.neighbours[&8].session.is_primary());
    }

    #[test]
    fn a_parcel_channel_or_a_call_has_no_neighbours() {
        assert_eq!(estate_region(Some(&estate(7))), Some(7));
        assert_eq!(estate_region(Some(&ChannelKey::Local { region: 7, parcel: Some(42) })), None);
        assert_eq!(estate_region(Some(&ChannelKey::Call("test-call".into()))), None);
        assert_eq!(estate_region(None), None);
        for key in [ChannelKey::Local { region: 7, parcel: Some(42) }, ChannelKey::Call("test-call".into())] {
            let mut voice = Voice {
                session: Some((estate(7), idle_session())),
                ..Default::default()
            };
            voice.neighbours.insert(8, Neighbour::new(idle_session()));
            // a parcel's own channel or a call: one connection, the neighbours close
            assert!(!voice.hand_over(&key));
            assert!(voice.session.is_none() && voice.neighbours.is_empty());
        }
        // without an estate session the neighbour pass keeps none
        let http = reqwest::Client::new();
        let mut voice = Voice {
            session: Some((ChannelKey::Local { region: 7, parcel: Some(42) }, idle_session())),
            ..Default::default()
        };
        voice.neighbours.insert(8, Neighbour::new(idle_session()));
        voice.update_neighbours(&inputs(&http), DVec3::ZERO);
        assert!(voice.neighbours.is_empty());
    }

    #[test]
    fn a_crossing_keeps_the_estate_channel_while_the_parcel_is_awaited() {
        let http = reqwest::Client::new();
        let caps = HashMap::from([("ProvisionVoiceAccountRequest".to_string(), "never contacted".to_string())]);
        let mut voice = Voice {
            session: Some((estate(7), idle_session())),
            ..Default::default()
        };
        let mut v = inputs(&http);
        v.region = Some(8);
        v.caps = Some(&caps);
        // no connection to region 8: nothing to keep
        assert!(voice.crossing(&v).is_none());
        voice.neighbours.insert(8, Neighbour::new(idle_session()));
        let (key, kind, _, _) = voice.crossing(&v).expect("the neighbour connection carries on");
        assert_eq!(key, estate(8));
        assert_eq!(kind, ChannelKind::Local { parcel_local_id: None });
        // the parcel known, a call, or still in the same region: the usual rules
        let parcel = aurora_net::ParcelInfo::default();
        v.parcel = Some(&parcel);
        assert!(voice.crossing(&v).is_none());
        v.parcel = None;
        let call = CallChannel {
            id: "test-call".into(),
            credentials: String::new(),
        };
        v.call = Some(&call);
        assert!(voice.crossing(&v).is_none());
        v.call = None;
        v.region = Some(7);
        assert!(voice.crossing(&v).is_none());
        // a parcel's own channel before the crossing: no estate to keep
        v.region = Some(8);
        voice.session = Some((ChannelKey::Local { region: 7, parcel: Some(42) }, idle_session()));
        assert!(voice.crossing(&v).is_none());
    }

    #[test]
    fn switching_voice_off_closes_every_connection() {
        let http = reqwest::Client::new();
        let mut voice = Voice {
            session: Some((estate(7), idle_session())),
            ..Default::default()
        };
        voice.neighbours.insert(8, Neighbour::new(idle_session()));
        voice.neighbours.insert(9, Neighbour::new(idle_session()));
        let mut v = inputs(&http);
        v.enabled = false;
        voice.update(v);
        assert!(voice.session.is_none() && voice.neighbours.is_empty());
        assert_eq!(voice.light, VoiceLight::Off);
    }

