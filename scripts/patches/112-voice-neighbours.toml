[[patch]]
id = "voice-neighbours-types"
why = "a neighbour connection, which neighbours to connect to, which channel has neighbours"
paths = ["crates/aurora-viewer/src/voice.rs"]
op = "literal"
find = "impl Voice {"
replace = '''// aurora-local-patch: voice-neighbours-types
/// A connection of the estate channel to a neighbouring region
/// (LLVoiceWebRTCSpatialConnection with INVALID_PARCEL_ID, not primary,
/// indra/newview/llvoicewebrtc.cpp, originally LGPL 2.1): it hears the
/// residents there and never carries the microphone. The mutes and volumes
/// it was sent are its own: each connection of the Legacy Viewer receives
/// them (sessionState::setUserMute, setUserVolume).
struct Neighbour {
    session: VoiceSession,
    muted: HashSet<Uuid>,
    volumes: HashMap<Uuid, f32>,
}

impl Neighbour {
    fn new(session: VoiceSession) -> Self {
        Self {
            session,
            muted: HashSet::new(),
            volumes: HashMap::new(),
        }
    }

    fn connected(&self) -> bool {
        matches!(self.session.status(), VoiceStatus::Connected)
    }
}

/// What a neighbour connection needs of its region: its own capabilities
/// and voice server.
#[derive(Debug, Clone, PartialEq)]
struct NeighbourLink {
    provision: String,
    signaling: Option<String>,
    server: String,
}

/// The neighbouring regions to connect to: in reach of the speaker
/// (LLWebRTCVoiceClient::updateNeighboringRegions), with WebRTC voice
/// (estateSessionState::isRegionWebRTCEnabled) and their own
/// ProvisionVoiceAccountRequest: requestVoiceConnection asks the neighbour
/// region's capability, never the agent's region's.
fn neighbour_links(
    own: u64,
    speaker: DVec3,
    regions: &HashMap<aurora_net::RegionHandle, crate::world::Region>,
) -> std::collections::BTreeMap<u64, NeighbourLink> {
    use aurora_voice::neighbours::{RegionArea, neighbouring_regions};
    let areas: Vec<RegionArea> = regions
        .iter()
        .map(|(&handle, r)| RegionArea::from_handle(handle, f64::from(r.heightmap.size_x), f64::from(r.heightmap.size_y)))
        .collect();
    neighbouring_regions(own, speaker, &areas)
        .into_iter()
        .filter_map(|handle| {
            let r = regions.get(&handle)?;
            if !aurora_voice::is_webrtc_voice_server(&r.voice_server) {
                return None;
            }
            let provision = r.caps.get("ProvisionVoiceAccountRequest")?.clone();
            let link = NeighbourLink {
                provision,
                signaling: r.caps.get("VoiceSignalingRequest").cloned(),
                server: r.voice_server.clone(),
            };
            Some((handle, link))
        })
        .collect()
}

/// The region of the estate channel's primary connection; `None` on a
/// parcel's own channel or a call, which have no neighbours
/// (parcelSessionState: a single connection).
fn estate_region(key: Option<&ChannelKey>) -> Option<u64> {
    match key {
        Some(ChannelKey::Local { region, parcel: None }) => Some(*region),
        _ => None,
    }
}

