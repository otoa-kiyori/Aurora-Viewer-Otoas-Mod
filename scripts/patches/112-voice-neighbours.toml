[[patch]]
id = "voice-neighbours-methods"
why = "the primary hand-over, the crossing, the neighbour pass and the merged participants"
paths = ["crates/aurora-viewer/src/voice.rs"]
op = "literal"
find = "/// Apply a native-window microphone override without waiting for a frame."
replace = '''// aurora-local-patch: voice-neighbours-methods
    /// A channel change. On the estate channel the connections outlive a
    /// region change, as the Legacy Viewer's "Estate" session does: the old
    /// region's connection becomes a neighbour (closed by the neighbour
    /// pass if out of reach) and the new region's, when there is one,
    /// becomes primary (the VOICE_STATE_SESSION_UP check of
    /// LLVoiceWebRTCConnection::connectionStateMachine; each joins again
    /// with its new state). Any other change leaves the old channel and its
    /// neighbours. True when a neighbour became the primary connection;
    /// otherwise `session` is empty and a new one is to be made.
    fn hand_over(&mut self, key: &ChannelKey) -> bool {
        let ChannelKey::Local { region, parcel: None } = key else {
            self.leave();
            self.close_neighbours();
            return false;
        };
        match self.session.take() {
            Some((
                ChannelKey::Local {
                    region: left,
                    parcel: None,
                },
                s,
            )) => {
                // the microphone first: the capture has a single reader
                s.set_mic(None);
                s.set_primary(false);
                log::info!("voice: region {left:x} is now a neighbour connection");
                let mut n = Neighbour::new(s);
                n.muted = std::mem::take(&mut self.muted);
                n.volumes = std::mem::take(&mut self.volumes);
                self.neighbours.insert(left, n);
            }
            Some((_, s)) => self.retire(s),
            None => {}
        }
        let Some(n) = self.neighbours.remove(region) else {
            return false;
        };
        n.session.set_primary(true);
        n.session.set_mic(self.mic.clone());
        log::info!("voice: region {region:x} is now the primary connection");
        self.muted = n.muted;
        self.volumes = n.volumes;
        self.session = Some((key.clone(), n.session));
        true
    }

    /// Right after a crossing on the estate channel the new region's parcel
    /// is not known yet: the estate channel goes on, on the new region's
    /// neighbour connection, instead of leaving (the Legacy Viewer's
    /// voiceConnectionCoro takes an unknown parcel as estate voice). Only
    /// when that connection exists, and only for the parcel wait: every
    /// other reason to leave stands.
    fn crossing(&self, v: &VoiceInputs) -> Option<(ChannelKey, ChannelKind, String, Option<String>)> {
        let Some((ChannelKey::Local { region: from, parcel: None }, _)) = &self.session else {
            return None;
        };
        let to = v.region?;
        if to == *from || v.call.is_some() || v.parcel.is_some() || !self.neighbours.contains_key(&to) {
            return None;
        }
        let caps = v.caps?;
        let provision = caps.get("ProvisionVoiceAccountRequest")?.clone();
        Some((
            ChannelKey::Local { region: to, parcel: None },
            ChannelKind::Local { parcel_local_id: None },
            provision,
            caps.get("VoiceSignalingRequest").cloned(),
        ))
    }

    /// leaveChannel: every neighbour connection logs out and closes.
    fn close_neighbours(&mut self) {
        for region in self.neighbours.keys() {
            log::info!("voice: closing the neighbour connection to region {region:x}");
        }
        self.release_neighbours();
    }

    /// Every neighbour connection logs out in the background, kept with the
    /// sessions left (`closing`) so that a quit in the meantime waits for
    /// them too, as upstream's `leave` does for the primary one.
    fn release_neighbours(&mut self) {
        let neighbours = std::mem::take(&mut self.neighbours);
        for n in neighbours.into_values() {
            self.retire(n.session);
        }
    }

    /// A session that closes: it logs out in the background and is kept
    /// until its thread ends (upstream's `leave`, for any session).
    fn retire(&mut self, session: VoiceSession) {
        self.closing.retain(|s| !s.is_finished());
        self.closing.push(session.disconnect());
    }

    /// estateSessionState::processConnectionStates: a connection to each
    /// neighbouring region in reach with WebRTC voice, closed when the
    /// region leaves reach, stops being WebRTC or the channel is not the
    /// estate one. Each gets its own Voice sink: the mixer sums them.
    fn update_neighbours(&mut self, v: &VoiceInputs, speaker: DVec3) {
        let wanted = match (estate_region(self.session.as_ref().map(|(k, _)| k)), v.regions) {
            (Some(own), Some(regions)) => neighbour_links(own, speaker, regions),
            _ => std::collections::BTreeMap::new(),
        };
        let gone: Vec<u64> = self
            .neighbours
            .keys()
            .filter(|region| !wanted.contains_key(region))
            .copied()
            .collect();
        for region in gone {
            log::info!("voice: closing the neighbour connection to region {region:x}");
            if let Some(n) = self.neighbours.remove(&region) {
                self.retire(n.session);
            }
        }
        let Some(engine) = v.engine else {
            return;
        };
        for (region, link) in wanted {
            if self.neighbours.contains_key(&region) {
                continue;
            }
            log::info!("voice: opening a neighbour connection to region {region:x}");
            let params = VoiceConnectParams {
                provision_cap_url: link.provision,
                signaling_cap_url: link.signaling,
                agent_id: v.agent_id,
                voice_server_type: link.server,
                // the estate body: no parcel_local_id
                channel: ChannelKind::Local { parcel_local_id: None },
                grid: v.grid.to_owned(),
                stun_servers: None,
            };
            let session = VoiceSession::connect(v.http.clone(), params, engine.voice_sink());
            session.set_primary(false);
            self.neighbours.insert(region, Neighbour::new(session));
        }
    }

    /// The channel's participants: the primary connection's and those of
    /// the connected neighbours, each resident once.
    fn nearby_participants(&self, primary: &VoiceSession) -> Vec<aurora_voice::Participant> {
        let neighbours = self.neighbours.values().filter(|n| n.connected()).map(|n| n.session.participants());
        aurora_voice::neighbours::merge_participants(std::iter::once(primary.participants()).chain(neighbours))
    }

