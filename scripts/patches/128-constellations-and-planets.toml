// aurora-local-patch: constellation-overlay-demo-window
/// `AURORA_DEMO_CONSTELLATIONS_WINDOW=1`: the Constellations window opens
/// at the start (beside the weather's, for a comparison by eye).
pub fn constellations_window() -> bool {
    static S: OnceLock<bool> = OnceLock::new();
    *S.get_or_init(|| std::env::var("AURORA_DEMO_CONSTELLATIONS_WINDOW").is_ok_and(|v| !v.trim().is_empty() && v.trim() != "0"))
}

/// `AURORA_DEMO_CONSTELLATION_CREDITS=<pixels>`: the constellations'
/// credits window opens at the start, its list scrolled that far down (0:
/// its top).
pub fn constellation_credits_scroll() -> Option<f32> {
    static S: OnceLock<Option<f32>> = OnceLock::new();
    *S.get_or_init(|| {
        std::env::var("AURORA_DEMO_CONSTELLATION_CREDITS")
            .ok()
            .and_then(|v| v.trim().parse::<f32>().ok())
            .filter(|v| v.is_finite())
            .map(|v| v.max(0.0))
    })'''

