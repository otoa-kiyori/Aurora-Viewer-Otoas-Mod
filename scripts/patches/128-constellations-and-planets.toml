[[patch]]
id = "night-sky-planets-star-frame"
why = "the star frame carries the planets' slots and the two disc words"
paths = ["crates/aurora-render/src/stars.rs"]
op = "literal"
find = '''
pub gain: f32,'''
replace = '''
pub gain: f32,
    // aurora-local-patch: night-sky-planets-star-frame
    /// The planets for the sky shader (aurora-viewer world/planets.rs;
    /// env.wgsl `sky_stars`): [0].x their count, then per planet its point
    /// in the star buffer's layout (`GpuStar`: catalogue direction and peak
    /// intensity; colour and sigma). Count 0: none, nothing read.
    pub planets: [[f32; 4]; PLANET_SLOTS],
    /// The Sun's and the Moon's discs as drawn: xyz their region direction,
    /// w `DISC_REGION` (the environment's own, as before; xyz unused),
    /// `DISC_REAL` (drawn there) or `DISC_HIDDEN` (not drawn).
    pub discs: [[f32; 4]; 2],
}

/// `StarFrame::planets`: the count, then two `vec4` per planet (at most 6).
/// Must match `sky_planets` in common.wgsl.
pub const PLANET_SLOTS: usize = 13;
/// `StarFrame::discs` w.
pub const DISC_REGION: f32 = 0.0;
pub const DISC_REAL: f32 = 1.0;
pub const DISC_HIDDEN: f32 = 2.0;

/// The Sun's and the Moon's disc words (`StarFrame::discs`) on the frame's
/// texture slots, cross-fade slots and moon direction (renderer.rs, the
/// frame uniforms): a hidden disc's slots (1 the sun, 2 the moon) left out
/// of both, so that its texture draws nothing; a real moon's direction in
/// `moon`'s xyz, its w (the scale) kept, for nothing but its disc reads it.
/// A hidden word is never moved, whatever its xyz: hide wins. The sun's
/// real direction goes to the shader in the words themselves (`sky_discs`).
pub fn apply_discs(discs: [[f32; 4]; 2], tex_slots: &mut [u32; 4], fade_slots: &mut [u32; 4], moon: &mut [f32; 4]) {
    let [sun, moon_word] = discs;
    if sun[3] == DISC_HIDDEN {
        tex_slots[1] = 0;
        fade_slots[1] = 0;
    }
    if moon_word[3] == DISC_HIDDEN {
        tex_slots[2] = 0;
        fade_slots[2] = 0;
    } else if moon_word[3] == DISC_REAL {
        *moon = [moon_word[0], moon_word[1], moon_word[2], moon[3]];
    }'''

