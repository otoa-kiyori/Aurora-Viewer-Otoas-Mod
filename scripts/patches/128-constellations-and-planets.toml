ui-constellations-rescan = Перечитати
ui-constellations-lines-and-names = Лінії та назви
ui-constellations-lines = Лінії
ui-constellations-lines-tip = Лінії від зорі до зорі.
ui-constellations-view = Малюнок і огляд
ui-constellations-reset = За замовчуванням
