ui-options-night-sky-sun-moon-help = Де на справжньому небі малюються диски сонця й місяця регіону. Лише відображення: світло, колір і сяйво неба, тіні та відблиски на воді залишаються як у регіоні.
ui-options-night-sky-sun-moon-real = Справжнє положення Сонця й Місяця
ui-options-night-sky-sun-moon-real-help = Диски сонця й місяця регіону малюються там, де перебувають справжні Сонце й Місяць у момент і в місці справжнього неба, з власними зображеннями регіону (без фаз). Лише відображення: світло залишається як у регіоні.
ui-options-night-sky-sun-moon-hidden = Приховати сонце й місяць регіону
ui-options-night-sky-sun-moon-hidden-help = Жодних дисків сонця й місяця. Лише відображення: світло, колір і сяйво неба залишаються як у регіоні. Має перевагу над справжнім положенням.
ui-constellations-solar-system = Сонячна система'''

