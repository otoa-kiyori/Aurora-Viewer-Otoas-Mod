[[patch]]
id = "night-sky-planets-discs-test"
why = "the disc words' test"
paths = ["crates/aurora-render/src/stars.rs"]
op = "literal"
find = '''
assert!((0.3..0.45).contains(&(small / pixel)) && (0.75..0.9).contains(&(large / pixel)));
    }
}'''
replace = '''
assert!((0.3..0.45).contains(&(small / pixel)) && (0.75..0.9).contains(&(large / pixel)));
    }

    // aurora-local-patch: night-sky-planets-discs-test
    #[test]
    fn the_disc_words_hide_or_move_only_their_own_body() {
        let tex = [11, 12, 13, 14];
        let fade = [21, 22, 23, 24];
        let moon = [0.1, 0.2, 0.97, 0.9];
        let run = |discs: [[f32; 4]; 2]| {
            let (mut t, mut f, mut m) = (tex, fade, moon);
            apply_discs(discs, &mut t, &mut f, &mut m);
            (t, f, m)
        };
        // the region's own: nothing changes (its xyz unused)
        assert_eq!(run([[0.5, 0.5, 0.5, DISC_REGION]; 2]), (tex, fade, moon));
        // the sun hidden: slot 1 of both, nothing else
        let hidden = [0.0, 0.0, -1.0, DISC_HIDDEN];
        assert_eq!(run([hidden, [0.0; 4]]), ([11, 0, 13, 14], [21, 0, 23, 24], moon));
        // the moon hidden: slot 2 of both, nothing else
        assert_eq!(run([[0.0; 4], hidden]), ([11, 12, 0, 14], [21, 22, 0, 24], moon));
        // the real moon: its direction, the scale kept; no slot touched
        let real_moon = [0.6, 0.0, 0.8, DISC_REAL];
        assert_eq!(run([[0.0; 4], real_moon]), (tex, fade, [0.6, 0.0, 0.8, 0.9]));
        // the real sun: in the words only, nothing here changes
        assert_eq!(run([[0.0, 0.8, 0.6, DISC_REAL], [0.0; 4]]), (tex, fade, moon));
        // hide wins for each body: a hidden word with a direction moves nothing
        let both = run([[0.0, 0.8, 0.6, DISC_HIDDEN], [0.6, 0.0, 0.8, DISC_HIDDEN]]);
        assert_eq!(both, ([11, 0, 0, 14], [21, 0, 0, 24], moon));
    }
}'''

