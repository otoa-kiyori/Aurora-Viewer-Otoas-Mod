ui-options-constellations-darkness-help = Наскільки глибоко сонце має опуститися під обрій, щоб з'явилися фігури: 6° — громадянські сутінки, 12° — навігаційні, 18° — повна ніч.
ui-options-constellations-font-size = Розмір назв
ui-options-constellations-font-size-help = Розмір назв на небі: за 16 пунктів висота літер — близько 1,2° за будь-якого масштабу.
ui-options-constellations-open = Сузір'я…
