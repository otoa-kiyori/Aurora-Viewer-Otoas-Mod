ui-constellations-line-width = Товщина ліній
ui-constellations-line-width-tip = Товщина ліній, кратна стандартній. Менше приблизно одного пікселя вони стають блідішими, а не тоншими, щоб ніколи не розпадатися на штрихи.
ui-constellations-effects = Ефекти
ui-constellations-brightness = Яскравість промальовування
ui-constellations-brightness-tip = Поки фігура промальовується, її лінії й зображення світяться настільки яскравіше, а після промальовування плавно повертаються до звичайної яскравості. ×1: без змін.
ui-constellations-highlight = Спалах завершення
