[[patch]]
id = "constellation-name-readings-module"
why = "constellations_readings.rs: a name's kana reading, its runs and where it goes (pure)"
paths = ["crates/aurora-viewer/src/world/constellations_readings.rs"]
op = "add_file"
source = "files/constellations-and-planets/constellations_readings.rs"

[[patch]]
id = "constellation-name-readings-wgsl"
why = "the figures' name size word read back with its lift"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
op = "literal"
find = '''
let wh = vec2<f32>(f32(dims & 0xffffu), f32(dims >> 16u));
            // each name its own texel: a long one is smaller, within its reach'''
replace = '''
// aurora-local-patch: constellation-name-readings-wgsl
            // width, height and lift (NameImage::dims): the label point is
            // the name's text's centre, lift / 2 rows under the picture's
            // when a reading sits over the text
            let wh = vec2<f32>(f32(dims & 0xfffu), f32((dims >> 12u) & 0x3ffu));
            let lift = f32(dims >> 22u);
            // each name its own texel: a long one is smaller, within its reach'''

[[patch]]
id = "constellation-name-readings-wgsl-at"
why = "the name's text centred on its label point, or moved off its figure's stars"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
op = "literal"
find = '''
let at = vec2<f32>(dot(v, right), -dot(v, up)) / texel + wh * 0.5;'''
replace = '''
let at = vec2<f32>(dot(v, right), -dot(v, up)) / texel + vec2<f32>(-spot.x, spot.y) + vec2<f32>(wh.x, wh.y + lift) * 0.5; // aurora-local-patch: constellation-name-readings-wgsl-at'''

[[patch]]
id = "constellation-name-readings-architecture"
why = "ARCHITECTURE.md: the readings' module"
paths = ["ARCHITECTURE.md"]
op = "literal"
find = '''
`constellations_names.rs` the names drawn with the interface's fonts,'''
replace = '''
`constellations_names.rs` the names drawn with the interface's fonts (`constellations_readings.rs`: a Japanese name's kana reading over its kanji <!-- // aurora-local-patch: constellation-name-readings-architecture -->),'''
