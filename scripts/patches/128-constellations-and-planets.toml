ui-options-constellations-darkness = Угол солнца, при котором появляются созвездия
ui-options-constellations-darkness-help = Насколько глубоко солнце должно опуститься под горизонт, чтобы появились фигуры: 6° — гражданские сумерки, 12° — навигационные, 18° — полная ночь.
ui-options-constellations-font-size = Размер названий
ui-options-constellations-font-size-help = Размер названий на небе: при 16 пунктах высота букв около 1,2° при любом масштабе.
ui-options-constellations-open = Созвездия…
ui-constellations-window-help = Созвездия на реальном ночном небе: их рисунки, линии и названия, которые рисует только этот вьюер. Они видны на снимках, но не в отражениях. Данные читаются из папки «constellations» вашего профиля.
ui-constellations-show = Показывать созвездия
ui-constellations-show-tip = Созвездия на реальном ночном небе. Когда выключено, ничего не читается и не рисуется.
ui-constellations-status-reading = Чтение данных о созвездиях…
ui-constellations-status-legacy-sky = Ночное небо не реальное: выберите реальное небо в разделе «Настройки › Графика › Окружающая среда».
ui-constellations-status-daylight = Слишком светло: фигуры появятся, когда солнце опустится на { $degrees }° под горизонт.
ui-constellations-sets-none = В данных нет набора рисунков.
ui-constellations-cultures = Наборы созвездий
ui-constellations-culture-tip = Его созвездия: { $count }.
ui-constellations-names-waiting = { $count ->
    [one] { $count } название ждёт места: сузьте поле вокруг обзора или отметьте меньше наборов.
    [few] { $count } названия ждут места: сузьте поле вокруг обзора или отметьте меньше наборов.
    [many] { $count } названий ждут места: сузьте поле вокруг обзора или отметьте меньше наборов.
   *[other] { $count } названия ждут места: сузьте поле вокруг обзора или отметьте меньше наборов.
    }
ui-constellations-culture-left-out = { $count ->
    [one] { $count } фигура не показана: больше, чем помещается на небе со всеми наборами.
    [few] { $count } фигуры не показаны: больше, чем помещается на небе со всеми наборами.
    [many] { $count } фигур не показано: больше, чем помещается на небе со всеми наборами.
   *[other] { $count } фигуры не показано: больше, чем помещается на небе со всеми наборами.
    }
ui-constellations-rescan = Перечитать
ui-constellations-lines-and-names = Линии и названия
ui-constellations-lines = Линии
ui-constellations-lines-tip = Линии от звезды к звезде.
ui-constellations-view = Рисунок и обзор
ui-constellations-reset = По умолчанию
ui-constellations-reset-tip = Все значения этого окна возвращаются к значениям по умолчанию, включая наборы.
ui-options-fun-sky = Ночное небо
ui-constellations-figures = Гравированные фигуры
ui-constellations-figures-opacity = Непрозрачность
ui-constellations-figures-opacity-help = Насколько заметны гравированные фигуры: от полностью прозрачных (0: их изображения тогда не читаются и не рисуются) до полностью прорисованных (1). Каждая фигура берёт рисунок из первого отмеченного набора этого списка, в котором он есть; без рисунка она показывает свои линии и название.
ui-constellations-line-width = Толщина линий
ui-constellations-line-width-tip = Толщина линий, кратная толщине по умолчанию. Тоньше примерно одного пикселя они становятся бледнее, а не тоньше, чтобы никогда не распадаться на штрихи.
ui-constellations-effects = Эффекты
ui-constellations-brightness = Яркость прорисовки
ui-constellations-brightness-tip = Пока фигура прорисовывается, её линии и изображение светятся во столько раз ярче, а после прорисовки плавно возвращаются к обычной яркости. ×1: без изменений.
ui-constellations-highlight = Вспышка завершения
ui-constellations-highlight-tip = Когда изображение, линии фигуры или название полностью появляются, они один раз коротко и мягко вспыхивают.
ui-constellations-colours = Разные цвета
ui-constellations-colours-tip = Каждое созвездие своим светлым пастельным цветом, всегда одним и тем же, для его линий, изображения и названия.
ui-constellations-sparkles = Искры
ui-constellations-sparkles-tip = Маленькая искра движется на конце каждой линии, пока она рисуется, и гаснет, когда линия прорисована.
ui-constellations-sparkle-size = Размер искр
ui-constellations-sparkle-size-tip = ×1: четыре толщины линий, с учётом настройки их толщины.
ui-constellations-sparkle-shape = Форма искр
ui-constellations-sparkle-shape-tip = Форма искр на концах линий.
ui-constellations-sparkle-circle-cross = Круг с крестообразной звездой
ui-constellations-sparkle-cross = Крестообразная звезда
ui-constellations-sparkle-star = Пятиконечная звезда
ui-constellations-sparkle-spin = Обороты искр
ui-constellations-sparkle-spin-tip = Сколько оборотов делает искра, пока линия рисуется от начала до конца: при 0 она неподвижна.
ui-constellations-credits = Лицензии и авторство
ui-constellations-credits-tip = Откуда взяты данные о созвездиях в вашем профиле и под какими лицензиями.
ui-constellations-credits-title = Лицензии и авторство
ui-constellations-credits-help = Источники данных о созвездиях в вашем профиле, как их называют файлы credits.json его папки: каждый правообладатель, что у него взято, его лицензия, сайт и дата, когда данные были добавлены. Ничего не читается из сети; ссылка открывается, только если это адрес https://.
ui-constellations-credits-general = Общие данные
ui-constellations-credits-culture = Культура: { $name }
ui-constellations-credits-set = Набор: { $name }
ui-constellations-credits-imported = Данные импортированы: { $date }
ui-constellations-credits-empty = В папке с данными о созвездиях не найден файл с указанием авторства.
ui-bars-constellations = Созвездия
constellation-culture-western = Западная
ui-options-night-sky-planets = Планеты
ui-options-night-sky-planets-help = Меркурий, Венера, Марс, Юпитер, Сатурн и тусклый Уран там, где они действительно находятся среди звёзд в момент реального неба (с 1800 по 2050 год); их рисует только этот вьюер. Планета вблизи реального Солнца теряется в его сиянии.
ui-options-night-sky-planet-names = Названия планет
ui-options-night-sky-planet-names-help = Название каждой планеты рядом с ней, из папки с данными о созвездиях (planets.json); на английском, если там его нет.
ui-options-night-sky-sun-moon = Солнце и Луна
ui-options-night-sky-sun-moon-help = Где рисуются диски солнца и луны региона на реальном небе. Только отображение: свет, цвет и свечение неба, тени и блики на воде остаются как в регионе.
ui-options-night-sky-sun-moon-real = Реальное положение Солнца и Луны
ui-options-night-sky-sun-moon-real-help = Диски солнца и луны региона рисуются там, где находятся реальные Солнце и Луна в момент и в месте реального неба, с собственными изображениями региона (без фаз). Только отображение: свет остаётся как в регионе.
ui-options-night-sky-sun-moon-hidden = Скрыть солнце и луну региона
ui-options-night-sky-sun-moon-hidden-help = Никаких дисков солнца и луны. Только отображение: свет, цвет и свечение неба остаются как в регионе. Имеет приоритет над реальным положением.
ui-constellations-solar-system = Солнечная система'''

