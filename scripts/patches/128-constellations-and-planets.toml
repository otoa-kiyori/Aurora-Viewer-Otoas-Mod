# Constellations and planets in the real night sky. Engraved figures draw
# themselves like a pen stroke as they come into view, with their stick
# lines from star to star and their names; the planets shine where they
# really are; the Sun and the Moon can be drawn at their real places or
# hidden. Aurora's own: the Legacy Viewer draws no constellations and no
# planets. Local rendering only: nothing comes from or goes to the grid.
#
# Code only: the figures' lines, names, drawings and credits are data the
# user installs in their profile, read at run time; without it nothing is
# drawn and the window names the folder.
#
# Data (constellations_catalogue.rs): `constellations/` in the viewer's
# configuration folder, beside the photo LUTs (settings.rs config_dir; the
# demo's own folder in the demo), or AURORA_CONSTELLATION_DIR:
#   cultures/<c>/lines.json   a culture's stick lines, names, label points
#   cultures/<c>/culture.json its name and translations (optional)
#   cultures/<c>/names.json   its figures' names per language (optional)
#   lines.json                the western culture's, when it has no folder
#   names.json                the western names, when it has no folder
#   planets.json              the planets' names: per planet id, the
#                             form of a culture's name (optional)
#   sets/<set>/set.json       a set: name, names by language, order, culture
#   sets/<set>/<figure>.json  a figure's metadata in that set
#   sets/<set>/<figure>.webp  its drawing (lossless, LA: ink, reveal time)
#   credits.json              the sources' credits, at the root, in a
#                             culture's or a set's folder (optional;
#                             constellations_credits.rs)
# Nothing in the code lists sets or figures. Untrusted input:
# size limits per file, bounded counts, ids of safe characters (file names
# come from ids, never from a path in a JSON), a picture's size checked
# against its JSON and the atlas before decoding; what does not read is
# left out and logged once, never a panic. Read on a thread of its own the
# first time it is needed, and again on Rescan only when a file changed
# (the root names file included).
#
# The window: built like the Aurora Weather window and sharing its cards
# (World > Environment > Constellations, a toolbar button on its default
# set that opens and closes it, and a "Night sky" row in Preferences >
# Just for fun). @setenv holds it like the weather: the menu entry greyed,
# the button refused, an open window closed. From the top:
# - "Show constellations" (on), with a line under it when nothing can show
#   (the sky is not the real one, too light, the data is being read, or
#   no data was found).
# - "Constellation sets": one row per sky culture of the data (a tick, its
#   name in the interface's language, its number of figures); several may
#   be ticked; a culture's art sets fold under its row. Setting
#   `constellations.cultures` (none stored: the western culture only). An
#   unticked culture is neither drawn nor listed in the shader's tables.
# - "Engraved figures": their opacity (1, 0 to 1), a check mark per art
#   set (a figure's drawing comes from the first checked set that has
#   one), and Rescan. Lines (on) and their width (x1), Names (on),
#   Obsolete figures (off).
# - Effects: drawing brightness (x1), a soft pulse as each part finishes
#   appearing (on), a pastel colour per constellation (off), sparkles at
#   the lines' pen tips with their size, shape and turns (off).
# - Drawing time (4 s), fade-out time (3 s), field around the view (50
#   degrees), sun under the horizon (8 degrees), names' size (16 pt).
# - "Solar system": the planets' and the Sun and Moon switches below.
# - "See licences and attribution": the data's sources from its
#   `credits.json` files, each in its own card. Reset to defaults.
#
# The figures: one in the field, at night, draws itself over the drawing
# time (lines, then the engraving in the pen's order, then its name), and
# fades out when it leaves the field or the sky grows light, never in one
# frame; every switch fades what it turns on or off the same way. They
# turn exactly with the real stars (night_sky.rs star_frame). Names lie
# level with the horizon (near the zenith they turn with the view), drawn
# with the interface's fonts at a fixed size in the sky. Drawn by the sky
# shader next to the stars (env.wgsl `constellation_overlay`, called from
# `sky_stars`): they fade with the stars, hide behind clouds, the sun and
# the moon, show in photos, and only in the main view's own sky (no
# mirror, water or probe). The GPU holds up to 1536 figures, every culture
# together, within a uniform binding's 64 KiB.
#
# The planets (world/planets.rs, its maths in planets_ephemeris.rs; also
# in Preferences > Graphics beside the real night sky's options; under
# @setenv they cannot change):
# - Planets (on): Mercury, Venus, Mars, Jupiter, Saturn and Uranus as
#   steady points like the stars, placed from a published table of
#   approximate Keplerian elements (public domain), their brightness from
#   a 2018 planetary magnitude model; valid from 1800 to 2050; they fade
#   in the real Sun's glare.
# - Planet names (off): each planet's name under it, in the
#   constellations' look, from `planets.json` (a built-in English name when
#   missing); a pass of their own (env.wgsl `constellation_planet_names`,
#   constellations_planets.rs), so they show with the figures off.
# - Real Sun and Moon positions (off), Hide the region's Sun and Moon
#   (off): display only; the light, the sky's colour, the shadows and the
#   star field's hour keep the region's sun.
#
# Names per language: a figure of another culture takes its name from its
# culture's `names.json`; a western figure from the western names file,
# both in the interface's language (or the language without its region),
# then as before (the catalogue key for the 88, the data's name for the
# others). The 88 have catalogue names in English, French and Japanese.
#
# Interface text: English, French and Japanese, and the twelve community
# catalogues (German, Spanish, Italian, Norwegian Bokmål, Polish, Brazilian
# and European Portuguese, Russian, Turkish, Ukrainian and both Chinese
# scripts) as draft translations, not proofread by a native speaker; they
# follow docs/TRANSLATING.md and the words each catalogue already uses.
#
# Readings: a Japanese name (of a figure or a planet) that ends with its
# kana reading in brackets, `<base>(<kana>)`, shows the reading over its
# kanji in letters half the name's size, as a book prints it
# (constellations_readings.rs); a nested reading goes over the base's
# group of its rank. Any other shape is drawn as written, and a name
# without a reading is laid out as before, byte for byte. The base stays
# centred on the label point; the picture carries its lift.
#
# Cost off: nothing while the overlay is off, by day or with the Legacy
# Viewer's stars: a few comparisons a frame, a zeroed uniform, one word
# tested in the shader; the planets off are a count of 0 and two zero disc
# words. Pictures are read on the overlay's worker the first time their
# figure shows, into an Rg8 atlas (layers of 4096 x 2048, at most 3, 6
# for several cultures' names), least recently used first out; 30 s with
# nothing shown let it go.
#
# Test variables (docs/TESTING.md): AURORA_CONSTELLATIONS=0|1,
# AURORA_CONSTELLATION_DIR=<folder>, and in the demo
# AURORA_DEMO_CONSTELLATIONS=on|<items> (stages, switches, sets=,
# cultures=, name_language=, zenith=, rescan...),
# AURORA_DEMO_CONSTELLATIONS_WINDOW=1|sets,
# AURORA_DEMO_CONSTELLATION_CREDITS=<pixels>, AURORA_DEMO_PLANETS=on|off|
# names, AURORA_DEMO_SKY_DISCS=real,hide.

