ui-constellations-sparkle-size = Розмір іскор
ui-constellations-sparkle-size-tip = ×1: чотири товщини ліній, з урахуванням налаштування їхньої товщини.
ui-constellations-sparkle-shape = Форма іскор
ui-constellations-sparkle-shape-tip = Форма іскор на кінцях ліній.
ui-constellations-sparkle-circle-cross = Коло з хрестоподібною зіркою
ui-constellations-sparkle-cross = Хрестоподібна зірка
ui-constellations-sparkle-star = П'ятикутна зірка
ui-constellations-sparkle-spin = Оберти іскор
ui-constellations-sparkle-spin-tip = Скільки обертів робить іскра, поки лінія малюється від початку до кінця: за 0 вона нерухома.
ui-constellations-credits = Ліцензії та авторство
ui-constellations-credits-tip = Звідки походять дані про сузір'я у вашому профілі та за якими ліцензіями.
ui-constellations-credits-title = Ліцензії та авторство
ui-constellations-credits-help = Джерела даних про сузір'я у вашому профілі, як їх називають файли credits.json його папки: кожен правовласник, що в нього взято, його ліцензія, сайт і коли дані було додано. З мережі нічого не читається; посилання відкривається, лише якщо це адреса https://.
ui-constellations-credits-general = Загальні дані
ui-constellations-credits-culture = Культура: { $name }
ui-constellations-credits-set = Набір: { $name }
ui-constellations-credits-imported = Дані імпортовано: { $date }
ui-constellations-credits-empty = У папці з даними про сузір'я не знайдено файлу з авторством.
ui-bars-constellations = Сузір'я
constellation-culture-western = Західна
ui-options-night-sky-planets = Планети
ui-options-night-sky-planets-help = Меркурій, Венера, Марс, Юпітер, Сатурн і тьмяний Уран там, де вони справді перебувають серед зірок у момент справжнього неба (з 1800 до 2050 року); їх малює лише цей переглядач. Планета поблизу справжнього Сонця губиться в його сяйві.
ui-options-night-sky-planet-names = Назви планет
ui-options-night-sky-planet-names-help = Назва кожної планети поруч із нею, з папки з даними про сузір'я (planets.json); англійською, якщо там її немає.
