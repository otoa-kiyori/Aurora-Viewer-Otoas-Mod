// aurora-local-patch: night-sky-planets-options-tests
/// The planets' and the Sun and Moon's switches under `@setenv`: no reset
/// of Preferences puts them back (a page, every row, everything), the rest
/// of the page resets as before; free, they reset like any row.
#[test]
fn under_setenv_no_reset_changes_the_planet_switches() {
    use crate::world::planets::Wanted;
    let ctx = egui::Context::default();
    let p = crate::theme::Theme::default().palette();
    let d = Settings::default();
    let mut s = Settings::default();
    let set = Wanted {
        planets: false,
        names: true,
        real: true,
        hidden: true,
    };
    set.store(&mut s);
    s.draw_distance = d.draw_distance + 64.0;
    let mut st = OptionsUi {
        rlva_setenv_locked: true,
        ..Default::default()
    };
    let mut r = OptionsResult::default();
    for page in [Some(Page::Graphics), None] {
        let mut t = s.clone();
        run_ui(&ctx, egui::RawInput::default(), |ui| {
            reset_rows(ui, &p, &mut t, &d, &mut st, &mut r, page)
        });
        assert_eq!(Wanted::of(&t), set, "{page:?}");
        assert_eq!(t.draw_distance, d.draw_distance, "{page:?}: the rest resets");
    }
    let mut t = s.clone();
    reset_all(&mut t, &mut st, &mut r, 0.0);
    assert_eq!(Wanted::of(&t), set, "reset of everything");
    assert_eq!(t.draw_distance, d.draw_distance);
    st.rlva_setenv_locked = false;
    let mut t = s.clone();
    run_ui(&ctx, egui::RawInput::default(), |ui| {
        reset_rows(ui, &p, &mut t, &d, &mut st, &mut r, Some(Page::Graphics))
    });
    assert_eq!(Wanted::of(&t), Wanted::of(&d), "free: back to the defaults");
}

/// The Planets row under `@setenv` offers no reset dot (the rule that
/// also greys its control, cx.rs `rlva_locked`); free, its dot resets it.
#[test]
fn under_setenv_the_planets_row_cannot_be_reset_by_its_dot() {
    let mut frames = Frames::new();
    let (mut s, mut r) = (Settings::default(), OptionsResult::default());
    let mut st = OptionsUi {
        rlva_setenv_locked: true,
        ..Default::default()
    };
    s.night_sky_planets = false;
    let label = aurora_i18n::tr!("ui-options-night-sky-planets");
    let mut texts = Vec::new();
    for _ in 0..3 {
        texts = page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 2, Vec::new());
    }
    let row = texts.iter().find(|t| t.source == label).expect("the Planets row").rect;
    let dot = egui::pos2(row.left() - 8.0, row.center().y);
    for events in click(dot) {
        page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 2, events);
    }
    assert!(!s.night_sky_planets, "locked: left as it is");
    st.rlva_setenv_locked = false;
    for _ in 0..2 {
        page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 2, Vec::new());
    }
    for events in click(dot) {
        page_frame(&mut frames, &mut s, &mut st, &mut r, Page::Graphics, 2, events);
    }
    assert!(s.night_sky_planets, "free: the dot puts it back");
}'''

