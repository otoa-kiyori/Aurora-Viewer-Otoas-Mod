ui-constellations-status-reading = Читання даних про сузір'я…
ui-constellations-status-legacy-sky = Нічне небо не справжнє: виберіть справжнє небо в «Налаштування › Графіка › Середовище».
ui-constellations-status-daylight = Надто світло: фігури з'являться, коли сонце опуститься на { $degrees }° під обрій.
ui-constellations-sets-none = У даних немає набору малюнків.
