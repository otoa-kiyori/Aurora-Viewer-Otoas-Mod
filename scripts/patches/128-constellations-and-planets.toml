    [few] { $count } фігури пропущено: більше, ніж уміщує небо з усіма наборами.
    [many] { $count } фігур пропущено: більше, ніж уміщує небо з усіма наборами.
   *[other] { $count } фігури пропущено: більше, ніж уміщує небо з усіма наборами.
