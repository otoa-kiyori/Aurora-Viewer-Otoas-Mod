# The Animation explorer's "Played" column is accurate per row.
#
# Upstream records one row each time a (source, animation) pair newly appears
# in the simulator's list, and prunes the pair when it leaves it. But a row's
# "Still playing" came from a check of the pair alone, so after a stop and a
# restart every old row of the pair said "Still playing", and a stopped row
# counted its "N seconds ago" from its start, not from its stop.
#
# Now the log entry records when its pair left the simulator's list (the
# `retain` that prunes `animation_sources`, and `stop_motion_from_source`,
# which removes a pair the same way). A row is playing only if it is the
# newest start of its pair (`AnimationLog::live_ids`), has no stop recorded,
# and the simulator still lists the pair. Every older row stays, never hidden,
# and says "stopped 12 s ago, played 3 s" (`animation-explorer-stopped`); a
# stopped row with no stop time keeps the old "N seconds ago". The column is
# wider for it (WEIGHTS), and the full text is also in the row's tooltip in case
# a narrow window elides it.
#
# This deliberately differs from the Legacy Viewer's AnimationExplorer
# (indra/newview/animationexplorer.cpp), which marks every row of a listed pair
# "still playing". Sorting, selection, the stand-in preview, Stop / Revoke /
# Blacklist and the asset-id rule are untouched.
#
# The demo (AURORA_DEMO_ANIMATION_EXPLORER) restarts the dance once more, so it
# shows a playing row above a stopped one of the same pair.
#
# Tests: files/animation-explorer-played/ (the log's rules, the row texts) and
# one in world/mod.rs (the simulator's list stamps the stop). Texts are added
# to the English, French and Japanese catalogues; the idempotence marker of the Fluent files is a Fluent
# comment line. Apply or skip the whole file, not one patch of it.

# --------------------------------------------------------------------- log

