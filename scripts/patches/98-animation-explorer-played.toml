[[patch]]
id = "animation-explorer-played-prune"
why = "the pairs the simulator no longer lists stopped now: stamp them where they are pruned"
paths = ["crates/aurora-viewer/src/world/mod.rs"]
op = "literal"
find = '''self.animation_sources.retain(|_, motions| {
                        motions.retain(|id| anims.iter().any(|(active, _)| active == id));
                        !motions.is_empty()
                    });'''
replace = '''// The log's rows learn when their pair stopped (the Animation
                    // explorer's "Played"); the Legacy Viewer has no such stamp.
                    // aurora-local-patch: animation-explorer-played-prune
                    let log = &mut self.animation_log;
                    self.animation_sources.retain(|source, motions| {
                        motions.retain(|id| {
                            let listed = anims.iter().any(|(active, _)| active == id);
                            if !listed {
                                log.stop(*id, *source, now);
                            }
                            listed
                        });
                        !motions.is_empty()
                    });'''

