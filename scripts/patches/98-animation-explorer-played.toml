[[patch]]
id = "animation-explorer-played-world-test"
why = "the simulator's list stamps the stop of a row, and a restart is a new playing row"
paths = ["crates/aurora-viewer/src/world/mod.rs"]
op = "literal"
find = "fn ao_smart_sit_uses_only_the_seat_and_linkset_sources() {"
replace = '''fn animation_explorer_rows_learn_when_the_simulator_stops_listing_their_pair() {
        // aurora-local-patch: animation-explorer-played-world-test
        let (mut world, _, _, root, linked) = seated_fixture();
        let (sit, hands) = (Uuid::from_u128(71), Uuid::from_u128(72));
        let signal = |world: &mut World, anims: Vec<(Uuid, i32)>, sources: Vec<Uuid>| {
            world.apply(NetEvent::AvatarAnimations {
                avatar: world.agent_id,
                anims,
                sources,
            });
        };
        signal(&mut world, vec![(sit, 1), (hands, 1)], vec![root, linked]);
        signal(&mut world, vec![(hands, 2)], vec![linked]);
        signal(&mut world, vec![(sit, 3), (hands, 3)], vec![root, linked]);
        let rows: Vec<_> = world.animation_log.entries().copied().collect();
        assert_eq!(rows.len(), 3, "the restart of the sit is a new row, the old one stays");
        assert_eq!((rows[0].animation, rows[0].source), (sit, root));
        assert!(rows[0].stopped.is_some_and(|at| at >= rows[0].started), "its pair left the list");
        assert_eq!((rows[1].animation, rows[2].animation), (hands, sit));
        assert_eq!(rows[1].stopped, None, "the hands never left the list");
        assert_eq!(world.animation_log.live_ids(), HashSet::from([rows[1].id, rows[2].id]));
        // releasing a source stops its running row the same way
        world.stop_motion_from_source(linked);
        assert!(world.animation_log.entries().nth(1).is_some_and(|e| e.stopped.is_some()));
        assert_eq!(world.animation_log.live_ids(), HashSet::from([rows[2].id]));
    }

    #[test]
    fn ao_smart_sit_uses_only_the_seat_and_linkset_sources() {'''

