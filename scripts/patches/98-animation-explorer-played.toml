[[patch]]
id = "animation-explorer-played-log-methods"
why = "stamp the stop of a pair's running start, and tell which rows can be playing"
paths = ["crates/aurora-viewer/src/world/animation_log.rs"]
op = "literal"
find = "/// Oldest first."
replace = '''/// The simulator no longer lists the pair: its newest start, if still
    /// running, stopped now. Older starts of the pair stopped earlier.
    // aurora-local-patch: animation-explorer-played-log-methods
    pub fn stop(&mut self, animation: Uuid, source: Uuid, now: Instant) {
        if let Some(entry) = self
            .entries
            .iter_mut()
            .rev()
            .find(|e| e.animation == animation && e.source == source)
            && entry.stopped.is_none()
        {
            entry.stopped = Some(now);
            self.generation = self.generation.wrapping_add(1);
        }
    }

    /// The rows that can be playing: the newest start of each pair, when no
    /// stop is recorded for it. The window also asks the simulator's list.
    pub fn live_ids(&self) -> std::collections::HashSet<u64> {
        let mut seen = std::collections::HashSet::new();
        self.entries
            .iter()
            .rev()
            .filter(|e| seen.insert((e.animation, e.source)) && e.stopped.is_none())
            .map(|e| e.id)
            .collect()
    }

    /// Oldest first.'''

