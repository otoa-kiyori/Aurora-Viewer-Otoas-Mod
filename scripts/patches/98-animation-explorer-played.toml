[[patch]]
id = "animation-explorer-played-text"
why = "a stopped row says when it stopped and how long it played; one with no stop time keeps the old text"
paths = ["crates/aurora-viewer/src/ui/animation_explorer.rs"]
op = "replace_fn_body"
fn = "played_text"
expect_sig = 'pub fn played_text\(row: &Row, now: Instant\) -> String'
body = '''if row.playing {
    return aurora_i18n::tr!("animation-explorer-still-playing").to_owned();
}
match row.stopped {
    Some(stopped) => aurora_i18n::tr!(
        "animation-explorer-stopped",
        ago = now.saturating_duration_since(stopped).as_secs(),
        played = stopped.saturating_duration_since(row.started).as_secs()
    ),
    None => aurora_i18n::tr!(
        "animation-explorer-seconds-ago",
        seconds = now.saturating_duration_since(row.started).as_secs()
    ),
}'''

