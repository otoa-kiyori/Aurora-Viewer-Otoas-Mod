[[patch]]
id = "trust-engine-web-view-notice"
why = "the engine line above a web page: shown with TRust (Open with Chromium), or with Chromium after a fall back or the user's choice (Try with TRust)"
paths = ["crates/aurora-viewer/src/ui/web_view.rs"]
op = "insert_fn_start"
fn = "show"
impl = "WebView"
expect_sig = 'size: Vec2, \) -> egui::Response'
body = '''
// the page's engine line (local patch set, 77-trust-engine): which engine
// shows the page, and the button to the other one
const NOTICE_H: f32 = 24.0;
use crate::media::engine_choice::{self, Switch};
let switch = self
    .plugin
    .as_ref()
    .and_then(|p| engine_choice::switch_now(&p.plugin_name, &self.url));
let line = match (&self.engine_notice, switch) {
    (Some(reason), _) => Some((aurora_i18n::tr!("media-trust-fell-back"), Some(reason.clone()), Switch::ToTrust)),
    (None, Some(Switch::ToChromium)) => Some((aurora_i18n::tr!("media-trust-shown"), None, Switch::ToChromium)),
    (None, Some(Switch::ToTrust)) => Some((aurora_i18n::tr!("media-chromium-chosen"), None, Switch::ToTrust)),
    (None, None) => None,
};
let size = match line {
    Some((text, reason, to)) => {
        let mut pressed = false;
        ui.allocate_ui_with_layout(
            Vec2::new(size.x, NOTICE_H),
            egui::Layout::left_to_right(egui::Align::Center),
            |ui| {
                ui.set_min_size(Vec2::new(size.x, NOTICE_H));
                let label = ui.label(egui::RichText::new(text).size(12.0).color(pal.muted));
                if let Some(reason) = reason {
                    label.on_hover_text(reason);
                }
                let tip = match to {
                    Switch::ToChromium => aurora_i18n::tr!("media-open-with-chromium"),
                    Switch::ToTrust => aurora_i18n::tr!("media-trust-try-again"),
                };
                pressed = super::widgets::action_button(
                    ui,
                    pal,
                    "arrows-exchange",
                    tip,
                    super::widgets::ActionKind::Flat,
                    Vec2::new(0.0, 20.0),
                )
                .clicked();
            },
        );
        if pressed {
            match to {
                Switch::ToChromium => engine_choice::open_with_chromium(&self.url),
                Switch::ToTrust => engine_choice::retry(&self.url),
            }
            self.engine_notice = None;
            self.plugin = None;
            self.profile = None;
            self.cookie_set = false;
            self.nav_pending = true;
        }
        Vec2::new(size.x, (size.y - NOTICE_H).max(16.0))
    }
    None => size,
};
'''

