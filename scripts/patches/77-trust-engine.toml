[[patch]]
id = "trust-engine-web-view-start"
why = "a host that does not start: Chromium takes the window's page at the next frame"
paths = ["crates/aurora-viewer/src/ui/web_view.rs"]
op = "literal"
find = '''Err(e) => {
                        log::warn!("web view: cannot start the browser: {e}");
                        self.failed = Some(e.to_string());
                    }'''
replace = '''Err(e) => {
                        // aurora-local-patch: trust-engine-web-view-start
                        if crate::media::engine_choice::fall_back(
                            engine,
                            &self.url,
                            crate::media::engine_choice::Surface::Window,
                            &e.to_string(),
                        ) {
                            self.engine_notice = Some(e.to_string());
                            ui.ctx().request_repaint();
                        } else {
                            log::warn!("web view: cannot start the browser: {e}");
                            self.failed = Some(e.to_string());
                        }
                    }'''

