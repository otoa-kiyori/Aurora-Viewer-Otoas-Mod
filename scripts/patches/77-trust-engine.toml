# --- docs: the two variables

[[patch]]
id = "trust-engine-docs"
why = "AGENTS.md §4: a new AURORA_* variable gets its line in docs/TESTING.md"
paths = ["docs/TESTING.md"]
op = "regex"
pattern = '^\| `AURORA_DEMO_MEDIA_CLICK_FRAME=<n>` \| [^\n]*$'
replace = '''\g<0>
| `AURORA_TRUST_HOST=<path>` | The TRust host program, instead of the preferences' path (local patch set) <!-- // aurora-local-patch: trust-engine-docs --> |
| `AURORA_WEB_ENGINE=trust`, `chromium` or `trust-then-chromium` | The engine of web pages for this launch, without saving it (local patch set) |'''

[[patch]]
id = "trust-engine-docs-details"
why = "goes with trust-engine-docs: what to look for"
paths = ["docs/TESTING.md"]
op = "regex"
pattern = '^- \*\*`AURORA_DEMO_MEDIA=mini`\*\*: [^\n]*$'
replace = '''- **`AURORA_WEB_ENGINE` and `AURORA_TRUST_HOST`** (local patch set,
  77-trust-engine; <!-- // aurora-local-patch: trust-engine-docs-details -->): with
  `AURORA_DEMO_MEDIA=data:text/html,...` and `AURORA_WEB_ENGINE=trust`, the
  demo prim shows the page through `aurora-trust-host` (a process per page,
  `media: launched … (socket pair)` in the log; the host's own log is the
  viewer log's name with `.trust-host.log`). With `trust-then-chromium`,
  killing the host's page process hands the face to Chromium at once
  (`TRust could not show a page … shown with Chromium`). With
  `chromium`, no host runs and `<cache>/trust-run/` is deleted. The host
  shows web pages (its own fetch and TLS; it needs an Internet rule in the
  firewall), `data:`, `about:` and `file:` pages, with scripts, CSS
  animations, canvas and input; with the default setting an address of
  another protocol goes straight to Chromium (`media_plugin_cef for …` in
  the log), with `trust` the host refuses it at once. A document TRust
  does not lay out (JSON, PDF) falls back the same way; an HTTP error,
  a DNS or TLS failure does not: TRust shows its error page. With
  `AURORA_DEMO_WEB_BROWSER=https://…` the web window's engine line reads
  "Shown with TRust" with an "Open with Chromium" button; after it, or
  after a fall back, "Try with TRust". A site in Preferences › Media ›
  "Always use Chromium for these sites" never starts the host.
\g<0>'''
