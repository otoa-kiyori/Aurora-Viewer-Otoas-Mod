# TRust as a second web engine beside Chromium (stages 1 to 3).
#
# Otoa's choice (2026-11-11/12): web pages are shown by TRust, a Rust web
# engine, run by our own host program `aurora-trust-host` (a separate local
# repository, not part of this one), one process per page, in
# place of SLPlugin + the CEF plugin; Chromium is the fall back. Her goal:
# browsing the Internet with an engine under our control rather than
# Google's. Preferences › Media › Plugins › Web pages: "TRust, then
# Chromium" (the default), "TRust only" or "Chromium only". One rule for
# the three surfaces that show pages: in-world faces (and parcel media),
# HUDs, and the viewer's web windows (files/trust-engine/engine_choice.rs,
# with its tests). Video and music types keep their player (GStreamer on
# Linux).
#
# - aurora-media: the plugin name `media_plugin_trust` launches the host
#   program directly (files/trust-engine/trust_host.rs): an explicit path
#   from the preferences, else `<data>/trust-host/aurora-trust-host`;
#   AURORA_TRUST_HOST=<path> wins (tests). The plugin socket is a Unix socket
#   pair given to the host as descriptor 3, not upstream's loopback TCP
#   port: no localhost rule in the firewall, which sees only the page's own
#   web traffic (the host needs an Internet rule of its own in Portmaster).
#   The messages and the shared memory are upstream's.
# - Routing: "TRust, then Chromium" gives TRust http(s), `data:`, `about:`
#   and `file:` pages (engine_choice.rs `TRUST_SCHEMES`); anything else goes
#   to Chromium. "TRust only" sends every page to TRust, which refuses what
#   it cannot load at once (`engine_unsupported`). "Always use Chromium for
#   these sites" (Preferences › Media) sends listed sites to Chromium in
#   both TRust settings.
# - The host (its own repository) fetches pages itself with TRust's TLS
#   (WebPKI, Mozilla roots), runs scripts and animations, takes the mouse,
#   the wheel, keys and text into forms, reports links to other protocols
#   (`secondlife:`) as `click_nofollow` and new windows as `click_href`, and
#   shows its own error page for a page that cannot be fetched.
# - Fall back to Chromium ("TRust, then Chromium" only): when the host does
#   not start, crashes or stops answering (upstream's PluginFailed) and when
#   it refuses the page itself (`media_browser:engine_unsupported`: a
#   response that is no page for TRust, a failure of its script engine or
#   raster), which becomes a PluginFailed. Never for HTTP, DNS or TLS
#   errors. Logged at info. Remembered per site for the session. Only the
#   address carries over. The relaunch is upstream's own "another plugin
#   for this face" rule.
# - "Open with Chromium" / "Try with TRust": a face's media controls and
#   the engine line above a web window's page (files/trust-engine,
#   ui/media.rs and ui/web_view.rs hooks), for the session.
# - Cookies: TRust pages are memory-only, except on the sites of patch 76's
#   kept cookies list: a TRust profile of their own,
#   `<cache>/trust-sites/<domain>/`, separate from Chromium's; the
#   profiles of sites taken off the list (all of them with "Chromium
#   only") are deleted. Web windows still get the OpenID cookie before
#   their first page (upstream's set_cookie), which the host stores.
# - "Chromium only" starts no host, drops running ones at the next frame,
#   and deletes `<cache>/trust-run/`, `<cache>/trust-sites/` and the host
#   log (`<viewer log name>.trust-host.log`). At every start, run folders of
#   viewers that no longer run are deleted.
# - The two `== "media_plugin_cef"` checks (Linux stream volume of a world
#   page; a browser reports no "loaded" status) now mean "a browser plugin".
# - AURORA_WEB_ENGINE=trust|chromium|trust-then-chromium overrides the
#   setting for one launch (tests), without saving it.
#
# Needs 76-cef-site-profiles (its launch hooks are the anchors, its list
# and its matching rule are reused). Apply or skip the whole file, not one
# patch of it.

