paths = ["crates/aurora-viewer/src/ui/web_view.rs"]
op = "literal"
find = '''let launched = match (&private, paths) {
                (Err(e), _) => Some(Err(std::io::Error::new(e.kind(), e.to_string()))),
                // aurora-local-patch: cef-site-profiles-web-view
                (Ok(Some(settings)), Some(paths)) => Some(MediaPlugin::launch(paths, "media_plugin_cef", px.0, px.1, settings, "")), // aurora-local-patch: cef-site-profiles-web-view (private)
                (Ok(None), Some(paths)) => Some(crate::media::site_profiles::launch(
                    "media_plugin_cef",
                    &self.url,
                    browser,
                    |browser| MediaPlugin::launch(paths, "media_plugin_cef", px.0, px.1, browser, ""), // aurora-local-patch: cef-site-profiles-web-view
                )),'''
replace = '''// aurora-local-patch: trust-engine-web-view
            let engine = crate::media::engine_choice::choose_now(
                crate::media::engine_choice::CEF_PLUGIN,
                &self.url,
                crate::media::engine_choice::Surface::Window,
            );
            let launched = match (&private, paths) {
                (Err(e), _) => Some(Err(std::io::Error::new(e.kind(), e.to_string()))),
                // aurora-local-patch: cef-site-profiles-web-view
                (Ok(Some(settings)), Some(paths)) => Some(MediaPlugin::launch(paths, engine, px.0, px.1, settings, "")), // aurora-local-patch: cef-site-profiles-web-view (private)
                (Ok(None), Some(paths)) => Some(crate::media::site_profiles::launch(engine, &self.url, browser, |browser| {
                    crate::media::engine_choice::launch(engine, &self.url, || {
                        MediaPlugin::launch(paths, engine, px.0, px.1, browser, "") // aurora-local-patch: cef-site-profiles-web-view (trust-engine-web-view: a kept site's TRust profile)
                    })
                })),'''

[[patch]]
