[[patch]]
id = "trust-engine-web-view-failed"
why = "a host that crashed, stopped answering or refused the page: Chromium, with the notice"
paths = ["crates/aurora-viewer/src/ui/web_view.rs"]
op = "literal"
find = '''MediaEvent::PluginFailed(e) => {
                    log::warn!("web view: browser stopped: {e}");
                    self.failed = Some(e);
                }'''
replace = '''MediaEvent::PluginFailed(e) => {
                    // aurora-local-patch: trust-engine-web-view-failed
                    if crate::media::engine_choice::fall_back(&p.plugin_name, &self.url, crate::media::engine_choice::Surface::Window, &e) {
                        fell_back = Some(e);
                    } else {
                        log::warn!("web view: browser stopped: {e}");
                        self.failed = Some(e);
                    }
                }'''

[[patch]]
id = "trust-engine-web-view-relaunch"
why = "the fallen-back page is relaunched with Chromium at the next frame, at the window's address"
paths = ["crates/aurora-viewer/src/ui/web_view.rs"]
op = "literal"
find = '''if self.failed.is_some() {
            self.plugin = None;
            self.profile = None;
            return resp;
        }'''
replace = '''// aurora-local-patch: trust-engine-web-view-relaunch
        if let Some(reason) = fell_back {
            self.engine_notice = Some(reason);
            self.plugin = None;
            self.profile = None;
            self.cookie_set = false;
            self.nav_pending = true;
            ui.ctx().request_repaint();
            return resp;
        }
        if self.failed.is_some() {
            self.plugin = None;
            self.profile = None;
            return resp;
        }'''

# --- a face's media controls (ui/media.rs)

[[patch]]
id = "trust-engine-face-switch"
why = "Open with Chromium on a face TRust shows, Try with TRust on one Chromium shows after a fall back or that choice"
paths = ["crates/aurora-viewer/src/ui/media.rs"]
op = "literal"
find = '''} else if button(ui, p, icons, "refresh", aurora_i18n::tr!("ui-media-reload"), m.is_loaded()) {
                            m.reload();
                        }'''
replace = '''} else if button(ui, p, icons, "refresh", aurora_i18n::tr!("ui-media-reload"), m.is_loaded()) {
                            m.reload();
                        }
                        // aurora-local-patch: trust-engine-face-switch
                        // the page's engine (media/engine_choice.rs): the
                        // next frame relaunches the face with the other one
                        let switch = m
                            .plugin_name()
                            .and_then(|name| crate::media::engine_choice::switch_now(name, &m.url));
                        match switch {
                            Some(crate::media::engine_choice::Switch::ToChromium)
                                if button(ui, p, icons, "arrows-exchange", aurora_i18n::tr!("media-open-with-chromium"), true) =>
                            {
                                crate::media::engine_choice::open_with_chromium(&m.url);
                            }
                            Some(crate::media::engine_choice::Switch::ToTrust)
                                if button(ui, p, icons, "arrows-exchange", aurora_i18n::tr!("media-trust-try-again"), true) =>
                            {
                                crate::media::engine_choice::retry(&m.url);
                            }
                            _ => {}
                        }'''

