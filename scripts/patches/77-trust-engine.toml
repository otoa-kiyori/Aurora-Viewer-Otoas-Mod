find = "impl Drop for PluginProcess {"
replace = '''// aurora-local-patch: trust-engine-ipc-stream
/// The plugin socket: SLPlugin's loopback TCP connection, or the Unix socket
/// pair of a plugin program started directly (the TRust host,
/// trust_host.rs; local patch set).
enum IpcStream {
    Tcp(TcpStream),
    #[cfg(unix)]
    Unix(std::os::unix::net::UnixStream),
}

impl Read for IpcStream {
    fn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {
        match self {
            IpcStream::Tcp(s) => s.read(buf),
            #[cfg(unix)]
            IpcStream::Unix(s) => s.read(buf),
        }
    }
}

impl Write for IpcStream {
    fn write(&mut self, buf: &[u8]) -> std::io::Result<usize> {
        match self {
            IpcStream::Tcp(s) => s.write(buf),
            #[cfg(unix)]
            IpcStream::Unix(s) => s.write(buf),
        }
    }

    fn flush(&mut self) -> std::io::Result<()> {
        match self {
            IpcStream::Tcp(s) => s.flush(),
            #[cfg(unix)]
            IpcStream::Unix(s) => s.flush(),
        }
    }
}

impl PluginProcess {
    /// Start `program`, a plugin that speaks the protocol itself (no
    /// SLPlugin, no library to load), with `args`. Its end of a Unix
    /// socket pair is its descriptor 3; it says hello at once, so the
    /// process starts connected.
    #[cfg(unix)]
    pub fn launch_host(program: &Path, args: &[std::ffi::OsString], env: &[(String, String)]) -> std::io::Result<PluginProcess> {
        use std::os::fd::AsRawFd;
        use std::os::unix::process::CommandExt;
        let (ours, theirs) = std::os::unix::net::UnixStream::pair()?;
        ours.set_nonblocking(true)?;
        let fd = theirs.as_raw_fd();
        let mut cmd = Command::new(program);
        cmd.args(args).envs(env.iter().map(|(name, value)| (name, value)));
        // SAFETY: between fork and exec only async-signal-safe calls on the
        // child's own descriptor table: its end of the pair becomes
        // descriptor 3, kept across exec (dup2 clears close-on-exec; the
        // fcntl covers the case where it already was 3)
        unsafe {
            cmd.pre_exec(move || {
                if libc::dup2(fd, 3) == -1 || libc::fcntl(3, libc::F_SETFD, 0) == -1 {
                    return Err(std::io::Error::last_os_error());
                }
                Ok(())
            });
        }
        let child = cmd.spawn()?;
        drop(theirs);
        log::info!("media: launched {} (socket pair)", program.display());
        Ok(PluginProcess {
            listener: None,
            stream: Some(IpcStream::Unix(ours)),
            child: Some(child),
            state: ProcState::Connected,
            input: MessageFramer::default(),
            output: Vec::new(),
            heartbeat: Instant::now() + LAUNCH_TIMEOUT,
            blocked: false,
            plugin_file: program.to_string_lossy().into_owned(),
            plugin_dir: program.parent().map(|d| d.to_string_lossy().into_owned()).unwrap_or_default(),
            shm: HashMap::new(),
            received: VecDeque::new(),
            sleep_time: 0.01,
            exit_deadline: None,
            plugin_version: String::new(),
            cpu_usage: 0.0,
        })
    }

    #[cfg(not(unix))]
    pub fn launch_host(_program: &Path, _args: &[std::ffi::OsString], _env: &[(String, String)]) -> std::io::Result<PluginProcess> {
        Err(std::io::Error::new(
            std::io::ErrorKind::Unsupported,
            "plugin programs need a Unix socket pair",
        ))
    }
}

impl Drop for PluginProcess {'''

