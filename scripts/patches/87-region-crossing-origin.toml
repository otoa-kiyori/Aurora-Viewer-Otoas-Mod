[[patch]]
id = "region-crossing-origin-api"
why = "the scene moves the world's records with the origin; the flush prepares the GPU pass"
paths = ["crates/aurora-render/src/arena.rs"]
op = "literal"
find = "    pub fn set_hud_model(&mut self, id: u32, model: [[f32; 4]; 4], zoom: f32) {"
replace = """// aurora-local-patch: region-crossing-origin-api
    /// The render origin moved by `delta` (whole regions, x and y): records
    /// `ids` (an object's faces, placed in the world) move with it. Their
    /// mirror moves now, the GPU's copies after the next flush's writes,
    /// with one compute pass instead of an upload (origin_shift.rs). Skinned
    /// and anchored records are left alone: returned, with how many moved.
    pub fn shift_world(&mut self, ids: impl IntoIterator<Item = u32>, delta: [f32; 2]) -> (usize, Vec<u32>) {
        if !self.origin.begin(delta) {
            // a second move before a flush (frames not built): the first
            // one's records are written again instead, as without the pass
            for id in self.origin.take_ids() {
                self.mark(id as usize);
            }
            self.origin.begin(delta);
        }
        let mut mask = crate::origin_shift::mask_of(ids, self.mirror.len());
        let refused = crate::origin_shift::shift_blocks(&mut self.mirror.blocks, &mut mask, BLOCK, delta);
        self.origin.add_mask(mask);
        (self.origin.count(), refused)
    }

    /// The origin's GPU pass prepared by the last flush, to submit after
    /// the frame's other writes.
    pub fn take_origin_pass(&mut self, device: &wgpu::Device) -> Option<wgpu::CommandEncoder> {
        self.origin_pass.take(device)
    }

    /// The flush's end: the GPU pass for the moved records it did not write.
    fn finish_origin_shift(&mut self, device: &wgpu::Device, writes: &mut GpuWrites, written: &[std::ops::Range<usize>]) {
        if !self.origin.is_active() {
            return;
        }
        let slots = (self.buffer.size() as usize / std::mem::size_of::<DrawRecord>()).min(self.mirror.len());
        if let Some(pass) = self.origin.finish(written, slots) {
            self.origin_pass.prepare(device, writes, &self.buffer, &pass);
        }
    }

    pub fn set_hud_model(&mut self, id: u32, model: [[f32; 4]; 4], zoom: f32) {"""

