[[patch]]
id = "region-crossing-origin-follow"
why = "at an origin move, what rests in the world is not placed again: shift_records moves it (the others are marked as before)"
paths = ["crates/aurora-viewer/src/scene/mod.rs"]
op = "literal"
fn = "update_origin"
find = """        self.last_origin = origin;
        for (idx, object) in world.objects.slots.iter_mut().enumerate() {
            if let Some(object) = object {
                object.render.needs_records = true;
                self.sets.dirty.insert(idx);
            }
        }
        true"""
replace = """// aurora-local-patch: region-crossing-origin-follow
        // (an origin move: what rests in the world follows on the GPU and
        // is not placed again, `shift_records`; origin_shift.rs)
        let moved = self.last_origin.is_some() && origin.is_some() && aurora_render::origin_shift::enabled();
        self.last_origin = origin;
        for (idx, object) in world.objects.slots.iter_mut().enumerate() {
            if let Some(object) = object {
                if moved && self.gpu.get(idx).is_some_and(ObjGpu::follows_origin) {
                    continue;
                }
                object.render.needs_records = true;
                self.sets.dirty.insert(idx);
            }
        }
        true"""

[[patch]]
id = "region-crossing-origin-follows"
why = "the rule of what follows the origin without a new placement"
paths = ["crates/aurora-viewer/src/scene/mod.rs"]
op = "literal"
find = "    pub fn sphere(&self) -> (Vec3, f32) {"
replace = """// aurora-local-patch: region-crossing-origin-follows
    /// At an origin move, the object follows it with no new placement: a
    /// prim or mesh resting in the world, its faces placed by their model
    /// (no avatar, HUD, worn, anchored, rigged or posed object, nothing
    /// without faces). Its records, bounds, object table entry and pick
    /// entry move by the delta (origin_shift.rs); the rest is placed again.
    pub fn follows_origin(&self) -> bool {
        !self.faces.is_empty() && self.rests_in_world()
    }

    /// Not an avatar, a HUD, worn, anchored, rigged nor posed.
    pub fn rests_in_world(&self) -> bool {
        !self.is_avatar && !self.hud && !self.rigged && self.anchor.is_none() && self.posed.is_none() && self.owner_avatar.is_none()
    }

    pub fn sphere(&self) -> (Vec3, f32) {"""

