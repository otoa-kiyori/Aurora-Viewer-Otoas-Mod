replace = """if slot.model != model || slot.flags != old_flags {
                // aurora-local-patch: region-crossing-origin-settle
                // (moved with the origin: the new model is the GPU's moved
                // one up to rounding, nothing to upload; origin_shift.rs)
                let settled = slot.flags == old_flags && self.origin.settles(id, &slot.model, &model);
                slot.model = model;
                if !settled {
                    self.mark(id as usize);
                }
            }"""

