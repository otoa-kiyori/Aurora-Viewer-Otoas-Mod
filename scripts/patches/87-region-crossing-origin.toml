replace = """self.textures.maintain(&self.device, &mut self.writes, &mut self.uploads, false);
        // aurora-local-patch: region-crossing-origin-submit
        // the render origin moved: the records the flush did not write move
        // on the GPU, after every write of the frame (origin_shift.rs)
        if let Some(enc) = self.records.take_origin_pass(&self.device) {
            self.writes.submit(vec![enc]);
        }
        let uploads = self.uploads.take_frame();"""

