# Region crossings: the records follow the render origin on the GPU, no
# upload of every record in one frame.
#
# What: the scene's coordinates start at the main region's corner, as the
# Legacy Viewer's agent frame (LLWorld::updateAgentOffset, then
# LLPipeline::shiftObjects). At every crossing (and teleport) upstream's
# Scene::update_origin marks every object for new records, the sync places
# them all again without a budget, and RecordStore::flush uploads every
# face record whole (304 bytes): 85 to 140 MB in one frame on a ride across regions,
# past the journal staging's 32 MB (write_staging.rs), so it went through
# Queue::write_buffer. A session log with 176 region crossings: "frame
# writes took 226.2 ms: 116063 KB in 1466 buffer", about 200 stalls of
# 20 ms or more right after the `arrival:` lines, the sound cut at the same
# moments.
#
# How (files/region-crossing-origin/origin_shift.rs and
# scene_origin_shift.rs, unit-tested): what rests in the world (a prim or
# mesh placed by its model: no avatar, HUD, worn, anchored, rigged or posed
# object; ObjGpu::follows_origin) is no longer marked by update_origin.
# Instead it moves by the delta as a placement would have moved it: its
# faces' CPU mirror at once (a few threads over the record blocks), the
# GPU's copies by one compute pass (origin_shift.wgsl) submitted last in the
# frame's journal, only those the flush did not write itself (a bit mask);
# its bounds, object table entry (48 bytes, uploaded as before) and pick
# entry; and the detail levels' camera (lod_watch), else the 256 m jump
# would make every object due. Everything else is marked and placed again
# as before; a moved record placed again where its model already is (same
# rotation, scale and height exactly, x and y within 16 ulps of the value
# plus the move: the rounding of the other origin) is not uploaded. Nothing is spread over frames:
# every record is right in the crossing frame itself. A face that turns out
# not to be placed by its model sends its object back to the old path.
#
# Why not a render origin kept across crossings (moved past a threshold):
# the whole world model is main-region relative (agent, camera, scripted
# camera, flexis, ~50 callers of World::main_origin, plus region-local
# positions used as is), so a separate render origin would need its delta
# at every GPU-bound position (view, lights, probes, particles, water,
# overlays, picking back), each a 256 m error if one is missed. And f32 at
# the threshold: the near-camera geometry would sit `threshold` metres from
# the origin instead of under ~300 m; at 2 km a unit in the last place is
# 0.24 mm, about 1.5 px in a 30 cm close-up at 4K (vertex wobble as the
# camera moves), so the threshold would have to stay near 512 m, a move
# every one or two crossings: no gain once a move costs no upload. Here the
# coordinates and their precision are upstream's; a moved translation is
# rounded once more, to half an ulp of the largest value it held (0.03 mm
# at 500 m), which does not grow with more crossings.
#
# Measure: AURORA_DEMO=1 AURORA_DEMO_CROSSING=64000 (about 384,000 records,
# a crossing every 180 frames from frame 1200) with AURORA_PROFILE=1: the
# `frame writes took` lines and `max:` after each `crossing demo: crossing`
# line, then the same with AURORA_ORIGIN_SHIFT=0 (every record written
# again, as upstream). On 2026-11-13, with a 30 fps cap and 400 m of draw distance:
# before, every crossing wrote 115.5 MB (33 to 48 ms of writes), sync 46 to
# 55 ms, worst frames 80 to 109 ms; after, no write over 4 ms, the move
# 10 to 16 ms of main thread (64,000 objects), the crossing seconds as
# smooth as the others. On the grid: the `render origin moved by` lines
# and the `frame writes took` lines after `arrival:`.
#
# Apply or skip the whole file, not one patch of it. Drop it once upstream
# stops writing every record again at an origin move.

