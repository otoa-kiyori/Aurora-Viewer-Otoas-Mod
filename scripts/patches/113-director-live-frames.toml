# Director: a Live film takes a new view every render frame it needs one,
# not every third.
#
# Cause: upstream's live film asks the renderer for one frame at a time
# (director_record_frame: `!record_pending && wants_frame`, the frame kept
# in Films::live_asked until its pixels reach the main thread). The film
# readback never waits (aurora-render's film_readback.rs) and its pixels
# come back about three render frames after the frame is drawn, so the film
# gets about one different view every three render frames; the recorder
# (recorder.rs, Pace) fills the periods between with repeats. A film of
# 24 fps drawn at 30 frames a second holds about 10 different views a
# second. The user's frame-rate limit, and the unfocused window's, also
# keep applying while a film records, so the render rate itself can sit
# near the film's rate. The Legacy Viewer has no video recorder to compare
# with.
#
# This build:
#  - several frames in flight: Films::live_asked becomes an ordered queue
#    of the frames asked (tag, the instant asked, the film period it is
#    for). A frame asks a new view while fewer than the setting are in
#    flight (the queue and Renderer::films_in_flight, so another film
#    request counts too), at most one a render frame (the renderer takes
#    one `film_request`; none is asked over another one). The pacing counts
#    the views in flight: a view is asked only for a period that neither
#    the frames written nor the newest view in flight cover yet
#    (director_live::ask, with Recording::period, the count Pace::due
#    owes against). No period gets two views, none is asked twice, and each
#    view still goes to the film at the instant it was asked (upstream's
#    rule), repeated for the periods since the one before it.
#  - delivery: the readback answers in the order asked; an answer takes
#    its entry and any older one that never came back. A failed frame (no
#    pixels) frees its place, the next view covers its period. A view of
#    another size (the window resized) ends the film at once and drops
#    what is still in flight, as upstream.
#  - stop: Record pressed again, the track's playback over or the Director
#    closed: the film keeps its frames in flight. It asks for no more and
#    waits up to DRAIN_FRAMES (8) render frames for them, then ends
#    (director_live::at_stop); its sound ends at the stop itself, the
#    frames waited for were all asked before it. A failed writer ends at
#    once. Whatever comes back after the film ended is dropped, as upstream.
#  - the setting: "Frames fetched at once" in the Output section's "More
#    options", Live mode only (recorder::Options::in_flight, saved with the
#    Director's other film choices; 1 to 10, default 3, brought into range
#    when the settings load and when shown). 1 is upstream's behaviour, one
#    at a time. 3: the pixels are back in about three render frames, so
#    three let the film take a view every render frame; more help a card
#    that answers later.
#  - the readback's buffers: film_readback.rs keeps up to 12 for reuse
#    instead of 4 (10 live frames, or an offline render's 2, plus spares).
#    They are made when a frame needs one, as before: a high setting costs
#    nothing until that many frames are really in flight; the buffers kept
#    stay until a film of another size, as upstream's four did.
#  - frame rate: while a Live film records (or waits for its last frames),
#    the user's frame-rate limit and the unfocused window's limit are not
#    applied (film_frame_cap, beside frame_cap). Unchanged: vsync, the
#    headset's pacing, the process limit (--fps-limit), the screen rate
#    outside the world, the throttle behind another viewer and the gaming
#    mode. An offline render and the idle viewer keep frame_cap as it is.
#
# Log: "director: the film ends, waiting for its N frames in flight" when a
# stop waits, "director: N frames still in flight dropped at the end of the
# film" when the wait ran out.
#
# Tests: director_live.rs (a view only for a period nothing covers; the
# bound at 1, 3 and 10, another request counted; the setting clamped, on
# load too, and its default for a settings file without it; a 24 fps film
# at 30 render frames with views back three frames later: one at a time
# gets 9 different views, three get one for every period, ten no fewer and
# more when the card answers later; the stop's wait) and app.rs
# (film_frame_cap: the user's and the unfocused limits lifted, the process
# limit, the screen rate and the headset kept).
# Apply or skip the whole file, not one patch of it.

