[[patch]]
id = "director-live-frames-cap-fn"
why = "goes with director-live-frames-cap: frame_cap without the user's limit and the unfocused one"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''/// Zero explicitly disables the user cap for reproducible uncapped tests;'''
replace = '''// aurora-local-patch: director-live-frames-cap-fn
/// frame_cap while a live film of the Director records: the user's
/// frame-rate limit and the unfocused window's are not applied; the
/// headset's pacing (`s` only matters there), the process limit and the
/// screen rate outside the world are frame_cap's.
fn film_frame_cap(headset_engaged: bool, in_world: bool, monitor_hz: f32, fps_limit: Option<u32>, s: &Settings) -> f32 {
    if headset_engaged {
        return frame_cap(s, true, true, in_world, monitor_hz, true, fps_limit);
    }
    let mut cap = fps_limit.map_or(f32::INFINITY, |limit| limit as f32);
    if !in_world {
        cap = cap.min(monitor_hz);
    }
    if cap.is_finite() { cap } else { 0.0 }
}

/// Zero explicitly disables the user cap for reproducible uncapped tests;'''

[[patch]]
id = "director-live-frames-cap-test"
why = "film_frame_cap: the user's and unfocused limits lifted, the rest kept"
paths = ["crates/aurora-viewer/src/app.rs"]
op = "literal"
find = '''#[test]
    fn frame_cap_rules() {'''
replace = '''// aurora-local-patch: director-live-frames-cap-test
    #[test]
    fn a_live_film_lifts_only_the_users_limits() {
        use super::film_frame_cap;
        let capped = Settings {
            fps_cap: true,
            fps_limit: 30,
            background_fps_cap: true,
            background_fps_limit: 30,
            ..Settings::default()
        };
        // in world, focused or not: no limit of the user's
        assert_eq!(film_frame_cap(false, true, 144.0, None, &capped), 0.0);
        // the process limit and the screen rate outside the world stay
        assert_eq!(film_frame_cap(false, true, 144.0, Some(60), &capped), 60.0);
        assert_eq!(film_frame_cap(false, false, 144.0, None, &capped), 144.0);
        // the headset's pacing is frame_cap's
        for limit in [None, Some(72)] {
            assert_eq!(
                film_frame_cap(true, true, 144.0, limit, &capped),
                frame_cap(&capped, false, true, true, 144.0, false, limit)
            );
        }
        // frame_cap with the user's two limits off, focused or not
        let free = Settings {
            fps_cap: false,
            background_fps_cap: false,
            ..Settings::default()
        };
        for in_world in [false, true] {
            for limit in [None, Some(24), Some(500)] {
                for focused in [false, true] {
                    assert_eq!(
                        film_frame_cap(false, in_world, 60.0, limit, &capped),
                        frame_cap(&free, focused, false, in_world, 60.0, false, limit)
                    );
                }
            }
        }
    }

    #[test]
    fn frame_cap_rules() {'''

