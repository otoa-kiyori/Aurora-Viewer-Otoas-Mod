[[patch]]
id = "director-live-frames-ask"
why = "a frame asked joins the queue with its instant and its period; the stop's wait; whether a live film is on"
paths = ["crates/aurora-viewer/src/app/director_render.rs"]
op = "literal"
find = '''renderer.film_request = Some(FilmRequest {
            tag,
            size: None,
            huds,
            shutter: None,
        });
        films.live_asked = Some((tag, Instant::now()));
        self.director.record_pending = true;
    }'''
replace = '''renderer.film_request = Some(FilmRequest {
            tag,
            size: None,
            huds,
            shutter: None,
        });
        // aurora-local-patch: director-live-frames-ask
        let now = Instant::now();
        let period = self.director.recording.as_ref().map_or(0, |(recording, _)| recording.period(now));
        films.live_asked.push_back((tag, now, period));
        self.director.record_pending = true;
    }

    // aurora-local-patch: director-live-frames-ask
    /// A live film asked to end: true while it waits for its frames still
    /// in flight (it ends at a later frame, `director_record_stop` called
    /// again), false when it ends now.
    pub(super) fn director_live_wait(&mut self) -> bool {
        let failed = self.director.recording.as_ref().is_none_or(|(recording, _)| recording.failed());
        let films = &mut self.director.films;
        let waited = films.live_drain.unwrap_or(0);
        match crate::director_live::at_stop(films.live_asked.len(), failed, waited) {
            crate::director_live::AtStop::Wait => {
                if films.live_drain.is_none() {
                    log::info!(
                        "director: the film ends, waiting for its {} frames in flight",
                        films.live_asked.len()
                    );
                }
                films.live_drain = Some(waited + 1);
                true
            }
            crate::director_live::AtStop::End => {
                if films.live_drain.take().is_some() && !films.live_asked.is_empty() {
                    log::info!(
                        "director: {} frames still in flight dropped at the end of the film",
                        films.live_asked.len()
                    );
                }
                false
            }
        }
    }

    /// A live film is being recorded, or waits for its last frames.
    pub(super) fn director_live_filming(&self) -> bool {
        self.director.recording.is_some()
    }'''

