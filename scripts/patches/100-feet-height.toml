[[patch]]
id = "feet-height-limit"
why = "the bound of Feet height, for the slider, the load and the solver"
paths = ["crates/aurora-viewer/src/settings.rs"]
op = "literal"
find = "pub(crate) fn foot_height_limit(value: f32) -> f32 {"
replace = '''// aurora-local-patch: feet-height-limit
/// The largest shift of Preferences › Avatars › Feet height, either way.
pub(crate) const MAX_GROUND_FEET_OFFSET: f32 = 1.0;

/// Feet height, bounded: a saved or typed value outside the slider (or not a
/// number) can never move the avatars further.
pub(crate) fn feet_height_offset(value: f32) -> f32 {
    if value.is_finite() {
        value.clamp(-MAX_GROUND_FEET_OFFSET, MAX_GROUND_FEET_OFFSET)
    } else {
        0.0
    }
}

pub(crate) fn foot_height_limit(value: f32) -> f32 {'''

