[[patch]]
id = "feet-height-sanitize-test"
why = "old settings get no shift; a save keeps it; the load bounds it"
paths = ["crates/aurora-viewer/src/settings.rs"]
op = "literal"
find = '''#[test]
    fn foot_height_settings_sanitize_limits_and_nonfinite_values() {'''
replace = '''// aurora-local-patch: feet-height-sanitize-test
    #[test]
    fn feet_height_offset_defaults_to_zero_and_is_bounded_on_load() {
        let old: Settings = serde_json::from_str(r#"{"ground_avatar_feet":true}"#).unwrap();
        assert_eq!(old.ground_feet_height_offset, 0.0, "existing preferences do not move");
        for (value, expected) in [
            (0.0, 0.0),
            (0.05, 0.05),
            (-0.07, -0.07),
            (0.1, 0.1),
            (-0.1, -0.1),
            (0.5, 0.5),
            (-0.75, -0.75),
            (1.0, 1.0),
            (-1.0, -1.0),
            (1.5, 1.0),
            (-3.0, -1.0),
            (f32::NAN, 0.0),
            (f32::INFINITY, 0.0),
            (f32::NEG_INFINITY, 0.0),
        ] {
            let settings = Settings {
                ground_feet_height_offset: value,
                ..Settings::default()
            };
            if value.is_finite() {
                let saved = serde_json::to_string(&settings).unwrap();
                let restored: Settings = serde_json::from_str(&saved).unwrap();
                assert_eq!(restored.sanitized().ground_feet_height_offset, expected, "{value} after a save");
            }
            assert_eq!(settings.sanitized().ground_feet_height_offset, expected, "{value}");
        }
    }

    #[test]
    fn foot_height_settings_sanitize_limits_and_nonfinite_values() {'''

