[[patch]]
id = "feet-height-account-tests"
why = "two accounts, a restart, the login screen and saved values out of bounds"
paths = ["crates/aurora-viewer/src/settings/hover_height.rs"]
op = "literal"
find = '''mod tests {
    use super::*;'''
replace = '''mod tests {
    use super::*;

    // aurora-local-patch: feet-height-account-tests
    #[test]
    fn hover_accounts_keep_the_feet_height_per_account_and_bound_it() {
        let (first, second) = (Uuid::from_u128(1), Uuid::from_u128(2));
        let mut settings = Settings::default();
        settings.select_hover_account(first);
        settings.ground_feet_height_offset = 0.06;
        settings.select_hover_account(second);
        assert_eq!(settings.ground_feet_height_offset, 0.0, "a new account starts at no shift");
        settings.ground_feet_height_offset = -0.04;
        settings.select_hover_account(first);
        assert_eq!(settings.ground_feet_height_offset, 0.06);
        let mut loaded = restart(&settings);
        loaded.select_hover_account(second);
        assert_eq!(loaded.ground_feet_height_offset, -0.04);
        loaded.select_hover_account(first);
        assert_eq!(loaded.ground_feet_height_offset, 0.06);
        loaded.release_hover_account();
        assert_eq!(loaded.ground_feet_height_offset, 0.0, "the login screen has no shift");
        let mut saved: Settings = serde_json::from_value(serde_json::json!({
            "hover_height_accounts": {
                "00000000-0000-0000-0000-000000000001": {"ground_height_offset": 4.0},
                "00000000-0000-0000-0000-000000000002": {"ground_height_offset": -4.0}
            }
        }))
        .unwrap();
        saved.select_hover_account(first);
        assert_eq!(saved.ground_feet_height_offset, crate::settings::MAX_GROUND_FEET_OFFSET);
        saved.select_hover_account(second);
        assert_eq!(saved.ground_feet_height_offset, -crate::settings::MAX_GROUND_FEET_OFFSET);
    }'''

