[[patch]]
id = "feet-height-lift"
why = "the frame's shift, bounded"
paths = ["crates/aurora-viewer/src/scene/anim/grounding.rs"]
op = "literal"
fn = "apply"
find = "let max_height = crate::settings::foot_height_limit(frame.max_height);"
replace = '''let max_height = crate::settings::foot_height_limit(frame.max_height);
        // aurora-local-patch: feet-height-lift
        // Feet height moves the supports, not the drawn avatar: the feet,
        // the body and everything they carry reach support + lift through
        // the same filters, acquisition and release as a change of terrain,
        // so it eases in and out with the grounding itself.
        let lift = crate::settings::feet_height_offset(frame.lift);'''

[[patch]]
id = "feet-height-floor"
why = "the floor the user's limit is measured from, lifted"
paths = ["crates/aurora-viewer/src/scene/anim/grounding.rs"]
op = "literal"
fn = "apply"
find = "let reference_floor = frame.to_world.transform_point3(Vec3::Z * setup.floor + pose.reference_offset).z;"
replace = '''let reference_floor = frame.to_world.transform_point3(Vec3::Z * setup.floor + pose.reference_offset).z;
        // aurora-local-patch: feet-height-floor
        // The user's limit bounds the terrain correction around the lifted
        // floor: Feet height itself is not terrain correction.
        let lifted_floor = reference_floor + lift;'''

[[patch]]
id = "feet-height-query"
why = "every support of the solver counts as lifted (the one place it asks the world)"
paths = ["crates/aurora-viewer/src/scene/anim/grounding.rs"]
op = "literal"
fn = "apply"
find = '''let query = |point: Vec3| {
            ground(point + anchor)
                .map(|hit| Surface {
                    position: hit.position - anchor,
                    ..hit
                })
                .filter('''
replace = '''let query = |point: Vec3| {
            // aurora-local-patch: feet-height-query
            // (the solver works around `anchor`, the world queries add it
            // back: the support is asked `lift` lower, its answer lifted)
            ground(point + anchor - Vec3::Z * lift)
                .map(|hit| Surface {
                    position: hit.position - anchor + Vec3::Z * lift,
                    ..hit
                })
                .filter('''

