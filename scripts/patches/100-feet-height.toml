# Feet height: grounded avatars stand a little higher or lower.
#
# Preferences › Avatars › Feet, under "Use Aurora foot placement" (greyed
# while it is off): a "Feet height" slider from -1.00 to +1.00 m in 1 cm
# steps, 0 by default (no change until moved). Positive lifts, negative
# lowers.
#
# It applies to exactly the avatars Aurora's foot grounding grounds (our own
# and the remote ones within "Maximum other avatars", foot_scope.rs), all by
# the same amount, as a whole: body, feet, attachments and rigged mesh follow
# the skeleton. It works inside the grounding, not on a draw matrix: the
# solver (Placement::apply, scene/anim/grounding.rs) queries every support as
# if it were `lift` higher, so the feet plant at support + lift and the body
# settles there through the same filters, acquisition and release as a
# change of terrain. It therefore eases in and out with the grounding's own
# 0.5 s transition (TRANSITION_SECONDS) when grounding starts or stops on an
# avatar (walking with "while moving" off, sitting, flying, out of scope),
# and moving the slider glides instead of popping. The user's "Maximum foot
# adjustment" still bounds the terrain correction, now around the lifted
# floor. Where grounding is not active, or for the native (Legacy) placement
# (`legacy_grounding_frame` keeps lift 0), there is no shift.
#
# Purely visual and local: nothing is sent to the simulator; the SL hover
# height (world/hover_height.rs, AgentPreferences) and its settings are
# unchanged, and this adds on top of it. The camera is not moved by it,
# like by the grounding itself; only the opt-in mouselook "follow the eyes"
# camera, which follows the posed eyes, sees it as it sees any grounding.
#
# At the extremes: the solver asks the world for each support as if it were
# `lift` higher, from the authored (unlifted) foot positions, and the
# support search reaches "Maximum foot adjustment"'s own ceiling (1 m,
# MAX_GROUND_FEET_HEIGHT) from there. A large shift spends that reach: on
# flat ground ±1 m plants as asked, but the margin for terrain left is about
# 1 m minus the shift, uphill (and steps up) with a raised avatar, downhill
# (and steps down) with a lowered one, where a support beyond it is not
# found and that foot follows the body instead. Up to about ±0.5 m the
# margin stays above the default 0.4 m limit. Not redesigned here.
#
# Stored as `ground_feet_height_offset`, bounded on load
# (settings::feet_height_offset), and kept per account with the other
# ground-feet options (settings/hover_height.rs Preferences).
#
# Aurora's own design: the Legacy Viewer has no equivalent.
#
# Tests: scene/anim/grounding_lift_tests.rs (zero shift changes nothing and
# leaves no trace, the whole avatar moves by the shift, the blend), the
# settings' bounds and round trip, the per-account switch, and the Options
# page lists. Texts are in the English, French and Japanese catalogues; the idempotence marker of the
# Fluent files is a Fluent comment line. Apply or skip the whole file, not
# one patch of it.

