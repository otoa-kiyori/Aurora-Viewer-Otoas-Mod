[[patch]]
id = "inventory-display-hidden"
why = "the empty system folders found again at each rebuild of the view (each inventory change), from the children just listed"
paths = ["crates/aurora-viewer/src/ui/inventory/view.rs"]
op = "literal"
find = '''self.version = Some(version);
        self.built = self.built.wrapping_add(1);'''
