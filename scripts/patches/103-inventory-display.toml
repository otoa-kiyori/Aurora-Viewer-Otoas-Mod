# Two display switches for the inventory window, both off by default,
# saved with its other preferences (InventoryPreferences): in the window's
# own preferences (the cog of both interface styles, controls.rs
# preferences_for_tab, beside "Folder colors" and the tab switches) and in
# Preferences › Inventory › Display. Display only: what the folder lists
# show and how a folder's name is drawn. No right, asset id or message
# changes.
#
# - "Hide empty system folders" (hide_empty_system_folders): the Legacy
#   Viewer's DebugHideEmptySystemFolders. LLInventoryPanel::
#   updateHideEmptySystemFolders (llinventorypanel.cpp, also read at
#   LLInventoryPanel::initFromParams and LLPanelMainInventory's filter
#   reset) sets FILTERTYPE_EMPTYFOLDERS; LLInventoryFilter::
#   checkAgainstFilterType (llinventoryfilter.cpp) then refuses a folder
#   whose type LLViewerFolderType::lookupIsHiddenIfEmpty marks (the "hide
#   if empty" column of LLViewerFolderDictionary, llviewerfoldertype.cpp:
#   Textures, Sounds, Calling Cards, Landmarks, Clothing, Objects,
#   Notecards, Scripts, Body Parts, Photo Album, Lost And Found,
#   Animations, Gestures, Favorites, My Outfits, Meshes, Received Items,
#   Merchant Outbox, Marketplace Listings, Settings, Materials, My
#   Suitcase...; never the root, the Trash, the Current Outfit, an outfit
#   or an ordinary folder) while it has no direct descendant, folder or
#   item. Two differences, both hiding less: a folder whose contents are
#   not loaded yet stays (the Legacy Viewer counts it as empty), so that
#   nothing disappears and comes back during the login fetch; and the
#   inventory and Library roots always stay. A hidden folder shows again as
#   soon as it holds something (the set is found again at each inventory
#   change). The rule is display.rs (empty_system_folders, tested); the
#   view keeps the set beside its children (ViewCache::prepare) and
#   children_iter leaves it out, so every folder list built from it follows:
#   the tree of the Legacy style and of Aurora's compact width, Aurora's
#   explorer list (medium and wide widths), its tiles (gallery, combination,
#   Compact and Tiles views, which hand the switch over themselves for the
#   narrow split view, drawn without the folder column) and its folder
#   column, folder windows, Expand all. A caret follows what is listed: the
#   trees' already did (rows::branches reads children_iter); the folder
#   column's has one only for a subfolder it lists (display.rs
#   has_shown_subfolders). Not the search and filter results (their own
#   tree, as upstream: a hidden folder never holds a match), nor the pickers
#   (their own view, the switch never given to it). Not covered, on
#   purpose: the counts (the explorer toolbar's, the Count and Type
#   columns, the count at the end of a tree row, the Count sort) still read
#   the folder's own lists, hidden folders included, so a folder that holds
#   hidden ones (mostly the inventory root) says more than it lists;
#   adjusting them would take an anchor at each of those upstream places.
#   Aurora's path bar (aurora/breadcrumb.rs) follows the same set: a
#   folder's chevron lists its subfolders without the hidden ones, and a
#   folder left with none has no chevron; the completions of a typed path
#   leave them out before they are counted (display.rs
#   path_bar_subfolders, tested). The bar keeps showing the folder the
#   explorer is in and its ancestors, even an empty system folder, and its
#   parent's drop-down keeps it; a path typed in full still goes to a
#   hidden folder. Quick access keeps every pin: a pin is the user's own
#   choice (upstream never pins a folder by itself). The Back and Forward
#   lists are places visited, not folder lists, and the Move To picker
#   lists destinations of its own: both as upstream. The Legacy style has
#   no path bar nor Quick access.
# - "Bold folders that hold worn items" (bold_worn_folders), a local
#   addition (the Legacy Viewer bolds worn items alone, LLItemBridge::
#   getLabelStyle): a folder is bold when a worn item, at any depth, is
#   inside it. Facts::worn holds the originals of what is worn; links (the
#   Current Outfit's, the saved outfits') are not the items worn and bold
#   nothing. The inventory and Library roots are never bold: the inventory
#   root holds everything worn, so its bold would say nothing. The folders are found by walking up from each worn item
#   (display.rs worn_folders, tested), again only when the inventory
#   generation or the worn set changed (ViewCache::follow_worn); with the
#   switch off, nothing is computed. The name takes the worn item's bold
#   of each style: the Legacy row's embolden and faux bold pass (as
#   item_row), Aurora's semi-bold (as its selected and worn rows) in the
#   tree, the explorer list, the folder column, the results (of the main
#   window and of a folder window), and the folder
#   tiles of the gallery view, of the combination view and of the Compact
#   view (gallery.rs tile and small_tile, in the ink of the other folder
#   names; display.rs folder_name_bold, tested). The Tiles view draws every
#   name semi-bold already (upstream's), so there a worn folder's name looks
#   as the others.
#
# Apply or skip the whole file, not one patch of it.

# ---------------------------------------------------------------- the rule

