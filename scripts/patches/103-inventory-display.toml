[[patch]]
id = "inventory-display-methods"
why = "the switch given to the view (a change rebuilds it), the worn folders found again only on a change, the row's question, and the hidden set for the folder column's caret"
paths = ["crates/aurora-viewer/src/ui/inventory/view.rs"]
op = "literal"
find = '''pub fn built(&self) -> u64 {
        self.built
    }'''
replace = '''pub fn built(&self) -> u64 {
        self.built
    }

    // aurora-local-patch: inventory-display-methods
    /// "Hide empty system folders" (local patch set) for the folder lists
    /// to come: a change rebuilds the view at its next `prepare`.
    pub(super) fn hide_empty_system_folders(&mut self, on: bool) {
        if self.hide_empty != on {
            self.hide_empty = on;
            self.version = None;
        }
    }

    /// "Bold folders that hold worn items" (local patch set): the folders
    /// above a worn item, found again only when the inventory or the worn
    /// set changed; with the switch off, nothing is kept or computed.
    pub(super) fn follow_worn(&mut self, inv: &Inventory, worn: &HashSet<Uuid>, on: bool) {
        if !on {
            if self.worn_key.take().is_some() {
                self.worn_folders = IdSet::default();
                self.worn_seen = HashSet::new();
            }
            return;
        }
        let key = (inv.root, inv.generation);
        if self.worn_key == Some(key) && self.worn_seen == *worn {
            return;
        }
        self.worn_folders = super::display::worn_folders(inv, worn);
        self.worn_seen = worn.clone();
        self.worn_key = Some(key);
    }

    /// The folder holds a worn item (`follow_worn`).
    pub(super) fn holds_worn(&self, id: Uuid) -> bool {
        self.worn_folders.contains(&id)
    }

    /// The folders `children_iter` leaves out (empty with the switch off).
    pub(super) fn hidden_folders(&self) -> &IdSet {
        &self.hidden
    }'''

