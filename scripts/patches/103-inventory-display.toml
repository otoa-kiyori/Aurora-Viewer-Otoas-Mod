id = "inventory-display-path-typing"
why = "goes with inventory-display-path-completions: the typed path's list asks for the completions without the hidden folders"
paths = ["crates/aurora-viewer/src/ui/inventory/aurora/breadcrumb.rs"]
op = "literal"
fn = "typing"
find = "let options = completions(inv, base, &edit.text);"
replace = "let options = completions_shown(inv, base, &edit.text, st.view.hidden_folders()); // aurora-local-patch: inventory-display-path-typing"

# ------------------------------------------------------------ the switches

[[patch]]
id = "inventory-display-controls"
why = "the two switches in the window's own preferences (both styles), after Folder colors"
paths = ["crates/aurora-viewer/src/ui/inventory/controls.rs"]
op = "literal"
fn = "preferences_for_tab"
find = '''changed |= check(ui, p, aurora_i18n::tr!("inventory-folder-colors"), &mut prefs.folder_colors_enabled);'''
replace = '''changed |= check(ui, p, aurora_i18n::tr!("inventory-folder-colors"), &mut prefs.folder_colors_enabled);
    // aurora-local-patch: inventory-display-controls
    changed |= check(
        ui,
        p,
        aurora_i18n::tr!("inventory-hide-empty-system-folders"),
        &mut prefs.hide_empty_system_folders,
    );
    changed |= check(ui, p, aurora_i18n::tr!("inventory-bold-worn-folders"), &mut prefs.bold_worn_folders);'''

[[patch]]
id = "inventory-display-page"
why = "the same switches in Preferences › Inventory › Display, after Folder colors"
paths = ["crates/aurora-viewer/src/ui/options/pages/inventory.rs"]
op = "literal"
fn = "page"
find = "cx.track(&field!(inventory.folder_colors));"
replace = '''cx.track(&field!(inventory.folder_colors));
        // aurora-local-patch: inventory-display-page
        cx.toggle(
            tr!("inventory-hide-empty-system-folders"),
            tr!("inventory-hide-empty-system-folders-help"),
            &field!(inventory.hide_empty_system_folders),
        );
        cx.toggle(
            tr!("inventory-bold-worn-folders"),
            tr!("inventory-bold-worn-folders-help"),
            &field!(inventory.bold_worn_folders),
        );'''

# --------------------------------------------------------------- the texts

[[patch]]
id = "inventory-display-text-en"
why = "the labels and help of the two switches (English)"
paths = ["crates/aurora-i18n/locales/en.ftl"]
op = "regex"
pattern = '^inventory-folder-colors-help = [^\n]*$'
replace = '''\g<0>
# // aurora-local-patch: inventory-display-text-en
inventory-hide-empty-system-folders = Hide empty system folders
inventory-hide-empty-system-folders-help = System folders such as Textures, Landmarks or Lost And Found are left out of the folder lists while they hold nothing. A folder whose contents have not loaded yet stays, and each one shows again as soon as something is put in it.
inventory-bold-worn-folders = Bold folders that hold worn items
inventory-bold-worn-folders-help = A folder's name is bold when something you wear is inside it, at any depth. Links, such as those of the Current Outfit and of saved outfits, do not count.'''

[[patch]]
id = "inventory-display-text-fr"
why = "goes with inventory-display-text-en (French); the parity test wants every key in English, French and Japanese"
paths = ["crates/aurora-i18n/locales/fr.ftl"]
op = "regex"
pattern = '^inventory-folder-colors-help = [^\n]*$'
replace = '''\g<0>
# // aurora-local-patch: inventory-display-text-fr
inventory-hide-empty-system-folders = Masquer les dossiers système vides
inventory-hide-empty-system-folders-help = Les dossiers système comme Textures, Repères ou Objets perdus et trouvés sont retirés des listes de dossiers tant qu'ils ne contiennent rien. Un dossier dont le contenu n'est pas encore chargé reste affiché, et chacun réapparaît dès que quelque chose y est placé.
inventory-bold-worn-folders = Dossiers des objets portés en gras
inventory-bold-worn-folders-help = Le nom d'un dossier est en gras quand il contient, à n'importe quelle profondeur, quelque chose que vous portez. Les liens, comme ceux de la tenue actuelle et des tenues enregistrées, ne comptent pas.'''

[[patch]]
id = "inventory-display-text-ja"
why = "goes with inventory-display-text-en (Japanese); the parity test wants every key in English, French and Japanese"
paths = ["crates/aurora-i18n/locales/ja.ftl"]
op = "regex"
pattern = '^inventory-folder-colors-help = [^\n]*$'
replace = '''\g<0>
# // aurora-local-patch: inventory-display-text-ja
inventory-hide-empty-system-folders = 空のシステムフォルダを隠す
inventory-hide-empty-system-folders-help = 「テクスチャ」「ランドマーク」「遺失物」などのシステムフォルダは、中身が空の間はフォルダ一覧に表示しません。中身をまだ読み込んでいないフォルダは表示したままにし、何かを入れるとすぐに再び表示します。
inventory-bold-worn-folders = 着用中のアイテムを含むフォルダを太字にする
inventory-bold-worn-folders-help = 着用中のアイテムが入っているフォルダの名前を、階層の深さに関係なく太字で表示します。「着用中のアウトフィット」や保存したアウトフィットにあるリンクは数えません。'''
