        // "Hide empty system folders" (local patch set): from the children
        // just listed, once per rebuild; nothing to do with the switch off.
        self.hidden = if self.hide_empty {
            super::display::empty_system_folders(inv, |id| self.children.get(&id).map_or(0, Vec::len))
        } else {
            IdSet::default()
        };
        self.version = Some(version);
        self.built = self.built.wrapping_add(1);'''

