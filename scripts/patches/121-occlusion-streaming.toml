[[patch]]
id = "occl-stream-demo-step"
why = "the wall sent, removed, and the loading after it told"
paths = ["crates/aurora-viewer/src/demo_stream.rs"]
op = "literal"
find = "    /// `,leave`: the objects removed and their textures released a second"
replace = '''// aurora-local-patch: occl-stream-demo-step
    /// The scenario's textures by the level they show: discard 0 to 5, then
    /// those that show nothing yet.
    fn by_level(&self, textures: &TextureStreamer) -> [u32; 7] {
        let mut out = [0; 7];
        for i in 0..self.next {
            out[textures.decoded_level(&texture(i)).map_or(6, |d| usize::from(d.min(5)))] += 1;
        }
        out
    }

    /// `,wall[=<s>]`: the wall sent before the first wave, removed after its
    /// delay, then the end of the loading it held back told.
    fn wall_step(&mut self, frame: u64, world: &mut crate::world::World, textures: &TextureStreamer, now: Instant) {
        let Some(remove_after) = self.wall else {
            return;
        };
        if !self.wall_sent {
            self.wall_sent = true;
            world.apply(wall_event(self.n, self.size));
            log::info!("demo stream: a wall between the view and the objects");
            return;
        }
        let (Some(after), Some(started)) = (remove_after, self.started) else {
            return;
        };
        match self.wall_removed_at {
            None if now.duration_since(started) >= after => {
                self.wall_removed_at = Some(now);
                world.apply(NetEvent::ObjectsKilled {
                    handle: HANDLE,
                    local_ids: vec![WALL_LOCAL_ID],
                });
                log::info!(
                    "demo stream: wall removed, textures by level (discard 0..5, none) {:?}",
                    self.by_level(textures)
                );
            }
            Some(at) if !self.wall_settled && frame.is_multiple_of(10) => {
                let idle = textures.stats.decoding == 0 && textures.stats.pending_upload == 0 && textures.stats.fetching == 0;
                let settled = std::mem::replace(&mut self.wall_idle_before, idle);
                if idle && settled && now.duration_since(at) >= Duration::from_millis(500) {
                    self.wall_settled = true;
                    log::info!(
                        "demo stream: {:.2} s after the wall went, textures by level (discard 0..5, none) {:?}",
                        now.duration_since(at).as_secs_f32(),
                        self.by_level(textures)
                    );
                }
            }
            _ => {}
        }
    }

    /// `,leave`: the objects removed and their textures released a second'''

