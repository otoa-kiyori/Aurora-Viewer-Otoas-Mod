            let Some(g) = self.gpu.get(idx) else {
                continue;
            };
            if g.faces.is_empty() || g.hud {
                continue;
            }
            let (sc, sr) = g.sphere();
            let px = texture_importance::texture_pixels(view, g.center, g.radius, view.sphere_visible(sc, sr) && boost_textures);
