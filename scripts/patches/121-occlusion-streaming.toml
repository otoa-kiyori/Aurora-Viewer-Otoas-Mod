// aurora-local-patch: occl-stream-options-test
#[test]
fn the_occlusion_streaming_rows_are_behind_the_occlusion_cog() {
    let mut frames = Frames::new();
    let (mut s, mut st, mut r) = (Settings::default(), OptionsUi::default(), OptionsResult::default());
    assert!(s.occlusion_streaming && s.occlusion_streaming_delay_s == 2.0, "on, 2 s");
