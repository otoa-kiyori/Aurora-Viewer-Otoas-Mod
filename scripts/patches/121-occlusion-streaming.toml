                note_face_usage(&mut usage, f, px, true);
            }
            if matches!(g.geom, Some(GeomKey::Mesh { .. })) {
                self.sets.dirty.insert(idx);
            }
            for (id, px, _) in usage {
                self.textures.reveal(&id, px);
            }
        }'''

[[patch]]
id = "occl-stream-reveal-texture"
why = "the level a revealed texture's size asks for, at once (recompute_wants' rule for one texture)"
paths = ["crates/aurora-viewer/src/scene/textures.rs"]
op = "literal"
find = '''    /// Like `note_usage`, for what memory pressure never lowers (as
    /// Firestorm's boosted textures: HUDs, sky, terrain).'''
replace = '''// aurora-local-patch: occl-stream-reveal-texture
    /// Like `note_usage`, for a face that shows again after it stayed hidden
    /// behind others (occlusion_streaming.rs): the level its size on screen
    /// asks for is taken now, as `recompute_wants` takes it at its next pass,
    /// so that the finer level is asked for at once; a download already
    /// waiting moves up with it. Never lowers anything.
    pub fn reveal(&mut self, id: &Uuid, px: f32) {
        let step = self.pressure.step();
        let paused = self.background.paused();
        let full = self.full_resolution && step == 0;
        let TextureStreamer {
            entries,
            todo,
            counts,
            moved,
            ..
        } = self;
        let Some(e) = entries.get_mut(id) else {
            return;
        };
        if px > e.need_px {
            e.need_px = px;
        }
        // (the drawing paused behind, or a texture loaded whole anyway)
        if paused || e.keep_pixels || e.refs == 0 {
            return;
        }
        let dropped = texture_budget::dropped(step);
        let full_px = full_size(e).map_or(512, |(w, h)| w.max(h)) as f32;
        let (want, _) = wanted(full_px, e.info.map(|i| i.levels), e, dropped);
        let want = if full && e.source == TexSource::Asset { 0 } else { want };
        if want >= e.want {
            return;
        }
        e.want = want;
        e.seen_px = e.seen_px.max(e.fixed_px.max(e.capped(e.need_px / dropped.0)));
        if e.fetching && !e.urgent && e.fetch_key != 0 && !e.cancelled {
            let (_, now) = Self::rank(e);
            if fetch_priority::changed(e.sent, now) {
                e.sent = now;
                moved.push((e.fetch_key, now));
            }
        }
        Self::settle(todo, counts, *id, e);
    }

    /// Like `note_usage`, for what memory pressure never lowers (as
    /// Firestorm's boosted textures: HUDs, sky, terrain).'''

