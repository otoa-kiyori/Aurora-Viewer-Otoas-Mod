[[patch]]
id = "occl-stream-wgsl-binding"
why = "the objects' bits, beside the spheres"
paths = ["crates/aurora-render/src/shaders/cull.wgsl"]
op = "literal"
find = "@group(0) @binding(13) var<storage, read_write> spheres: array<vec4<f32>>;"
replace = '''@group(0) @binding(13) var<storage, read_write> spheres: array<vec4<f32>>;
// aurora-local-patch: occl-stream-wgsl-binding
// occlusion streaming (object_occlusion.rs): per object of the table, a
// tested bit then a seen bit (two halves of (objects + 31) / 32 words); a
// placeholder too short for them while the streaming is off
@group(0) @binding(14) var<storage, read_write> obj_bits: array<atomic<u32>>;'''

[[patch]]
id = "occl-stream-wgsl-occlude"
why = "tested and seen bits of each object; the draw keeps the exact test"
paths = ["crates/aurora-render/src/shaders/cull.wgsl"]
op = "literal"
find = '''    args[a + 1u] = select(0u, 1u, vis);
    // drawn by phase 1'''
replace = '''args[a + 1u] = select(0u, 1u, vis);
    // aurora-local-patch: occl-stream-wgsl-occlude
    // occlusion streaming: the first face of an object tested this frame
    // tells whether its sphere, enlarged (object_occlusion::INFLATE_*), is
    // seen; the draw keeps the exact test above
    let words = (frame.sizes.y + 31u) / 32u;
    if (f.object < frame.sizes.y && 2u * words <= arrayLength(&obj_bits)) {
        let w = f.object / 32u;
        let bit = 1u << (f.object % 32u);
        let before = atomicOr(&obj_bits[w], bit);
        if ((before & bit) == 0u) {
            var seen = vis;
            if (!seen) {
                let s = spheres[f.object];
                seen = hiz_sphere_visible(hiz, vec4<f32>(s.xyz, s.w * 1.25 + 0.5), occl.view_proj, occl.screen, occl.levels);
            }
            if (seen) {
                atomicOr(&obj_bits[words + w], bit);
            }
        }
    }
    // drawn by phase 1'''

