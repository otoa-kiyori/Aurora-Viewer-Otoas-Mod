paths = ["crates/aurora-viewer/src/demo_stream.rs"]
op = "literal"
find = "/// Bytes of downloaded data held by texture `i` once loaded: about what"
replace = '''// aurora-local-patch: occl-stream-demo-option
/// `wall[=<s>]` in the variable's value (local patch set, occlusion
/// streaming): a wall between the start view and the objects; removed `s`
/// seconds after the first wave when given. None: no wall.
fn wall_option(value: &str) -> Option<Option<Duration>> {
    value.split(',').map(str::trim).find_map(|p| {
        if p == "wall" {
            return Some(None);
        }
        let s = p
            .strip_prefix("wall=")?
            .trim()
            .parse::<f32>()
            .ok()
            .filter(|s| s.is_finite() && *s >= 0.0)?;
        Some(Some(Duration::from_secs_f32(s)))
    })
}

/// Local id of the wall.
const WALL_LOCAL_ID: u32 = FIRST_LOCAL_ID - 1;

/// The wall: 30 m high, a little wider than the field of `n` objects of
/// `size`, standing between the start view and it.
fn wall_event(n: u32, size: f32) -> NetEvent {
    let side = (n as f32).sqrt().ceil().max(1.0);
    let (x, y) = (143.0, 126.0);
    let wall = prim(
        WALL_LOCAL_ID,
        Vec3::new(x, y, height(x, y) + 14.0),
        Quat::IDENTITY,
        Vec3::new(1.0, side * size * SPACING + 10.0, 30.0),
        shape(LL_PCODE_PATH_LINE, LL_PCODE_PROFILE_SQUARE, 100, 0, 0),
        te([0.55, 0.57, 0.62, 1.0], 0, false, 0.0),
        ExtraParams::default(),
        "",
    );
    NetEvent::ObjectUpdates {
        handle: HANDLE,
        objects: vec![wall],
    }
}

/// Bytes of downloaded data held by texture `i` once loaded: about what'''

