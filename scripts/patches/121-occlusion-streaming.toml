# Occlusion streaming: objects that stay hidden behind others load less
# (Aurora's own; the Legacy Viewer freezes the detail level of what its
# occlusion hides, and sizes textures by the view cone only).
#
# Preferences › Graphics, behind the cog of "Occlusion": "Lighter loading
# behind walls" (on by default; used only with the occlusion on) and
# "Hidden for" (2 s, 0.5 to 10 s). AURORA_OCCLUSION_STREAMING=0|1 and
# AURORA_OCCLUSION_STREAMING_DELAY=<s> force them for a launch.
#
# GPU. The main view's occlusion test of the GPU draw lists (cull.wgsl
# cs_occlude) already tests one sphere per object for each face it keeps.
# It now also sets two bits per object of the scene's table in a buffer of
# its own (binding 14): tested (the object had a face in the main view's
# bins) and seen (its sphere, 1.25 times larger plus 0.5 m, passes the Hi-Z
# test; only the first face of each object does it, and only when the exact
# test hid it). The draws keep the exact test. The bits are cleared before
# the pass, copied with the culling's counts into a ring of three mapped
# buffers and read back a few frames later, never waited for
# (aurora_render::object_occlusion). With the switch off the buffer is a
# placeholder of one word and the shader writes nothing. A frame whose main
# view is not the user's camera (a photo or film frame at its own size, a
# 360° face, an external output) is not read back, nor is a frame from
# before the last cut of the motion history (teleport, region change, 360°
# capture). The CPU draw lists (no GPU culling) give nothing: everything
# stays as before there. Cost: a clear of 2 bits per object, an atomic per
# face of the main bins, at most one more Hi-Z test per hidden object, a
# readback of 25 KB for 100,000 objects.
#
# Viewer (scene/occlusion_streaming.rs). An object tested and not seen for
# the delay counts as hidden; one never seen since its slot was given to it
# counts as hidden at once (nothing finer was loaded for it). Any verdict
# that sees it reveals it; an object not tested (out of the view) keeps its
# state. A released slot starts afresh. While hidden:
# - its textures are noted as out of view (note_usage_away, no boost near
#   the camera): not loaded finer for it, lowered under memory pressure as
#   any out-of-view texture; a texture another visible face uses keeps that
#   face's size. The faces a shadow samples keep their size (masked faces,
#   and blended ones when blended faces cast, of an object within the
#   shadow distance).
# - its mesh keeps the detail level it shows, both ways, while it shows the
#   mesh it is asked for (LLPipeline::stateSort, indra/newview/pipeline.cpp:
#   occluded groups never reach LLVOVolume::updateLOD). Prims, sculpts and
#   trees follow their distance as before.
# Revealed, its textures take in the same frame the level their size on
# screen asks for (TextureStreamer::reveal, the rule of recompute_wants for
# one texture; a waiting download moves up), and its mesh is synced again.
# The coarse level stays shown meanwhile; what was downloaded is kept.
# Left as before: avatars and everything they wear, HUDs, selected, picked
# or highlighted objects, what stands in front of the mirror drawn this
# frame, and everything while a second camera shows the world or a photo
# wants every texture at full resolution.
#
# Network: only the rank and the byte ranges of the HTTP asset requests
# change (fewer and smaller); no simulator message, capability or rate
# changes.
#
# Test without the grid: AURORA_DEMO_STREAM=<n>,<n>,j2k=<folder>[,net=<ms>],
# size=2,wall=8 puts a wall between the view and the objects and removes it
# after 8 s; the log gives the textures by level then, and once nothing is
# left to download or decode. With AURORA_PROFILE=1 the log gets an
# "occlusion streaming:" line a second.
#
# Tests: scene/occlusion_streaming.rs (delay, never seen, reveal, out of
# view, flicker, released slot, old verdicts, off, exemptions, frozen
# level), object_occlusion.rs (bits, lengths, the shader's enlargement),
# textures.rs (reveal = the next pass's level), the options page (the rows
# behind the Occlusion cog), demo_stream.rs (the wall option).

