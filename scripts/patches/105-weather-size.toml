# Aurora Weather: snowflakes up to three times their size, and a Drop size
# slider that sizes the raindrops the same way.
#
# What: upstream's Environment › Aurora Weather has a "Flake size" slider
# (WeatherSettings::snow_size, 0..1, 0.5 by default), turned into the
# flakes' scale by WeatherSettings::flake_scale: 0.5 * 4^position, so 0.5
# (fine powder) to 2 (big wet flakes), 1 in the middle. The scale reaches
# the renderer as RainLook::snow (0: rain), packed into Frame::rain_look.w
# by Backend's frame uniforms (renderer.rs, clamped to 0.5..2) and read by
# env.wgsl: vs_rain (the flake's diameter), snow_landed (the flakes that
# land) and rain_far_streaks (the distant dots).
#
# Snow: the curve is kept, so every position of the old slider keeps its
# look and a saved snow_size means what it meant; the slider only goes
# further, to SIZE_MAX = log4(6) (about 1.2925), where the scale is 3. The
# clamps follow (flake_scale, renderer.rs). Nothing else is sized by the
# flake: the drops pass is drawn without bounds (a box of 44 x 44 x 30 m
# around the camera, whatever the flakes' size), the fall speed already
# stops growing past a 12 mm flake (min(diameter, 12)), and the lying snow,
# deep snow and avatar snow do not read it.
#
# Rain: a new setting, WeatherSettings::rain_size, on the same curve and
# range, 0.5 by default (scale 1: upstream's drops exactly), with a "Drop
# size" slider where the Flake size slider is, shown while rain falls. Its
# scale (RainLook::rain_drop, 1 by default) multiplies what the drop's
# size gives on screen, as the snow's does: the streak's width and its
# length in vs_rain (the width before the RAIN_MIN_PX floor, so bigger
# drops simply reach that floor farther away; the floor itself is a pixel
# rule, not a size, and stays), and the splash droplets' width and length
# in vs_rain_splash, as Flake size sizes the flakes that land. The drop's
# fall (its speed from its diameter, the wind's slant and carry) stays the
# drop's own, so a bigger setting draws bigger drops without making the
# rain fall faster; the distant rain's layers stay the faint pixel-wide
# streaks of drops too far to see (their width is the pixel's, not the
# drop's); the puddles' rings are the wet pass's, not the drops'.
#
# The scale travels in the field upstream uses for the flakes:
# Frame::rain_look.w was the flakes' scale in snow and 0 in rain, and its
# only reader that is not snow-gated is env.wgsl `snowing()` (w > 0.25). In
# rain it now holds the drops' scale negated (-0.5..-3, renderer.rs
# `fall_size`, unit-tested), so `snowing()` and every snow reader read what
# they read before, RainLook::snow keeps its meaning for the Rust readers
# (`snow > 0.0`), the Frame uniform keeps its size and layout, and at the
# default env.wgsl `rain_drop_scale` gives exactly 1.0.
#
# Upstream functions touched: WeatherSettings (field, Default,
# flake_scale, rain_look), ui/environment.rs weather_body and
# weather_label_width, RainLook (field, Default), the frame uniforms'
# rain_look packing (renderer.rs), env.wgsl vs_rain and vs_rain_splash.
# The slider of the Environment window is the only place either value is
# set (one interface style; Preferences › Graphics › Weather has no size
# rows); a region's or a sky's Aurora Weather carries no size, its
# RegionDay::apply keeps the viewer's own (..own.clone()). Saved with the
# other weather settings (#[serde(default)]: an older file gets 0.5).
#
# Tests: weather/mod.rs size_tests (the curve's ends, old positions, the
# default and an older file, a save and read back), renderer.rs
# the_frame_carries_what_falls_and_its_size. Apply or skip the whole file,
# not one patch of it.

# --- the setting (weather/mod.rs)

[[patch]]
id = "weather-size-field"
why = "the Drop size setting beside the Flake size one, on the same curve"
paths = ["crates/aurora-viewer/src/weather/mod.rs"]
op = "literal"
find = '''/// How big the snowflakes are, 0 (fine powder) to 1 (big wet flakes);
    /// 0.5 is the middle.
    pub snow_size: f32,'''
replace = '''/// How big the snowflakes are, 0 (fine powder) to `SIZE_MAX` (flakes
    /// three times their middle size; upstream's slider ended at 1, twice);
    /// 0.5 is the middle.
    pub snow_size: f32,
    // aurora-local-patch: weather-size-field
    /// How big the raindrops are, on the same curve and range as
    /// `snow_size`: 0.5, the middle, draws them as upstream does.
    pub rain_size: f32,'''

[[patch]]
id = "weather-size-default"
why = "the drops as upstream draws them by default"
paths = ["crates/aurora-viewer/src/weather/mod.rs"]
op = "literal"
find = "snow_size: 0.5,"
replace = '''snow_size: 0.5,
            rain_size: 0.5, // aurora-local-patch: weather-size-default'''

[[patch]]
id = "weather-size-scales"
why = "the flakes' scale up to 3 on upstream's curve, and the drops' on the same"
paths = ["crates/aurora-viewer/src/weather/mod.rs"]
op = "literal"
find = '''/// The flakes' size scale for the renderer (0.5 to 2, 1 in the middle).
    pub fn flake_scale(&self) -> f32 {
        0.5 * 4.0f32.powf(self.snow_size.clamp(0.0, 1.0))
    }'''
replace = '''/// The flakes' size scale for the renderer (0.5 to 3, 1 in the middle).
    // aurora-local-patch: weather-size-scales
    pub fn flake_scale(&self) -> f32 {
