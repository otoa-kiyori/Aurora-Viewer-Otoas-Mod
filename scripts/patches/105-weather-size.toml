[[patch]]
id = "weather-size-fall"
why = "what falls and its size in one value: the flakes' scale, or the drops' negated"
paths = ["crates/aurora-render/src/renderer.rs"]
op = "literal"
find = "fn rain_drops(rain: f32, quality: u32) -> u32 {"
replace = '''// aurora-local-patch: weather-size-fall
/// `Frame::rain_look.w` (local patch set, 105-weather-size): what falls and
/// how big. Snow: the flakes' scale, 0.5 to 3 (upstream's 0.5 to 2; its
/// readers test `> 0.25`). Rain: the drops' scale negated, -0.5 to -3
/// (upstream's 0, which no reader told apart from another value under
/// 0.25; env.wgsl `rain_drop_scale`). A drops' scale that is not a number
/// is 1.
fn fall_size(snow: f32, rain_drop: f32) -> f32 {
    if snow > 0.0 {
        snow.clamp(0.5, 3.0)
    } else if rain_drop.is_finite() {
        -rain_drop.clamp(0.5, 3.0)
    } else {
        -1.0
    }
}

fn rain_drops(rain: f32, quality: u32) -> u32 {'''

