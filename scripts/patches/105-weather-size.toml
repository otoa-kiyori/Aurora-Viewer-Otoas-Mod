# --- the shaders (common.wgsl, env.wgsl)

[[patch]]
id = "weather-size-comment"
why = "the Frame field's comment says what w now holds"
paths = ["crates/aurora-render/src/shaders/common.wgsl"]
op = "literal"
find = "z quality (0 low, 1 medium, 2 high), w snow (0/1)"
replace = "z quality (0 low, 1 medium, 2 high), w what falls: snow > 0 the flakes' scale (0.5..3), rain < 0 the drops' scale negated (-0.5..-3) // aurora-local-patch: weather-size-comment"

[[patch]]
id = "weather-size-shader-fn"
why = "the drops' scale read back from rain_look.w; 1 in snow and at the default"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
op = "literal"
find = '''fn snowing() -> bool {
    return frame.rain_look.w > 0.25;
}'''
replace = '''fn snowing() -> bool {
    return frame.rain_look.w > 0.25;
}

// aurora-local-patch: weather-size-shader-fn
// The raindrops' size scale (Drop size, local patch set 105-weather-size):
// rain_look.w holds it negated while it rains (renderer.rs `fall_size`), 1
// for upstream's drops; 1 in snow, whose flakes' scale is w itself.
fn rain_drop_scale() -> f32 {
    return select(1.0, -frame.rain_look.w, frame.rain_look.w < -0.25);
}'''

[[patch]]
id = "weather-size-drops"
why = "Drop size: the streak drawn longer by the drops' scale; the fall stays the drop's own"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
op = "literal"
find = "let length_m = select(speed * RAIN_EXPOSURE, diameter * 0.001 + length(velocity) * 0.012, snow);"
replace = '''// aurora-local-patch: weather-size-drops
    // Drop size: the streak drawn wider (below) and longer by the drops'
    // scale, 1 in snow; its speed, slant and drift stay the drop's own
    let drop_k = select(rain_drop_scale(), 1.0, snow);
    let length_m = select(speed * RAIN_EXPOSURE * drop_k, diameter * 0.001 + length(velocity) * 0.012, snow);'''

[[patch]]
id = "weather-size-drop-width"
why = "Drop size: the streak's real width, before the RAIN_MIN_PX floor"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
op = "literal"
find = '''let real = diameter * 0.001;
    let width = max(real, RAIN_MIN_PX / max(px_per_m, 1e-3)) * 0.5;'''
replace = '''let real = diameter * 0.001 * drop_k; // aurora-local-patch: weather-size-drop-width
    let width = max(real, RAIN_MIN_PX / max(px_per_m, 1e-3)) * 0.5;'''

[[patch]]
id = "weather-size-splash"
why = "Drop size: bigger drops throw bigger droplets, as Flake size sizes the flakes that land"
paths = ["crates/aurora-render/src/shaders/env.wgsl"]
op = "literal"
find = '''let real = (0.6 + rain_rand(ds + 3u) * 0.6) * 0.001;
    let width = max(real, RAIN_MIN_PX / max(px_per_m, 1e-3)) * 0.5;
    let coverage = clamp(real / (width * 2.0), 0.0, 1.0);
    let length_m = max(speed * RAIN_EXPOSURE * 0.6, 0.004);'''
replace = '''// aurora-local-patch: weather-size-splash
    // Drop size: the droplets' width and length (how high and far they fly
    // stays the same)
    let drop_k = rain_drop_scale();
    let real = (0.6 + rain_rand(ds + 3u) * 0.6) * 0.001 * drop_k;
    let width = max(real, RAIN_MIN_PX / max(px_per_m, 1e-3)) * 0.5;
    let coverage = clamp(real / (width * 2.0), 0.0, 1.0);
    let length_m = max(speed * RAIN_EXPOSURE * 0.6, 0.004) * drop_k;'''

