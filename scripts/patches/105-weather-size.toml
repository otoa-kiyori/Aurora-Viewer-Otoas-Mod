    }

    /// The raindrops' size scale for the renderer (`RainLook::rain_drop`,
    /// 0.5 to 3, 1 in the middle: upstream's drops).
    pub fn drop_scale(&self) -> f32 {
        size_scale(self.rain_size)
    }'''

[[patch]]
id = "weather-size-look"
why = "the drops' scale goes to the renderer with the flakes'"
paths = ["crates/aurora-viewer/src/weather/mod.rs"]
op = "literal"
fn = "rain_look"
find = "snow: if self.snowing() { self.flake_scale() } else { 0.0 },"
replace = '''snow: if self.snowing() { self.flake_scale() } else { 0.0 },
            rain_drop: self.drop_scale(), // aurora-local-patch: weather-size-look'''

[[patch]]
id = "weather-size-curve"
why = "one curve for both sliders, its end, and its tests"
paths = ["crates/aurora-viewer/src/weather/mod.rs"]
op = "literal"
find = '''/// The wind of the Wind sliders at their strongest (m/s, a gale).
const WIND_MAX: f32 = 18.0;'''
replace = '''// aurora-local-patch: weather-size-curve
/// The right end of the Flake size and Drop size sliders (local patch set,
/// 105-weather-size): log4(6), where `size_scale` reaches 3. Upstream's
/// Flake size ended at 1 (a scale of 2); every position up to it keeps the
/// scale it had.
pub const SIZE_MAX: f32 = 1.292_481_3;

/// A Flake size or Drop size position (0 to `SIZE_MAX`) as the size scale
/// the renderer multiplies by: 0.5 * 4^position, upstream's curve (0 gives
/// 0.5, 0.5 gives 1, 1 gives 2), now up to 3. A value that is not a number
/// (a hand-edited settings file) is the middle.
pub fn size_scale(position: f32) -> f32 {
    let position = if position.is_finite() { position.clamp(0.0, SIZE_MAX) } else { 0.5 };
    0.5 * 4.0f32.powf(position)
}

#[cfg(test)]
mod size_tests {
    use super::*;

    #[test]
    fn the_size_curve_keeps_upstreams_positions_and_reaches_three() {
        assert_eq!(size_scale(0.0), 0.5);
        assert_eq!(size_scale(0.5), 1.0);
        assert!((size_scale(SIZE_MAX) - 3.0).abs() < 1e-5, "{}", size_scale(SIZE_MAX));
        // past either end, or not a number
        assert_eq!(size_scale(5.0), size_scale(SIZE_MAX));
        assert_eq!(size_scale(-1.0), 0.5);
        assert_eq!(size_scale(f32::NAN), 1.0);
        // a position saved before: the scale upstream gave it
        for s in [0.0f32, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0] {
            assert_eq!(size_scale(s), 0.5 * 4.0f32.powf(s.clamp(0.0, 1.0)), "{s}");
        }
    }

    #[test]
    fn the_rain_keeps_upstreams_drops_by_default_and_in_older_files() {
        let w = WeatherSettings::default();
        assert_eq!(w.rain_size, 0.5);
        assert_eq!(w.drop_scale(), 1.0);
        assert_eq!(w.flake_scale(), 1.0);
        assert_eq!(w.rain_look(&Wind::default()).rain_drop, 1.0);
        // a settings file from before the Drop size slider
        let read: WeatherSettings = serde_json::from_str("{\"snow_size\": 0.8}").expect("parse");
        assert_eq!(read.drop_scale(), 1.0);
        assert_eq!(read.flake_scale(), 0.5 * 4.0f32.powf(0.8));
        // both sliders' right end: three times the middle size
        let big = WeatherSettings {
            snow_size: SIZE_MAX,
            rain_size: SIZE_MAX,
            ..Default::default()
        };
        assert!((big.flake_scale() - 3.0).abs() < 1e-5);
        assert!((big.drop_scale() - 3.0).abs() < 1e-5);
        // saved and read back
        let back: WeatherSettings = serde_json::from_str(&serde_json::to_string(&big).expect("save")).expect("read");
        assert_eq!((back.snow_size, back.rain_size), (SIZE_MAX, SIZE_MAX));
    }
}

/// The wind of the Wind sliders at their strongest (m/s, a gale).
const WIND_MAX: f32 = 18.0;'''

