[[patch]]
id = "water-normal-shape-common"
why = "the shape's lookup in the bathymetry texture and the short waves with it mixed in"
paths = ["crates/aurora-render/src/shaders/common.wgsl"]
op = "literal"
find = "// water_fx_wave with the geometric waves calmed (`calm`, its whole"
replace = """// ---- wave shape from the water normal map (local patch set,
// water_shape.rs; off while water_fx.shape is zero, every caller then takes
// its earlier path)
// aurora-local-patch: water-normal-shape-common
const SHAPE_ROW:i32=704;
// a cross-fade's second height map (patch 998), under the first one's
const SHAPE_NEXT_ROW:i32=960;
fn water_shape_on()->bool { return water_fx.shape.x>0.0 && water_fx.shape.w>0.5 && water_fx_on(1u); }
// The shape's height and gradient at material position p. While the
// environment cross-fades two water normal maps (patch 998) the second one's
// shape, its own rows and waves, is mixed in by its share; without a fade it
// is not read.
fn water_shape_at(p:vec2<f32>,time:f32)->vec3<f32> {
    let first=water_shape(water_ground,SHAPE_ROW,p,time,frame.water_waves,water_fx.shape.y,water_fx.shape.z);
    if(water_fx.shape_fade.x<=0.0){return first;}
    return mix(first,water_shape(water_ground,SHAPE_NEXT_ROW,p,time,water_fx.shape_next,water_fx.shape.y,water_fx.shape.z),water_fx.shape_fade.x);
}
// water_fx_wave_calmed with the shape mixed into the geometric waves by the
// Ratio (their horizontal motion fades with it), before the shallow water
// and the calming scale them; the wake on top.
fn water_fx_wave_shaped(p:vec2<f32>,level:f32,shift:vec2<f32>,calm:f32)->vec3<f32> {
    let r=water_fx.shape.x;
    let geo=water_swell(p,frame.camera_pos.w,water_fx.counts.w).offset;
    let h=water_shape_at(p,frame.camera_pos.w).x;
    var offset=vec3<f32>(geo.xy*(1.0-r),mix(geo.z,h,r))*(smoothstep(0.08,2.4,level-water_fx_bed(p).x)*calm);
    offset.z+=clamp(water_wake_sample(p+offset.xy+shift,level).z,-0.16,0.16);
    return offset;
}
// water_fx_wave with the geometric waves calmed (`calm`, its whole"""

