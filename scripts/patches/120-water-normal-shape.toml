[[patch]]
id = "water-normal-shape-spectrum"
why = "the height map's lookup and the three layers, pure functions shared by the water shaders and the tests"
paths = ["crates/aurora-render/src/shaders/water_spectrum.wgsl"]
op = "literal"
find = """    return vec2<f32>(edge+(1.0-edge)*x*x*(3.0-2.0*x),(1.0-edge)*ds);
}"""
replace = """return vec2<f32>(edge+(1.0-edge)*x*x*(3.0-2.0*x),(1.0-edge)*ds);
}

// Wave shape from the water normal map (local patch set; water_shape.rs
// mirrors these and its tests keep the constants equal): the normal map's
// height map, SHAPE_SIZE texels of pattern units, its levels side by side
// from row `row` of `map` (level l at x 2 SIZE - (2 SIZE >> l), the height
// in x), and the three layers the water's shading reads: uv per metre xy,
// scroll speed, weight (the first and the last along wave1, the middle one
// along wave2).
// aurora-local-patch: water-normal-shape-spectrum
const SHAPE_SIZE:i32=256;
const SHAPE_TOP:f32=8.0;
const SHAPE_FILTER:f32=2.0;
const SHAPE_LAYERS=array<vec4<f32>,3>(vec4<f32>(0.04,0.04,0.055,0.5),vec4<f32>(0.45,0.9,0.13,0.2),vec4<f32>(0.1,0.2,0.1,0.3));
fn shape_wrap(i:i32,n:i32)->i32 { return ((i%n)+n)%n; }
// A level's value (x) and gradient per uv (yz) at uv, bilinear, wrapping.
fn shape_level(heights:texture_2d<f32>,row:i32,level:i32,uv:vec2<f32>)->vec3<f32> {
    let n=SHAPE_SIZE>>u32(level);
    let x0=2*SHAPE_SIZE-((2*SHAPE_SIZE)>>u32(level));
    let pos=fract(uv)*f32(n)-vec2<f32>(0.5);
    let base=floor(pos);
    let f=pos-base;
    let i=vec2<i32>(base);
    let a=vec2<i32>(shape_wrap(i.x,n),shape_wrap(i.y,n));
    let b=vec2<i32>(shape_wrap(i.x+1,n),shape_wrap(i.y+1,n));
    let ta=textureLoad(heights,vec2<i32>(x0+a.x,row+a.y),0).x;
    let tb=textureLoad(heights,vec2<i32>(x0+b.x,row+a.y),0).x;
    let tc=textureLoad(heights,vec2<i32>(x0+a.x,row+b.y),0).x;
    let td=textureLoad(heights,vec2<i32>(x0+b.x,row+b.y),0).x;
    return ocean_bilinear(ta,tb,tc,td,f,1.0/f32(n));
}
// The shape's height (x, m) and gradient (yz) at material position p, time
// (s), the normal map's wave directions (wave1 xy, wave2 zw), scale and the
// water mesh's vertex spacing (m): each layer scale times larger and
// taller, read at the level whose texel is SHAPE_FILTER vertex spacings
// (trilinear), the shading's slow x warp and its Jacobian included.
fn water_shape(heights:texture_2d<f32>,row:i32,p:vec2<f32>,time:f32,waves:vec4<f32>,scale:f32,spacing:f32)->vec3<f32> {
    let t=time*0.5;
    let q=vec2<f32>(p.x+(cos(p.x*0.08)+sin(p.y*0.02))*6.0,p.y);
    let j11=1.0-0.48*sin(p.x*0.08);
    let j12=0.12*cos(p.y*0.02);
    var out=vec3<f32>(0.0);
    for(var k=0;k<3;k++) {
        let layer=SHAPE_LAYERS[k];
        let lod=clamp(log2(SHAPE_FILTER*spacing*max(layer.x,layer.y)*f32(SHAPE_SIZE)/scale),0.0,SHAPE_TOP);
        if(lod<SHAPE_TOP) {
            let dir=select(waves.xy,waves.zw,k==1);
            let uv=(layer.xy*q+dir*t*layer.z)/scale;
            let l0=floor(lod);
            var h=shape_level(heights,row,i32(l0),uv);
            if(lod>l0){h=mix(h,shape_level(heights,row,i32(l0)+1,uv),lod-l0);}
            h*=layer.w*scale/sqrt(layer.x*layer.y);
            out+=vec3<f32>(h.x,h.y*layer.x*j11/scale,(h.y*layer.x*j12+h.z*layer.y)/scale);
        }
    }
    return out;
}"""

