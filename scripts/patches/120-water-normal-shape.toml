# Wave shape from the water normal map: Preferences › Graphics › Aurora
# water, in the gear of "Enhanced water effects", right under "Geometric
# waves" (greyed while they are off, above patch 109's swell rows): "Wave
# shape from the normal map" (the Ratio, 0 to 1, 0.01 steps, default 0) and
# "Normal map scale" (x1 to x100, logarithmic, default x1). All drawing only.
#
# The environment's water normal map (the EEP water's texture, the one the
# shading reads) holds slopes. When it changes (and once at start) its
# decoded texels, which the texture streamer keeps on the CPU for it as it
# keeps a sculpt map's (full resolution, no block compression for that one
# texture; scene/water_shape_source.rs), go to the thread pool: their slopes
# (-x / z, -y / z) are averaged onto 256 x 256 texels (resampled when the
# map's sides are not multiples of 256), integrated by a Fourier (Poisson)
# solve, H = F⁻¹[−i(kx·Fx + ky·Fy) / (kx² + ky²)], mean 0 (a radix-2 FFT
# of our own, no new dependency), and filtered into nine levels by 2 x 2
# averages (files/water-normal-shape/water_shape.rs). No GPU readback, no
# wait in the frame. The levels reach the GPU in 256 rows of the bathymetry
# texture under patch 109's maps and one vec4 of the shared water uniform
# after 109's four (Ratio, Scale, the vertex spacing, loaded): no new
# binding.
#
# The water's vertices read the same three layers the shading reads (the
# big wave and two little ones of env.wgsl water_pixel: their scales, the
# wave1 / wave2 scroll directions and speeds, the slow x warp, their weights
# 0.5, 0.2 and 0.3), each Scale times larger: a layer of L metres is Scale
# times L long and Scale times L times its weight times H high, its slopes
# the map's. Each layer takes the level whose texel is at least two vertex
# spacings of the dense water mesh at the chosen quality (2, 1.33, 1 and
# 0.67 m), trilinear, so the pattern does not shimmer as it scrolls; a layer
# finer than the last level is skipped. The big wave (25 m at x1) reads its
# finest level from about x27 at medium quality (x41 low, x20 high, x14
# ultra); at x1 its coarser levels (texels of 1.6 to 3 m) already give its
# largest features, low ones. The finest little wave (1.1 to 2.2 m) shows
# from about x2.4 at medium quality; the other (5 to 10 m) is there at every
# Scale, only coarse below about x137. Like the geometric waves it mixes
# with, the shape fades out from 80 to 160 m from the camera (the far
# water's quads and patch 109's coarse grid would crack against the dense
# mesh): it does not show on the far grid.
#
# The Ratio: the short waves' vertical movement is mix(geometric waves,
# shape, Ratio); their horizontal motion and their foam compression scale by
# 1 - Ratio (none at 1). The open-sea swell stays on top with its own
# sliders; the calming of patch 109 and the shallow-water damping scale the
# result as they scale the geometric waves. The shading takes the shape's
# analytic gradient (the same texels and levels, the warp's Jacobian in it)
# in place of the waves' gradient by the same mix, so shading and shape
# agree; the per-pixel normal map itself is unchanged. At Ratio 0, with the
# geometric waves off or before the map is in, nothing here runs: the
# shaders take their earlier lines (a test of the vec4), the vec4 stays
# zero, the CPU surface is today's bit for bit.
#
# What follows the new shape where it followed the geometric waves: the
# camera's waterline and the underwater view (camera_level), the body
# contacts, our own heave (WaterGround::surface's CPU model, which mirrors
# the WGSL, files/water-normal-shape/water_shape.rs: an agreement test
# draws both), the splash droplets' and bubbles' kill height
# (particle_water_level). What followed only the swell keeps the swell
# only: the objects' contacts, the riders, rain and snow at the surface, the
# underwater light and fog on what lies under it, the refracted water's
# fog, the planar reflection's plane, the underwater sound.
#
# Cost while it is on: per water vertex and per water pixel, 2 or 3 layers
# of 2 levels of 4 texel loads (16 to 24 loads from a 1 MB block of
# 8-byte texels) and some arithmetic; nothing off. The height map: a few
# milliseconds on the pool each time the normal map changes.
#
# Cross-fade (patch 998): while an environment change fades from one water
# normal map to another (never between a day cycle's keyframes), the second
# map's height map is made the same way into 256 rows of its own under the
# first's (the bathymetry texture is 512 x 1216), two more vec4 of the
# uniform hold its wave directions and its share, and the two shapes, each
# scrolled along its own waves, are mixed by it (on the GPU, twice the loads
# while it lasts, and in the CPU model); when the fade ends the second
# height map is the first one's, not made again. No fade: the share is 0 and
# only the first shape is read, as before.
#
# Apply or skip the whole file, not one patch of it; it needs patch 109, and
# patch 998, whose fade fields it reads.

# ------------------------------------------------------------ render crate

