[[patch]]
id = "water-normal-shape-settings-test"
why = "older files load the defaults, the choices round-trip, every value is bounded"
paths = ["crates/aurora-viewer/src/settings.rs"]
op = "literal"
find = "fn ocean_swell_choices_load_round_trip_and_stay_in_range() {"
replace = '''fn water_shape_choices_load_round_trip_and_stay_in_range() {
        // aurora-local-patch: water-normal-shape-settings-test
        let old: super::WaterEffectsSettings = serde_json::from_str(r#"{"caustics":true,"ocean_depth":3.0}"#).unwrap();
        assert_eq!((old.shape_ratio, old.shape_scale), (0.0, 1.0), "older files: off");
        let chosen = super::WaterEffectsSettings {
            shape_ratio: 0.35,
            shape_scale: 42.5,
            ..Default::default()
        };
        let loaded: super::WaterEffectsSettings = serde_json::from_str(&serde_json::to_string(&chosen).unwrap()).unwrap();
        assert_eq!(loaded, chosen);
        let r = loaded.render();
        assert_eq!((r.shape_ratio, r.shape_scale), (0.35, 42.5));
        for (saved, ratio, scale) in [
            (-1.0, 0.0, 1.0),
            (250.0, 1.0, 100.0),
            (f32::NAN, 0.0, 1.0),
            (0.5, 0.5, 1.0),
            (7.0, 1.0, 7.0),
        ] {
            let mut s = super::Settings::default();
            s.water_effects.shape_ratio = saved;
            s.water_effects.shape_scale = saved;
            assert_eq!(
                (s.water_effects.render().shape_ratio, s.water_effects.render().shape_scale),
                (ratio, scale)
            );
            let clean = s.sanitized();
            assert_eq!((clean.water_effects.shape_ratio, clean.water_effects.shape_scale), (ratio, scale));
        }
        let d = super::WaterEffectsSettings::default();
        assert_eq!((d.render().shape_ratio, d.render().shape_scale), (0.0, 1.0));
    }
    #[test]
    fn ocean_swell_choices_load_round_trip_and_stay_in_range() {'''

