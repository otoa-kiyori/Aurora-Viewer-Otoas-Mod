[[patch]]
id = "water-normal-shape-surface-test"
why = "the CPU surface: Ratio 0 is today's bit for bit, the shape follows the vertices, the calming scales it"
paths = ["crates/aurora-render/src/ocean_swell.rs"]
op = "literal"
find = """    #[test]
    fn the_shader_constants_are_these() {"""
replace = """#[test]
    fn the_wave_shape_from_the_normal_map_follows_the_ratio_and_the_calming() {
        // aurora-local-patch: water-normal-shape-surface-test
        use super::super::shape::{self, HeightMap, Shape};
        let n = shape::SIZE as usize;
        let slopes: Vec<[f32; 2]> = (0..n * n)
            .map(|i| {
                let (u, v) = (((i % n) as f32 + 0.5) / n as f32, ((i / n) as f32 + 0.5) / n as f32);
                let x = std::f32::consts::TAU * (2.0 * u + v);
                [0.6 * x.cos(), 0.3 * x.cos()]
            })
            .collect();
        let with_shape = |g: WaterGround| WaterGround {
            ocean: Ocean {
                shape: Shape {
                    map: HeightMap::from_slopes(&slopes).map(Arc::new),
                    waves: [0.6, -0.8, -0.3, 0.95],
                    ..Default::default()
                },
                ..g.ocean
            },
            ..g
        };
        let shaped = |ratio: f32| WaterEffects {
            shape_ratio: ratio,
            shape_scale: 20.0,
            ..calmed(0.0, 0.0, 100.0, 1.0)
        };
        let plain = with_shape(ground(None, None));
        for (x, y, t) in [(43.0, 118.0, 7.3), (-12.0, 3.5, 0.0), (300.0, -77.0, 1234.5)] {
            let xy = Vec2::new(x, y);
            // Ratio 0: upstream's surface exactly, map or not
            let up = super::super::surface_level(xy, t, shaped(0.0), 20.0, 13.0);
            assert_eq!(plain.surface(xy, t, shaped(0.0), 20.0, 13.0).to_bits(), up.to_bits());
        }
        // Ratio 1: the shape's height alone (it has no horizontal motion)
        let mut moved = 0.0f32;
        for i in 0..40 {
            let xy = Vec2::new(i as f32 * 3.7 - 60.0, 20.0 - i as f32 * 1.9);
            let t = i as f32 * 0.4;
            let h = plain.ocean.shape.at(xy, t, shaped(1.0)).x;
            assert!((plain.surface(xy, t, shaped(1.0), 20.0, 0.0) - (20.0 + h)).abs() < 1e-5);
            moved = moved.max(h.abs());
        }
        assert!(moved > 0.05, "the shape moves the surface: {moved}");
        // the calming scales it as it scales the waves: still at a pier
        let pier = with_shape(ground(None, Some(pier())));
        let calm = WaterEffects {
            calm_edge: 0.0,
            ..shaped(1.0)
        };
        let near = (0..40)
            .map(|i| (pier.surface(Vec2::new(2.1, 10.0 + i as f32), i as f32 * 0.3, calm, 20.0, 0.0) - 20.0).abs())
            .fold(0.0f32, f32::max);
        let far = (0..40)
            .map(|i| (pier.surface(Vec2::new(150.0, 10.0 + i as f32 * 2.3), i as f32 * 0.3, calm, 20.0, 0.0) - 20.0).abs())
            .fold(0.0f32, f32::max);
        assert!(near < 0.01 && far > 0.05, "{near} {far}");
    }

    #[test]
    fn the_shader_constants_are_these() {"""

