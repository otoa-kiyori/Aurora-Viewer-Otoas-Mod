paths = ["crates/aurora-render/src/shaders/env.wgsl"]
op = "literal"
fn = "particle_water_level"
find = "let swell_level=level+water_swell(p,water_fx.clock.x,water_fx.counts.w).offset.z*smoothstep(0.08,2.4,level-water_fx_bed(p).x);"
replace = """// aurora-local-patch: water-normal-shape-particle-level
    var short_z=water_swell(p,water_fx.clock.x,water_fx.counts.w).offset.z;
    if(water_shape_on()){short_z=mix(short_z,water_shape_at(p,water_fx.clock.x).x,water_fx.shape.x);}
    let swell_level=level+short_z*smoothstep(0.08,2.4,level-water_fx_bed(p).x);"""

