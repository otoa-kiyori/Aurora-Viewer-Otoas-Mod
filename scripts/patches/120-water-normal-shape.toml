[[patch]]
id = "water-normal-shape-rows"
why = "the two sliders in the enhanced water's gear right under the geometric waves, greyed while they are off"
paths = ["crates/aurora-viewer/src/ui/options/pages/graphics.rs"]
op = "literal"
find = "cx.greyed(!cx.s.water_effects.waves);"
replace = """cx.greyed(!cx.s.water_effects.waves);
                // aurora-local-patch: water-normal-shape-rows
                {
                    use aurora_render::water_effects::shape;
                    cx.row(
                        tr!("water-effects-shape-ratio"),
                        tr!("water-effects-shape-ratio-help"),
                        &field!(water_effects.shape_ratio),
                        |ui, s| slider(ui, &mut s.water_effects.shape_ratio, shape::RATIO_RANGE, ""),
                    );
                    cx.row(
                        tr!("water-effects-shape-scale"),
                        tr!("water-effects-shape-scale-help"),
                        &field!(water_effects.shape_scale),
                        |ui, s| {
                            ui.add(
                                egui::Slider::new(&mut s.water_effects.shape_scale, shape::SCALE_RANGE)
                                    .custom_parser(aurora_i18n::parse_number)
                                    .logarithmic(true)
                                    .fixed_decimals(2)
                                    .step_by(0.01)
                                    .prefix("×")
                                    .trailing_fill(true),
                            )
                            .changed()
                        },
                    );
                }"""

